limitations:
- 'This is partial scientific review: the complete record was read, but only exact
  identity and the terminal stereochemistry conflict were independently adjudicated
  in depth.'
- The 1985 primary experiment was inspected through its indexed abstract, not full
  text. The 2009 and 2022 primary bodies were inspected directly.
- The 2022 WbbB paper repeats the KdsB specificity statement with a citation to earlier
  NMR; it is not an independent new KdsB NMR experiment.
- The reviewer has not exhausted external beta-specific chemical/reaction identity
  alternatives and does not assert that none exists.
- All seven required and supporting corpus checks passed; they do not resolve the
  scientific finding or complete unperformed all-edge verification.
- Structured expression results were inspected as bounded context only; they do not
  prove reaction mechanism, stereochemistry, or absence of module membership.
