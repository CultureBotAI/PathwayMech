limitations:
- Eight of nine primary papers were inspected through indexed primary abstracts, plus
  current curated enzyme and reaction sources. PMID12081978 was independently read
  in full text by this reviewer, including methods, Table1, results and figure captions.
  Figure image pixels were not inspected. No unseen assay details are reconstructed.
- Generic Rhea ETF states are supported, but the exact physiological donor complex,
  sequence and transfer stoichiometry are unresolved. Genetic FixA/FixB necessity
  is not direct biochemical transfer evidence.
- K-12 is the curated protein accession scope. Older O44 K74/overexpression experiments
  and BW25113 mutants do not prove universal expression or growth in every K-12 strain.
- CaiD homotrimer comes from an inspected experimental UniProt annotation, without
  full-text oligomerization-method inspection. Gene-product nodes do not assert autonomous
  monomeric activity.
- Selected catabolic directions preserve explicitly reversible CaiD/CaiB reactions;
  absence of a cofactor or compartment edge is not evidence of independence.
- Programmatic SVG/KGX checks do not constitute browser visual or interaction inspection.
  iModulonDB results are computational context only.
