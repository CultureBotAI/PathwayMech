limitations:
- The native mirror is MetaCyc 22.5. Exact source identifiers, memberships and physical
  assembly annotations are preserved with current reviewed UniProt and exact Rhea
  142 chemistry checks; this is not a claim that all source databases have the same
  release date.
- MG1655 scope is grounded in native pathway/component annotation. The 1973 assay
  used Y-70-272 and the 2007/1994 studies used mutant contexts; no unmeasured wild-type
  flux, constitutive expression or universal taxon claim is added.
- PMIDs 8157589, 8289286 and 2199449 were inspected as complete indexed primary abstracts
  only. Full 1973 and 2007 texts were inspected; unsupported full-article details
  are not inferred.
- Native reaction ordering also lists the parallel thymidine branch as predecessor
  to deoxyuridine phosphorolysis. The record preserves only source-supported shared-intermediate
  flow and accounts for that exclusion.
- Original Documents checkout was OS-inaccessible. Hidden/ignored-inclusive searches
  cover the accessible current worktree and preserved prior ledgers, not the entire
  computer.
- The standard iModulon console entrypoint lacked dotenv; actual direct unchanged-adapter
  acquisition and independent offline reproduction provide the bounded contextual
  check. No network freshness is claimed for the offline replay.
- Graph/KGX validation is programmatic. No browser visual rendering or interaction
  test is claimed.
