summary: The exact native PathBank identity and explicitly bounded four-enzyme glutamylation
  core are supported. All 23 Rhea chemical-side occurrences, including the two-hydron
  coefficient in PuuC, preserve exact forms and balanced equations. Native intermediate
  structure errors and the PuuB water/hydron conflict are explicitly resolved using
  independent ChEBI/Rhea evidence. Catalysis, PuuA dodecamer and PuuD homodimer, alternative
  PuuA metals and three material connections have scoped support. No corrective finding
  remains. Abstract-only access to older original studies, heterogeneous annotation
  evidence, selected NADP chemistry and condition-dependent physiology limit the conclusion.
