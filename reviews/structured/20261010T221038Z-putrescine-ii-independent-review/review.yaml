limitations:
- The original 2005, 2006 and 2008 studies were inspected as indexed primary abstracts;
  their full methods, figures and supplementary data were unavailable in the author
  retrievals and are not claimed inspected here. Current authoritative structured
  assertions provide claim-specific chemistry and component support.
- PuuB catalytic and pathway comments and PuuD pathway comment lack separate ECO annotations.
  The record explicitly preserves that distinction rather than upgrading every claim
  to a purified-enzyme experiment.
- The graph chooses the native NADP PuuC variant; supported NAD activity is acknowledged
  but not represented as a second branch. No intracellular NAD/NADP preference is
  inferred.
- The maintained core stops at GABA and excludes native transport and downstream succinate
  metabolism; it is not a whole-cell flux, uptake or universal essentiality model.
- iModulon membership is computational expression context, not experimental proof
  of catalysis, regulation, direction or pathway identity.
- Programmatic SVG/KGX checks do not replace a browser visual inspection. This review
  does not claim independent authorship of the previously merged shared PathBank authority
  parser.
