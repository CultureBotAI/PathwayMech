limitations:
- The 2009 supplement containing primer Table S1 and supplementary figures was unavailable.
  Exact recombinant terminal/tag sequences remain unresolved and are explicitly qualified.
- Only the 1993 abstract was independently read; no individual treatment dose, recovery
  kinetics, metal-state occupancy or physiological redox regulation is claimed.
- The historical native 35.5 kDa subunit estimate differs from the 266 aa sequence
  assignment. The native database model is retained without asserting exact molecular
  equivalence to the recombinant enzyme.
- Native pathway/chemical structure assertions close exact stereochemistry; characteristic
  spectra in the 2009 assays alone do not independently establish every stereoisomer
  or protonation state.
- PraR reporter transcriptional repression lacks an exact representable promoter/reporter
  target. This identity gap is retained without claiming that repression or direct
  ligand binding is absent.
- 'Configured CLAW aggregation was unavailable: no installed main entry point, and
  an incomplete residual module could not import its canonical contract. Exact local
  predecessor and competing-head checks cover all registered worktree review roots
  including ignored/hidden files; no remote-only or deleted-worktree absence is claimed.'
- Final corpus gates were executed by root and independently checked through actual
  outputs and unchanged input hashes; only this pathway received this fresh scientific
  review.
