limitations:
- Most historical primary studies were inspected as indexed abstracts by the inherited
  scientific reviewer. Complete available CydX and cardiolipin bodies and selected
  6RKO deposition objects have narrower source/construct scope. This review did not
  freshly reread those primary bodies.
- The CydX supplementary request and 2019 journal body remain unavailable; missing
  access is not negative biological evidence. No complete literature search or source-exhaustion
  claim is made.
- Graph junction labels can overlap in the static rendering; the complete table retains
  exact claims. Browser interaction was unavailable and is not claimed.
- Scientific issue dispositions below are inherited observations about the unchanged
  current draft. They do not fabricate native previous_occurrences or independently
  close GitHub issues.
- No maintained files, native reviews, shared cache, Git or GitHub state were mutated
  by this reviewer. Root owns evidence adoption, final native inspection/save and
  any later publication.
- Technical review only; no new scientific interpretation or fresh line-by-line runtime
  review.
notes:
- Initial checker assumptions and intermediate failures are preserved in the QA packet,
  including .gitkeep, unconnected taxon rendering, source hashes omitted from HTML,
  unfinished CLI export and SSSOM metadata-comment parsing. These were bounded harness
  or scheduling corrections, not suppressed product findings.
