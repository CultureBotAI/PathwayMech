limitations:
- Complete source-defined two-reaction chemical pathway is supported, while strain-U
  physiological electron carrier and PeaEFG physical assembly remain unresolved.
- Strain-U PeaACD structural/cofactor annotations are database/in-silico tier, not
  purified complex structural measurements.
- Unreviewed UniProt entries provide sequence/strain identity, not experimentally
  reviewed catalytic function.
- Primary 2008 full body unavailable; detailed mechanism assertions are explicitly
  database-sourced.
- The DOI reference key denotes the publication annotated by BRENDA; native source
  identity is supplied explicitly by title, URL, source version/body hash and locator.
  It must not be read as primary-full-text evidence.
- No browser interaction audit is claimed.
- The 2020 PeaEFG statement is secondary literature, retained only to disclose the
  unresolved assembly discrepancy.
notes:
- Initial governed inspect used an incorrect schema path and failed; corrected-path
  inspect succeeded before scientific assessment.
- Independent replay first exposed a reviewer ENA parser bug that removed FT dipeptides;
  anchoring the line-prefix removal fixed it, and all five exact sequences plus the
  entire replay passed. No source or target mutation resulted.
- The maintained independent audit is an earlier scientific observation pending shared
  gates. This completed review incorporates actual final receipts and exact final
  input hashes.
- Independent ignored-inclusive exact-identity search covered the active data/pathways
  and maintained research trees (excluding only .git and .venv); the author’s ignored-inclusive
  search logs also cover the original checkout. Only this target represents this exact
  active pathway; degradation I is an adjacent distinct route.
- 'This review assesses only phenylethylamine II. Separate salvage #351 and galactonate
  changes were assessed by their assigned independent reviewers; their scientific
  dispositions are not inferred from this clean target review.'
