limitations:
- Full 1987/1997 and original 1997/1999 structural papers were inspected as indexed
  abstracts only; exact experimental annotations are cited as UniProt assertions,
  not represented as inspected full primary articles.
- FeaB oligomeric state remains unresolved for exact K12 P80668. The qualified gene-product/activity
  relation does not assert isolated-monomer sufficiency or fixed stoichiometry.
- The 2013 FeaR study did not directly test aldehyde binding; transcriptional phenotype
  is not enzyme allostery. Strain/stock and nutrient conditions remain limited to
  inspected evidence.
- Initial whole-suite command failed its stale-page case during overlapping render/evidence
  edits. After final rerender the sole failed case passed, with 1047 unaffected cases
  retained; no full local suite was rerun after final wording correction. Full exact-head
  CI is a separate required premerge gate.
- Independent source replay first overlapped author edits; a subsequent guarded attempt
  failed intentionally on byte change, and only the stable final successful run is
  used as attestation.
- No browser visual/interaction inspection is claimed. Programmatic SVG/KGX checks
  verify representation and links.
- Structured expression search results are bounded context; no module-name hit does
  not establish absent membership or biological absence.
