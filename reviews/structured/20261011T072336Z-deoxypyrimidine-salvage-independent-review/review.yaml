limitations:
- PMID 8289286, 2199449 and 2041474 were inspected as indexed primary abstracts, not
  full articles. The 1991 abstract is explicitly truncated.
- The native Tdk assembly has no numerical component coefficient; K-12 apparent molecular
  mass, a multimeric primary abstract and HAMAP homotetramer inference do not resolve
  condition-specific stoichiometry.
- The maintained strain is supported by native MG1655 annotation. Primary Y-70-272,
  W3110/KY895 and K-12 mutant experiments do not establish constitutive quantitative
  wild-type MG1655 salvage flux.
- The five biochemical members are complete under the independently verified EcoCyc
  boundary. Four PathBank uptake objects are contextual source dispositions; their
  transport mechanisms and downstream nucleotide phosphorylation are outside this
  record.
- iModulonDB observations are limited to the declared searches and inspected components;
  no module-name hit or queried component membership is not biological absence.
- The review uses programmatic publication preservation checks; interactive browser
  inspection was outside this source-review scope.
