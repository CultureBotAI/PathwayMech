limitations:
- MoaA K-12 activity and Fe-S stoichiometry are reviewed HAMAP-supported inference,
  not direct K-12 purified-enzyme measurements in the inspected primary papers.
- YnjE evidence supports enhancement of an in-vitro sulfur-transfer reconstitution.
  Its complete physiological sulfur relay and necessity are not resolved; IscS alternatives
  and conditional residual activity remain possible.
- The two generic donor/acceptor pairs do not identify physiological reductants. Chemical
  net balancing is formal stoichiometry, not measured cellular flux.
- The formal current Rhea/ChEBI Mo(VI) endpoint differs from older native charged
  forms and does not establish the intracellular resting redox state or downstream
  modified cofactor coverage.
- Six cited primary studies were inspected through retained indexed abstracts only.
  Full-text access failures/challenge bodies are retained and not described as successful
  full-text inspection.
- Canonical iModulon console failed missing dotenv; root used the unchanged direct
  client and retained body/parser receipts. Reviewer inspected these results without
  a fresh network replay.
- Original Documents checkout is inaccessible; duplicate searches cover the accessible
  worktree with hidden and ignored files, excluding .git and .venv, plus prior recorded
  dispositions.
- Full corpus gate and structural graph runs were executed by root and their real
  receipts/logs inspected here. The full test began before other records' wording-only
  provenance fixes; final corpus QC/render/identifier/KGX/lint checks cover the corrected
  bytes. No implementation or tests changed, and this Moco target stayed unchanged.
- No browser surface was available; diagram verification is structural, not visual
  or interactive.
- This review is independent for Moco only. Reviewer authored nicotine, which is separately
  reviewed by another agent.
