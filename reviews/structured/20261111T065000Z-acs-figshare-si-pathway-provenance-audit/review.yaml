  description: When local Zotero PDFs are available for 10.1021/bi000401r, 10.1021/bi00289a008,
    10.1021/bi034840c, 10.1021/bi060052m, 10.1021/ja8025278, 10.1021/jp404948c, and
    10.1021/jacs.2c03322, resolve them via scripts/fulltext_access.py and upgrade
    abstract-only references.
  finding_ids:
  - FIND-SIX-PATHWAYS-ACS-DOIS-WITHOUT-OPEN-FIGSHARE-S001
  target_ids:
  - MetaCyc:P2-PWY
  - MetaCyc:PWY-8383
  - MetaCyc:PWY-8178
  - GO:0042864
  - MetaCyc:PWY-6151
  - gomodel:YeastPathways_PWY3O-17
  owner_paths:
  - repository: CultureBotAI/PathwayMech
    path: data/pathways/citrate-lyase-activation.yaml
    role: Maintained PathwayRecord citing 10.1021/* ACS literature
  - repository: CultureBotAI/PathwayMech
    path: data/pathways/myxochelin-a-and-b-biosynthesis.yaml
    role: Maintained PathwayRecord citing 10.1021/* ACS literature
  - repository: CultureBotAI/PathwayMech
    path: data/pathways/pentose-phosphate-pathway-non-oxidative-branch-ii.yaml
    role: Maintained PathwayRecord citing 10.1021/* ACS literature
  - repository: CultureBotAI/PathwayMech
    path: data/pathways/pyochelin-biosynthesis.yaml
    role: Maintained PathwayRecord citing 10.1021/* ACS literature
  - repository: CultureBotAI/PathwayMech
    path: data/pathways/s-adenosyl-l-methionine-cycle-i.yaml
    role: Maintained PathwayRecord citing 10.1021/* ACS literature
  - repository: CultureBotAI/PathwayMech
    path: data/pathways/thiamine-biosynthesis.yaml
    role: Maintained PathwayRecord citing 10.1021/* ACS literature
  acceptance_checks:
  - pytest tests/test_fulltext_access.py passes
limitations:
- Pre-Figshare ACS Biochemistry/JACS/JPC articles (1983-2013) do not expose 10.1021/*.s001
  Figshare handles and require local Zotero PDF capture.
