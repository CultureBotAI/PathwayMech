limitations:
- Dihydromonapterin-triphosphate dephosphorylation remains an explicit unresolved
  mechanism. The graph is not a complete mass-flow or flux model and asserts neither
  a phosphatase nor the excluded RHEA:34844 reaction.
- Original FolX oligomer and FolE assembly papers PMID 9182560, 9651328, 10378270
  and 12297008 were inspected as complete indexed abstracts only. Full primary main-pathway
  and zinc article text was read; figure captions, not figure pixels or supplements,
  were inspected.
- The later NudB and FolQ3 full-text sections do not identify the missing E. coli
  catalyst. The 2024 N-methylserotonin paper was limited to its primary abstract;
  the bounded search is not a claim that no uninspected literature could resolve the
  gap.
- JP2255 complementation uses heterologous Pseudomonas PhhA/B. MG1655 profiling used
  iodine oxidation and does not establish the original redox state of all secreted
  pterins. Native E. coli physiological cofactor function is not established here.
- The public MetaCyc mechanism snapshot is version 22.5. Current UniProt and Rhea
  mechanistic sources provide independent support, but this is not a statement about
  the latest licensed MetaCyc release.
- iModulonDB gene hits and zero returned module hits are computational context, not
  direct mechanism evidence or negative evidence for regulation.
- Programmatic SVG/KGX checks do not replace browser visual inspection. No browser
  surface was available, and none is claimed.
notes:
- The target was frozen before initial governed inspection. Initial shared authority
  snapshots were replaced during integration; this reviewer explicitly compared every
  baseline term and source metadata, checked the additions against raw authorities
  and re-inspected final inputs before saving. The target remained unchanged at the
  exact SHA-256 retained in source.inputs.
- Root identified and the author corrected the pre-review FolX family locator to distinguish
  bidirectional 28349 from directional 28347. The final exact source triple was independently
  verified. This is a positive corrected assessment, not a fabricated resolved finding
  without a predecessor bundle.
- An ignored-inclusive prior-review search returned no occurrence for this exact target
