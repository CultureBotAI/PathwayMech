limitations:
- PMID9484892 and PMID7791215 remain abstract-only for their claims; the older NagB
  structure paper is abstract-only. Rice12 main Results/Discussion/Methods were read,
  but Supplementary Table S1 was not. No uninspected primary methods or exact strain
  equivalence is asserted.
- BiGG acmana structure identity, older/newer NanR interpretations and native ManXYZ
  assembly sources disagree at documented boundaries. The record preserves those conflicts;
  this review does not settle them.
- Three NagB relations describe engineered/tagged/prepared experimental endpoints.
  Inferred assembly, reconstituted metal alternatives and proposed versus demonstrated
  catalytic roles remain qualified.
- Static SVG and fragment navigation were inspected, with automated graph/interaction
  tests passing. No available live browser was obtained for a fresh full-page interactive
  visual inspection; the dense overview relies on zoom/selection.
- The iModulon follow-up covers one matched dataset and four components; it is supplementary
  expression context, not an exhaustive transcriptomic or biochemical evidence survey.
- Prior software authorship limits independence for endpoint-qualification and complex-name
  implementation; independent root code reviews and fresh final integration review
  are relied upon for those portions. No broad gate was rerun merely to duplicate
  root receipts.
