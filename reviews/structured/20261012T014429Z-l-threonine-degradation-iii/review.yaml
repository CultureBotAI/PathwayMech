limitations:
- The complete source-defined route has an explicitly hypothetical E. coli TynA terminal
  assignment; no experimentally reconstructed complete E. coli route or intervening
  aminoacetone transport is established.
- Full-paper, critical-section, abstract-only and database-annotation evidence scopes
  remain explicit in the retained original/successor reviews. The 2012 Tdh supplement
  and complete historical assay sequences were not available or established.
- Initial chemistry and independent successor evidence are inherited only after fresh
  exact adopted-byte/source comparisons. Canonical authority builders, maintained
  corpus gates and static page QA are attributed to their actual root/author executions,
  not newly rerun by this finalizer.
- PathBank attached-child identity is not a full child chemistry definition; the malformed
  original whole PWML supports only inspected intact interface fragments.
- Licensing remains deferred under the authorized task; no source exhaustion or corpus-wide
  scientific coverage is claimed.
- External findings 432–435 are retained through evidence-linked assessments and links.
  They are not fabricated canonical finding predecessors, and saving this review does
  not close issues or authorize/perform merge.
- The maintained suite reports three skipped tests and three dependency deprecation
  warnings. The -q receipt does not name the skipped cases; this review does not infer
  their identities or claim they ran.
- Visual QA covers the native static SVG and generated anchors, not an interactive
  browser session. Dense overview labels require close reading in the existing graph
  controls and evidence tables.
- The required unstaged whitespace check passed. Complete staged whitespace, commit/PR
  review, issue closure, merge and publication follow this observation and remain
  root-owned; they are not claimed completed here.
