    value: hypothetical EV-AS-NAS with bounded primary observations
    definition: Source-defined pathway completeness is distinct from experimental
      E. coli whole-route demonstration.
    evidence_ids:
    - source-009
- assessment_id: constructs
  area: scope
  topic: Versioned proteins and experimental constructs
  outcome: supported
  summary: YiaY uses versioned 382-aa AAB18566.1 with an explicitly qualified six-His
    assay material, not current 383-aa P37686. NADH absorbance at 340 nm is separated
    from direct intermediate/product evidence. SstT Thr301 versus current Ala301 and
    the separate eight-His 2002 serine-transport preparation remain distinct. TdcC
    historical 431-aa/current 443-aa reporting uncertainty does not identify a physical
    variant.
  target_ids:
