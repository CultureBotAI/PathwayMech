    - source-014
- assessment_id: chemistry
  area: graph
  topic: Complete formal chemistry and native orientation
  outcome: supported
  summary: Initial independent RDF/ChEBI audit verified all 23 sides, coefficient-one
    semantics, five atom/charge balances and directional/master relations. These adopted
    edge objects and originals are unchanged. Three core directions are L-to-R; both
    inward transport choices are master R-to-L with explicit out/in context.
  target_ids:
