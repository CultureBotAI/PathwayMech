      RDF and retained exactly.
    denominator: 23
- assessment_id: terminal-scope
  area: evidence
  topic: Hypothetical terminal catalyst and primary taxon limits
  outcome: supported
  summary: TynA assignment remains hypothetical EV-AS-NAS. The unnamed sewage isolate
    was only described as closely related to Arthrobacter globiformis; washed-cell
    methylglyoxal/O2 evidence and the proposed peroxide/catalase equation do not identify
    an oxidase or measured peroxide. E. coli W1485/SBD76 negative assays and unresolved
    Serratia Sr41 metabolism remain bounded, not universal impossibility.
  target_ids:
  - MetaCyc:THRDLCTCAT-PWY
  evidence_ids:
  - initial-science
  - successor-science
  - record
  - source-009
  - source-031
  - source-030
  - source-032
  dimensions:
