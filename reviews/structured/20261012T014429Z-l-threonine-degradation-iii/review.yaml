  outcome: supported
  summary: MetaCyc THRDLCTCAT-PWY denotes the complete three-event degradation-III
    route to methylglyoxal. All84 named IDs match independent adopted authority labels;
    no adjacent single-reaction or parent pathway is substituted.
  target_ids:
