    title (F-C9S4-001). Across 2 maintained MetaCyc pathway records (MetaCyc:THIOREDOX-PWY
    and MetaCyc:PWY-8178), 11 paired MetaCyc:* and EcoCyc:* reaction, protein-complex,
    metabolite, and regulation references[] entries in MetaCyc:THIOREDOX-PWY store
    an unprefixed raw database frame identifier where title == local_id instead of
    a descriptive title, and the 6 MetaCyc:* reactions[] entries in MetaCyc:PWY-8178
    store raw frame IDs as reaction labels where label == local_id (F-C9S4-002).
  target_ids:
