  and all Cycle 8 Stage 4/5 findings (F-C8S4-001 4 concrete CHEBI:* small-molecule
  effector participants typed as chemical_entity across 4 MetaCyc records and F-C8S4-002
  17 structured MetaCyc:* reaction/complex references[] entries with raw local-ID
  titles across 4 MetaCyc records) remain 100% resolved (0 concrete CHEBI:* small
  molecules with defined formulas typed as chemical_entity across all 7,868 participants;
  0 bare CURIE reference titles where title == id across all 7,107 references; 0 pure
  chemical_entity vs small_molecule biolink:ChemicalEntity|biolink:SmallMolecule merges
  in pages/downloads/nodes.tsv). Identified 2 minor open representation findings across
  5 MetaCyc:* records (F-C9S4-001: 16 structured MetaCyc:* reaction, monomer, and
  metabolite references[] entries across 3 MetaCyc:* pathway records — 1 in MetaCyc:PWY-8132,
  7 in MetaCyc:PWY-7255, and 8 in MetaCyc:PWY0-1241 — store an unprefixed raw database
  frame identifier where title == local_id instead of a descriptive reaction, monomer,
  or metabolite title; F-C9S4-002: 11 paired MetaCyc:* and EcoCyc:* reaction, protein-complex,
