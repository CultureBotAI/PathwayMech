limitations:
- The exact N terminus expressed in the historical NagI pWWF19-25 assay remains unresolved
  because source primer and complete-reading-frame wording conflict; the qualified
  endpoint preserves this uncertainty.
- Cgl 2006 source was independently read as author-uploaded full-paper extracted text
  and Figure 5 legend, not as an original downloaded PDF or visually inspected Figure
  5 image.
- Later NagL 2008/Cgl 2007 papers were not independently read in full; no unseen-text
  mechanistic claims were added. Curated UniProt similarity/experimental codes remain
  explicit and are not promoted to new direct experiments.
- Cofactor protonation is graph normalization; BagL physiological cysteine preference
  remains inference, and tagged-enzyme metal effects do not establish native metal
  requirements.
- All deterministic corpus gates were run by root and independently checked through
  lossless receipts/input hashes; only this one pathway was scientifically rereviewed.
  Review bundles were added afterward and separately checked by the native immutable-review
  helper.
