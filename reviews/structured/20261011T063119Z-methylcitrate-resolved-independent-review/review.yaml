actions: []
limitations:
- The absolute configuration of the E. coli methylcitrate product remains unresolved.
  This record deliberately uses issued generic reaction identities and does not imply
  that every stereoisomer is accepted.
- The 2017 main paper and older cited primaries were inspected as indexed abstracts;
  the complete 2017 supporting PDF was independently read and rendered. Serialized
  2002 publisher excerpts are transformed context, not original publisher HTML.
- PrpE activation remains an annotation-level alternative, and the Acs physiological
  contribution is condition-qualified inference. Native MG1655 scope does not make
  every primary experiment strain specific to MG1655.
- The PrpD iron-sulfur conflict remains biologically unresolved even after its provenance
  correction. No obligatory cofactor or categorical metal independence is asserted.
- iModulonDB results are computational expression context only. Acs and AcnB were
  not included in the retained query set, and missing search hits do not establish
  biological absence.
- Programmatic source, SVG and KGX checks are distinct from browser visual inspection
  and from experimental replication.
notes:
- This successor explicitly resolves the exact saved initial finding. The initial
  YAML/Markdown review and archived initial source inputs remain unchanged.
- The scientific acceptance for issue 332 concerns uncertainty representation using
  separately issued generic reactions. The absolute methylcitrate configuration remains
  unresolved and must not be treated as experimentally settled.
- The initial reviewer document needed serialization and enum corrections before its
  canonical save. A successor helper initially assumed an optional edge description
  existed; using the documented empty-string default fixed that helper without changing
  any target or source.
- 'The initial full suite was intentionally interrupted before source-evidence corrections:
  1,022 tests passed and three were skipped, with pytest exit 2 and driver exit 130.
  It was not a complete pass. Final verification uses separate logs on corrected frozen
  inputs.'
- Generated pages are owned by the maintained YAML and repository renderer; no generated
  page was manually edited by this reviewer. Shared authority facts remain unchanged
  from the initial inspection.
