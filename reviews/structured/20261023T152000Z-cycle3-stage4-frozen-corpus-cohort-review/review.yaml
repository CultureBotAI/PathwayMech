- finding_id: F-C3S4-002
  issue_key: gomodel-oxobutanoate-mislabeled-as-lipid-in-4-records
  category: consistency
  severity: minor
  status: open
  certainty: confirmed
  title: 'Four maintained gomodel amino-acid metabolism records type short-chain 2-oxoacid
    intermediates CHEBI:11851 (3-methyl-2-oxobutanoate) and CHEBI:16763 (2-oxobutanoate)
    as category: lipid instead of category: small_molecule'
  description: 'Four maintained gomodel:* amino-acid metabolism records type short-chain
    2-oxoacid amino-acid intermediates as category: lipid instead of category: small_molecule:
    CHEBI:11851 (3-methyl-2-oxobutanoate, alpha-ketoisovalerate) at data/pathways/valine-degradation.yaml#participants[3].category
    (gomodel:YeastPathways_PWY3O-4105), and CHEBI:16763 (2-oxobutanoate, alpha-ketobutyrate)
    at data/pathways/homocysteine-and-cysteine-interconversion.yaml#participants[13].category
    (gomodel:YeastPathways_HOMOCYS-CYS-CONVERT), data/pathways/l-cysteine-biosynthesis-iii-from-l-homocysteine.yaml#participants[9].category
    (gomodel:YeastPathways_HOMOCYSDEGR-PWY-1), and data/pathways/threonine-degradation.yaml#participants[3].category
    (gomodel:YeastPathways_THREOCAT2-PWY). In sibling MetaCyc:* records (MetaCyc:LEUSYN-PWY,
    MetaCyc:PANTO-PWY, MetaCyc:VALSYN-PWY, and MetaCyc:ILEUSYN-PWY), CHEBI:11851 and
    CHEBI:16763 are typed as category: small_molecule, causing pages/downloads/nodes.tsv
    to export both nodes with conflicting biolink:ChemicalEntity|biolink:SmallMolecule
    categories and lipid|small_molecule source_category values.'
  target_ids:
  - gomodel:YeastPathways_PWY3O-4105
  - gomodel:YeastPathways_HOMOCYS-CYS-CONVERT
  - gomodel:YeastPathways_HOMOCYSDEGR-PWY-1
  - gomodel:YeastPathways_THREOCAT2-PWY
  field_paths:
  - data/pathways/valine-degradation.yaml#participants[3].category (CHEBI:11851)
  - data/pathways/homocysteine-and-cysteine-interconversion.yaml#participants[13].category
    (CHEBI:16763)
  - data/pathways/l-cysteine-biosynthesis-iii-from-l-homocysteine.yaml#participants[9].category
    (CHEBI:16763)
  - data/pathways/threonine-degradation.yaml#participants[3].category (CHEBI:16763)
  evidence_ids:
  - EV-C3-OXOBUTANOATE-LIPID-MISMATCH
  - EV-C3-KGX-NODES-TSV
  rule_id: CAUSAL_GRAPHS:cross-record-participant-category-consistency
  native_severity: minor
  normalization_reason: 'Native minor cross-record consistency defect maps directly
    to minor severity: harmonizing CHEBI:11851 and CHEBI:16763 from lipid to small_molecule
    across the 4 gomodel:* records aligns with their chemical identity as hydrophilic
    C4/C5 2-oxoacid amino-acid intermediates and eliminates the multi-category conflict
    in pages/downloads/nodes.tsv.'
  owner_paths:
  - repository: CultureBotAI/PathwayMech
    path: data/pathways/valine-degradation.yaml
    role: maintained pathway YAML
  - repository: CultureBotAI/PathwayMech
    path: data/pathways/homocysteine-and-cysteine-interconversion.yaml
    role: maintained pathway YAML
  - repository: CultureBotAI/PathwayMech
    path: data/pathways/l-cysteine-biosynthesis-iii-from-l-homocysteine.yaml
    role: maintained pathway YAML
  - repository: CultureBotAI/PathwayMech
    path: data/pathways/threonine-degradation.yaml
    role: maintained pathway YAML
  tags:
  - cycle3-stage4-record-review
  - participant-category
  - cross-record-consistency
  - kgx-export
