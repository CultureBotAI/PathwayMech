name: Publish Pages

# Publishes only the root redirect and pages/, and only after "Build and test"
# has passed on the commit being published.
on:  # yamllint disable-line rule:truthy
  workflow_run:
    workflows: [Build and test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A slow run for an older commit must not overwrite a newer site.
      - name: Publish only the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_head=$(git rev-parse HEAD)
          current_head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$published_head" = "$current_head" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$published_head is no longer main ($current_head); not publishing"
          fi

      - name: Install uv
        if: steps.current.outputs.publish == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      # Never publish a site that is not what the records render to.
      - name: Refuse a stale site
        if: steps.current.outputs.publish == 'true'
        run: uv run --locked pathwaymech-check-pages

      - name: Stage the site
        if: steps.current.outputs.publish == 'true'
        run: |
          site="$RUNNER_TEMP/pathwaymech-site"
          mkdir -p "$site"
          cp index.html "$site/"
          cp -R pages "$site/pages"

      - uses: actions/configure-pages@v5
        if: steps.current.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          path: ${{ runner.temp }}/pathwaymech-site

      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.publish == 'true'
        id: deployment
