sources:
  - id: go-cam
    priority: 10
    label: Gene Ontology Causal Activity Models
    enabled: true
    ingest_status: active
    role: causal-activity-model
    homepage: https://geneontology.org/docs/download-go-cams/
    notes: Activity-centric causal models serialized as LinkML-defined JSON.
  - id: wikipathways
    priority: 20
    label: WikiPathways
    enabled: true
    ingest_status: active
    role: pathway-reference
    homepage: https://www.wikipathways.org/
    notes: CC0 monthly GPML and RDF releases for community-curated pathways.
  - id: rhea
    priority: 30
    label: Rhea
    enabled: true
    ingest_status: support
    role: reaction-reference
    homepage: https://www.rhea-db.org/
    notes: CC-BY reaction reference for ChEBI-grounded biochemical reactions.
  - id: mibig
    priority: 40
    label: MIBiG
    enabled: true
    ingest_status: active
    role: biosynthetic-gene-cluster-reference
    homepage: https://mibig.secondarymetabolites.org/
    notes: CC-BY JSON source for experimentally characterized BGC records.
  - id: reactome
    priority: 50
    label: Reactome
    enabled: true
    ingest_status: active
    role: pathway-reference
    homepage: https://reactome.org/
    notes: CC0 BioPAX source with narrow Mycobacterium tuberculosis canary records.
  - id: pathbank
    priority: 60
    label: PathBank
    enabled: true
    ingest_status: support
    role: model-organism-pathway-reference
    homepage: https://pathbank.org/
    notes: >-
      Pinned primary-archive BioPAX canary for local drafting; source versions
      and current data terms retained for later public-release review.
  - id: metacyc
    priority: 70
    label: MetaCyc
    enabled: true
    ingest_status: license-gated
    role: pathway-reference
    homepage: https://metacyc.org/
    notes: BioCyc flat-file and web-service source for curated metabolic pathways.
  - id: kegg
    priority: 80
    label: KEGG PATHWAY
    enabled: true
    ingest_status: license-gated
    role: pathway-reference
    homepage: https://www.genome.jp/kegg/pathway.html
    notes: License-gated KGML and REST source for pathway maps and modules.
  - id: go
    priority: 90
    label: Gene Ontology
    enabled: true
    ingest_status: active
    role: pathway-grounding
    homepage: https://geneontology.org/
    notes: CC-BY ontology and GO-CAM source for process grounding.
  - id: modelseed
    priority: 100
    label: ModelSEED Biochemistry
    enabled: true
    ingest_status: support
    role: reaction-reference
    homepage: https://modelseed.org/
    notes: GitHub-hosted TSV/JSON biochemistry with KEGG and MetaCyc caveats.
  - id: bigg
    priority: 110
    label: BiGG Models
    enabled: true
    ingest_status: support
    role: organism-model-reference
    homepage: https://bigg.ucsd.edu/
    notes: Noncommercial SBML/JSON genome-scale models with reaction subsystems.
  - id: bv-brc
    priority: 120
    label: BV-BRC Pathways and Subsystems
    enabled: true
    ingest_status: support
    role: genome-pathway-membership
    homepage: https://www.bv-brc.org/
    notes: Genome-specific KEGG pathway calls and SEED subsystem assignments.
  - id: pmn
    priority: 130
    label: Plant Metabolic Network / ChlamyCyc
    enabled: true
    ingest_status: license-gated
    role: algal-pathway-reference
    homepage: https://plantcyc.org/
    notes: >-
      Local PGDB-scoped importer; native exports require license agreement and
      staff-issued access. Chlamy public metadata inspected; no authorized
      native export or maintained pathway adopted (2026-10-08 canary report).
  - id: veupathdb
    priority: 140
    label: VEuPathDB
    enabled: true
    ingest_status: support
    role: protist-fungal-pathway-membership
    homepage: https://veupathdb.org/
    notes: >-
      Fungal and protist KEGG/MetaCyc membership rows from local WDK exports.
  - id: gapmind
    priority: 150
    label: GapMind
    enabled: true
    ingest_status: support
    role: enzyme-step-rulebase
    homepage: https://github.com/morgannprice/PaperBLAST
    notes: GPL-3.0 local amino-acid and carbon .steps rulebase for enzyme triage.
  - id: unipathway
    priority: 160
    label: UniPathway
    enabled: true
    ingest_status: support
    role: pathway-crosswalk
    homepage: https://github.com/geneontology/unipathway
    notes: CC-BY retired UPA OBO crosswalk to Rhea, MetaCyc, KEGG, GO, EC, and ChEBI.
  - id: dbcan-pul
    priority: 170
    label: dbCAN-PUL
    enabled: true
    ingest_status: support
    role: glycan-locus-reference
    homepage: https://pro.unl.edu/dbCAN_PUL/dbCAN_PUL/home
    notes: >-
      Local February 2025 workbook support ingestion preserves all 633 locus
      rows and original cells; public-release data terms remain under review.
  - id: panther
    priority: 180
    label: PANTHER Pathway
    enabled: true
    ingest_status: fixture
    role: biopax-pathway-reference
    homepage: https://pantherdb.org/
    notes: Generic SBML and BioPAX pathway diagrams exposed as a low-priority fixture.
  - id: puldb
    priority: 190
    label: PULDB
    enabled: false
    ingest_status: deferred
    role: glycan-locus-reference
    homepage: https://www.cazymodo.org/PULDB/
    notes: Prediction-heavy Bacteroidetes PUL catalogue without a clear bulk license.
  - id: seed-pubseed
    priority: 200
    label: SEED / PubSEED Subsystems
    enabled: true
    ingest_status: support
    role: subsystem-role-reference
    homepage: https://theseed.org/
    notes: >-
      Local native subsystem API bundles preserve role positions, genome
      variants and feature cells, with request/hash provenance and join checks.
  - id: microscope-microcyc
    priority: 210
    label: MicroScope / MicroCyc
    enabled: false
    ingest_status: deferred
    role: genome-pgdb-reference
    homepage: https://mage.genoscope.cns.fr/
    notes: Authenticated Tier-3 Pathway Tools PGDBs predicted from MetaCyc topology.
  - id: jgi-img-abc
    priority: 220
    label: JGI IMG/M and IMG-ABC
    enabled: false
    ingest_status: license-gated
    role: genome-bgc-reference
    homepage: https://img.jgi.doe.gov/
    notes: JGI portal exports require policy-gated access and mix imported predictions.
  - id: ecmdb
    priority: 230
    label: E. coli Metabolome Database
    enabled: false
    ingest_status: deferred
    role: organism-pathway-reference
    homepage: https://ecmdb.ca/
    notes: E. coli pathway cards overlap EcoCyc, KEGG, and PathWhiz without a bulk graph.
  - id: algaepath
    priority: 240
    label: AlgaePath
    enabled: false
    ingest_status: deferred
    role: algal-expression-pathway-overlay
    homepage: https://algaepath.itps.ncku.edu.tw/
    notes: KEGG-derived algal pathway overlay outranked by PMN and ChlamyCyc topology.
  - id: brenda
    priority: 250
    label: BRENDA
    enabled: true
    ingest_status: support
    role: pathway-reaction-component-reference
    homepage: https://brenda-enzymes.org/
    notes: >-
      Pinned local RDF role-query importer preserves native reaction-component
      assertions; separately audited web rows retain organism/reference scope,
      without automatic enzyme joins or maintained pathway graphs.
  - id: hadeg
    priority: 260
    label: HADEG
    enabled: true
    ingest_status: support
    role: degradation-pathway-membership
    homepage: https://github.com/jarojasva/HADEG
    notes: >-
      Pinned local CSV membership adapter tested on 629 rows; lexical identifier
      candidates remain unverified. Four-member Finnerty evidence canary spans
      three strains and does not establish a pathway graph. Upstream GPL terms
      retained; source tables remain external (2026-10-08 canary report).
  - id: envipath
    priority: 270
    label: enviPath
    enabled: false
    ingest_status: license-gated
    role: biotransformation-pathway-reference
    homepage: https://envipath.org/
    notes: Current terms restrict extraction and redistribution despite documented graph APIs.
  - id: dram
    priority: 280
    label: DRAM
    enabled: true
    ingest_status: support
    role: metabolic-module-reference
    homepage: https://github.com/BortonWrightonLabs/DRAM
    notes: >-
      Pinned local DRAM1 module-step support preserves all native rows and path
      coordinates; KEGG lineage is retained for later public-release review.
  - id: diting
    priority: 290
    label: DiTing
    enabled: false
    ingest_status: deferred
    role: biogeochemical-pathway-rulebase
    homepage: https://github.com/SilentGene/DiTing
    notes: KO abundance formulas are support rules with derived-data terms, not causal graphs.
  - id: metabolic
    priority: 300
    label: METABOLIC
    enabled: false
    ingest_status: license-gated
    role: biogeochemical-module-reference
    homepage: https://github.com/AnantharamanLab/METABOLIC
    notes: Packaged module templates need format inspection and explicit data reuse terms.
