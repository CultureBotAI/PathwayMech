limitations:
- Root complete1993/2002/2011 and ten-image reading is inherited, alongside this reviewer earlier native/source
  audits. This maintained review freshly reads the whole current record and all root appraisals and decodes original
  bytes; it does not repeat full paper reading. Two-event interpretation and six native plus two interpreted donor
  sides retain their stated evidence limits.
- PWML BaeS drawing has one chain; BaeR component coefficients are nil. BioPAX flattened BaeR self-side and reciprocal
  modification/binding features do not establish a noncovalent phosphate complex, prephosphorylated reactant or
  native assembly stoichiometry.
- Native isolated Pi acid structure/trianion cross-reference conflict remains unresolved. No acid/free phosphate/bound
  phosphoryl equivalence. ATP/ADP stereo exact mappings do not determine assay protonation.
- Root personally viewed the earlier static light preview. Deoxy verified complete current SVG and style/CSS/JS
  equality to that preview. Dense convergence, long return paths, overlapping/truncated labels and tall blank canvas
  remain. This SCI reviewer inherits that exact visual assessment and makes no personal new browser, interactive,
  responsive, keyboard, dark-mode or print claim.
- 'Current P30847 BaeS467 differs from historical BAA03140.1 BaeS466: historical414-420 VPATVPA is replaced by current414-421
  GSRNRASG. Historical BaeR equals current P69228 reference sequence, without resequencing assay plasmids. H250/D61
  are PROSITE inference, not demonstrated sites.'
- 1993 enriched membrane/cytosolic fractions and mixing controls support presumed cognate transfer, not a purified
  pair, direct donor loss, affinity, exclusive Ca2+ requirement or natural ligand. Truncated BasS/OmpR crosstalk
  remains separate.
- 2002 construct/host-specific overexpression and EMSA results do not establish obligatory phosphorylation, MdtD
  requirement or native oligomer stoichiometry. 2011 condition-specific reporter/phenotype results do not show direct
  BaeS ligand binding or purified MdtA transport.
- Wrong source GO0070258 is excluded; GO0005886 bacterial inner membrane and GO0005737 cytoplasm retain narrow supported
  scope. NCBITaxon562/83333 are species/K12 identity, not MG1655 or unrestricted assay generalization.
- 2005 PMID15522865 full article remains unavailable:403 body attempts and HTTP200 Elsevier core data are not full
  text. Its use remains reviewed-annotation-attributed. Raw PWML undeclared-prefix original and separately bound
  reversible reading derivative remain distinct.
- Ordinary PathBank authority identity/name projections do not add typed-context chemistry or assembly guarantees.
  Accepted ATP/ADP earlier first-encounter ordering permutation remains explicit.
