- The 2007 early-enzyme paper is abstract-only, and the later supplement was unavailable. Full source
  access or exact tagged-construct sequences are not claimed.
- Both branches are supported in vitro; a unique intracellular sequence and accumulation of every
  intermediate are not established.
- Selected citryl identities leave citrate-derived stereochemistry unspecified; this does not claim
  racemic physiology or acceptance of all stereoisomers.
- Generic carrier matching-scaffold balance is conditional bookkeeping, not a full-polypeptide molecular
  formula; the physiological maturation catalyst remains unknown.
- Reviewer code contributions are excluded from independent implementation approval. Separate independent
  technical acceptance is cited.
- The initial independent all-source assessment remains applicable to unchanged scientific assertions.
  This successor performs fresh narrow source/delta and final integration checks; no new full literature
  survey is claimed.
- Remote CI, merge and deployment checks are outside this local scientific observation.
