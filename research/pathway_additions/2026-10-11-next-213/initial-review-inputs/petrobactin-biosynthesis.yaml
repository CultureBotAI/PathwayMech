id: MetaCyc:PWY-6289
label: petrobactin biosynthesis
description: Complete ten-transformation native pathway including 3-dehydroshikimate conversion, carrier
  maturation and both convergent citrate/spermidine assembly branches. The organism context is Bacillus
  anthracis Sterne; the principal full pathway study used Sterne 34F2-derived preparations. The six versioned
  source proteins preserve native identities; current reviewed AsbB and AsbE annotations differ at their
  N termini, and exact tagged constructs are not equated to native sequences. Source-defined AsbF is dimeric;
  AsbB dimer evidence is retained on its functional role without assigning an unverified complex identity.
  The physiological catalyst of generic apo-to-holo carrier maturation remains unassigned. Generic carrier
  states represent whole chemical classes rather than full protein sequences. The authentic native reaction
  and CPD-9985 product are selected. Native and ChEBI:142778 have equal formula/charge but different spermidine-arm
  connectivity; no exact equation or product equivalence to RHEA:63821 is asserted. Its independently
  specified carrier side supports the holo output only. Both branches are supported by the primary in
  vitro study, while a unique intracellular order remains unresolved. AsbA partial substitution by AsbB
  and early free-aroylspermidine side products do not expand the selected native boundary. The inspected
  early-enzyme paper is abstract-only and the later study supplement was unavailable. The selected citryl
  intermediate identities leave absolute citrate-derived stereochemistry unspecified; they do not assert
  racemic physiology or acceptance of every stereoisomer.
