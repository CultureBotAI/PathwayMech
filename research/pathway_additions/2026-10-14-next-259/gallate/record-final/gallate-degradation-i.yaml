- id: native-022
  subject: MetaCyc:CPLX-7918
  predicate: catalyzes
  object: RHEA:28928
  description: Purified SYK-6 DesB produced in E. coli BL21(DE3) with pETB/pET21a(+). The encoded 418-residue
    reference has a processed initiating methionine in the assayed preparation. Gallate-dependent oxygen
    consumption gives Vmax 42.7 ± 2.4 U/mg and Km 66.9 ± 9.3 µM (2005 Table 2). Late acidified GC-MS supports
