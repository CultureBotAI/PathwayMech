description: Four-step aerobic gallate cleavage to pyruvate and oxaloacetate through keto-4-oxalomesaconate,
  the E,E enol and stereochemically unspecified carboxyhydroxyoxoadipate. The exact MetaCyc accession
  has suffix II but displays gallate degradation I. Formal reaction structures control the E,E assignment
  despite a conflicting Z,Z narrative link. KTGAL repaired GalT, KT2440 reporter constructs, historical
  native preparations and recombinant assays remain distinct. Source associations do not establish this
  complete route in every component organism. SYK-6 DesZ and LigAB oxygen-consumption assays show alternative
  gallate turnover without resolving the immediate product; PCA-specific LigAB regulator edges do not
  imply gallate-flux regulation.
pathway_type: aromatic-compound-catabolism
