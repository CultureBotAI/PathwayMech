- id: gallate-induced-galb
  subject: CHEBI:16918
  predicate: regulates
  object: KEGG:ppu:PP_2515
  description: The 2011 KTGAL RT-PCR study reports gallate-inducible galBCD and galTAP transcriptional
    units; citrate-only cultures lacked the tested intergenic products. This edge denotes an indirect
    environmental transcriptional response at the stated promoter/gene context. Insertions in galB and
    galT caused downstream polar effects, so individual-gene necessity is not isolated. The gene locus
    owner is distinct from the repaired KTGAL GalT protein; no direct GalR ligand binding is established.
  evidence:
  - reference_id: PMID:21219457
    quote: GA inducible
    source_locator: 2011 Transcriptional organization, publisher lines236–239; FigureS2 original unavailable
