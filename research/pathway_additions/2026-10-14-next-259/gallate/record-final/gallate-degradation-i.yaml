  object: MetaCyc:CPLX-7916
  description: Synthetic NCBI-derived SYK-6 ligAB was expressed from pET15b in E. coli BL21; alpha was
    initially N-His-tagged and beta was untagged. Anaerobic purification included thrombin cleavage (P8–P16).
    2,3,4-trihydroxybenzoic acid reduced PCA-dependent O2 consumption by 95% with 500 µM PCA, 1 mM inhibitor
    and 3–7 nM LigAB in air-saturated 50 mM Tris, pH 7.5, 25 °C (Table 2b/P27). This does not establish
    a competitive Ki or inhibition of gallate flux. The chemical endpoint follows the neutral parent drawn
    in SI Figure S2; supplied salt and unique assay microspecies are not assigned.
