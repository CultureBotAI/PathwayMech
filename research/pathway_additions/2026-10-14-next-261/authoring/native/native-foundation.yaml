id: MetaCyc:PWY-5415
label: catechol degradation I (meta-cleavage pathway)
description: The complete five-transformation catechol meta-cleavage route comprises P183-PWY and PWY-5162. Catechol
  ring cleavage and hydrolysis yield formate and a five-carbon intermediate; hydration and aldol cleavage yield
  pyruvate and acetaldehyde, followed by acetyl-CoA formation. Formal chemistry retains the (2Z,4E) ring-cleavage
  product, the 2Z enol hydratase substrate and the S aldolase substrate. Native parent prose also describes keto/2E
  forms; historical assay preparations do not independently establish these exact formal stereochemical assignments.
  The native hydrolase Rhea cross-reference specifies a keto product and is not an exact replacement for the selected
  native enol reaction. Enzyme activity nodes preserve individual microbial source preparations and evidence codes.
  Their component activities do not establish the entire route in every source organism. Native activity interfaces
  and curated formal reaction assignments remain distinct, with expression hosts, partial purification, complexes
  and sequence-reference limitations attached to their evidence. E. coli MhpD/E/F are a shared terminal module;
  their inclusion does not assign the complete catechol route to E. coli. XylE is tetrameric and the MhpD native
  assembly pentameric. DmpFG contains two F/G catalytic pairs; heterodimer wording denotes a pair. XylI/J and Bordetella
  decarboxylase/hydratase partners retain their native assembly boundaries, with unspecified coefficients left unspecified.
  Oxidative-branch catalysis and its separate PWY-5420 route remain adjacent context. AdhE is explicitly excluded
  by PWY-5162 and its regulators are retained only in source context. Native NADH inhibition of DmpG conflicts with
  primary stimulation and is excluded as an accepted inhibitory claim. Native Mn/Zn allosteric labels do not establish
  a binding mechanism. PKO1 TbuE has independently reported catechol activity but its current native ENZRXN pointer
  is methylcatechol chemistry; those material reactions are not added to the five-step route. Gene-product identities,
  additional substrates, kinetics, source organism catalogues and regulatory identity gaps remain explicitly dispositioned
  with source locators.
pathway_type: aromatic-compound-degradation
