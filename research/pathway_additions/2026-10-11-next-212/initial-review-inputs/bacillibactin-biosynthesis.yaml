id: MetaCyc:PWY-5903
label: bacillibactin biosynthesis
description: 'Complete twelve-transformation chorismate-to-bacillibactin pathway in Parageobacillus
  sp. KH3-4: three upstream 2,3-dihydroxybenzoate reactions and nine carrier-dependent NRPS transformations.
  The upstream DhbA/C/B activities are genome and cluster annotations; the 2025 purified reconstitution
  starts with supplied 2,3-DHB, glycine and L-threonine. The native DhbF model retains both CP sites,
  condensations and TE-mediated trimeric cyclorelease. The old MetaCyc terminal arginyl carrier is chemically
  inconsistent with its threonyl precursor and primary structure. The independently issued MetaNetX
  threonyl reactive-state class is selected explicitly under the same native transformation identities;
  no exact equivalence to the old arginyl frame or imported ModelSEED alias is asserted. Carrier classes
  represent covalent reactive states with unspecified protein continuations, not exact KH3-4 sequences
  or whole-polypeptide stoichiometry. Three ATP adenylations per repeat imply nine ATP per trimer as
  mechanistic bookkeeping, not a measured ATP/product ratio; the conflicting native six-ATP composite
  is excluded rather than added to these twelve steps. The primary accession bridge identifies native
  gene sources, while tags, domain truncations and a contradictory printed DhbB coexpression primer
  limit exact engineered construct identity. DhbB phosphopantetheinylation was measured; DhbF maturation
  is supported by coexpression and function without direct occupancy measurement. MbtH was included
  in reconstitution, but its isolated requirement and stable complex stoichiometry were not established.
  Mg2+ was an assay condition, not an independently demonstrated free cofactor dependency. No native
  assembly stoichiometry, cellular location, transporter or regulation is transferred from B. subtilis.
  The strain-168 sfp0 defect and engineered E. coli expression host do not define KH3-4 biology. Ferric
  loading, uptake, mutasynthetic analogues and downstream utilization are outside this complete biosynthetic
  boundary.'
