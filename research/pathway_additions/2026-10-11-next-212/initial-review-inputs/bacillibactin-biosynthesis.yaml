    source_assertion: Methods identify BDG45617 as the KH3-4 PPTase gene and BDG45614/BDG45615 as DhbB/DhbF.
      The proteins were expressed with tags and/or coexpression; this identifies native gene sources,
      not fully verified engineered construct sequences.
    source_locator: PDF p.12, Plasmid construction; pp.12-13, Production and purification
  - reference_id: PMID:39870587
    source_assertion: Purified PPTase and CoA increase apo-DhbB mass by about 340 Da. The no-PPTase
      control and coexpression preparation support phosphopantetheinylation. The printed coexpression
      primer discrepancy limits exact construct reconstruction.
    source_locator: PDF pp.5-6, PPTase Results and Figure 3; p.14, PPTase assay; p.19, SI Table S1
  description: Activation by phosphopantetheinylation in the KH3-4-derived preparation; DhbB modification
    was measured directly. The printed coexpression primer mismatch does not prove that an incorrect
    plasmid was used.
