id: GO:0033468
label: CMP-keto-3-deoxy-D-manno-octulosonic acid biosynthetic process
description: 'CMP-Kdo biosynthesis in Escherichia coli K-12 converts D-ribulose 5-phosphate to the activated
  lipid-A sugar donor through KdsD or GutQ, KdsA, KdsC and KdsB. The complete MetaCyc PWY-1269 boundary
  includes four enzymatic conversions and a reversible spontaneous arabinose-5-phosphate ring equilibrium.
  KdsA consumes the open-chain sugar in current Rhea and primary substrate studies; the older native furanose
  substrate assignment is not treated as an obligatory intermediate. A second unresolved source conflict
  concerns KdsB: current Rhea and MetaCyc use free alpha-Kdo, whereas primary NMR and kinetic evidence
  identifies beta-pyranose Kdo as the accepted substrate and reports retained beta configuration in CMP-Kdo.
  The alpha-Kdo edges preserve the current database convention, not direct experimental alpha catalysis
  or an inferred anomerase. Native KdsD and GutQ tetramers are supported; native KdsA is a tetramer, conflicting
  with the unqualified current UniProt homotrimer annotation. K-12 KdsC catalysis, tetramer and Mg binding
  are annotated by similarity to the B/BL21 protein. KdsC and KdsB gene-product roles do not imply isolated
  monomer sufficiency; KdsB structural studies show a dimer. Downstream Kdo transfer to lipid IVA, capsule-specific
  paralogs and LPS assembly are outside this boundary.'
