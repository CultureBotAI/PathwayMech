limitations:
- 'Full scientific source interpretation is inherited from the accepted independent review: six complete
  primary main bodies, two spreadsheets, whole native/UniProt objects and bounded older abstracts. This
  maintained review freshly reads the full current YAML and inherited judgments; it does not claim a new
  full-paper reading.'
- Most historical papers have indexed abstracts rather than complete Methods; unavailable/unread supplements
  and other sources remain explicitly limited. No source-exhaustion claim follows.
- Static graph junction labels overlap. Exact claims remain in the fully checked evidence table. Static
  raster was produced earlier by root and freshly viewed here; actual maintained SVG is identical. No
  interactive browser test is claimed.
- Scientific e083 assertion is a 400-character source excerpt ending mid-word. Inherited whole-source
  review supports the claim; complete FUNCTION original remains portable. No claim that the excerpt is
  the whole source.
- Technical runtime behavior is inherited from accepted independent implementation and actual-output reviews
