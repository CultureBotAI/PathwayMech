id: MetaCyc:PWY-5901
label: 2,3-dihydroxybenzoate biosynthesis
description: The complete three-step pathway converts chorismate to 2,3-dihydroxybenzoate through isochorismate
  and (2S,3S)-2,3-dihydroxy-2,3-dihydrobenzoate. It follows the exact MetaCyc PWY-5901 boundary and the
  experimentally resolved EntC–EntB–EntA sequence in Escherichia coli K-12. EntC is an active monomer;
  its reversible chemistry is oriented toward biosynthesis. EntB contributes its N-terminal isochorismatase
  activity, represented by the native holo-EntB dimer with two explicitly modified protein components.
  That form does not establish a requirement for phosphopantetheinylation of its separate carrier domain
  in DHB production. EntA uses NAD and produces DHB by oxidation followed by rapid aromatization, represented
  once as the net reaction. Its selected native tetramer coexists with concentration-dependent dimer–tetramer
  behavior; an older octamer estimate remains a historical conflict. Magnesium annotations are retained
  for EntC and EntB with their stated evidence limits. K-12 mutant physiology and reviewed K-12 proteins
  ground the taxon; native MG1655 assembly attribution does not relabel every experiment as MG1655. Upstream
  chorismate biosynthesis, downstream EntB carrier maturation/loading and enterobactin assembly, and the
  extra CueO-associated oxidation on the broader PathBank map are outside this independently defined pathway.
  Pairwise EntC–EntB interaction does not establish obligatory substrate channeling or a fixed multienzyme
  assembly.
