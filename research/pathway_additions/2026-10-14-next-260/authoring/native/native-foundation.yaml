id: MetaCyc:GALLATE-DEGRADATION-I-PWY
label: gallate degradation II
description: Source-defined five-step gallate route through PDC, keto OMA, the formal E,E enol and CHA
  to pyruvate and oxaloacetate. Native P. putida/PDC extract evidence and component-specific assays have
  different scopes. Other component taxa do not establish whole-route occurrence. Exact LigJ and BR6020
  PmdE E,E catalysis is deferred; historical preparations are not equated with modern reference sequences.
  The native narrative Z,Z link conflicts with the formal E,E structure. Adjacent activities remain assay
  context, not additional pathway steps.
