- id: pdc-1982-inhibit-zn
  subject: CHEBI:29105
  predicate: inhibits
  object: MetaCyc:MONOMER-3463
  description: The named divalent ion at 1 mM strongly inhibited purified native P. testosteroni
    PDC hydrolase. Counterion and quantitative residual activity were not reported; this is
    an in vitro assay effect.
  evidence:
  - reference_id: PMID:7142106
    quote: strongly inhibited
    source_locator: p.1157, left column, Properties of purified PDC hydrolase, complete metal-effects
      sentence (Zn2+, Cu2+, Mn2+, Co2+ at 1 mM)
  endpoint_qualifiers:
  - endpoint: object
    kind: experimental_construct
    description: Purified native P. testosteroni hydrolase from the 1982 study; final DEAE-Sephacel
      fraction. This historical sample is not the P. putida PDC-isolate enzyme and is not
      identified with a later BR6020 sequence.
    evidence:
    - reference_id: PMID:7142106
      source_assertion: 'Table 1 final DEAE-Sephacel fraction: 5.2 mg protein, 778 U total
        activity and 149 U/mg; U denotes µmol PDC hydrolyzed per minute.'
      source_locator: p.1156, Table 1, final DEAE-Sephacel row and unit footnote
