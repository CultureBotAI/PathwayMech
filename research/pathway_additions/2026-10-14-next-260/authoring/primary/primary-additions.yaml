- id: pdc-1982-gsh-protection
  subject: CHEBI:16856
  predicate: activates
  object: MetaCyc:MONOMER-3463
  description: Reduced glutathione at 5 mM preserved hydrolase activity during 15 min co-incubation
    with DTNB. This is protection during treatment, not recovery after completed inactivation
    or unconditional activation. GSH is a named-parent normalization with supplied salt/protonation
    unspecified.
  evidence:
  - reference_id: PMID:7142106
    quote: fully preserved
    source_locator: p.1157 left column, complete final DTNB paragraph sentence naming 5 mM
      glutathione during 15 min incubation
  endpoint_qualifiers:
  - endpoint: object
    kind: molecular_state
    description: Hydrolase during DTNB challenge; glutathione was present during the incubation,
      not added after a completed inactivation. Purified 1982 native hydrolase, final DEAE
      fraction.
    evidence:
    - reference_id: PMID:7142106
      source_assertion: 'Table 1 final DEAE-Sephacel fraction: 5.2 mg protein, 778 U total
        activity and 149 U/mg; U denotes µmol PDC hydrolyzed per minute.'
      source_locator: p.1156, Table 1, final DEAE-Sephacel row and unit footnote
    - reference_id: PMID:7142106
      quote: incubation with Ellman reagent
      source_locator: p.1157 left column, complete final DTNB paragraph sentence
- id: pca-1975-gallate-inhibition
  subject: CHEBI:16918
  predicate: inhibits
  object: MetaCyc:PROTOCATECHUATE-34-DIOXYGENASE-RXN
  description: Gallate competitively inhibited PCA oxidation by the anonymous crystalline
    3,4-dioxygenase gift, Ki 5 µM. Figure 4 used 13.3–66.7 µM gallate. This is the PCA readout,
    not self-inhibition of gallate turnover; the paper did not identify the gifted enzyme
    organism or establish a shared binding site.
  evidence:
  - reference_id: PMID:1194238
    quote: competitive inhibitor
    source_locator: p.1378 left column, complete crystalline-enzyme inhibition paragraph and
      Figure 4
- id: ligj-2000-cys
  subject: CHEBI:15356
  predicate: activates
  object: MetaCyc:CPLX-2864
  description: Pretreatment of 0.5 µg recombinant LigJ with 1 mM CYS for 10 min at 30 °C gave
    147% relative activity in the OMA-mixture assay. This does not establish E,E-specific
    turnover or cellular regulation. Cysteine/DTT stereochemistry and supplied salt/protonation
    are not specified.
  evidence:
  - reference_id: PMID:11092855
