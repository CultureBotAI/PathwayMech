- id: pdc-1982-dtnb
  subject: CHEBI:86228
  predicate: inhibits
  object: MetaCyc:MONOMER-3463
  description: DTNB at 0.1 mM abolished activity after treatment of 10 µg purified hydrolase
    in 0.2 ml EDTA-Tris, pH 8. The named acid parent normalizes the paper reagent; supplied
    salt and protonation were unspecified. No modified residue was identified.
  evidence:
  - reference_id: PMID:7142106
    quote: completely abolished the activity
    source_locator: p.1157 left column, complete DTNB treatment sentence and preceding 10
      µg/0.2 ml assay sentence
