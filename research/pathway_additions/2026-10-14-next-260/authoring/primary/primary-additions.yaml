- id: proa-1990-cofactor-mg
  subject: MetaCyc:CPLX-2782
  predicate: has_cofactor
  object: CHEBI:18420
  description: Purified native historical P. ochraceae aldolase; Mg2+ supplied as chloride
    supported l-CHA cleavage. Table II metal Km 32.3 µM, substrate Km 8.8 µM and Vmax 262
    U/mg apply to pH 8, 25 °C and 0.2 mM phosphate. This is alternative metal support, not
    simultaneous requirement or physiological occupancy.
  evidence:
  - reference_id: PMID:2229032
    source_assertion: Table II l-CHA/Mg2+ row gives metal Km 32.3 µM, substrate Km 8.8 µM
      and Vmax 262 U/mg.
    source_locator: p.331 Table II, l-CHA/Mg2+ row, headers and assay footnote
  endpoint_qualifiers:
  - endpoint: subject
    kind: experimental_construct
    description: Purified native aldolase from phthalate-grown historical P. ochraceae, ending
      with isoelectric focusing. No NGJ1 strain or later recombinant sequence equivalence
      is asserted.
    evidence:
    - reference_id: PMID:2229032
      source_assertion: 'Table I final isoelectric-focusing fraction: 0.61 mg protein; specific
        activities 282, 52.6 and 9.46 U/mg for dl-CHA, dl-HMG and OA, respectively.'
      source_locator: p.329 Table I, final isoelectric-focusing row with column headers
