mechanistic_edges:
- id: native-catalysis-ENZRXN-3623
  subject: MetaCyc:MONOMER-3463
  predicate: catalyzes
  object: RHEA:10645
  description: Historical purified native P. testosteroni PDC hydrolase catalyzed reversible
    ring opening. At pH 8 about 56% PDC remained at forward equilibrium; reverse assays formed
    about 53% PDC. Apparent Km was 90 µM. Individual open-chain isomers were not separately
    proven substrates; the native physiological direction remains PDC hydrolysis.
  evidence:
  - reference_id: MetaCyc:ENZRXN-3623
    source_assertion: ENZRXN-3623 links enzyme MONOMER-3463 to reaction RXN-2462; evidence[1]
      uses EV-EXP-IDA-PURIFIED-PROTEIN.
    source_locator: /ptools-xml/Enzymatic-Reaction[@frameid='ENZRXN-3623']/enzyme[1]; /ptools-xml/Enzymatic-Reaction[@frameid='ENZRXN-3623']/reaction[1];
      /ptools-xml/Enzymatic-Reaction[@frameid='ENZRXN-3623']/evidence[1]
  - reference_id: PMID:7142106
    quote: freely reversible
    source_locator: p.1154 abstract, complete PDC hydrolase reaction sentence
  endpoint_qualifiers:
  - endpoint: subject
    kind: experimental_construct
    description: Purified native P. testosteroni hydrolase from the 1982 study; final DEAE-Sephacel
      fraction. This historical sample is not the P. putida PDC-isolate enzyme and is not
      identified with a later BR6020 sequence.
    evidence:
    - reference_id: PMID:7142106
      source_assertion: 'Table 1 final DEAE-Sephacel fraction: 5.2 mg protein, 778 U total
        activity and 149 U/mg; U denotes µmol PDC hydrolyzed per minute.'
      source_locator: p.1156, Table 1, final DEAE-Sephacel row and unit footnote
- id: native-material-03
  subject: MetaCyc:RXN-11861
  predicate: produces
  object: CHEBI:58304
  description: Formal pathway output, coefficient 1. Native traversal L2R; native direction
    PHYSIOL-LEFT-TO-RIGHT. Directional normalization is bound by the separate complete chemical-equation/Rhea
    proof; this is not an enzyme-specific substrate assay. Primary 1982 evidence identified
    PDC after gallate oxidation by purified B. fuscum 3,4-dioxygenase (about 70% spectral
    yield); a separate P. aeruginosa preparation gave about 80%. These preparations are not
    identified with native P. putida CPLX-2721, and the product was not exclusive.
  evidence:
  - reference_id: MetaCyc:RXN-11861
    source_assertion: The full RXN-11861 Reaction object lists CPD-184 on its right side with
      coefficient 1 (one native occurrence; no non-unit coefficient slot).
    source_locator: /ptools-xml/Reaction[@frameid='RXN-11861']/right[Compound/@frameid='CPD-184']
  - reference_id: PMID:7142106
    quote: converted gallate into PDC
    source_locator: pp.1157–1158, B. fuscum gallate assay and Figure 3; p.1160, Discussion,
      separate P. aeruginosa comparison
- id: native-catalysis-ENZRXN-3365
  subject: MetaCyc:CPLX-2782
  predicate: catalyzes
  object: RHEA:28936
  description: Historical native P. ochraceae aldolase cleaved both optically resolved CHA
    forms to pyruvate and oxaloacetate; Table II records different kinetics for l-CHA and
    d-CHA. These are optical labels, not absolute R/S assignments. Reversal was observed,
    but oxaloacetate decarboxylation drained product. The purified 1990 and recombinant 2001
    preparations remain distinct.
  evidence:
  - reference_id: MetaCyc:ENZRXN-3365
    source_assertion: ENZRXN-3365 links enzyme CPLX-2782 to reaction RXN-2464; evidence[1]
      uses EV-EXP-IDA-PURIFIED-PROTEIN.
    source_locator: /ptools-xml/Enzymatic-Reaction[@frameid='ENZRXN-3365']/enzyme[1]; /ptools-xml/Enzymatic-Reaction[@frameid='ENZRXN-3365']/reaction[1];
      /ptools-xml/Enzymatic-Reaction[@frameid='ENZRXN-3365']/evidence[1]
  - reference_id: PMID:2229032
    source_assertion: 'Table II reports l-CHA/Mg2+: Km 8.8 µM, Vmax 262 U/mg; d-CHA/Mg2+:
      Km 97.1 µM, Vmax 69.0 U/mg; dl-CHA/Mg2+: Km 17.5 µM, Vmax 234 U/mg.'
    source_locator: p.331 Table II, l-CHA, d-CHA and dl-CHA Mg2+ rows with headers
  endpoint_qualifiers:
  - endpoint: subject
    kind: experimental_construct
    description: Purified native aldolase from phthalate-grown historical P. ochraceae, ending
      with isoelectric focusing. No NGJ1 strain or later recombinant sequence equivalence
      is asserted.
    evidence:
    - reference_id: PMID:2229032
      source_assertion: 'Table I final isoelectric-focusing fraction: 0.61 mg protein; specific
        activities 282, 52.6 and 9.46 U/mg for dl-CHA, dl-HMG and OA, respectively.'
      source_locator: p.329 Table I, final isoelectric-focusing row with column headers
- id: native-catalysis-ENZRXN-18373
  subject: MetaCyc:CPLX-8178
  predicate: catalyzes
  object: RHEA:17403
  description: Purified 2011 pET29a-derived GalB from E. coli BL21(DE3) hydrates the E enol,
    not fresh keto OMA. Primary Km 85 µM and Vmax 76 µmol/min/mg apply to enol hydration,
    despite the native XML attaching them to CHA. Table 1 reports a 244-residue protein, whereas
    the deposited reference is 258 residues; the complete insert is unresolved. The 2016 240-residue
    crystallization construct does not settle this discrepancy. The formal CHA identifier
    leaves absolute stereochemistry unspecified.
  evidence:
  - reference_id: MetaCyc:ENZRXN-18373
    source_assertion: 'ENZRXN-18373 assigns CPLX-8178 to RXN-2463. Native evidence: EV-EXP-IDA-PURIFIED-PROTEIN-HH.'
    source_locator: /ptools-xml/Enzymatic-Reaction/enzyme; /ptools-xml/Enzymatic-Reaction/reaction
  endpoint_qualifiers:
  - endpoint: subject
    kind: experimental_construct
    description: 2011 pET29a-derived KT2440 GalB in E. coli BL21(DE3), purified by DEAE and
      phenyl chromatography. Table 1 reports 244 residues; reference Q88JX8 has 258. Complete
      insert/termini remain unresolved; the separate 2016 crystal is 240 residues.
    evidence:
    - reference_id: MetaCyc:ENZRXN-18373
      source_assertion: The activity has purified heterologous-host evidence for CPLX-8178
        linked to PMID21219457.
      source_locator: /ptools-xml/Enzymatic-Reaction/evidence[Evidence-Code/@frameid="EV-EXP-IDA-PURIFIED-PROTEIN-HH"]
    - reference_id: PMID:21219457
      source_assertion: Table 1 lists GalB as a 244-residue, 27.4-kDa protein in the gal cluster.
        This does not identify the complete recombinant insert with the independently deposited
        258-residue reference.
      source_locator: '2011 Table1, galB row: protein size and predicted molecular mass columns'
    - reference_id: PMID:21219457
      quote: pETGalB
      source_locator: '2011 Results GalB publisher line274: E. coli BL21(DE3)(pETGalB); Methods
        GalB expression and purification'
