  area: scope
  topic: Native physiological scope
  outcome: supported
  summary: The complete 2020 Results and Methods support R. rubrum ATCC11170 mutant/complementation physiology
    and anaerobic isotope feeding (passages12,14,43,50). The twofold comparison is extracellular dAdo:MTA,
    not mutant:wild type. NCBI strain269796 has parent species1085. Native PWY species1076/Bacteria range
    is retained as source scope, without whole-route experimental generalization.
