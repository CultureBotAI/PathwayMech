limitations:
- Original 2012/2020 figure bodies and supplementary files remain unavailable under the inherited acquisition
  record. All available main text/captions and the full 2020 table/footnotes were freshly read; no image-body
  or SI review is claimed.
- The older 2017 primary and comparative 2018/2024/2025 evidence interpretation is inherited, not a fresh
  full-paper read. Older His10/His6 construct details remain database-attributed; tag orientation and
  MtnP tag identity are unresolved.
- Native assembly coefficients and conflicting dimer label remain source assertions; HAMAP-inferred hexamer
  is not measured physiological stoichiometry. Co and Ni are separate recombinant reconstitution conditions,
  not simultaneous native occupancy.
- Current chemical complete structures/formal charges support identity; they do not measure intracellular
  speciation. Garbled ChEBI definition, older MtnA arrest commentary and 2020 kinetic-efficiency arithmetic
  conflicts remain explicitly disclosed.
- Actual light SVG raster has dense shared-junction labels, long qualifier label truncation and tall whitespace.
  Complete qualifications and evidence are preserved in checked DOM/ARIA/table cells. No interactive browser,
  keyboard, responsive or dark-mode result is claimed; fresh CUA inventory had no enabled browser.
- Current review is independent of scientific draft authorship, with prior source/planning roles disclosed.
  Whole earlier authority-builder and portable-integration technical acceptance is inherited from root/separate
  reviews. Current source/biology and target export checks do not independently certify this reviewer's
  own earlier preparation.
- Whole-corpus native commands were executed by the separate authorized owner. This reviewer checked their
  exact receipts and final single-record representations; broad gates, builders and SQL whole hashes were
  not rerun.
notes:
- External proposed native content only. No maintained save, code change, cache mutation, Git/GitHub action
  or public release occurred in this review. Root owns evidence adoption, final currentness inspection
  and native save authorization.
- Both original failed DOM-helper attempts and the premature pre-KGX export attempt remain retained with
  actual commands/streams. Final corrected DOM and after-gates full target checks pass. Native reinspection
  explicitly records only the two KGX phase changes; no silent rebinding.
- Ignored/hidden-inclusive inventory of all 120 existing native review YAMLs found no exact PWY-8130 target
  predecessor. Prior external scientific reports are not invented native findings or previous occurrences.
- Durable evidence references point to the root-specified future adoption prefix; this external proposal
  does not claim those copies or the native review have already been saved. All original receipt bodies
  retain their original absolute execution paths; the separate copy ledger maps durable copies.
