assessments:
- assessment_id: paragraph-1
  area: completeness
  topic: Three-event phosphorolytic route
  outcome: supported
  summary: Fresh full PWY-8130 and three reaction frames support MtnP phosphate consumption, adenine release,
    MtnA isomerization and Ald2 cleavage. All nine sides are represented; native ordering plus the shared
    products supports two material-transfer edges. PMID31950558 distinguishes this route from nucleosidase/kinase
    entry. Neither ATP-dependent entry nor physical channeling is imported.
