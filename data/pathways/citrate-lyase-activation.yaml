id: MetaCyc:P2-PWY
label: citrate lyase activation
description: 'The Escherichia coli K-12 protein core of citrate lyase maturation: CitG forms the triphosphoribosyl-dephospho-CoA
  precursor from ATP and dephospho-CoA; CitX attaches the prosthetic group to the dedicated apo acyl-carrier
  protein; CitC acetylates its thiol using acetate and ATP. The endpoint is acetylated carrier, not citrate
  cleavage. Whole apo, holo and acetylated ACP states retain separate generic Rhea protein identifiers
  and do not identify a particular protein sequence. CitG/CitX have direct biochemical support; the P77390
  CitC assignment combines reviewed catalytic annotation, an explicit EcoCyc direct-assay GO mapping and
  the primary E. coli ligase observation, whose full paper was not inspected. This record does not claim
  isolated sequence-specific CitC purification or activity in every K-12 strain. AMP-ACP is an off-pathway
  side product. The multispecies source''s alternative acetyltransferase and deacetylase branches are
  excluded; no citrate-lyase assembly stoichiometry or bound-metal requirement is inferred from assay
  conditions.'
