id: Reactome:R-MTU-936635
label: Sulfate assimilation
description: Mycobacterium tuberculosis sulfate uptake and activation links SubI binding, CysTWA transport,
  CysD/CysNC-dependent APS synthesis, APS phosphorylation and the CysQ PAPS-hydrolysis branch. GTP hydrolysis
  is coupled to APS synthesis, correcting its placement on APS kinase in Reactome. This record does not
  assert exclusive sulfate dependence, universal enzyme essentiality or complete stoichiometric balance.
  CysQ PAPS activity is qualitatively supported; PAP is its better-characterized substrate.
