id: PathBank:SMP0002077
label: Methylphosphonate Degradation I
description: 'The four-reaction PathBank route converts methylphosphonate through ribosyl phosphonate
  intermediates to methane and alpha-D-ribose 1,5-bisphosphate using characterized Escherichia coli K-12
  proteins. PhnI acts with PhnG, PhnH and PhnL in the source-defined assembly; PhnM, radical-SAM PhnJ
  and PhnP perform the following reactions. The endpoint is a phosphate ester, not free phosphate or PRPP.
  The graph uses Rhea charge forms and its activation-associated PhnJ equation, including generic hydrogen
  donor/acceptor classes. SAM cleavage and reduced [4Fe-4S] are required for the reconstructed radical
  reaction; one SAM consumed per physiological substrate turnover is not established. The source-defined
  four-protein assembly is not the full PhnGHIJKL machinery characterized later. This is enzyme chemistry,
  not a claim of growth by every K-12 strain: phnE phase variation can prevent methylphosphonate uptake.'
