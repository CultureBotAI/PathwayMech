- id: methylphosphonate-edge-027
  subject: PathBank:SMP0002077/ProteinComplex/4049
  predicate: catalyzes
  object: RHEA:34680
  description: The four proteins support the complete first reaction. PhnI alone has a separate nucleosidase
    activity, which is not this pathway reaction; no individual accessory subunit is asserted to catalyze
    the overall transformation alone. The reconstructed reaction used MgATP. This assay condition does
    not establish a specific magnesium-binding site or obligatory cofactor relation for the assembly,
    and no magnesium independence is asserted.
  evidence:
  - reference_id: PathBank:SMP0002077
    source_assertion: Catalysis ReactionCatalysis/6000 identifies ProteinComplex/4049 as controller of
      Reactions/6035, the ATP+methylphosphonate reaction with EC 2.7.8.37.
