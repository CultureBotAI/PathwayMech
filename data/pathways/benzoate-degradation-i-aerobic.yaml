id: MetaCyc:PWY-2503
label: benzoate degradation I (aerobic)
description: 'Benzoate degradation I (aerobic) is the complete two-step entry route from benzoate to catechol.
  Benzoate 1,2-dioxygenation consumes NADH, oxygen and a proton and produces cis-dihydrodiol carboxylate
  (DHB) and NAD. NAD-dependent dehydrogenation/decarboxylation of DHB produces catechol, carbon dioxide
  and NADH. The native pathway''s ordered reactions map to the complete left-to-right RHEA:12634 and RHEA:11561
  equations. All eleven material-side entries are explicit, with formal coefficient one. CPD-290 is the
  primary intermediate passed between the reactions. NAD/NADH cycling does not imply a reverse causal
  or regulatory edge. The formal net equation is benzoate + O2 + H+ → catechol + CO2; it is not a third
  elementary reaction. Exact issuing structures specify the (1R,6S) configuration and formal ionic species;
  the historical cis-DHB measurements do not independently establish absolute configuration or assay protonation.


  The native pathway annotates Acinetobacter calcoaceticus, Azotobacter vinelandii, Corynebacterium glutamicum
  ATCC 13032, Cupriavidus necator, and Pseudomonas putida mt-2, with additional native TW3, NT4 and JMP222
  contexts. The selected Pseudomonas putida taxon is a species-level parent, not an exact mt-2 strain
  identifier. TW3''s issuing assignment is Pseudomonas sp. TW3 rather than the native P. putida assignment;
  it is not silently reconciled. Native NT4 is not equated with the paper''s 4NT. JMP222 has a native
  C. necator parent but a comment describing a plasmid-cured C. pinatubonensis JMP134 derivative; no exact
  taxon is selected for that unresolved lineage. The native Actinomycetota and Pseudomonadota taxonomic
  ranges remain broad source annotations, not phylum-wide pathway phenotypes. None of these database species
  annotations demonstrates both steps experimentally in every taxon. Modern Rhizorhabdus wittichii RW1
  and Pseudomonas putida KT2440 are separately identified experimental preparations.


  Five native activity objects preserve assignments to four catalysts: ENZRXN-15650 to CPLX-7698, ENZRXN-3124
  to CPLX-2541, ENZRXN-15651 to CPLX-7701, and ENZRXN-3125/ENZRXN-12384 to the same mt-2 XylL protein.
  The two XylL activities remain distinct source objects, while the shared formal reaction assignment
  is coalesced with both source owners. ENZRXN-15650, ENZRXN-3124 and ENZRXN-3125 carry unpurified-protein
  evidence codes; ENZRXN-15651 carries a purified-protein code; ENZRXN-12384 has no evidence-code or citation
  slot. These are database assertions, not new primary experiments. In particular, the native first-step
  citation of PMID4341530 is mis-scoped: that paper purified the second-step enzyme from historical strain
  335, not a JMP222 benzoate dioxygenase.


  All thirteen native protein/complex contexts and nine component links are retained. The database describes
  CPLX-7698 as a CPLX-7699 hydroxylase plus MONOMER-14400 reductase, with three MONOMER-14398 and three
  MONOMER-14399 subunits in the hydroxylase. It describes the mt-2 CPLX-2541 assembly as CPLX-7700 plus
  XylZ, with three XylX and three XylY subunits in the hydroxylase. CPLX-7701 is assigned four MONOMER-14397
  subunits and a cytosolic location. Component coefficients and the reported location remain native annotations;
  membership does not establish isolated-subunit catalysis or exclusive localization. The separately studied
  C-1 and strain 335 preparations cannot experimentally validate the native JMP222 assembly assignment.


  Eight native genes remain declared context nodes with reciprocal native product links: G-10984/benA→MONOMER-14398,
  G-10985/benB→MONOMER-14399, G-10986/benC→MONOMER-14400 and G-10983/benD→MONOMER-14397 in the native
  JMP222 context; G-2081/xylX→MONOMER-2961, G-2082/xylY→MONOMER-2962, G-2083/xylZ→MONOMER-2963 and G-2084/xylL→MONOMER-2964
  in mt-2. Gene/product identity is not represented as an invented causal encoding relation. The four
  Xyl monomers normalize to the verified P23099, P23100, P23101 and P23102 sequences. P23099 is the 454-residue
  curated sequence; a current pWW0 450-residue protein lacks the initial MTMT and is not an identical
  replacement.


  Native FAD and [2Fe-2S] cofactor annotations are retained for CPLX-7698 and its reductase context with
  their C-1/JMP222 attribution conflict. FAD(3−) is an exact formal identity. The native CPD-6 protein-ligated
  cluster class is preserved; it is not equated to CHEBI:33739''s neutral Fe2S2 core. The broader CHEBI:49601
  class does not establish exact native ligand chemistry, a Rieske coordination pattern, oxidation state
  or site count. The primary C-1 reductase abstract reports one FAD, two iron atoms and two labile sulfurs,
  NADH preference with weaker NADPH use, and artificial cytochrome c/dye acceptors (PMID214433). Those
  acceptors are not additional material steps in this benzoate route.


  Historical strain 335, B9, C-1, Acinetobacter 73, mt-2, modern JMP222, H16, ADP1, RW1, KT2440 and B1
  remain distinct preparations. H16 Q0KAB0 and discontinued Gene4248800 are ortholog/context leads, not
  the native JMP222 or purified 335 enzyme. ADP1 proteins are not substituted for Acinetobacter 73. P07771''s
  348-residue sequence differs from an older 338-residue BenC sequence. Deleted O85961/O85988 have archived
  sequence histories but no selected current replacement. The historical P. testosteroni 16/ATCC15668
  label conflicts with the issuing Delftia acidovorans deposit association and remains unresolved.


  PMID4399343 examined benzoate-grown bacterial extracts, including Alcaligenes eutrophus 335 (ATCC17697),
  its B9 mutant, A. calcoaceticus 73, A. vinelandii, P. aeruginosa 132 (ATCC17504), P. cepacia 249/382
  (ATCC17616/17759), P. putida 90 (ATCC12633), and P. testosteroni 16 (ATCC15668). These printed preparations
  are not JMP222. Table 2 reports DHB dehydrogenase activities of 0.92, 0.85, 0.36, 0.20, 0.79 and 0.64
  μmol NADH/min/mg protein for benzoate-grown calcoaceticus 73, eutrophus 335, vinelandii, aeruginosa
  132, cepacia 382 and putida 90, respectively. B9 and testosteroni 16 are below 0.005; blank cells for
  other conditions are not negative measurements. Activity induction alone does not identify a transcriptional
  regulator.


  The same study identified radiolabeled DHB by co-chromatography in three solvents after incubation with
  carboxyl-labeled benzoate. In 335, calcoaceticus 73 and putida 90 extracts, adding 40 mM unlabeled DHB
  trapped more label in DHB and reduced labeled carbon dioxide, supporting the intermediate connection.
  In the calcoaceticus 73 coupled assay, Table 4 reports 12,468 cpm with NADH, 33 with NADPH, 768 with
  NAD, 872 with NAD plus NADPH, and 60 with no added cofactor; added cofactors were 1 mM and the assay
  lasted 10 minutes. This preparation-specific comparison neither establishes a universal NADPH prohibition
  nor conflicts with weak NADPH use by a separately purified reductase.


  Anthranilate and phthalate controls in PMID4399343 do not establish DHB as an intermediate of those
  distinct routes. B9 respired anthranilate despite lacking DHB dehydrogenase. The p92 prose names testosteroni
  139 whereas Methods and Table 5 name 16; the discrepancy is preserved. These observations bound the
  tested preparations and substrates, not every pathway using those substrates.


  PMID4341530 purified the second-step DHB dehydrogenase from A. eutrophus 335 grown aerobically at 30°C
  on benzoate; B9 supplied DHB substrate. The native mass was 94,600 ± 2,100 Da and the estimated subunit
  mass 24,000 Da, with a single subunit type inferred. Those values do not identify or measure the modern
  native JMP222 assembly. For purified 335 Fraction V, the standard assay used 25°C and 20 mM Tris at
  pH 8.0. NAD was required; NADP substitution gave no detected activity, whereas NADP in excess over NAD
  partially inhibited the NAD-supported assay. The prose Km values were 0.20 mM for DHB and 0.15 mM for
  NAD. Substitution failure is distinct from the separately reported inhibitory effect.


  The 335 enzyme did not achieve the reverse reaction with catechol/NADH at tested pH 6, 7 or 8. This
  is not proof of universal thermodynamic irreversibility. Salt inhibition depended on pH; ambiguous exact
  values in the transformed Table IV are withheld. NADP and salt effects remain preparation-scoped narrative
  because exact assay reagent identities and unambiguous native protein targets have not been established
  for additional signed graph edges. Dehydrogenation before decarboxylation was proposed, but no beta-ketoacid
  intermediate was detected. No third reaction, observed intermediate node, or resolved spontaneous-versus-enzyme-mediated
  decarboxylation mechanism is inferred.


  In the 2025 RW1 study (PMID40405529), benA disruption prevented growth on 5 mM benzoate. A benA-only
  complement failed, while a pRK415 benABD construct restored growth. The authors proposed a polar effect
  on downstream genes. The combined rescue does not independently demonstrate purified BenD catalysis
  or individual BenD necessity; BenD remains a putative context protein. Single redA1 or redA2 knockouts
  retained growth, the double knockout did not, and either reductase complemented it. These positive genetic
  rescues support qualified pathway-enabling assignments, not purified direct electron-transfer claims.
  The fdx1/fdx3 double knockout retained benzoate growth, so no unique physiological ferredoxin is established.


  The same study used E. coli BL21 DE3 pGGA constructs to test the first step. RW1 BenAB with RedA2 and
  Fdx3 converted nominal 1 mM benzoate to cis-dihydrodiol over 24 hours. The separate KT2440 BenABC construct
  was a positive control reported as 100% conversion. BenAB alone and combinations lacking either required
  partner in that assay showed no detectable product. Positive graph edges apply to the named components
  within their experimentally coexpressed ensembles, not to isolated proteins independently catalyzing
  the complete reaction. HPLC retention matching against the KT2440 control supports product identity;
  no NMR, absolute stereochemical determination, or purified-subunit kinetics is claimed.


  Resting-cell assays used 50 mM sodium/potassium phosphate, 20 mM glucose, nominal 1 mM benzoate, 30°C
  and 180 rpm; cultures were induced with 1 mM IPTG. The reported sampling times were 0, 4, 8, 12, 16,
  20 and 24 hours, and figures show triplicate means with standard deviations. Benzoate and cis-dihydrodiol
  retention times were 26.8 and 7.4 minutes. The Methods call the negative control cell-free extracts
  carrying pRK415, whereas the expression assays use pGGA constructs; that wording is retained without
  inventing an identically matched empty-vector experiment. The conjugation helper is HB101 in Methods
  2.2 but JM109 in Table 1 and the mating procedure.


  Alternative RW1 ferredoxins SWIT0053 and SWIT0363, coexpressed with BenAB and RedA2, supported average
  conversions of about 5% and 12.4%, respectively, in the 24-hour assay. SWIT0285, SWIT0998 and SWIT1843
  showed no detectable activity under these conditions; this does not establish inhibition or universal
  inability. All twelve printed RW1 and three KT2440 accession/locus identities used here were checked
  against their issuing protein/CDS sequences. The two B1 XylXY sequences in the paper are sequence-comparison
  contexts, not assayed substitutes for mt-2 or RW1 components. The accession paragraph is Methods 2.1,
  DNA Techniques and Alignments, rather than Methods 2.3.


  Abstract-level evidence from PMID2183008 assigns xylXYZ dioxygenase and xylL dehydrogenase roles in
  the mt-2 pWW0 system; it does not establish purified complex stoichiometry. PMID4418209 reports that
  loss of the TOL plasmid leaves benzoate utilization through the ortho route and proposes two oxidase
  systems; that observation does not add a third step here. C-1 hydroxylase abstracts report a suggested
  alpha3 beta3 assembly of about 201 kDa with approximately 50/20 kDa subunits (PMID7130163), while a
  separate preparation reported approximately 273/280/270 kDa estimates, ten iron atoms and eight labile
  sulfurs, without heme or flavin (PMID7372624). These distinct preparation reports are not silently reconciled
  or transferred to JMP222.


  PMID8245826, PMID8357257 and PMID9555884 concern adjacent nitrotoluene, 4NT or TW3 contexts; their substrate
  and preparation scopes are not additional benzoate-route demonstrations. PMID4326771 and PMID961528
  are metadata/title-only leads in the frozen source set. The native lineage citation PMID3025183 remains
  an unread lead. PMID8335640, PMID11222587, PMID11306574 and PMID12399500 concern benzoyl-CoA alternatives;
  PMID16466637 provides generic cluster background, and PMID18505728 concerns unrelated rhamnose metabolism.
  The native citations, five umbrella backlinks, six adjacent interfaces, four chlorinated-substrate activities
  and twenty-one unrelated regulation backlinks do not become extra route steps or causal edges.


  Source access is explicit: the complete 1971 PDF and complete 2025 JATS/PDF and figures support the
  scoped claims. The 1972 article is retained as complete web-transformed text plus a visually inspected
  first-page image; the remaining original figures and table layouts were not visually inspected. Its
  reference digest identifies the transformed text rather than a raw PDF. Native database assertions,
  exact chemical equations, issuing identity checks, primary observations, hypotheses, and unresolved
  source conflicts remain distinct throughout the graph and evidence ledger.


  The separate A1501 study (PMID20137101) concerns Pseudomonas stutzeri A1501, Chinese culture CGMCC 0351,
  and its explicitly named derivatives. Its 11.5 kb ben/cat region is described as PST1666–PST1676, with
  benR, benABCD, benK and catBCA. The paper treats BenABC and BenD as the two-step peripheral benzoate-to-catechol
  route but does not purify or reconstitute these A1501 enzymes or independently measure their intermediate,
  formal stoichiometry, cofactors or assembly. Issuing genome/CDS checks identify the selected BenR protein
  and benA gene separately from the paper''s locus labels. The exact benA gene is labeled with its issuing
  locus tag, PST_1667; benA is its publication-specific role. No A1501 protein is substituted for native
  JMP222, historical 335, C-1, RW1 or KT2440.


  A1601 is an insertional benR disruption made using pK18mob carrying an internal benR fragment, not a
  scarless deletion or an engineered active BenR protein. The authors designed it as nonpolar, checked
  recombination by PCR and reported retained downstream transcription. A1601 lost benzoate growth but
  retained catechol growth, delimiting the entry phenotype from downstream catechol use. A1608 carries
  pLbenR in A1601: a 1041 bp EcoRI-HindIII fragment containing benR and its native promoter in pLAFR3.
  Its benzoate-growth rescue is reported in prose as data not shown. The separately qualified genetic
  enabling edge refers to this complemented preparation; it does not qualify the wild-type native-transcript
  regulation experiment or establish purified BenR activity.


  RT-PCR spanning benA–benB, benB–benC and benC–benD supports benABCD co-transcription under the tested
  benzoate condition; no benR–benA or benD–benK product was observed in that experiment. The quantitative
  target was an internal 186 bp benA amplicon, with catB and pcaD measured separately using 159 and 173
  bp amplicons. Native transcripts were normalized to 16S rRNA; cDNA measurements were in triplicate and
  the reported means and standard deviations derive from three independent RNA samples. The BenR regulatory
  edge targets the exact benA gene as the measured proxy for the co-transcribed benABCD unit, not four
  separately measured gene responses. The inferred positive BenR dependence comes from wild type versus
  the insertion mutant and is not a purified protein–DNA interaction or a promoter-reporter experiment.


  Benzoate caused the strongest tested benA induction in wild-type A1501, while catechol and cis,cis-muconate
  were weak comparators. The benR mutant had strongly reduced benA transcription with or without inducer.
  Methods lists 4 mM benzoate, 4 mM lactate and 0.4 mM catechol when required, but gives neither a cis,cis-muconate
  dose nor a Figure 6-specific exposure duration. The separate Figure 7 conditions are not silently assigned
  to Figure 6. Figure 6A''s proposed BenR-binding region and promoter/start features are in silico annotations;
  there was no reported A1501 binding assay, footprinting or binding-site mutagenesis. The experiment
  does not prove that BenR directly senses benzoate or exclude every alternative regulator.


  Figure 7A measures benA expression in logarithmically growing A1501 cells transferred to the indicated
  carbon-source conditions with 4 mM benzoate and incubated for two hours at 30°C. Glucose or acetate
  gives lower benA transcript abundance than lactate or succinate; adding glucose or acetate to succinate
  also lowers expression relative to succinate alone. Methods lists 4 mM final additions for these carbon
  sources when required. The graph''s chemical regulation edges concern this expression response, not
  direct inhibition of BenABC, BenD or BenR catalytic or binding activity. Glucose is the generic issuing
  identity; its D/L form and anomer, lactate stereochemistry, and assay protonation were not specified.
  Acetate is a formal normalized identity. Results incorrectly points to Figure 8 for one expression comparison;
  the actual expression plots and caption are Figure 7. The differing catB/pcaD responses are not transferred
  to benA. The presence of a Crc-like sequence does not establish a mechanism: the authors explicitly
  said a Crc mutant was still needed, so no Crc-mediated edge is added.


  In the A1501 whole-cell experiments, adding 0.4 mM 4-hydroxybenzoate to 4 mM benzoate shortened the
  growth lag and increased growth rate. The authors report benzoate depletion within 18 hours in the mixture
  versus 26 hours on benzoate alone, without discernible loss of 4-hydroxybenzoate. This is concentration-specific
  enhancement of whole-cell utilization, not an additional consumed material in the two-step route, measured
  benA induction by 4-hydroxybenzoate, or direct activation of BenR/BenABC/BenD. At 0.8 mM 4-hydroxybenzoate,
  the mixture markedly restricted growth. Figure 3 also shows very limited growth with 8 mM benzoate or
  0.8 mM 4-hydroxybenzoate alone. The plotted low, slightly increasing biomass does not justify a literal
  zero-growth assertion, and a toxic whole-cell condition does not identify an inhibited enzyme.


  The A1501 HPLC material was filtered culture supernatant after cell removal and 0.22 μm filtration,
  despite prose calling the metabolites intracellular. No intracellular accumulation or uptake is inferred.
  The reported catechol/cis,cis-muconate assignments have a source conflict: Methods gives catechol at
  2.388 minutes and muconate at 3.358 minutes, while Figure 4 labels CCM near 2.383 and CAT near 3.330;
  the supplementary eight-hour chromatogram similarly labels CCM near 2.387 and CAT near 3.333. These
  reported assignments are retained with the conflict, not used as independent chemical identification
  of either formal pathway intermediate. The reported reduction in the material assigned as catechol,
  about 0.12 versus 0.28 mM with low-dose 4-hydroxybenzoate, cannot distinguish decreased formation from
  increased downstream clearance. A separate supplementary time course loses the benzoate peak by 24 hours,
  whereas Figure 8''s benzoate-only depletion is reported at 26 hours; these are not merged into one exact
  endpoint. The Figure 3 benzoate-growth plateau is approximately OD600 0.37, whereas Results says 0.5
  after 24 hours, so the growth conclusion remains qualitative.


  The proposed explanation involving induction of downstream enzymes such as PcaD by 4-hydroxybenzoate
  is a hypothesis: no corresponding pcaD/benA transcript or PcaD activity experiment established it. The
  catBC transcription and catB response, pcaR/pcaD mutant and complementation phenotypes, and the reported
  inability to identify catR/pcaK concern the downstream convergent routes. They neither add an entry
  reaction nor establish BenR control of catBC, a specific A1501 CatR, PcaK-dependent uptake failure,
  or current exhaustive genomic absence. Figure 1''s predicted catechol/protocatechuate routes and pcaDIJF
  tail, and Figure 2''s comparisons with PAO1, KT2440, Pf-5 and ADP1, remain bounded context rather than
  direct assays of every depicted step.


  The issuing taxonomy now labels A1501 Stutzerimonas stutzeri A1501. The original paper''s Pseudomonas
  stutzeri preparation name is retained alongside that exact taxon identity. The 186 bp benA qPCR primer
  product matches the issuing genome exactly. Four optional junction-primer pairs map uniquely but produce
  786/453/500/598 bp rather than the printed 782/456/503/610 bp; another pair reproduces 546 bp. These
  sequence discrepancies do not become a claim that all printed amplicon sizes reproduce, nor silently
  replace the paper''s qualitative co-transcription observation.'
