id: MetaCyc:PWY-8131
label: 5'-deoxyadenosine degradation II
description: 'This exact MetaCyc route converts 5''-deoxyadenosine to adenine, dihydroxyacetone phosphate
  (DHAP) and acetaldehyde in four events: nucleosidase hydrolysis releases 5-deoxyribose and adenine;
  ATP-dependent phosphorylation forms 5-deoxyribose 1-phosphate; isomerization forms 5-deoxyribulose 1-phosphate;
  and aldol cleavage gives DHAP and acetaldehyde. Water, ATP(4-), ADP(3-) and the proton are explicit
  stoichiometric participants. All 14 native side occurrences and three consecutive intermediate transfers
  are represented. Metabolite continuity does not imply physical substrate channeling.


  The whole-route physiological evidence is for Escherichia coli ATCC 25922. The 2020 study followed labeled
  5''-deoxyadenosine through these intermediates and used pfs, mtnK, mtnA and ald2 deletions to distinguish
  the steps. Ald2 deletion retained a small residual activity, consistent with a promiscuous fuculose-phosphate
  aldolase, but this did not restore growth on 5-deoxyribose. Growth with 5-deoxyribose as sole carbon
  source required each DHAP-shunt-specific gene. The K12 BW25113 comparator did not grow on this substrate.
  The taxon list also records component evidence: MG1655 nucleosidase, the Bacillus HD73/HD73-20 three-enzyme
  module, and the two shared Rhodospirillum rubrum ATCC 11170 steps. It does not assert the complete four-event
  route in every listed taxon.


  Both final native reaction frames are reversible, although the pathway layout and physiological activity
  annotations use the degradative left-to-right direction. Bacillus DrdA also has explicit reverse aldol-condensation
  evidence. These are preserved as reversible native nodes with their written sides, rather than replaced
  by irreversible forward Rhea nodes. Rhea release 142 independently supports all four reaction families
  and the same 14 chemical sides. The ATP, ADP and sugar phosphates retain their specific charge states.
  The cyclic, anomer-unspecified native 5-deoxyribose structure matches CHEBI:149540 by complete InChI;
  its native CHEBI:62012 and PubChem:45489773 links instead denote an open-chain structure and are not
  used as exact mappings. The alpha assignment for the kinase product and the 3R,4R aldol product assignment
  have biochemical inference support in the 2018 paper, rather than direct complete stereochemical determination
  in each organism.


  Current NCBIProtein accessions represent the four ATCC 25922 enzymes: WP_000689844.1 (MtnN/Pfs), WP_000132325.1
  (MtnK), WP_001022015.1 (MtnA) and WP_000439686.1 (Ald2). Each complete sequence exactly matches its
  archived UniProt accession, the corresponding UniParc sequence and a single translated CDS on ATCC 25922
  chromosome NZ_CP032085.1. Their current loci are D1792_RS20095, D1792_RS18645, D1792_RS18650 and D1792_RS18655,
  respectively; native MetaCyc DR76 locus names belong to a different assembly annotation. The historical
  UniProt records are deleted and are not active identifier owners. RefSeq product labels are preserved,
  including the generic L-fuculose-phosphate aldolase label for WP_000439686.1; functional Ald2 assignment
  comes from the explicit identity bridge and experimental evidence, not that generic label alone.


  The ATCC enzymes were expressed from pET28 constructs in E. coli Rosetta(DE3) pLysS and purified by
  nickel chromatography. Exact tag orientation is not asserted because the 2020 supplementary primers
  were inaccessible. Native activity annotations distinguish purified heterologous protein, mutant reaction
  blocks and the separate unpurified native-host tier for Ald2; the last tier alone does not identify
  a purified enzyme. The 2020 Results call Ald2 natively purified and report activity and violet color
  like Co2+-reconstituted enzyme; the Methods describe EcAld2 expression in Rosetta(DE3) pLysS. This is
  treated as an as-purified recombinant preparation, not evidence of purification from the native ATCC
  host. Native kinetic slots give Km/kcat pairs of 4.7 micromolar/57 s−1 for MtnN, 25/16.1 for MtnK, 222/2.02
  for MtnA and 598/22 for Ald2, with their substrates and source citations retained on the activity edges.
  These are assay-specific parameters, not universal cellular fluxes.


  The R. rubrum proteins contribute the shared isomerase and aldolase activities only; its complete 5''-deoxyadenosine
  route begins with MtnP phosphorylase, an alternative entry reaction outside this record. Native MtnA
  commentary describes a His10 construct, and Ald2 commentary a His6 construct with anaerobic purification.
  The MtnA activity frame assigns partially purified heterologous evidence to the 2020 study, alongside
  distinct earlier purified-protein and mutant evidence. Native Km/kcat pairs are 171 micromolar/0.18
  s−1 for MtnA and 229/1.94 for Ald2. Co2+ and Ni2+ confer the highest Ald2 activity among tested reconstitution
  conditions. Alternative metals are separate assay states, not simultaneous required components.


  The 2018 Bacillus thuringiensis experiments used HD73-20 (BGSC 4D22), with current protein identities
  assigned to strain HD73. DrdK and DrdI carried N-terminal His6 tags and DrdA a C-terminal His6 tag in
  activity assays; a separate tag-free DrdA preparation was used for crystallography and metal-loading
  analyses. Together the three enzymes converted 5-deoxyribose plus ATP to DHAP. Size exclusion supported
  DrdK and DrdI dimers and a DrdA oligomer possibly tetrameric; the crystal lattice supplied a proposed
  tetramer. Functional protein edges therefore do not invent exact physiological complex identifiers.
  DrdK Km/kcat values were 178 micromolar/15.4 s−1 for 5-deoxyribose and 216/17.1 for ATP. DrdI had a
  22 ± 7 mM Km and 3.5 ± 0.7 s−1 kcat; DrdA had 36 ± 3 micromolar and 6.3 ± 0.2 s−1. Values in the primary
  table refer to one subunit.


  Bacillus DrdA preferred Mn2+ in demetallation/reconstitution assays; Co2+ and Mg2+ supported lower activity
  under the stated alternative conditions. Zn2+ did not activate the enzyme even though zinc predominated
  in an unsupplemented heterologous tag-free preparation. The tag-free mineral-supplemented ICP/EPR results
  and structures support manganese binding without equating bound zinc with an active cofactor. ATCC Ald2
  instead preferred Co2+, and the authors did not establish the bound cobalt oxidation state in the as-purified
  preparation. Metal conclusions remain protein- and preparation-specific. The 2018 DrdK ATPase estimate
  used glycerol-containing buffers; the 2020 work removed glycerol and measured 0.04 s−1 intrinsic ATPase
  for E. coli and B. subtilis kinases, explicitly questioning the earlier Bacillus thuringiensis estimate.
  An extra ATPase pathway event is not inferred.


  The native MG1655 nucleosidase is a homodimer containing two EG11090/P0AF12 chains. The complex catalyzes
  the hydrolysis event; its individual subunit is represented by membership, not isolated-chain catalysis.
  The native activity frame reports a 4.6 micromolar Km for 5''-deoxyadenosine and distinct experimental
  and purified-protein evidence codes linked to older papers. Those older papers were not fully acquired
  in this work, so these are database-attributed statements. K12 nucleosidase activity does not establish
  the downstream DHAP shunt.


  Later ATCC 25922 experiments support carbon acquisition as a physiological benefit. In the 2024 aerobic
  glucose growth-inhibition assays with added MTA or 5-deoxyadenosine, deletion of mtnK, mtnA and ald2
  did not significantly change sensitivity; Pfs deletion increased sensitivity. Added 5-deoxyribose at
  up to 4 mM did not significantly inhibit the tested strains, and shunt deletion did not change that
  response. Separately, deleting the shunt abolished growth on 5-deoxyribose as sole carbon source, and
  complementation restored it. The chemistry can operate anaerobically, but growth on 5-deoxyribose required
  suitable electron-acceptor conditions: oxygen or TMAO supported the tested growth, while nitrate and
  fermentation did not. Engineered K12 expressing the shunt is distinct from native K12. MTA metabolism,
  sulfur salvage, extracellular oxidation and the 2''-deoxyribonucleoside route to glyceraldehyde 3-phosphate
  are adjacent mechanisms outside this exact four-event record.


  The 2025 work places mtnK, mtnA, ald2 and a putative permease in an operon and supports MtnR/YjhU repression
  and CRP-dependent activation under carbon catabolite control. The permease substrate and the direct
  MtnR ligand are unresolved. CRP binding to a promoter fragment was tested with a His-tagged protein
  and cAMP; a predicted fine binding site is not equated with nucleotide-resolved occupancy. This optional
  regulation remains contextual narrative without unverified graph endpoints. The source''s inconsistent
  secondary TSS offsets and other caption/aggregate-count discrepancies are retained in the review ledger;
  exact disputed numbers are not propagated.


  The complete four primary main texts were read, together with available material 2018, 2024 and 2025
  supplements and figures. The 2020 supporting PDF/spreadsheet and original figure images could not be
  obtained through the tested official routes; no claim depends solely on those inaccessible materials.
  One retained 2024 EMF image was not rendered, and no EMF-only assertion is made. This route is distinct
  from the maintained 2''-deoxyribonucleoside route to glyceraldehyde 3-phosphate. Broader PWY-8130, PWY-8132
  and PathBank PW002085/SMP0002097 leads remain unassessed for adoption; this addition does not establish
  source exhaustion.'
