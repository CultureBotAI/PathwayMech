id: MetaCyc:GLYOXYLATE-BYPASS
label: glyoxylate cycle
description: The glyoxylate cycle assimilates acetyl-CoA through citrate synthase, aconitase, isocitrate
  lyase and malate synthase. Malate dehydrogenase regenerates oxaloacetate, closing the cycle while succinate
  is released. Enzyme activities have been demonstrated in Mycobacterium tuberculosis.
