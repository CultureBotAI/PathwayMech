id: MetaCyc:GLYOXYLATE-BYPASS
label: glyoxylate cycle
description: >-
  The glyoxylate cycle diverts D-threo-isocitrate to succinate and glyoxylate,
  then condenses glyoxylate with acetyl-CoA and H2O to form (S)-malate.
pathway_type: central-carbon-metabolism
