id: gomodel:YeastPathways_PWY-5123
label: trans, trans-farnesyl diphosphate biosynthesis
description: trans, trans-farnesyl diphosphate biosynthesis in Saccharomyces cerevisiae
  S288C isomerizes isopentenyl diphosphate to dimethylallyl diphosphate, condenses
  dimethylallyl diphosphate with isopentenyl diphosphate to geranyl diphosphate, and
  condenses geranyl diphosphate with isopentenyl diphosphate to (2E,6E)-farnesyl diphosphate.
