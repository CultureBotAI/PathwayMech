id: MetaCyc:GALACTARDEG-PWY
label: D-galactarate degradation I
description: The four-event bacterial pathway dehydrates meso-galactarate, cleaves the resulting 5-dehydro-4-deoxy-D-glucarate
  to pyruvate and (2R)-tartronate semialdehyde, reduces the latter with an NAD(P)H donor to D-glycerate,
  and phosphorylates D-glycerate to 2-phosphoglycerate. The historical pathway name retains D-galactarate
  although galactarate is meso. The GarD entry distinguishes this route from D-glucarate degradation;
  three downstream steps are shared. Native MetaCyc 27.0 stereochemistry and cofactor classes are preserved
  rather than equated with broader Rhea reactions. E. coli K-12 evidence, engineered enzyme assays, regulatory
  expression effects and database annotations retain their separate scopes.
pathway_type: carbohydrate-degradation
