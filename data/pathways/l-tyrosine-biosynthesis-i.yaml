id: MetaCyc:TYRSYN
label: L-tyrosine biosynthesis I
description: L-tyrosine biosynthesis I converts chorismate to prephenate, oxidatively decarboxylates prephenate
  with NAD+ to 3-(4-hydroxyphenyl)pyruvate, and transaminates 3-(4-hydroxyphenyl)pyruvate with L-glutamate
  to form L-tyrosine.
