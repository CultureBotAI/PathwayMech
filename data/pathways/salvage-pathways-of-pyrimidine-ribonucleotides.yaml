id: gomodel:YeastPathways_YEAST-RNT-SALV
label: salvage pathways of pyrimidine ribonucleotides
description: Salvage pathways of pyrimidine ribonucleotides in Saccharomyces cerevisiae S288C
  recover uridine, cytidine, cytosine, and uracil through nucleosidase, deaminase, kinase,
  and uracil phosphoribosyltransferase reactions to regenerate UMP, CMP, CDP, UDP, CTP, and
  UTP in the SGD GO-CAM pyrimidine ribonucleotide salvage pathway.
