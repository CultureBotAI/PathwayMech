id: MetaCyc:XYLCAT-PWY
label: D-xylose degradation I
description: D-xylose degradation I isomerizes alpha-D-xylose to alpha-D-xylulofuranose, then phosphorylates
  D-xylulose with ATP to form D-xylulose 5-phosphate for entry into the pentose phosphate pathway.
