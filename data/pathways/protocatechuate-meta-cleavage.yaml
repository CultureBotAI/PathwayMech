id: MetaCyc:P184-PWY
label: protocatechuate degradation I (meta-cleavage pathway)
description: The complete MetaCyc 27.0 eight-member protocatechuate 4,5-cleavage definition proceeds through
  a semialdehyde hemiacetal, pyrone dicarboxylate, oxalomesaconate, the source-defined E,E enol and stereochemically
  unspecified CHA to oxaloacetate and pyruvate, followed by oxaloacetate decarboxylation. This is a source-defined
  composite with enzyme and taxon assertions scoped individually; it is not an experimentally reconstituted
  eight-step route in one strain. Modern LigU/LigJ reactions use distinct KCH and stereospecific S-CHA
  and are not substituted under the historical native reaction IDs. Taxa also include the explicitly scoped
  enzyme-source contexts; KT2440 gallate-module activities do not establish complete pathway occurrence
  in that strain.
pathway_type: aromatic-compound-catabolism
