  - reference_id: PMID:20435721
    quote: LigR activates the transcription of the ligK and ligJ operons in the presence of PCA or GA
- id: meta-126
  subject: CHEBI:16240
  predicate: inhibits
  object: MetaCyc:CPLX-2701
  description: Historical native P. testosteroni dioxygenase is inactivated when its Fe2+ is oxidized;
    this is assay-induced redox inactivation, not inferred physiological regulation.
  evidence:
  - reference_id: PMID:6317682
    quote: oxidized, for instance by H2O2
  - reference_id: PMID:6317682
    quote: In the oxidized state, protocatechuate 4,5-dioxygenase is inactive
- id: meta-127
  subject: CHEBI:22651
  predicate: activates
  object: MetaCyc:CPLX-2701
  description: Ascorbate restores activity by reducing the oxidized iron site in the historical native
    preparation; it is not generalized activation of already-active dioxygenase.
  evidence:
  - reference_id: PMID:6317682
    quote: rereduced by ascorbate to yield active enzyme
  endpoint_qualifiers:
  - endpoint: object
    kind: molecular_state
    description: Previously oxidized, inactive Fe3+-containing native P. testosteroni dioxygenase; reduction
      recovers activity.
    evidence:
    - reference_id: PMID:6317682
      quote: In the oxidized state
