- id: meta-125
  subject: UniProtKB:Q8RQV9
  predicate: regulates
  object: MetaCyc:P184-PWY
  description: In SYK6, LigR activates ligK-orf1-ligI-lsdA and ligJABC transcription with PCA/gallate
    and autorepresses ligR. This regulatory evidence does not validate every chemical step of the composite
    native eight-member definition; promoter DNA identifiers and cooperative-binding hypotheses are not
    invented.
