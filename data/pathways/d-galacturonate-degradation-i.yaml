id: MetaCyc:GALACTUROCAT-PWY
label: D-galacturonate degradation I
description: D-galacturonate degradation I isomerizes aldehydo-D-galacturonate to keto-D-tagaturonate,
  reduces it to D-altronate, dehydrates and phosphorylates it to 2-dehydro-3-deoxy-6-phospho-D-gluconate,
  and cleaves that phosphorylated intermediate to D-glyceraldehyde 3-phosphate and pyruvate.
pathway_type: carbohydrate-degradation
