id: MetaCyc:PWY0-1277
label: 3-phenylpropanoate and 3-(3-hydroxyphenyl)propanoate degradation
description: The complete eight-transformation aerobic meta-cleavage route in Escherichia coli K-12, with
  separate 3-phenylpropanoate and 3-(3-hydroxyphenyl)propanoate entry branches converging on a dihydroxyphenylpropanoate.
  Ring cleavage and hydrolysis release succinate; the remaining five-carbon fragment yields pyruvate and
  acetaldehyde, which MhpF converts to acetyl-CoA. Both native subpathways are included. Hca component
  roles and HcaB assignments combine genetics, whole-cell conversion and homology; the cited Hca study
  does not demonstrate isolated HcaB activity. W3110 genetics and purified MhpA directly support the other
  entry branch, with FAD binding and measured NADH or NADPH use. The selected formal reaction uses NADH.
  Apparent polymeric MhpA has no established subunit count. Purified-enzyme studies also support downstream
  Mhp activities. The putative Hca assembly has no established subunit stoichiometry. MhpB is tetrameric,
  MhpC dimeric and MhpD pentameric; low-pH MhpD cages are a separate assembly condition. MhpF supports
  MhpE folding but their physiological association has no fixed stoichiometry in the inspected sources.
  Current Rhea chemistry retains relative-cis dihydrodiol and (2Z,4E) ring-cleavage-product scope; the
  native ring-cleavage compound has a stale ChEBI cross-reference contradicted by its own structure. The
  selected S aldolase substrate is the current curated assignment; the 1998 assay inferred its absolute
  configuration from the preceding hydratase. These sources cover K-12 strains and engineered derivatives,
  not uniform growth by every K-12 isolate. Cinnamate turnover, uptake, regulation and pyruvate assimilation
  are outside this exact boundary.
pathway_type: aromatic-compound-degradation
