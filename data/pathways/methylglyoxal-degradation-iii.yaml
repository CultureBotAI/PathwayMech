- id: mg3-edge-011
  subject: UniProtKB:Q46851
  predicate: enables
  object: RHEA:27988
  description: Functional Gpr/YghZ activity is represented without asserting a monomeric physical catalyst.
    Current UniProt reports tetrameric and octameric assemblies in different studies. Its methylglyoxal
    activity is much less efficient than its L-glyceraldehyde 3-phosphate reductase activity; this is
    not an exclusive substrate or physiological-role claim.
  evidence:
  - reference_id: PMID:16077126
    source_assertion: Purified YghZ converts methylglyoxal to acetol with NADPH by NMR. NADH activity
      was below 3% of NADPH activity; the reverse acetol-to-methylglyoxal reaction was not detected under
      the assay conditions.
    source_locator: 'PMC1196063: Results, Reduction of methylglyoxal to acetol by purified E. coli AKRs;
      Figure 3B; Table 2'
  - reference_id: UniProtKB:Q46851
    source_assertion: Reviewed Q46851 assigns hydroxyacetone/NADP versus methylglyoxal/NADPH chemistry
      to RHEA:27986, citing ECO:0000269 PMID:16077126 and ECO:0000305 PMID:12583903.
    source_locator: /comments/2/reaction; /genes/0; /primaryAccession
- id: mg3-edge-012
  subject: MetaCyc:GLYCDEH-CPLX
  predicate: catalyzes
  object: RHEA:28668
  description: The (S) product is the current Rhea/UniProt and native pathway annotation. The inspected
    2005 NMR study did not resolve diol enantiomers. Engineered AG1 R-diol production in PMID:10049880
    was assigned to a lactaldehyde route and does not directly test this exact GldA acetol step. This
    retains a reviewed enzyme-function assertion; the cited older experiments were not all inspected as
    full texts. NADH is the selected branch, not a claim that no NADPH-supported activity exists.
  evidence:
  - reference_id: MetaCyc:RXN-8632
    source_assertion: RXN-8632 has ENZRXN0-6324 with GLYCDEH-CPLX as enzyme, a RHEA:28667 cross-reference
      and acetol/NADH/proton opposite (S)-propane-1,2-diol/NAD. PWY-5453 selects the reduction direction.
    source_locator: Reaction[@frameid="RXN-8632"]/enzymatic-reaction/Enzymatic-Reaction[@frameid="ENZRXN0-6324"]/enzyme;
      left; right; dblink
  - reference_id: UniProtKB:P0A9S5
    source_assertion: Reviewed GldA explicitly assigns hydroxyacetone + NADH + H(+) = (S)-propane-1,2-diol
      + NAD(+) to RHEA:28667, with ECO:0000269 citations 18179582,3920199,40950,6365902.
    source_locator: /comments/2/reaction; /primaryAccession
