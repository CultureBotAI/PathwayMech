id: MetaCyc:PWY-5453
label: methylglyoxal degradation III
description: The glutathione-independent acetol branch of methylglyoxal degradation III in Escherichia
  coli uses Gpr/YghZ to reduce methylglyoxal with NADPH and GldA to reduce acetol with NADH. The record
  represents the native MG1655 pathway annotation with K-12 enzyme and mutant evidence. Purified YghZ
  produces acetol; NADH activity and the reverse reaction were negligible or undetected under the reported
  conditions. The (S)-propanediol product is retained as a current Rhea/UniProt annotation, not an enantiomer-resolved
  result of the inspected 2005 NMR experiments. A separate engineered AG1 study produced R-propanediol
  through a proposed lactaldehyde route and does not establish the stereochemistry of this acetol branch.
  Native physiological flux, exclusive enzyme roles and a fixed GldA oligomeric state are not implied.
  YghZ also acts on L-glyceraldehyde 3-phosphate; other methylglyoxal reductases provide parallel activities.
  Transport and neighboring lactaldehyde, glyoxalase and glycerol-utilization reactions are outside this
  two-reaction record.
