id: gomodel:YeastPathways_PWY3O-402
label: inositol phosphate biosynthesis
description: Inositol phosphate biosynthesis in Saccharomyces cerevisiae S288C converts phosphatidylinositol
  4,5-bisphosphate and soluble inositol phosphates through inositol tetrakisphosphate, inositol
  pentakisphosphate, inositol hexakisphosphate, and inositol pyrophosphate intermediates.
  The source includes the additional diphosphoinositol pentakisphosphate phosphorylation step
  without assigning its enabling protein.
