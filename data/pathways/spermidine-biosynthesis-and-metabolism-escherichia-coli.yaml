id: PathBank:SMP0002097
label: Spermidine Biosynthesis and Metabolism
description: 'This record represents the complete current PathBank SMP0002097 map for Escherichia coli,
  not just its two spermidine-producing reactions. SpeD decarboxylates S-adenosyl-L-methionine (SAM);
  SpeE transfers the resulting aminopropyl group to putrescine to make spermidine and 5′-methylthioadenosine
  (MTA); Pfs/MtnN hydrolyzes MTA to adenine and methylthioribose (MTR). The current map also includes
  ATP-dependent glutathionylspermidine (Gsp) formation by Gss and cytosol-to-periplasm MTR transport.
  All four chemical reactions, the transport and their 22 explicit stoichiometric sides are retained.
  A separately represented SAM-biosynthesis interface is a source pathway connection, not a sixth resolved
  chemical equation.


  The map''s native organism is species-level E. coli (NCBITaxon:562). Its four reviewed protein accessions
  refer to E. coli K-12 (NCBITaxon:83333), which does not demonstrate every reaction or physiological
  outcome in every derivative. PWML assigns the Gss chain to K-12 but its complex to species element 346,
  labelled E. coli K-12 while carrying taxon 679895. Current NCBI identifies 679895 as E. coli BW25113,
  a descendant of K-12; this native label/identifier conflict is preserved rather than silently reassigned.
  The Gss biochemical work uses recombinant expression and several cellular strains, not a whole-route
  validation in BW25113.


  The older archived PW002085 BioPAX contains the SpeD, SpeE, Pfs and transport branch but lacks the current
  Gss branch and SAM interface. The current whole download adds 69 native objects and changes pathway
  membership while preserving the older event definitions. PathBank''s HTML/PWML narrative still describes
  the older three-enzyme route. Current membership and explicit equation slots take precedence for the
  scope of this record, while the archive and narrative disagreement remain documented. This is distinct
  from the existing yeast spermidine-biosynthesis-I record and from the bacterial SAM cycle, although
  substrates and Pfs are shared.


  SpeD/P0A7F6 is a 264-residue proenzyme that undergoes nonhydrolytic cleavage between Lys111 and Ser112,
  yielding beta residues 1–111 and alpha residues 112–264; Ser112 gives the covalently attached pyruvoyl
  group required for catalysis. The 1987 processing abstract (PMID:3316212) describes pulse-chase precursor/product
  evidence, and PMID:3546296 supports four alpha/beta pairs with one pyruvoyl per pair. PathBank instead
  encodes eight copies of a protein explicitly named proenzyme in complex 3895. That native coefficient
  is retained as an annotation with an unresolved precursor-versus-processed-chain mismatch, not asserted
  as eight active precursor molecules. The older 1982 abstract''s six-subunit description is separately
  retained as historical conflicting evidence.


  PWML lists pyruvic acid and magnesium as SpeD cofactors without coefficients. Free pyruvic acid (CHEBI:32816)
  is chemically distinct from the covalent pyruvoyl substituent (CHEBI:45360); the mechanistic cofactor
  edge represents the latter and explicitly qualifies the mature molecular state. Mg2+ activates the studied
  E. coli enzyme, but 2007 assays also report activation by several alternative cations and salt-dependent
  cooperativity. These are alternative experimental activation conditions, not simultaneous metal requirements
  or direct proof of the cellular metal. Native magnesium''s unrelated BioCyc 13-HYDROXY-MAGNESIUM-PROTOPORP
  cross-reference is rejected; its Mg2+ structure agrees with current CHEBI:18420.


  The complete 1986 speE/speD paper, including all five scanned pages, reports linked gene deletions,
  complementation and separate overexpression. A 1795-bp insert restores both measured activities, and
  deleting upstream sequence lowers both unless an external T7 promoter supplies transcription. Its note
  added in proof identifies the SpeE N-terminal sequence with the predicted gene product. This supports
  the biochemical entry module in the tested strains and constructs. The paper explicitly says deficient
  cells still grow on purified medium and does not establish universal spermidine essentiality or a new
  Gss/transport phenotype.


  SpeE/P09158 catalyzes aminopropyl transfer from decarboxylated SAM to putrescine. PathBank complex 3896
  contains two SpeE chains; the 2010 structural-paper abstract reports a dimer in crystal and solution.
  Current UniProt names the protein polyamine aminopropyltransferase and annotates additional amine substrates,
  which are outside this exact map. Its Michaelis-constant annotation labels two donor entries S-adenosylmethionine
  even though the catalytic equation uses decarboxylated SAM; those ambiguous donor values are preserved
  in the kinetic ledger and are not silently relabelled or propagated as pathway-substrate constants.


  Pfs/MtnN/P0AF12 is assigned as a homodimer in PathBank complex 3419. Reviewed annotation and the 1998
  cloning abstract support irreversible glycosidic cleavage of MTA; the distinct SAH and 5′-deoxyadenosine
  activities belong to adjacent pathways. The 1996 recombinant study''s abstract distinguishes the full-length
  enzyme from an engineered N-terminal eight-residue deletion with altered MTA affinity; the truncation
  is not substituted for the native chain. The retained current sequence is 232 residues, and an old sequence-start
  caution remains separate from its current identity. Annotation-derived MTA kinetic values from different
  temperatures and references are assay-specific and do not establish cellular flux.


  The Gss reaction joins the glycine carboxyl group of reduced glutathione to spermidine''s N1 aminopropyl
  terminal amino group while ATP is converted to ADP and phosphate. PathBank''s equation is an ATP-dependent
  synthetase reaction, despite its native reaction label and enzyme-class slot being the amidase EC 3.5.1.78.
  The chain''s PWML/UniProt records also list synthetase EC 6.3.1.8. The graph retains the native reaction
  identifier and written direction with a chemically descriptive label, without promoting the inconsistent
  amidase label to synthetase identity. The same bifunctional protein hydrolyzes Gsp through a separate
  amidase activity; this does not reverse ATP-dependent synthesis or regenerate ATP.


  The complete 2006 primary paper reports a dimeric 619-residue Gss structure with N-terminal amidase
  residues 1–195, a 196–205 linker and C-terminal synthetase residues 206–619. Its main text describes
  analytical ultracentrifugation near 138 kDa and a roughly 70-kDa polypeptide, but the cited supporting
  measurement itself was not acquired. The reported two-subunit complex agrees with PathBank''s coefficient.
  Crystal structures reveal Mg2+-associated nucleotide binding and an ATP-grasp catalytic domain. GSH
  acylphosphate formation followed by spermidine attack is the proposed chemical mechanism; movement between
  two GSH sites is a mechanistic proposal, with direct binding at the productive site not excluded. Trapped
  Cys338–GSH disulfide and Lys607-linked material at crystallization pH are not obligatory catalytic intermediates.


  Experimental preparations remain distinct. The 2006 crystallographic protein was expressed in E. coli
  BL21(DE3) from the supplied plasmid and purified using cited earlier procedures; the accessible Methods
  do not establish its exact tag. The same paper explicitly describes pET28a N-terminal His6 constructs
  for the kinetic/mutant work. The 2010 study uses full-length GspSA and a separately expressed 1–197
  amidase fragment; its fragment crystal is not a full-length native enzyme. The Gss magnesium edge therefore
  describes the synthetase structural/assay context without assigning a metal requirement to the amidase
  domain or inferring native-host metal occupancy.


  The 2006 Table 1 gives wild-type Gss apparent Km values of 218 ± 12 micromolar for GSH and 76 ± 1 micromolar
  for spermidine, with kcat 4.35 ± 0.30 s−1 under its coupled assay and saturating other substrates. The
  ten mutant rows, including the inactive R316E row, are separate constructs, not additional wild-type
  constants. Older UniProt kinetic annotations include different pH-dependent substrate values and synthetase/amidase
  turnover values attributed to 1995. Those older numbers are retained as annotation-tier evidence because
  the complete 1995 paper was not read. No numerical value is assigned to a PMID merely because that paper
  appears in a combined citation list.


  The complete 2010 paper supports selective oxidative inhibition of Gss amidase activity through Cys59
  sulfenic-acid formation, while synthetase activity is relatively preserved under the tested peroxide
  conditions. It proposes a Gsp-linked protein-thiolation/redox cycle. Its Results state that the single
  gspSA deletion had viability similar to wild type in the tested comparison, whereas glutaredoxin/gspSA
  double mutants showed greater peroxide sensitivity. This narrower result is retained despite broader
  abstract wording. These findings explain adjacent Gsp physiology; the record does not expand the native
  four-reaction map into an unassigned redox or trypanothione pathway.


  PathBank transport 511 explicitly moves its MTR state from cytosol to periplasm and is marked nonspontaneous,
  but supplies no transporter, energy-coupling reaction or transport mechanism. The available 2006 export
  abstract (PMID:16788729) studies plasmid-directed coliphage-T3 SAM hydrolase, radiolabelled methionine
  and metK mutants, reporting enhanced extracellular MTR. It supports export in that experimental context,
  not a measured periplasmic step, identified transporter, universal lack of methionine salvage, or native
  whole-pathway flux in all E. coli strains. Its publisher full text remained inaccessible. The 1973 production
  citation has metadata only and is not used as mechanistic evidence.


  The source distinguishes unlocalized and cytosolic spermidine/SAM/MTR instances, and cytosolic from
  periplasmic MTR. These native states remain distinct. Connections between a produced unlocalized metabolite
  and a later cytosolic pool are explicit curation inferences of pathway continuity, not measured translocation
  or substrate channeling. The SAM interface has an output-marked cytosolic SAM state and generic Interaction
  553236, with no enzyme or complete chemical sides; it is represented as a pathway interface and does
  not import the entire adjacent SAM-biosynthesis pathway.


  Chemical identities are checked against complete current ChEBI originals and the full native structures.
  MTA is stereo-unspecified in PathBank, so it is not exactly equated to stereospecific CHEBI:17509. Native
  MTR is cyclic and stereospecified, whereas current CHEBI:16895 explicitly depicts an open-chain structure;
  no exact mapping is made. Native phosphate has phosphoric-acid structure/formula but a phosphate(3−)
  cross-reference, so its source identity is retained with the contradiction. Reduced GSH agrees with
  CHEBI:16856 and conflicts with the source''s OXIDIZED-GLUTATHIONE cross-reference. Native Gsp uses an
  imidic tautomer depiction; full InChI comparisons, rather than names alone, govern any chemical mapping.
  Source equations mix their own protonation conventions; no exact Rhea normalization or atom-balanced
  physiological equation is inferred.


  The complete 2009 physiological paper studied the specifically constructed HT765 strain with eight biosynthetic-gene
  deletions and a thiamine-prototrophy selection. It grew indefinitely in air without added polyamines
  at a reduced rate, remained sensitive to oxygen stress, and showed strong early anaerobic growth impairment.
  The main text also records anaerobic growth after several days, possibly following a bypass change.
  These conditions contradict a blanket assertion that spermidine is essential for all E. coli growth;
  they do not disprove the recorded enzyme reactions.


  Evidence coverage comprises complete main-text reading of the 2006 Gss, 2010 redox and 2009 physiology
  articles, all 19 corresponding figure images, and all five scanned pages of the 1986 speE/speD paper.
  Other primary articles are limited to the complete available abstracts or metadata, explicitly identified
  in their references. Two supplementary-file attempts returned HTML download challenges rather than scientific
  files; no supporting-file contents are claimed. The whole current BioPAX, relevant complete PWML biological
  frames, all four current UniProt scientific frames and current ChEBI/taxon identities were inspected.
  Independent scientific review, authority integration, native validation and public-release licensing
  remain later decisions.'
