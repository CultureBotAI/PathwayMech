id: MetaCyc:PWY-5386
label: methylglyoxal degradation I
description: The complete three-reaction glutathione-dependent route from methylglyoxal to pyruvate represented
  by MetaCyc PWY-5386 and PathBank SMP0002125, curated for the E. coli K-12 protein core. GloA acts as
  a homodimer on the spontaneously formed methylglyoxal-glutathione hemithioacetal; the source net reaction
  includes that nonenzymatic condensation. Monomeric GloB hydrolyzes (R)-S-lactoylglutathione, regenerating
  glutathione and releasing D-(R)-lactate. FAD-dependent membrane-associated Dld oxidizes D-lactate to
  pyruvate while reducing a quinone. Exact Rhea quinone/quinol classes are retained without asserting
  ubiquinone-6 specificity; ubiquinone-8 supports reconstituted E. coli respiration. The native PathBank
  L-lactate identity and oxidized-glutathione cross-reference are rejected. Pathway-level flux evidence
  comes from MG1655-derived SIJ488 strains with engineered glycolytic deletions grown on glycerol, not
  unrestricted wild-type flux. The older MetaCyc description calls the D-lactate fate likely; the 2022
  deletion study supports this branch in its tested context. The GloB branch does not exclude accessory
  GloC activity. Ni activates GloA whereas Zn activates GloB; published GloA metal occupancies differ
  and are retained in the cofactor evidence. Upstream methylglyoxal synthesis, alternative glutathione-independent
  routes, Kef regulation and downstream respiratory-chain reactions are outside this pathway.
pathway_type: detoxification
