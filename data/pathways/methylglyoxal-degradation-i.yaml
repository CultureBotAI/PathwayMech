- id: mg1-edge-017
  subject: MetaCyc:GLYOXI-CPLX
  predicate: has_cofactor
  object: CHEBI:49786
  description: Ni2+ activates E. coli GloA, whereas Zn2+ does not. Current annotation of the 2000 structures
    reports one Ni per subunit/two per dimer; the 1998 solution study reported one Ni per dimer. These
    are differing measurements, not a universal physiological occupancy. Co2+ and Cd2+ also activated
    protein-metal complexes in the structural study.
  evidence:
  - reference_id: UniProtKB:P0AC81
    source_assertion: 'COFACTOR: Ni2+ (ECO:0000269/PMID10913283); note reports one nickel per subunit/two
      between dimer subunits and inactivity with Zn2+.'
    source_locator: /comments/2/cofactors; /comments/2/note
    assay_taxon: NCBITaxon:83333
    eco_code: ECO:0000269
  - reference_id: PMID:10913283
    quote: the Escherichia coli enzyme is inactive in the presence of Zn(2+) and is maximally active with
      Ni(2+).
  - reference_id: PMID:9628737
    source_assertion: The indexed abstract reports one nickel ion per dimeric enzyme by inductively coupled
      plasma and atomic absorption analyses; this differs from the later structured annotation.
    source_locator: /resultList/result[0]/abstractText, metal-analysis sentences
