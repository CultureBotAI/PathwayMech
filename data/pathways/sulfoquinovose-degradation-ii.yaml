id: MetaCyc:PWY-7722
label: sulfoquinovose degradation II
description: The complete five-transformation sulfo-Entner-Doudoroff route from free sulfoquinovose to
  pyruvate and sulfolactate in Pseudomonas putida strain SQ1 (DSM 100120). Six exact Rhea activities represent
  the five native members because the final SLA oxidation has alternative NAD- and NADP-dependent forms.
  All five SQ1 enzymes were reconstituted in vitro and induced during aerobic SQ growth. Current native
  reaction structures and reviewed Rhea/UniProt assignments retain S-SLA/S-SL; older native protein prose
  linking R-SLA is superseded, without recasting the SQ1 HPLC-MS assay as an enantiomer-resolved experiment.
  SQDH has direct tetramer evidence; the other functional protein/activity relations do not assert monomer
  sufficiency. Metal annotations preserve inference levels, and the aldolase genomic-start difference
  is explicit. The endpoint retains organic sulfur. SQ-glycoside hydrolysis, mutarotation, unidentified
  transport/regulatory mechanisms, downstream pyruvate metabolism and partner-organism sulfolactate mineralization
  are outside this exact native boundary. KT2440 expression datasets do not establish SQ1 applicability.
