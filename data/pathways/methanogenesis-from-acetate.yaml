id: MetaCyc:METH-ACETATE-PWY
label: methanogenesis from acetate
description: Source-selected acetate conversion ending at
  methyl-CoM, not completed methane production. The native direct associations include two genera and four publicly
  pointed species plus species-rank ORG-5913 (Methanosarcina TM-1), whose own object has no NCBI pointer. TAX-28890
  is range only. Methanothrix associations are retained although condition-specific Opfikon/CALS-1 evidence supports
  Acs activation; no seventh Acs reaction or universal Ack/Pta operation is inferred. All six reactions retain reversible
  source direction and separately selected root orientation. Full chemistry, taxon, activity, construct and source
  conflicts are carried on incident edge descriptions/evidence. No exact aliases are promoted.
