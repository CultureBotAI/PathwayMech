id: gomodel:YeastPathways_PWY-7176
label: UTP and CTP de novo biosynthesis
description: UTP and CTP de novo biosynthesis in Saccharomyces cerevisiae S288C converts UMP
  to UDP via URA6-catalyzed UMP kinase activity, phosphorylates UDP to UTP through YNK1-catalyzed
  nucleoside diphosphate kinase activity, and aminates UTP to CTP through URA8- or URA7-catalyzed
  CTP synthase activity.
