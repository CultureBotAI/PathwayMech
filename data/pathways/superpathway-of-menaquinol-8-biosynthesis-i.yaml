id: MetaCyc:PWY-5838
label: superpathway of menaquinol-8 biosynthesis I
description: 'The complete E. coli K-12 classical menaquinol-8 superpathway contains ten reactions: seven
  steps convert chorismate to 1,4-dihydroxy-2-naphthoate, IspB extends farnesyl diphosphate with five
  isopentenyl diphosphates, and MenA and UbiE prenylate and methylate the naphthalenediol to menaquinol-8.
  This is the full native PWY-5838 boundary, including its octaprenyl donor branch; upstream chorismate,
  IPP and farnesyl diphosphate synthesis and downstream respiratory redox cycling are separate. MenF is
  the dedicated isochorismate synthase. MenD forms SEPHCHC, MenH releases pyruvate, and MenI hydrolyzes
  DHNA-CoA; older assignments that collapsed these activities are superseded. K-12 protein annotation
  and MG1655 native frames are distinguished from primary experiments in specific K-12 derivatives, including
  XL1 Blue and BW25113. The quinol endpoint follows exact native reactions and current Rhea chemistry;
  older quinone extraction studies do not directly establish intracellular redox occupancy. Native MenE
  tetramer, reviewed homodimer by similarity and monomeric inhibitor-bound crystal assemblies disagree,
  so its edge expresses supported function without resolving assembly. MenC, MenA and UbiE functional
  edges likewise do not assert isolated-monomer sufficiency. UbiE membership in the ubiquinone metabolon
  is not transferred to this pathway. Magnesium and manganese alternatives for MenD and inferred IspB
  magnesium binding retain their evidence limits; bicarbonate is a supported MenB cofactor, not a stoichiometric
  substrate.'
