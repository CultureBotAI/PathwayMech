id: PathBank:SMP0002055
label: Thiazole Biosynthesis I
description: 'PathBank SMP0002055 (native BioPAX archive member PW002041.owl) models Escherichia coli thiazole biosynthesis
  I across three enzyme-catalyzed transformations that supply the 2-[(2R,5Z)-2-carboxy-4-methylthiazol-5(2H)-ylidene]ethyl
  phosphate (cTHZ-P, CHEBI:62899) moiety for thiamine diphosphate biosynthesis. In the two parallel precursor-forming branches,
  homodimeric 1-deoxy-D-xylulose-5-phosphate synthase Dxs (PathBank:SMP0002055/ProteinComplex/3831, containing 2 copies of
  UniProtKB:P77488; RHEA:12606, EC:2.2.1.7; native Reactions/5963) condenses pyruvate (CHEBI:15361) and D-glyceraldehyde 3-phosphate
  (CHEBI:59776) with H(+) (CHEBI:15378) using Mg(2+) and thiamine diphosphate cofactors to produce 1-deoxy-D-xylulose 5-phosphate
  (DXP, CHEBI:57792) and CO2 (CHEBI:16526), while radical-SAM 2-iminoacetate synthase ThiH (UniProtKB:P30140; RHEA:26362,
  EC:4.1.99.19; native Reactions/5962) cleaves the C(alpha)-C(beta) bond of L-tyrosine (CHEBI:58315; marked as a SubPathwayOutput
  from Tyrosine Biosynthesis SMP0000826 in PW002041.owl) with S-adenosyl-L-methionine (CHEBI:59789) and NADPH (CHEBI:57783)
  via its [4Fe-4S] cluster to produce 2-iminoacetate (dehydroglycine zwitterion, CHEBI:77846), 4-methylphenol (p-cresol, CHEBI:17847),
  5''-deoxyadenosine (CHEBI:17319), L-methionine (CHEBI:57844), and NADP(+) (CHEBI:58349). In the converging thiazole-ring-forming
  step, the hetero-oligomeric thiazole synthase assembly ThiGH (PathBank:SMP0002055/ProteinComplex/4013, containing 6 copies
  of thiazole synthase ThiG, UniProtKB:P30139, and 6 copies of 2-iminoacetate synthase ThiH, UniProtKB:P30140; RHEA:26298,
  EC:2.8.1.10; native Reactions/5964) condenses DXP (CHEBI:57792), 2-iminoacetate (CHEBI:77846), and C-terminally thiocarboxylated
  sulfur-carrier protein ThiS (RHEA-COMP:19908, native Compound/Generic238) to yield [ThiS sulfur-carrier protein]-C-terminal
  Gly-Gly (RHEA-COMP:12909, native Compound/Generic239), 2-[(2R,5Z)-2-carboxy-4-methylthiazol-5(2H)-ylidene]ethyl phosphate
  (CHEBI:62899; marked as a SubPathwayInput to Thiamin Diphosphate Biosynthesis SMP0002042 in PW002041.owl), 2 H2O (CHEBI:15377),
  and H(+) (CHEBI:15378).


  Several native PW002041.owl BioPAX representation quirks are preserved in provenance while normalized to verified biochemical
  authorities in the causal graph: (1) unlike MetaCyc PWY-6892 (part of THISYN-PWY), which explicitly includes the upstream
  IscS/ThiF/ThiI sulfur-mobilization and ThiS-adenylation/thiocarboxylation reactions (RHEA:17458, RHEA:43345, RHEA:43341),
  PathBank SMP0002055 models only the three-reaction DXP + tyrosine + thiocarboxylated-ThiS condensation core (Reactions/5963,
  Reactions/5962, Reactions/5964) and treats thiocarboxylated ThiS (Compound/Generic238, RHEA-COMP:19908) as a boundary input;
  (2) native Reactions/5962 (dehydroglycine synthase ThiH) omits bp:eCNumber in PW002041.owl and erroneously lists Compound/PW_C000696
  (4-Methylcatechol, CHEBI:17254, formula C7H8O2) and Compound/PW_C040034 (Hydrogen Ion, CHEBI:15378) on bp:right, whereas
  radical-SAM tyrosine lyase ThiH (EC:4.1.99.19, RHEA:26362, UniProtKB:P30140, PMID:19923213) cleaves L-tyrosine (C9H11NO3)
  to 2-iminoacetate (CHEBI:77846) and 4-methylphenol (p-cresol, CHEBI:17847, formula C7H8O) without introducing an unbuffered
  hydroxyl oxygen or extra free proton; (3) native Reactions/5964 (thiazole synthase, eCNumber 2.8.1.10) omits the balanced
  proton (CHEBI:15378) on bp:right that RHEA:26298 produces with coefficient 1; and (4) native BiochemicalPathwayStep elements
  (PathwayEnzymeReaction/22285 through PathwayEnzymeReaction/22287) in PW002041.owl are listed under bp:pathwayOrder without
  bp:nextStep links and native Protein/SmallMolecule instances omit bp:cellularLocation, so reaction ordering and metabolite
  handoffs are grounded in bp:pathwayOrder and shared reaction bp:right/bp:left intermediates (CHEBI:57792 and CHEBI:77846)
  and cytoplasmic localization (GO:0005737) is asserted only where directly supported by reviewed UniProtKB annotations (UniProtKB:P77488)
  for Escherichia coli K-12 (NCBITaxon:83333).'
