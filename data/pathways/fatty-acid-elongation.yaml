  condense and reduce acyl-carrier protein intermediates through 3-oxoacyl-[acp], (3R)-3-hydroxyacyl-[acyl-carrier-protein],
  enoyl-[acp], palmitoyl-[acp], and palmitoyl-CoA, then uses TES1 to hydrolyze palmitoyl-CoA to palmitate.
