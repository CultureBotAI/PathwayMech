id: gomodel:YeastPathways_FASYN-ELONG2-PWY
label: fatty acid elongation
description: Fatty acid elongation in Saccharomyces cerevisiae S288C uses CEM1, OAR1,
  FAS1, and FAS2 to condense and reduce acyl-carrier protein intermediates through
  3-oxoacyl-[acp], (3R)-3-hydroxyacyl-[acyl-carrier-protein], enoyl-[acp], palmitoyl-[acp],
  and palmitoyl-CoA, then uses TES1 to hydrolyze palmitoyl-CoA to palmitate.
