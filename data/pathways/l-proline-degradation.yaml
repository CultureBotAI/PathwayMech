id: gomodel:YeastPathways_PROUT-PWY
label: L-proline degradation
description: L-proline degradation in Saccharomyces cerevisiae S288C oxidizes L-proline
  to (S)-1-pyrroline-5-carboxylate, hydrates that intermediate to L-glutamic 5-semialdehyde,
  and oxidizes it to L-glutamate.
