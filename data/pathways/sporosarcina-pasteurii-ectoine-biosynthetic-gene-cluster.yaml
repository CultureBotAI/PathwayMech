id: MIBiG:BGC0000852
label: Sporosarcina pasteurii ectoine biosynthetic gene cluster
description: The ectABC operon from Sporosarcina pasteurii DSM 33 (ATCC 11859; named Bacillus pasteurii
  in the study) supports ectoine production. This cluster record preserves all three deposited gene products
  and the observed pathway output. Individual enzyme functions follow sequence-based assignments; detailed
  reaction, cofactor and localization claims are outside this record.
