id: MetaCyc:RHAMCAT-PWY
label: L-rhamnose degradation I
description: L-rhamnose degradation I converts alpha-L-rhamnose to beta-L-rhamnose, isomerizes L-rhamnopyranose
  to L-rhamnulose, cyclizes keto-L-rhamnulose to L-rhamnulofuranose, phosphorylates L-rhamnulose with
  ATP, and cleaves L-rhamnulose 1-phosphate to (S)-lactaldehyde and dihydroxyacetone phosphate.
pathway_type: carbohydrate-degradation
