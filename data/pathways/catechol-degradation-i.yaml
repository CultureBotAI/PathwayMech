id: MetaCyc:PWY-5415
label: catechol degradation I (meta-cleavage pathway)
description: 'The complete five-transformation catechol meta-cleavage route comprises P183-PWY and PWY-5162.
  Catechol ring cleavage and hydrolysis yield formate and a five-carbon intermediate; hydration and aldol
  cleavage yield pyruvate and acetaldehyde, followed by acetyl-CoA formation. Formal chemistry retains
  the (2Z,4E) ring-cleavage product, the 2Z enol hydratase substrate and the S aldolase substrate. Native
  parent prose also describes keto/2E forms; historical assay preparations do not independently establish
  these exact formal stereochemical assignments. The native hydrolase Rhea cross-reference specifies a
  keto product and is not an exact replacement for the selected native enol reaction. Enzyme activity
  nodes preserve individual microbial source preparations and evidence codes. Their component activities
  do not establish the entire route in every source organism. Native activity interfaces and curated formal
  reaction assignments remain distinct, with expression hosts, partial purification, complexes and sequence-reference
  limitations attached to their evidence. E. coli MhpD/E/F are a shared terminal module; their inclusion
  does not assign the complete catechol route to E. coli. XylE is tetrameric and the MhpD native assembly
  pentameric. DmpFG contains two F/G catalytic pairs; heterodimer wording denotes a pair. XylI/J and Bordetella
  decarboxylase/hydratase partners retain their native assembly boundaries, with unspecified coefficients
  left unspecified. Oxidative-branch catalysis and its separate PWY-5420 route remain adjacent context.
  E. coli ADHE-CPLX is explicitly excluded by PWY-5162 and its regulators are retained only in source
  context; this exclusion does not apply to unrelated proteins named AdhE. Native NADH inhibition of DmpG
  conflicts with primary stimulation and is excluded as an accepted inhibitory claim. Native Mn/Zn allosteric
  labels do not establish a binding mechanism. PKO1 TbuE has independently reported catechol activity
  but its current native ENZRXN pointer is methylcatechol chemistry; those material reactions are not
  added to the five-step route. Gene-product identities, additional substrates, kinetics, source organism
  catalogues and regulatory identity gaps remain explicitly dispositioned with source locators.


  The taxa list preserves the eight independently grounded species and strain annotations in the MetaCyc
  27.0 parent pathway. These native species slots have no individual evidence entries; the parent direct-assay
  citation concerns PKO1 and does not demonstrate the complete route in every listed organism. Historical
  native Pseudomonas putida mt-2 (ORG-5948) remains strain context without a guessed modern taxon alias.
  Component-source organisms and recombinant expression hosts are not added as whole-route taxa.


  CF600 native enzyme was purified from phenol-grown cells at 30 C. Recombinant DmpF assays used E. coli
  carrying pVI1311A at 37 C, with pVI1300A (dmpQ) as an unrelated-gene control. The aldolase substrate
  was S-4-hydroxy-2-ketovalerate unless a racemate was explicitly stated. [PMID:8419288]


  DmpF-expressing extracts formed acetyl-CoA from acetaldehyde and propionyl-CoA from propanal with CoA
  and NAD+. Propanal was 2.7-fold slower in recombinant extracts and 2.4-fold slower in native extracts.
  Unrelated-gene and acetate-grown controls gave negligible products. [PMID:8419288]


  The 1993 results sentence assigning propanal to 3-methylcatechol conflicts with that paper’s abstract
  and discussion, which assign it to 4-methyl/3,4-dimethylcatechol and acetaldehyde to catechol/3-methylcatechol.
  The contradictory sentence does not change the formal catechol-route product. [PMID:8419288]


  CF600 aldolase and acylating dehydrogenase copurified through five chromatographic steps and ammonium
  fractionation. Final protein was 15 mg, with 63 U aldolase and 47 U dehydrogenase (ratio 1.34); aldolase
  specific activity was 4.2 U/mg and yield 28%. Early dehydrogenase measurements were confounded by alcohol
  dehydrogenase; crude aldolase correction assumed a factor of two. [PMID:8419288]


  The CF600 preparation contained apparent 34.5 and 40 kDa bands identified as DmpF and DmpG by their
  N termini. DmpG lacked its initiator methionine. Staining and amino-acid composition are approximate
  abundance evidence; the composition fit was DmpF:DmpG = 1:0.83. Reported N termini were MNQKLK for DmpF
  and TFNPSK for processed DmpG. [PMID:8419288]


  The CF600 preparation’s gel-filtration mass of 148 kDa was compatible with two DmpF and two DmpG subunits.
  Monomer or homodimer peaks were not detected in that preparation. [PMID:8419288]


  The complex remained stable at -80 C for at least six months. At 4–6 C aldolase was stable over six
  days, while dehydrogenase retained 87%, 56% and 47% at days 2, 4 and 6. Activity was linear over a 30-fold
  protein range. [PMID:8419288]


  CF600 aldolase activity was maximal around pH 8.5–9. Dehydrogenase activity increased over the tested
  pH 6.5–8.5 range; its rate in Tris was about half the HEPES rate. These are preparation and buffer conditions,
  not physiological pH optima for the complete pathway. [PMID:8419288]


  In purified CF600 DmpFG, 1 mM Mn2+ increased aldolase activity 6–8-fold, Zn2+ strongly inhibited, and
  Mg2+ and Ca2+ had no effect. Overnight dialysis with 5 mM EDTA did not alter basal activity. These results
  support assay effects but leave an obligatory removable metal requirement unresolved. [PMID:8419288]


  NADH stimulated complex-associated CF600 aldolase; NAD+ stimulated it more weakly. Delaying lactate
  dehydrogenase allowed pyruvate to accumulate, whereas delaying NADH left little accumulated pyruvate.
  Figure 6 used 1 mL assays containing 48 micromol HEPES pH 8, 1 micromol MnCl2, 270 nmol NADH, 14 U reporter
  LDH and 20 micrograms DmpFG; added NAD+ was 270 nmol. MnCl2 is a delivery salt without an inferred hydrate.
  [PMID:8419288]


  Direct nucleotide action on DmpG and signaling through DmpF were alternative explanations for stimulation.
  The experiment does not identify a direct NADH binding site or establish allostery. The native negative
  NADH mode is conflicting database metadata and is not an accepted inhibition assertion. [PMID:8419288]


  Maximum aldolase pyruvate recovery was 77%; ten additional minutes did not restore it. Pyruvate-plus-acetaldehyde
  controls recovered more than 95% of the expected signal, and an overalkaline substrate preparation recovered
  about 50%. Added hydratase did not improve recovery (data not shown). The authors favored substrate
  instability over equilibrium or a simple precursor impurity. [PMID:8419288]


  For 15 micrograms purified CF600 complex, 10 mM aldehyde and 0.05 M HEPES pH 8, rates in nmol/min (mean,
  SD) were acetaldehyde 58.5,1.0; propanal 35.6,1.0; butanal 14.9,2.0; isobutyraldehyde 10.5,1.9; formaldehyde
  less than 2.0. NADP+ supported 7% of the NAD+ rate. Mn2+, Mg2+, Ca2+ and Co2+ at 1 mM did not stimulate
  dehydrogenase. Alternative aldehydes are not inputs to the formal acetaldehyde reaction. [PMID:8419288]


  CF600 extracts contained other acetaldehyde-metabolizing activities. Failure to detect activity from
  DmpG expressed alone may reflect expression or assay sensitivity; it does not prove an absolute catalytic
  requirement for DmpF. Adjacent alcohol/acetate assays are controls, not extra route steps or support
  for E. coli AdhE inclusion. [PMID:8419288]


  The 1993 Dmp decarboxylase/hydratase association was unpublished context. Channeling, protection from
  acetaldehyde toxicity and energetic benefit were proposed explanations, not directly measured universal
  pathway properties. [PMID:8419288]


  The 1989 native preparation was P. putida mt-2 PaW1 carrying pWW0. Separate E. coli K-12 delta-trp experiments
  used temperature-inducible lambda PL constructs: pGSH2915 for xylHI and pGSH2829 for xylJ, induced at
  42 C. Hydratase substrate was synthesized using DL-allylglycine/oxidase and reverse-phase purification;
  DL precursor does not establish product stereochemistry. [PMID:2681159]


  The 1989 hydratase assay used 30 micromolar nominal substrate in 10 mM Tris pH 7 with 3.3 mM MgSO4.
  Enol disappearance was monitored at 265 nm; alkaline 305-nm measurement assessed the total enol/keto
  pool. Historical unspecified enol is not proof of the formal 2Z isomer. [PMID:2681159]


  The 1989 methods reverse the xylH/xylI function assignment relative to the final interpretation, and
  one mass sentence reverses hydratase/decarboxylase masses. The supported assignments are XylH tautomerase,
  XylI decarboxylase and XylJ hydratase; contradictory source statements remain documented. [PMID:2681159]


  The recombinant oxidative-branch isomerase had an apparent native mass of 28 kDa and an apparent SDS
  subunit mass of 3.5 kDa. The latter is a mass, not a subunit count, and does not add an isomerase step
  to this hydrolytic route. [PMID:2681159]


  PaW1 decarboxylase and hydratase copurified through anion exchange, hydrophobic interaction and gel
  filtration, with an apparent complex mass near 130 kDa. Association evidence is distinct from proof
  that a separately expressed hydratase cannot function. [PMID:2681159]


  The fresh substrate pool was about 25% resistant to hydratase; after 90 minutes about 50% was resistant
  and about 70% of the original total pool remained, leaving about 30% uncharacterized decay. Mn2+ also
  accelerated spontaneous ketonization, motivating Mg2+ use in the assay. The resistant pool is not evidence
  that formal 2Z enol is inactive. [PMID:2681159]


  For the 1989 hydratase preparation in 10 mM Tris pH 7 and 3.3 mM MgSO4, Km was 30 micromolar and Vmax
  120 U/mg, with weak pH dependence from 5.8 to 7.5. These values retain the historical chemically mixed
  substrate and preparation scope. [PMID:2681159]


  Separately expressed XylJ retained activity: about 1 U/mg in cellular extracts and 4 U/mg after DEAE
  enrichment. Recombinant decarboxylase alone declined from 0.07 U/mg one hour after induction to below
  0.01 U/mg at two hours, eluted earlier than native complex and lost activity during hydrophobic chromatography.
  This 1989 XylJ-alone result is not replaced by later complex-specific assays. Decarboxylase DEAE elution
  was about 60 minutes versus 90 minutes for native complex. [PMID:2681159]


  The associated decarboxylase preferred the keto diacid and yielded about 90% dienol, potentially near
  100% after decay correction. This is oxidative-branch substrate-delivery context, not an extra step
  in the five-step hydrolytic route. [PMID:2681159]


  The 1989 paper cites the 1986 Duggleby/Williams hydrolase study for dienol production. Separation of
  hydrolase and hydratase was unpublished. Its own initial hydratase product could not be distinguished
  between hydroxy-keto and dihydroxy-enol forms; historical E/Z substrate geometry is likewise not resolved.
  [PMID:2681159]


  PKO1 chromosomal donor DNA was studied mainly in the heterologous P. aeruginosa PAO1.93 catA host. pRO1957
  carried a 26.5-kb insert. pRO1959 lacked the measured meta-cleavage activities and phenol/m-cresol growth
  in that context, while retaining upstream phenol hydroxylase. Thus the frozen shorthand “no enzyme activities”
  must not be read as absence of PHH. [PMID:1856161]


  The PKO1 hydrolase assay detected formate from ring-cleavage substrate generated with pWW0 XylE-containing
  PAO4032(pRO1940) extracts; formate was reduced to formaldehyde analytically. Hydratase substrate came
  from DL-allylglycine; aldolase substrate from alkaline hydrolysis of 4-methyl lactone, with a pyruvate/LDH/NADH
  readout. These analytical reagents do not become route metabolites or establish historical stereochemistry.
  [PMID:1856161]


  1991 deletion mapping supported the order tbuE-F-G-K-I-H-J, assigning catechol dioxygenase, semialdehyde
  hydrolase, semialdehyde dehydrogenase, aldolase, decarboxylase, isomerase and hydratase respectively.
  The tbuJ position was less precise, near a 6.7-kb SalI site. The terminal acylating dehydrogenase was
  not identified by this map; 1996 sequencing subsequently placed tbuW upstream of tbuE. [PMID:1856161]


  Table 2 measured induction and trans complementation in PAO1.93 clone combinations. pRO1957 was below
  activity-specific limits without inducer and expressed all measured activities with phenol. pRO1996
  showed partial constitutive expression; pRO2345 in trans restored phenol-responsive high activity. Numeric
  extract activities and detection bounds are retained in the claim ledger; PHH was not determined for
  pRO1996 combinations. In PHH/C23O/HMSH/HMSD/4OI/4OD/OEH/HOA order, phenol-induced pRO1957 activities
  were 180/230/14/19/581/74/622/21 mU/mg. The seven meta-enzyme values for pRO1996 were 44/3/4/98/10/114/3
  without inducer and 45/3/4/101/9/114/3 with phenol; adding pRO2345 with phenol gave 250/14/20/567/72/601/20.
  pRO1957 without inducer was below 10/10/0.1/0.1/10/0.1/10/0.1 mU/mg in the full eight-enzyme order.
  [PMID:1856161]


  The named tbuS locus restored regulation of the PKO1 meta-cleavage operon in trans; tbuR/phiR concerned
  upstream phenol hydroxylase and is not substituted for TbuS. Repression without inducer and activation
  with inducer are the authors’ genetic model. No verified issuing TbuS identifier or direct ligand/DNA
  binding evidence was obtained, so these findings remain named regulatory context. [PMID:1856161]


  Phenol and m-cresol induced the measured activities in the 1991 PAO1.93 clone assay. o-Cresol, p-cresol,
  catechol, 3-methylcatechol and 4-methylcatechol did not induce under the tested conditions. Noninduction
  is not enzyme inhibition or inability of induced enzyme to transform the compound. [PMID:1856161]


  In pRO1985 extracts, catechol/3-methylcatechol/4-methylcatechol activities were 254/245/248 mU/mg after
  phenol induction and 244/235/240 after m-cresol induction (at least three determinations). PAO1.93(pRO1996)
  growth with 0.05% methylcatechol and 0.005% phenol was reported without shown data. These are heterologous
  substrate-scope findings, not complete-route host occurrence. The corresponding current TbuE ENZRXN-11552
  native reaction pointer describes methylcatechol chemistry and is not identified with formal catechol
  RHEA:17338. [PMID:1856161]


  The inspected 2003 pages identify the DmpFG biological assembly as a roughly 140-kDa tetramer of two
  DmpFG heterodimers; one heterodimer is a catalytic pair. The crystal asymmetric unit contains two tetramers/four
  pairs. DmpG forms the core and DmpF lies peripherally; biological assembly, catalytic pair and crystal
  packing are different scopes. Structural chains A/C/E/G are DmpG and B/D/F/H are DmpF; AB/CD/EF/GH are
  catalytic pairs, while A–D and E–H are biological tetramers. Apparent subunit masses in that structural
  report are 37.5 and 32.5 kDa respectively. [PMID:12764229]


  The inspected crystal preparation used 2 mM NAD+ and 18% PEG rather than the earlier 15%; native and
  SeMet resolutions were 1.7 and 2.2 angstrom. Three DmpF chains were holo and one apo. Proposed CoA positioning
  and domain motion are structural interpretations, and NAD+ occupancy is not NADH stimulation evidence.
  Only pages 6992–6993 were read. [PMID:12764229]


  A 29-angstrom tunnel supports a channeling proposal. The introductory greater-than-20-fold stimulation
  and acetaldehyde Km greater than 50 mM were unpublished data; they are not promoted as independently
  inspected kinetic measurements. Later main-text pages were inaccessible, limiting assessment of the
  complete structural mechanism. [PMID:12764229]


  The 1995 XylF abstract supports hydrolysis of 3-alkylcatechol ring-cleavage products and a proposed
  Ser107-Asp228-His256 catalytic triad in an alpha/beta-hydrolase fold. The inspected abstract does not
  describe an unsubstituted catechol assay, initial product E/Z geometry, quantitative kinetic values
  or complete experimental construction. [PMID:7890778]


  The XylF F108M variant was reported to have increased thermostability and altered substrate preference.
  This engineered-variant claim is distinct from native XylF; magnitude and complete construct details
  remain inaccessible. [PMID:7890778]


  The 2004 abstract reports soluble E109Q and E111Q decarboxylase/hydratase complexes with retained hydratase
  but strongly reduced decarboxylase activity. Glu109/Glu111 metal-ligand roles were structure-based proposals.
  Complex-only wording is preparation-specific and does not overturn the 1989 single-XylJ activity result;
  exact mutant sequence/strain details were not available. [PMID:15301547]


  Fluorinated analogues inhibited 4-OT and YwhB, and E/Z fluorinated alkynes competitively inhibited the
  engineered E109Q complex. Exact inhibitor authority identities and complete mutant assignments are unresolved.
  The abstract’s “less potent” wording conflicts with its stated 5–633-fold lower Ki comparison; both
  remain unresolved. No native hydratase inhibition edge or native substrate E/Z assignment follows. [PMID:15301547]


  The 2007 YwhB abstract describes unknown physiological function and no obvious gene-context assignment.
  In vitro, 1,3-tautomerization exceeded 1,5 activity and P1A/R11A impaired reactions. This does not establish
  YwhB as a native catechol-route catalyst or Bacillus subtilis as a complete-route taxon. [PMID:17902707]


  In D2O, YwhB gave predominantly 3R products from two monoacids and 3S from a diacid; 4-OT gave a racemic
  3-deuterated diacid product. Native diacid preference and 4-OT’s 1,5 role are hypotheses. The near-stereospecific
  5S result belonged to prior work; main kinetic tables, isotope-product identities and methods were not
  obtained. The monoacids were named 2-hydroxy-2,4-pentadienoate and phenylenolpyruvate; the diacid was
  2-hydroxy-2,4-hexadienedioate, without an inferred native formal isomer assignment. [PMID:17902707]


  The 1990 abstract maps pWW0 genes in the order xylX-Y-Z-L-T-E-G-F-J-Q-K-I-H by E. coli maxicell expression.
  Product mass estimates and then-unknown xylT/xylQ functions are historical mapping context; the paper
  does not retrospectively assign XylQ an acylating-dehydrogenase function or prove one present-day host’s
  complete route. In that gene order, approximate product masses were 57/20/39/28/12/36/60/34/28/42/39/29/4
  kDa. [PMID:2183008]


  The 1986 publisher abstract describes PaW1 hydrolase as a 65-kDa protein with two equal subunits, N-terminal
  alanine, one cysteine per subunit, pI 4.7 and pH optimum near 7.5. Ketone-containing ring-fission substrates
  were preferred through higher Vmax rather than lower Km. Full initial-product evidence remains unavailable;
  no exact 2Z product assignment follows. Tested substrate scope included linear-chain alkylcatechol and
  4-chlorocatechol ring-cleavage products. [DOI:10.1099/00221287-132-3-717]


  The 1987 pWW0/NAH7 abstract supports shared gene order and evolutionary similarity, with reported nahH/xylE
  differences of 20% DNA and 16% protein. It is a different source from the 1986 Duggleby/Williams hydrolase
  study and does not independently resolve initial enol-versus-keto product chemistry. [PMID:3481421]


  The 1971 Azotobacter 4-oxalocrotonate paper was available only as bibliographic metadata. It remains
  an unread mechanistic lead; its citation by Rhea does not supply inspected primary product evidence.
  [PMID:4325686]


  The 2013 MhpF abstract reports an active E. coli monomer and catalytic properties independent of oligomeric
  state. Transthioesterification was rate-limiting, with efficiency reported 10,000-fold above a chemical
  model. This is preparation-level evidence, without complete construct details or complete E. coli catechol-route
  occurrence. [PMID:23237860]


  The native MhpF competitive acetaldehyde inhibition assertion (Ki 265000 micromolar, REG0-13116) is
  absent from the inspected primary abstract. It remains a native-only assertion; no primary verification
  of the mode, Ki or assay conditions is claimed. [PMID:23237860]


  The oxidative-branch isomerase also ketonized the five-carbon dienol in vitro (480 micromol/min/mg in
  10 mM potassium phosphate pH 7.3). For the diacid, spontaneous half-life was 6 minutes, Km 20 micromolar
  and Vmax 6000 U/mg. Buffer optima differed (Tris pH 7.5, MOPS/NaOH pH 6.5). Salt-dependent rates and
  a conflicting CaCl2 OCR row are retained as adjacent assay context, not hydratase or DmpG modulation.
  Table 2 isomerase rates (U/mg) were 4400 in 10 mM potassium phosphate, 2200 with 100 mM KCl, 1300 with
  100 mM NaCl, 840 in 100 mM phosphate, 1700 in 10 mM Tris and 1200 in Tris with 3.3 mM MgSO4. The CaCl2
  row’s extracted 100 U/mg and 20% conflict; its concentration also remains OCR-uncertain. [PMID:2681159]


  Decarboxylase Km was 15 micromolar for both substrate preparations; Vmax was 51 U/mg for spontaneous
  and 43 U/mg for isomerase-prepared substrate, with pH optimum 6.5. Mg2+ was required in that decarboxylase
  assay. Isomerase carryover could underestimate apparent Vmax; the Mg requirement is not transferred
  to DmpG. [PMID:2681159]


  Removing approximately 200 bp upstream of the 11.4-kb HindIII site abolished measured downstream activity
  even with pRO2345 complementation. With pRO2348, pRO1992 extracts had catechol dioxygenase activity
  246 mU/mg versus 234 for pRO2348 alone, while lower activities remained below detection and yellow semialdehyde
  accumulated. This supports a cis requirement without proving regulator binding. The deletion retained
  the 10.7-kb SphI coordinate. [PMID:1856161]


  The 1991 source renames phiA to tbuD and phiR to tbuR. Exact sequence successors close PKO1 TbuD as
  Q01551/AAA25992.1 (M98806.1 CDS83..2098) and TbuE as Q59220/AAC13787.1 (U20258.1 CDS608..1552), with
  exact deposited-CDS/protein/UniProt matches. Bounded issuing searches did not close TbuS, TbuR/phiR
  or tbuF/G/I/H identifiers. TbuD is upstream of the formal catechol route. The 1998 upstream tbuD regulation
  by TbuT does not prove TbuR=TbuT; the 1996 map lists tbuT, tbuR and tbuS separately. [PMID:1856161,
  PMID:1400204, PMID:9451833, PMID:8633871]


  The 1991 Table 1 derives pRO2345 by PstI cloning from pRO2346, whereas the results name pRO2347 as the
  parent of its 1.3-kb insert. Both source statements are retained, without inventing an exact clone sequence.
  The pRO2345 resistance-marker assignment also differs between 1991 and 1996 tables. These discrepancies
  do not negate the observed trans-complementation phenotype. [PMID:1856161, PMID:8633871]


  The 1996 paper identifies tbuW before tbuE and maps a transcript start 24 bp upstream of the paper’s
  tbuW ATG. Alternative sigma54-like promoter assignments have consensus/spacing conflicts; direct TbuS
  binding remained unresolved pending regulator sequencing and purification. In PAO1.93 constructs, oxygen-limited
  denitrification approximately doubled tbuE expression. An 18-nt upstream deletion or the PAO6261 anr
  background removed the enhancement; 74-nt deletion reduced expression by over 95%, and further deletions
  abolished it. Stationary cultures without nitrate lacked enhancement (data not shown), addressing growth-phase
  confounding. This does not identify a PKO1 ANR protein or establish direct binding. [PMID:8633871]


  For 1996 enzyme comparisons, the partially purified PKO1 TbuE preparation came from PAO1.93 carrying
  pRO1986 and pRO2345, while PaW1 enzyme came from PAO4032(pRO1940). Native W31/PKO1/CFS215 whole-cell
  nitrate-enhanced hypoxic toluene metabolism was a separate experiment. Comparative kinetic tables retain
  unnormalized OCR-ambiguous units; they do not establish five-step route occurrence for any expression
  host. TbuW function and TbuE active-site metal assignments were sequence-based proposals in this source,
  not direct repair or ligand-binding experiments. [PMID:8633871]'
