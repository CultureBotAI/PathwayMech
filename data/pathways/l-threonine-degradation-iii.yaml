id: MetaCyc:THRDLCTCAT-PWY
label: L-threonine degradation III (to methylglyoxal)
description: 'The complete native L-threonine degradation-III boundary contains three elementary events:
  NAD-dependent threonine oxidation, spontaneous decarboxylation of the unstable (2S)-2-amino-3-oxobutanoate,
  and aerobic aminoacetone oxidation to methylglyoxal. All 15 formal core chemical sides are retained.
  The composite RXN-14249 is not an additional event. The E. coli TynA terminal assignment is explicitly
  HYPOTHETICAL (EV-AS-NAS): microbial washed-cell aminoacetone-to-methylglyoxal/O2-consumption evidence
  came from an unnamed sewage isolate described as closely related to Arthrobacter globiformis, with no
  identified oxidase, exact strain accession or directly measured peroxide product. Tested E. coli W1485/SBD76
  preparations failed to grow on or measurably consume aminoacetone, and Serratia Sr41 work left subsequent
  aminoacetone metabolism unresolved. These bounded observations neither demonstrate the complete E. coli
  route nor prove its universal impossibility. Cytoplasmic Tdh and periplasmic TynA do not imply an established
  intervening aminoacetone transport mechanism.

  The Tdh homotetramer and His-tagged YiaY assay alternative have separate evidence. YiaY uses versioned
  382-residue AAB18566.1 as reference; the assayed full construct sequence was not reported and is not
  equated to current 383-residue P37686. Its reported glycine-auxotrophy phenotype conflicts with the
  cited Keio deletion result. Metal use is preparation and condition dependent: older one-zinc measurements
  versus the reviewed two-zinc annotation, zinc/cobalt/cadmium alternatives, newer iron/manganese activity,
  contradictory cadmium activity and inferred intracellular occupancy are retained. Dps/MntH/manganese
  protection concerns measured Tdh activity under peroxide stress, not demonstrated pathway flux.

  Separate uptake context includes inward SstT Na+/threonine and TdcC H+/threonine reactions, plus ATP-dependent
  LIV-I activity with all five native components and no invented threonine-specific ATP stoichiometry.
  TdcC anaerobic induction does not assert simultaneous oxygen-requiring terminal flux. SstT expression
  experiments used a reported Thr301 construct distinct from current Ala301; the separate purified 2002
  serine-uptake preparation carried a C-terminal eight-His tag. The current PathBank biosynthesis connection,
  downstream methylglyoxal degradation and parent superpathway are opaque interfaces/hierarchy; connected
  pathways are not expanded. Current PathBank and frozen 2019 definitions, neutral source forms and charged
  Rhea forms remain distinct.

  Lrp represses tdh in the inspected primary reporters despite positive native TU polarity; leucine induces
  tdh expression. LIV-I expression and transport responses depend on Lrp/leucine conditions. FeaR, FNR
  and NsrR edges describe conditional expression, not direct catalytic control. NsrR start-codon modification,
  FeaR domain-only binding assays, older anaerobic profiling versus newer reporter results, and named
  experimental derivative strains remain explicitly qualified. Native MG1655 reference identities do not
  relabel every historical assay as MG1655. This graph records a complete source-defined route with bounded
  uncertainty, not an experimentally reconstructed complete E. coli degradation system. The newer Nissle
  FeaR biosensor report is retained at abstract/native-annotation scope and is not treated as an MG1655
  full-length ligand-binding or aminoacetone-induction experiment.'
