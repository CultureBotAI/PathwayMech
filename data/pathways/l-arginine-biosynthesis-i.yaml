id: MetaCyc:ARGSYN-PWY
label: L-arginine biosynthesis I (via L-ornithine)
description: L-arginine biosynthesis I acetylates L-glutamate, reduces the phosphorylated acetylglutamate
  through N-acetyl-L-glutamate 5-semialdehyde, transaminates it to N(2)-acetyl-L-ornithine, deacetylates
  L-ornithine, and converts L-ornithine through L-citrulline and argininosuccinate to L-arginine.
pathway_type: amino-acid-biosynthesis
