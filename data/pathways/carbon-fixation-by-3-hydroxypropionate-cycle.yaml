id: GO:0043427
label: carbon fixation by 3-hydroxypropionate cycle
description: The complete first 3-hydroxypropionate cycle fixes two inorganic-carbon units into glyoxylate
  while regenerating acetyl-CoA. It includes all 13 objects listed in native MetaCyc PWY-5743 plus experimentally
  supported succinate oxidation and fumarate hydration omitted from that list. CO2/bicarbonate equilibration
  and the two protein-bound biotin half-reactions remain explicit; there is no duplicated overall acetyl-CoA
  carboxylation. The distinct second cycle that assimilates glyoxylate into pyruvate is outside this GO
  boundary. The primary whole-cycle experiments used Chloroflexus aurantiacus OK-70-fl/DSM636. Exact OK-70-fl
  MCR, PCS, Mcl and Smt sequences are distinguished from J-10-fl BC1 and current inferred CT/SDH annotations.
  BC1 has a fused BCCP domain and forms a tetramer; no whole-ACC stoichiometry is inferred. Current native
  MCR/Smt component cross-references refer to different J-10-fl sequences; the selected OK-70-fl components
  are independently grounded. PCS has an unresolved three-or-four-subunit native estimate. Physiological
  MCR metal preference and the SDH quinone species remain unresolved; Mg/Fe stimulation and artificial
  DCIP/PMS assays are not promoted to exact physiological assignments. The genome-paper fumarase locus
  Caur_1443 is currently annotated as aspartase, so fumarase chemistry is retained without an invented
  catalyst. Exact propionyl-CoA carboxylase, methylmalonyl-CoA epimerase and mutase isoform assignments
  likewise remain open. Native archaeal carboxylase CPLX-7545 and reductase MONOMER-13611 are excluded
  from bacterial protein attribution. Thus the complete chemical cycle is represented with visible protein-identity
  gaps, not a claim that every catalytic component or assembly has been experimentally fixed in a single
  strain.
pathway_type: carbon-fixation
