id: MetaCyc:ARO-PWY
label: chorismate biosynthesis I
description: >-
  Chorismate biosynthesis I converts D-erythrose 4-phosphate and
  phosphoenolpyruvate to chorismate through
  7-phospho-2-dehydro-3-deoxy-D-arabino-heptonate, 3-dehydroquinate,
  3-dehydroshikimate, shikimate,
  3-phosphoshikimate, and 5-O-(1-carboxyvinyl)-3-phosphoshikimate.
