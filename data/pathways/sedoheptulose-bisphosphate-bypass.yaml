id: MetaCyc:PWY0-1517
label: sedoheptulose bisphosphate bypass
description: 'This ATP-dependent two-event bypass converts sedoheptulose7-phosphate (S7P) through sedoheptulose1, 7-bisphosphate
  (SBP) to erythrose4-phosphate (E4P) and glycerone phosphate (DHAP). Exact Rhea chemistry is S7P + ATP -> SBP + ADP + H(+),
  followed by SBP -> E4P + DHAP. Native RXN0-6541 and SEDOBISALDOL-RXN map to directional RHEA31444 and cleavage30169; native
  30170 is bidirectional and 30168 is condensation. The generic S7P class is distinct from alpha-pyranose CPD-19339/CHEBI133984.
  PfkA is a native homotetramer and FbaA a homodimer, not the mixed PfkA/PfkB assembly suggested by the frozen PathBank component
  list. Reference P0A796/b3916 and P0AB71/b2925 and MG1655 GeneIDs948412/947415 anchor identity; off-taxon GeneIDs93777982/93779073
  belong to Shigella sonnei and are rejected. Database taxonomic range and reference identity do not establish unmodified
  wild-type flux in every strain. [EcoCyc:6PFK-1-CPX; EcoCyc:FRUCBISALD-CLASSII; EcoCyc:PWY0-1517; Entrez:947415; Entrez:948412;
  MetaCyc:CPD-19339; MetaCyc:D-SEDOHEPTULOSE-1-7-P2; MetaCyc:D-SEDOHEPTULOSE-7-P; MetaCyc:PWY0-1517; MetaCyc:RXN0-6541; MetaCyc:SEDOBISALDOL-RXN;
  PathBank:SMP0002110; RHEA:30169; RHEA:31444; UniProtKB:P0A796; UniProtKB:P0AB71]


  PMID19756045 studies BW25113 talA:tet/talB:Cm derivatives, not a sequenced MG1655 assay strain. The double deletion grows
  on xylose (doubling time110 min versus 100 min wild type); additional pfkA deletion abolishes this growth. deoBC, fbp and
  tpiA comparisons distinguish alternative routes, with the paper''s data-not-shown limitations retained. Growth screening,
  metabolomics and enzyme assays have distinct media/carbon concentrations. Cultures were at 37 °C, generally in MOPS medium;
  a common universal medium is not inferred. [PMID:19756045]


  The 2009 direct assay uses six-His ASKA PfkA/FbaA, 2 µM enzyme, 5 mM S7P or F6P, 2 mM ATP and 50 mM potassium MOPS at 37
  °C for 1 h (five samples). TableIII separates no-enzyme S7P 5.13±0.26 mM with products not detected; PfkA-only S7P 2.91±0.15/SBP
  1.15±0.13; both enzymes S7P 3.05±0.14/SBP 0.79±0.11/DHAP0.23±0.02/E4P0.39±0.03; FbaA-only S7P 5.27±0.17 with products not
  detected; and the F6P comparison yielding FBP/DHAP with E4P not determined. No authentic SBP standard was available: migration
  reasoning and F1, 6BP calibration were used. Results report m/z369.0 and Methods367.0, an unresolved internal discrepancy
  rather than a silently corrected observation. [PMID:19756045]


  The 2009 original supplementary workbooks retain S7P accumulation of about 45.67-fold on xylose and 101.63-fold on gluconate
  for the selected mutant/wild-type columns. The description of no notable transcriptional change differs from literal equality:
  fbaA ratio 1.18 and pfkA1.241 are retained. Isotopomer model fits support the bypass in tested talAB cells; with uptake
  normalized100, wild-type best-fit bypass values are small nonzero0.004/0.005 and the mutant both-pathway fit is about 29.923/29.181.
  These are model-specific relative fluxes. Some supplementary MFA equations label the SBP-cleavage product GAP/G3P rather
  than DHAP; direct products and Rhea define the chemistry, and no TPI event is added to repair a source model. [PMID:19756045]


  Supplementary Figure 8 of PMID19756045 uses the Lactococcus lactis pfk ORF in pTRC99A under a trc promoter to complement
  the E. coli talAB pfkA triple-mutant xylose phenotype (MOPS, 0.2% xylose, 1 mM IPTG). The donor strain/accession is not
  supplied. This is heterologous complementation, not native L. lactis complete-pathway flux or a reference-protein sequence
  assignment. [PMID:19756045]


  PMID31871051 reconstructs BW25113 talAB and measures xylose growth at 0.33±0.01 h−1 versus wild type 0.39±0.01 in M9; glucose
  values are0.52 versus 0.49 h−1. Its knockout Methods inconsistently mention pKD3 and pKD4. Orbitrap identification at 368.99
  [M-H]− with 199/271 fragments uses mutant extract as a control, not an authentic commercial SBP standard. SBP stability
  limits, a blank368.804 peak and trace wild-type xylose SBP remain explicit; metabolite detection does not measure wild-type
  bypass flux. Its PfkA BW25113_3916 in pET-28b(+), DH5α cloning, Rosetta expression and His-affinity purification is separate
  from the 2009 ASKA preparation. [PMID:31871051]


  The 2020 E. coli PfkA comparison at 55 °C reports F6P apparent Km 0.065 mM/kcat 1.2 s−1 versus S7P 2.5 mM/0.25 s−1. Tabulated
  S7P efficiency0.15×10^3 differs from arithmetic using the rounded values and is not replaced. The coupled assay includes
  Mg 5 mM, ATP 2 mM, ADP 0.25 mM, rabbit aldolase4 U/ml, G3PDH2 U/ml and NADH0.15 mM. S7P was supplied as a Ba salt; this
  reagent form is retained as assay context, not a new core species. No TPI was added; trace TPI is a suggested explanation
  for unequal downstream peaks, not a new E. coli core participant. The separately cited2020 thesis DOI10.18174/510683 chapter6
  supplement is not asserted byte-identical to the inaccessible journal supplement. PDF137 FigureS1 is a no-enzyme control;
  PDF140 FigureS4 shows both Michaelis–Menten S7P Km 2.489181822 mM and Hill K1/2=1.24179394 mM, n=1.603138135. Raw Vmax in
  dAbs/min is not kcat, and the fit comparison does not establish physiological bypass cooperativity. [DOI:10.18174/510683;
  PMID:31871051]


  The clostridial PPi-dependent six-event MetaCycPWY-8178 definition is a separate pathway. Added rabbit aldolase in the 2020
  coupling assay does not characterize a particular native clostridial aldolase. C. thermosuccinogenes ATP/GTP-PFK CDQ83_07225
  showed no S7P activity up to 4 mM; its F6P ammonium dependence, very high Hill coefficient and proposed relief-valve role
  concern another enzyme and remain a hypothesis. The later engineered-clostridial LL1660 result (PMID36286488) removes both
  PPi-pfk and introduced TAL, limiting claims of universal necessity; the alternative C6↔C5 route remains unresolved. That
  result does not refute the E. coli ATP bypass assays. [MetaCyc:PWY-8178; MetaCyc:RXN-21730; PMID:31871051; PMID:36286488]


  PfkA annotation supports Mg dependence, homotetramer and cytoplasmic location. Canonical F6P-dependent activity is inhibited
  by PEP and activated by ADP/GDP; F6P has a cooperative substrate response whereas ATP does not in the cited native context.
  These signs, the >90% contribution to wild-type canonical PFK activity, pH effects and in-vitro reverse activity are not
  direct measurements of S7P regulation or whole-pathway flux. S7P turnover and F6P turnover are separate substrate contexts.
  [EcoCyc:6PFK-1-CPX; EcoCyc:6PFRUCTPHOS-ENZRXN; EcoCyc:REG0-7473; EcoCyc:REG0-7474; EcoCyc:REG0-7475; EcoCyc:REG0-7476; UniProtKB:P0A796]


  FbaA is a cytosolic class-II metal-dependent dimer. Native location/GO annotation is independent of SUBUNIT text. Two Zn
  sites per subunit (catalytic and structural) in the current annotation differ from the older PMID8436219 abstract''s two
  Zn per dimer. The 2011 study (PMID22014167;2012 issue) separates untagged MG1655/pLEM1/pWKS30 material≥70% pure from pLEM5/pET28b
  His 6 WT and site mutants≥95% pure. As-purified metal content was up to 0.3 Zn/0.2 Ni per monomer; denaturation-assisted
  Zn loading produced2.3 Zn per monomer and 3.8-fold higher activity. Source numbering follows removed initiating methionine:
  His 110/226/264 catalytic ligands and Asp144/Glu174/Glu181 secondary-site ligands; historical His 108/111 is not silently
  renumbered. Native Co/Fe/Mn active metalloprotein alternatives are distinct from additive metal effects. Ni inhibits, Cu2+
  strongly inhibits in vitro, low Zn slightly activates/high Zn slightly inhibits, Co slightly activates, and Ca/Mg/Mn had
  no effect in the measured preparation. Cytoplasmic copper is mainly cuprous, limiting physiological Cu2+ claims. Native
  K/ammonium activation cites personal communication in 1996; Ni/EDTA effects and earlier Crookes preparations remain source
  qualified. [EcoCyc:F16ALDOLASE-ENZRXN-CLASSII; EcoCyc:FRUCBISALD-CLASSII; EcoCyc:FRUCTBISALD-CLASSII-MONOMER; EcoCyc:REG0-12167;
  EcoCyc:REG0-12168; EcoCyc:REG0-12169; EcoCyc:REG0-8470; PMID:22014167; PMID:6996735; PMID:8436219; UniProtKB:P0AB71]


  In PMID22014167, untagged FbaA 20 nM challenged with Ni 16 µM is protected by His 100 µM (about 20% loss instead of 70%);
  GSH 1 mM enhances Ni inhibition. These are conditional activity effects relative to Ni-only challenge, not generic ligand
  activation/inhibition or direct FbaA binding. The rcnA/gshA comparisons and D 144A/E174A resistance support contributions
  of cellular ligands and the secondary metal site without uniquely proving a Ni-delivery mechanism. Source-native His/GSH
  formula, charge and InChI ground selected reference chemical identities, while the assay ionic form remains unstated; inconsistent
  native CML SMILES is retained as a conflict. MG1655 growth inhibition at 8 µM Ni depends on carbon source (glucose/fructose
  versus glycerol/lactate/succinate), is bacteriostatic, and FbaA activity recovers after Ni removal even with translation
  inhibited. Active versus passive repair remains unresolved. [PMID:22014167]


  UniProt FUNCTION text names GAP+E4P for SBP cleavage whereas its structured reaction and the 2009 direct assay support DHAP+E4P.
  Abstract-level PMID7872790 supports carbonyl substrate forms, Zn-dependent enediol(ate)-DHAP chemistry and pH effects; Cd
  replacement structures (PMID12595741) do not prove a physiological Cd cofactor or inhibition. Earlier phosphate-associated
  labeling (PMID3281666) and the later +76-Da mercaptoethanol adduct at source Cys36 (PMID7851430) concern different preparations;
  the latter ruled out phosphorylation and found no significant activity effect. Later phosphoproteome annotation (PMID35636362)
  does not reconcile these as a single constitutively modified active chain. Synthetic N-sulfonyl hydroxamate phosphate inhibitors
  and weaker phosphonate isosteres (PMID16236509) are bounded canonical-FBP context without an invented exact inhibitor identity.
  [EcoCyc:FRUCBISALD-CLASSII; PMID:12595741; PMID:16236509; PMID:19756045; PMID:3281666; PMID:35636362; PMID:7851430; PMID:7872790;
  UniProtKB:P0AB71]


  PMID31464375 uses His-tagged ASKA proteins (>90% purity;0.1 mM IPTG, 16 h at 37 °C, TALON purification). The 2019 NMR assay
  (15 µM monomer equivalent, 200 µM metabolites, 298 K; RF threshold0.1805/FPR5%) lists eleven FbaA binders:3PG, 6PG, AMP,
  ATP, citrate, GTP, malonate, NADP, PEP, PRPP and phenylpyruvate; six PfkA binders are AMP, CTP, FAD, FBP, GTP and NAD. These
  observations have no assigned causal sign merely from binding. The 2016 NMR paper PMID27065204 remains abstract/native scope;
  different buffers and thresholds limit direct comparison of binder sets. [PMID:27065204; PMID:31464375]


  The 2019 direct FbaA assay uses canonical FBP 1 mM, Tris10 mM pH7.5/Mg 1 mM at 30 °C,≈1 µM enzyme monomer equivalent, modifiers5
  mM (hypoxanthine3.22 mM), triplicate activities and quadruplicate mixture-specific MS calibration. ATP, 3PG and PEP activate;
  hypoxanthine and IMP have no effect. MS combines same-mass DHAP/GAP signals. ATP is within the cited physiological range,
  whereas 3PG/PEP are above it. The source reports prior3PG inhibition, while the 1995 abstract PMID7872790 reports no effect
  from glycolytic intermediates/ATP. These source/assay-specific outcomes remain separate, and the appendix''s generic inhibitor
  caption does not reverse measured activation. None directly measures SBP cleavage regulation. [PMID:31464375; PMID:7872790]


  Cra/FruR native PC00061 is a tetramer; the 1994 pT7-5 six-His assembly/ace-operator preparation (PMID8195118) differs from
  1996 six-His binding-site/pfkA work (PMID8858581). Native pfkA regulatory records share siteBS785, and epd promoter records
  share BS264; epd-pgk-fbaA operon membership carries the fbaA expression interpretation. Cra-CPLX127 includes a native beta-D-fructofuranose1P
  component without a supplied ligand coefficient. Generic F1P assay identity is not assigned the native beta anomer. The
  2018 abstract PMID29923648 reports F1P-dependent impairment of Cra DNA binding and negative FBP binding/effect tests, contrasting
  older FBP-effector discussion and the contaminant explanation in PMID30019355. Full2018 methods were unavailable. The 2021
  Cra Asn50 cleavage/NTD behavior (PMID34666048) is a later preparation context, not proof that earlier specimens were cleaved.
  [EcoCyc:CPLX-127; EcoCyc:D-fructofuranose-1-phosphate; EcoCyc:FRU1P; EcoCyc:PC00061; EcoCyc:PD00521; EcoCyc:REG0-15081;
  EcoCyc:REG0-15233; EcoCyc:REG0-4838; EcoCyc:REG0-5630; PMID:19838295; PMID:29923648; PMID:30019355; PMID:34666048; PMID:8195118;
  PMID:8577250; PMID:8858581]


  Native CRP-cAMP CPLX0-226 contains CRP dimerPC00004 and cAMP; PC00004 has two P0ACJ8 chains, but ligand stoichiometry is
  not supplied. Positive epd-pgk-fbaA regulation is limited by the 1998 PMID9851989 abstract: deleting the CRP site had little
  effect under glucose whereas crp/cya loss strongly reduced epd/gapB P0, supporting an indirect response. PtsG-encoded IICBGlc
  contributes to glucose stimulation of that promoter. It is distinct from crr/EIIAGlc, does not establish a direct fbaA operator
  and is not a pathway-specific S7P transporter. [EcoCyc:CAMP; EcoCyc:CPLX0-226; EcoCyc:PC00004; EcoCyc:PD00257; EcoCyc:REG0-15234;
  EcoCyc:REG0-5629; Entrez:945295; Entrez:945651; PMID:9851989; UniProtKB:P0A9A9; UniProtKB:P0A9E5; UniProtKB:P13445; UniProtKB:P69783;
  UniProtKB:P69786; UniProtKB:P69913]


  PMID19838295 compares JM101-derived PB11/PB12 ΔptsH ptsI crr backgrounds and rpoS derivatives under aerobic M9 glucose conditions,
  distinct from BW25113 talAB. Its pET28b+/ER2566 His-RpoS or His-RpoD combined with commercial RNAP core at core:sigma1:5
  supports direct transcription of the first pfkA promoter. A sigma chain is not an autonomous polymerase. fbaA expression
  is condition-specific and can be operon-mediated; no immediate fbaA promoter was found in the tested analysis, which is
  not general promoter absence. Original MG1665 and pykA/pfkA-label discrepancies remain source errors rather than reference-strain
  reassignments. PMID16102000 abstract describes epd-pgk-fbaA cotranscription, RNaseE cleavage and segment stability without
  a uniquely determined signed RNaseE effect on FbaA catalysis. [PMID:16102000; PMID:19838295]


  The csrA51 hypomorph in M9 glucose has reduced PfkA expression and partial growth/stress rescue after PfkA restoration (PMID26833659
  plus native annotation). This is positive expression context, not a clean csrA deletion or a mapped direct RNA-binding site.
  Acid-associated pfkA response under aerobic but not microaerobic conditions is retained at abstract/native scope (PMID23274360),
  without assigning an unmeasured PhoB binding mechanism. [EcoCyc:6PFK-1-CPX; EcoCyc:TU0-45239; Entrez:947176; PMID:23274360;
  PMID:26833659]


  PMID21272324 uses BW25113 Keio cyoA(JW0422), cydB(JW0723), fnr(sourceJW1318) and fur(JW0669) deletions in continuous aerobic
  culture (D 0.2 h−1, 37 °C, pH7, DO35–40%; C/N 1.68 or8.42). RT-PCR, with source controls, reports increased pfkA expression
  in the relevant deletion comparisons, amid broad network changes. Negative reference-associated effects are therefore qualified
  indirect knockout inferences, not direct pfkA binding. The source Fnr gene contrast under oxygen does not identify a purified
  anaerobic [4Fe-4S] active species, and CyoA/CydB reference chains do not autonomously reproduce their respiratory complexes.
  Exact subject-reference genes and the pfkA object gene are separately grounded. [Entrez:945295; Entrez:945651; Entrez:945908;
  PMID:21272324; UniProtKB:P0ABJ1; UniProtKB:P0ABK2]


  Frozen PathBank memberPW002098.owl/rootSMP0002110 attaches Pentose PhosphateSMP0121065 (S7P-input/E4P-output context) and
  Glycolysis and Pyruvate DehydrogenaseSMP0000807 (DHAP-output context). Their generic Interaction markers are unsigned structural
  membership, not transport or inhibition. Exact local compounds remain separate from Rhea: neutral S7P/E4P and a DHAP dilithium
  salt C3H5Li2O6P are not merged into anions. The frozen neutral ATP/ADP/SBP forms and erroneous PfkB inclusion are explicit
  source conflicts. The original wholeZIP/member/root provenance is retained, with no live per-pathway download claim. [PathBank:SMP0002110]


  The Calvin-cycle and riboneogenesis condensation E4P+DHAP->SBP and subsequent SBP hydrolysis have different direction and
  energy chemistry. Classical PPP transaldolase uses S7P+GAP, while ADP-heptose formation isomerizes S7P. The ATP-dependent
  phosphorylation/cleavage pair is distinct from those routes and from the six-event PPi branch; shared metabolites and earlier
  research mentions do not merge the pathway definitions.


  Native PfkA sequence-based NAD-kinase prediction, antisense/production engineering, altered carbon-catabolite repression
  and enzyme allostery studies are neighboring enzyme contexts, not additional bypass reactions. FbaA ts8/h8, RNA/engineered
  substrate variants and broader physiological annotations likewise do not demonstrate more steps in this pathway. Physical
  substrate channeling discussed speculatively in older work is not a demonstrated multienzyme complex. Older unavailable
  primary bodies remain explicitly abstract/native-annotation evidence. [EcoCyc:6PFK-1-CPX; EcoCyc:FRUCBISALD-CLASSII; PMID:7872790]'
