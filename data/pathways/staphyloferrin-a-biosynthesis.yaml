id: MetaCyc:PWY-7990
label: staphyloferrin A biosynthesis
description: 'Complete three-transformation staphyloferrin A biosynthesis scoped to Staphylococcus aureus
  Newman: L-ornithine racemization supplies D-ornithine, followed by the ordered SfaD and SfaB citrate
  ligations. The selected racemization direction is pathway flux; native MetaCyc and KEGG describe the
  reversible reaction. SfaC/NWMN_2079 activity remains inferred from locus function, sequence-family evidence
  and the native assignment, not an isolated Newman enzyme assay. Its PLP relation is an automatic annotation
  transferred through exact sequence equality, not a direct binding measurement. Newman SfaB and SfaD
  coding regions were used in the inspected 2010 recombinant preparation; full engineered construct sequences
  and native assembly states are unresolved. The 2009 Cotton evidence for ordered individual ligations
  was inspected as an abstract only. Current NCTC 8325 annotations inform reaction identity: SfaB is sequence-identical
  to the selected Newman protein, whereas SfaD differs at residue 532 and is not treated as the same protein.
  The native ligase Mg2+ assertions are retained as qualified curated cofactor assignments rather than
  a unique physiological metal or binding stoichiometry. Current Rhea/ChEBI chemistry specifies the N5-(S)-citryl
  intermediate and N2-(R),N5-(S)-citryl product, whereas native CPD-21047 and CPD-12589 leave the citryl
  centers unspecified. The inspected 2010 ferric receptor-bound structure supports final N2 R/N5 S stereochemistry;
  it does not directly establish the free intermediate''s stereochemistry or the selected free ionic forms.
  These forms remain explicit current chemical-authority conventions, without exact native-compound equivalence.
  Iron/Fur-dependent transcription is reported as context; transport, ferric loading, uptake, citrate
  production and the distinct staphyloferrin B route lie outside this complete biosynthetic boundary.'
