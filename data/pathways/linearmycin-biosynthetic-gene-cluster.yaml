id: MIBiG:BGC0002072
label: linearmycin A and related metabolites biosynthetic gene cluster
description: The Streptomyces sp. Mg1 linearmycin gene cluster produces linearmycins A, B and C. Deletion
  and complementation establish LnyI as required for production. The graph records experimentally observed
  products and genetic dependence; detailed starter-unit chemistry and modular chain-extension assignments
  remain proposed.
