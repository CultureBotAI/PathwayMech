id: MetaCyc:PWY0-1471
label: uracil degradation III
description: The complete Rut chemical route converts uracil to two ammonium ions, carbon dioxide and
  3-hydroxypropionate, with FMN recycling. This E. coli K-12 reconstruction updates the older MetaCyc
  peracid model using measured RutA/RutF, RutB, RutC and YdfG activities. RutA is represented by the current
  net reaction, including spontaneous NADH reduction of its flavin-N5-oxide product; enzyme-bound intermediates
  are not separate pathway metabolites. RutC is a homotrimer that accelerates 3-aminoacrylate deamination,
  which also occurs spontaneously. Carbamate decay is spontaneous; the proposed RutD contribution remains
  unmeasured. YdfG provides directly demonstrated terminal reduction, while the alternative RutE assignment
  and its FMN cofactor remain qualified predictions. NCM3722 and derivative experiments establish nitrogen
  utilization near room temperature, not unrestricted growth at 37°C or carbon assimilation. The 2021
  polarity controls show that RutC and RutD are not essential under the tested conditions. Upstream transport
  and nucleoside cleavage, thymine catabolism and regulatory circuitry are outside this uracil-route boundary.
pathway_type: uracil-catabolism-rut-pathway
