id: MetaCyc:LEUSYN-PWY
label: L-leucine biosynthesis
description: L-leucine biosynthesis extends 3-methyl-2-oxobutanoate with acetyl-CoA to (2S)-2-isopropylmalate,
  isomerizes it to (2R,3S)-3-isopropylmalate, oxidatively decarboxylates that intermediate to 4-methyl-2-oxopentanoate,
  and transaminates it to L-leucine.
