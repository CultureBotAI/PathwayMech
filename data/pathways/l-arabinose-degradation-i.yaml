id: MetaCyc:ARABCAT-PWY
label: L-arabinose degradation I
description: L-arabinose degradation I isomerizes beta-L-arabinopyranose to L-ribulose, phosphorylates L-ribulose with ATP to form L-ribulose 5-phosphate, and epimerizes that phosphoketose to D-xylulose 5-phosphate for entry into pentose phosphate metabolism.
