id: PathBank:SMP0000991
label: 'Secondary Metabolites: Isoprenoid Biosynthesis (Nonmevalonate Pathway)'
description: 'PathBank primary BioPAX pathway SMP0000991 (archive member PW000975.owl) representing the
  Escherichia coli methylerythritol 4-phosphate (MEP / non-mevalonate) isoprenoid precursor biosynthetic
  pathway from D-glyceraldehyde 3-phosphate (CHEBI:59776) and pyruvate (CHEBI:15361) to isopentenyl diphosphate
  (IPP, CHEBI:128769) and dimethylallyl diphosphate (DMAPP, CHEBI:57623). Nine enzymatic activities catalyzed
  by eight E. coli K-12 enzymes convert D-glyceraldehyde 3-phosphate and pyruvate via 1-deoxy-D-xylulose-5-phosphate
  synthase Dxs (UniProtKB:P77488, homodimer PathBank:SMP0000991/ProteinComplex/3831, RHEA:12606), 1-deoxy-D-xylulose
  5-phosphate reductoisomerase Dxr (UniProtKB:P45568, homodimer PathBank:SMP0000991/ProteinComplex/3809,
  RHEA:13719), 2-C-methyl-D-erythritol 4-phosphate cytidylyltransferase IspD (UniProtKB:Q46893, homodimer
  PathBank:SMP0000991/ProteinComplex/3810, RHEA:13430), 4-diphosphocytidyl-2-C-methyl-D-erythritol kinase
  IspE (UniProtKB:P62615, homodimer PathBank:SMP0000991/ProteinComplex/3811, RHEA:18438), 2-C-methyl-D-erythritol
  2,4-cyclodiphosphate synthase IspF (UniProtKB:P62617, homotrimer PathBank:SMP0000991/ProteinComplex/3812,
  RHEA:23865), [4Fe-4S] 4-hydroxy-3-methylbut-2-en-1-yl diphosphate synthase IspG (UniProtKB:P62620, RHEA:43606),
  [4Fe-4S] 4-hydroxy-3-methylbut-2-enyl diphosphate reductase IspH (UniProtKB:P62623, homodimer PathBank:SMP0000991/ProteinComplex/3814,
  branching to IPP via RHEA:24490 and to DMAPP via RHEA:24827), and isopentenyl-diphosphate Delta-isomerase
  Idi (UniProtKB:Q46822, RHEA:23285). Three upstream PW000975.owl BioPAX serialization defects and one
  taxon-annotation discrepancy are resolved explicitly: (1) BiochemicalReaction Reactions/3713 omits co-substrate
  pyruvate (CHEBI:15361) from bp:left, which is supplied by balanced RHEA:12606 and UniProtKB:P77488;
  (2) BiochemicalReactions Reactions/3692, Reactions/3693, and Reactions/3694 record ParticipantStoichiometry
  1.0 for H(+) (CHEBI:15378) and substitute NADPH/NADP (with Reactions/3693 also listing Compound/PW_C000103
  NADPH on bp:right while its bp:name states NADP) for the physiological [2Fe-2S] ferredoxin/flavodoxin
  electron donor of E. coli IspG/IspH (PMID:11818558, PMID:12571359), so this record models the balanced
  Rhea chemical-side conversions with H(+) coefficient 2 and omits generic electron-carrier state classes;
  and (3) ProteinReference/6814 (UniProt_Q46822) in PW000975.owl carries a generic BioSource NCBITaxon:2
  (Bacteria) rather than BioSource/3 (NCBITaxon:562), whereas its referenced UniProtKB:Q46822 entry is
  the E. coli K-12 enzyme.'
