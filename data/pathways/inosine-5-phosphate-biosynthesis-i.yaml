id: MetaCyc:PWY-6123
label: inosine-5'-phosphate biosynthesis I
description: Inosine-5'-phosphate biosynthesis I carboxylates 5-amino-1-(5-phospho-beta-D-ribosyl)imidazole via the bacterial N5-CAIR route, ligates the resulting carboxylate to L-aspartate, releases fumarate to form AICAR, formylates AICAR with 10-formyltetrahydrofolate, and cyclizes FAICAR to IMP.
pathway_type: nucleotide-biosynthesis
