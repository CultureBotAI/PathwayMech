id: MetaCyc:PWY0-1241
label: ADP-L-glycero-beta-D-manno-heptose biosynthesis
description: The complete five-reaction MetaCyc route converts sedoheptulose 7-phosphate to ADP-L-glycero-beta-D-manno-heptose
  using GmhA, the two activities of HldE, GmhB and HldD. The selected proteins are E. coli K-12; native
  complexes are MG1655 assignments. The 2002 HldE/GmhB experiments used K-12 gene products with an Aneurinibacillus
  GmhA reagent, whereas later GmhA work directly examines E. coli. Current Rhea represents GmhA as two
  substrate molecules giving one alpha and one beta heptose 7-phosphate; both products and the coefficient
  are retained, without asserting an experimentally fixed 1:1 physiological product ratio. Only the beta
  branch continues to ADP-heptose. GmhA, HldE and HldD are represented by source-defined tetramer, dimer
  and pentamer assemblies; GmhB is monomeric. GmhA zinc is a similarity-based annotation. GmhB catalytic
  magnesium and manganese/cobalt alternatives are distinguished from its bound zinc loop site, whose physiological
  role remains unresolved. HldD recycles bound NADP during epimerization; NAD is a lower-activity substitute,
  not an additional required cofactor. Sedoheptulose generation, alpha-GDP-heptose synthesis, LPS incorporation
  and host sensing are outside this native boundary. No obligatory growth phenotype, universal strain
  activity or compensating GmhB phosphatase is inferred.
