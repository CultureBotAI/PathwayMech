id: GO:0019618
label: protocatechuate catabolic process, ortho-cleavage
description: The complete four-reaction ortho-cleavage branch converts protocatechuate to 3-oxoadipate
  through 3-carboxy-cis,cis-muconate, the R carboxymuconolactone and 3-oxoadipate enol-lactone. The selected
  Pseudomonas putida machinery retains historical native enzyme identities and assembly limitations; it
  does not assert occurrence in every strain. The exact native cycloisomerase preserves a stereospecific
  product absent from its Rhea cross-reference. Terminal CoA transfer and thiolysis belong to the separate
  downstream pathway.
pathway_type: aromatic-compound-catabolism
