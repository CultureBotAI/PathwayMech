id: MIBiG:BGC0000194
label: actinorhodin biosynthetic gene cluster
description: 'Actinorhodin biosynthetic gene cluster of Streptomyces coelicolor A3(2). This bounded graph
  records the annotated actI polyketide-synthase components and their genetic participation, not a complete
  reaction sequence or individual enzyme sufficiency. MIBiG source assessments: status="active"; quality="questionable";
  completeness="complete". The source completeness label describes the locus; this graph is partial. Product
  identity is retained as a source name only because inspected chemical authorities require reconciliation.'
