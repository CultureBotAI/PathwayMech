id: PathBank:SMP0002057
label: Tetrahydromonapterin Biosynthesis
description: 'PathBank SMP0002057 (native BioPAX archive member PW002043.owl, PathWhiz PW002043) models
  Escherichia coli tetrahydromonapterin biosynthesis across two experimentally supported modules and an
  unresolved intervening dephosphorylation step: (1) hydrolytic ring expansion of GTP(4-) and water to
  7,8-dihydroneopterin 3''-triphosphate(4-), formate, and H(+) (Reactions/3396, displayName 3.5.4.16,
  normalized to RHEA:17474 in the left_to_right direction) catalyzed by the homodecameric GTP cyclohydrolase
  I complex FolE (PathBank:SMP0002057/ProteinComplex/3628, ten copies of Protein/6012 cross-referenced
  to UniProtKB:P0A6T5, with one catalytic Zn(2+) ion CHEBI:29105 per subunit); (2) reversible C2'' epimerization
  of 7,8-dihydroneopterin 3''-triphosphate(4-) to 7,8-dihydromonapterin 3-triphosphate(4-) (Reactions/5965,
  displayName 5.-.-.-, normalized in its monapterin-forming biosynthetic direction to RHEA:28347 left_to_right)
  catalyzed by the homooctameric dihydroneopterin triphosphate 2''-epimerase complex FolX (PathBank:SMP0002057/ProteinComplex/4014,
  eight copies of Protein/6195 cross-referenced to UniProtKB:P0AC19); and (3) NADPH-dependent reduction
  of unphosphorylated 7,8-dihydromonapterin (CHEBI:71175) with H(+) to tetrahydromonapterin (CHEBI:71177)
  and NADP(3-) (Reactions/5967, normalized to RHEA:34848 in the left_to_right direction) catalyzed by
  dihydromonapterin reductase FolM (Protein/6277, UniProtKB:P0AFS3).


  In native PW002043.owl, BiochemicalPathwayStep PathwayEnzymeReaction/22294 wraps Reactions/5966 (Dihydromonapterin-triphosphate
  + 3 Water -> Dihydromethysticin + 2 Hydrogen Ion + 3 Phosphate) without any stepProcess or Catalysis
  controller, and both Reactions/5966 and Reactions/5967 erroneously substitute the plant kavalactone
  Compound/PW_C011995 (Dihydromethysticin, C15H16O5, ChEBI_CHEBI_1034670 / KEGG_Compound_C09926) for 7,8-dihydromonapterin
  (CHEBI:71175, C9H13N5O4). Because the intervening dephosphorylation mechanism and phosphatase catalyst
  between 7,8-dihydromonapterin 3-triphosphate(4-) (CHEBI:61186) and 7,8-dihydromonapterin (CHEBI:71175)
  remain unresolved in Escherichia coli (PMID:19897652), uncatalyzed Reactions/5966 and the erroneous
  Dihydromethysticin placeholder are excluded from asserted reactions and mechanistic_edges, and no provides_input_for
  edge bridges RHEA:28347 to RHEA:34848. Native PW002043.owl encodes species-level Escherichia coli (NCBITaxon:562)
  without cellularLocation annotations on participants, while the reviewed UniProtKB proteins and primary
  biochemical, structural, and genetic complementation studies refer to Escherichia coli K-12 (NCBITaxon:83333).
  Neutral/parent ChEBI cross-references in PW002043.owl (CHEBI:15996 -> CHEBI:37565, CHEBI:30751 -> CHEBI:15740,
  CHEBI:16474 -> CHEBI:57783, CHEBI:18009 -> CHEBI:58349) and unlinked pterin intermediates (Compound/PW_C042912
  -> CHEBI:58462, Compound/PW_C041451 -> CHEBI:61186, Compound/PW_C041607 -> CHEBI:71177) are normalized
  to Rhea pH 7.3 major microspecies.'
