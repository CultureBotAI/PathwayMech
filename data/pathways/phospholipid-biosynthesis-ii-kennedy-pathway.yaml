id: gomodel:YeastPathways_PWY3O-259
label: phospholipid biosynthesis II (Kennedy pathway)
description: Phospholipid biosynthesis II (Kennedy pathway) in Saccharomyces cerevisiae S288C phosphorylates ethanolaminium to O-phosphonatoethanaminium, converts that intermediate and CTP to CDP-ethanolamine, and transfers phosphoethanolamine from CDP-ethanolamine to 1,2-diacyl-sn-glycerol to form phosphatidylethanolamine.
pathway_type: lipid-biosynthesis
