id: MetaCyc:PROSYN-PWY
label: L-proline biosynthesis I (from L-glutamate)
description: L-proline biosynthesis I phosphorylates L-glutamate to L-glutamyl 5-phosphate, reduces it
  to L-glutamate 5-semialdehyde, cyclizes that intermediate to (S)-1-pyrroline-5-carboxylate, and reduces
  it to L-proline.
pathway_type: amino-acid-biosynthesis
