id: MetaCyc:PWY1-3
label: polyhydroxybutanoate biosynthesis
description: 'The core PhaA-PhaB-PhaC route in Cupriavidus necator H16 (called Ralstonia eutropha or Alcaligenes
  eutrophus H16 in the primary literature) condenses two acetyl-CoA molecules, reduces acetoacetyl-CoA
  with NADPH to (R)-3-hydroxybutanoyl-CoA, and extends poly[(R)-3-hydroxybutanoate] by one monomer with
  release of CoA. The graph represents the biosynthetic direction and the core phaCAB enzymes, not every
  alternative H16 isoenzyme. The polymer node is a chemical class: its input and output edges distinguish
  chains of length n and n+1 in their descriptions; they are not the same physical chain state.'
pathway_type: storage-polymer-biosynthesis
