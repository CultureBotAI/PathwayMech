id: MetaCyc:GLCMANNANAUT-PWY
label: superpathway of N-acetylglucosamine, N-acetylmannosamine and N-acetylneuraminate degradation
description: 'Complete META 27.0 two-child, six-core-reaction amino-sugar degradation pathway, scoped
  here to E. coli K-12 evidence. NanQ ring opening feeds NanA, NanK and NanE, then NagA and NagB produce
  fructose 6-phosphate; alpha ring opening is a supported alternative. Neu5Ac/NanT, ManNAc/ManXYZ PTS
  and GlcNAc/NagE or ManXYZ PTS supply the three entry contexts. Native assemblies, alternative metal
  cofactors and transcriptional control are retained. Ser1-NagB regulatory assays carry explicit construct
  qualifiers. Generic transport pools and anomer-specific core species remain distinct. BiGG ManNAc identities
  retain their native model scope: the substrate InChIKey conflicts with ChEBI:17122, so no exact cross-database
  alias or intervening stereochemical conversion is asserted. The coupled ManNAc PTS and shared PTS phosphorylation
  reaction are overlapping descriptions, not additive net stoichiometry. The glycolysis link is an opaque
  downstream interface. PathBank SMP0002044 is a related conflicting definition lacking NanQ, not an exact
  identifier synonym.'
pathway_type: carbohydrate-degradation
