id: MIBiG:BGC0000829
label: Chromobacterium violaceum violacein biosynthetic gene cluster
description: Literature-refined cluster scope from C. violaceum JCM 1249 (ATCC 12472), using the experimentally
  studied AB032799.1 locus. The active MIBiG entry points to AF172851.1; retired BGC0000828 points to
  AB032799.1 and explicitly merges into BGC0000829. The four AB proteins differ from the AF proteins and
  are not equated. VioE is independently sequence-resolved in the unannotated AB locus region. This graph
  records five gene-product contributions and observed violacein output, including subsequent spontaneous
  chemistry; it does not assign all final chemistry to enzymes or assert elementary reactions. Native
  MIBiG quality remains questionable.
