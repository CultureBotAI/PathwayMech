id: MetaCyc:P121-PWY
label: adenine and adenosine salvage I
description: The complete two-reaction pathway converts adenosine to AMP through adenine. The E. coli
  K-12 DeoD homohexamer phosphorolyzes adenosine to adenine and alpha-D-ribose 1-phosphate; the Apt homodimer
  transfers phosphoribosyl from supplied PRPP to adenine, forming AMP and diphosphate. This is the phosphorolysis
  route defined by P121-PWY, distinct from the four-step IMP-producing salvage III route and the nucleoside-hydrolase
  route. E. coli enzyme identity and activity are supported separately from the native pathway definition,
  whose listed species do not include E. coli. K-12 native enzyme annotations are distinguished from experiments
  in K-12 derivatives and recombinant enzyme assays. Magnesium supports Apt activity; native annotation
  also lists manganese as an alternative, without claiming simultaneous occupancy. Apt is intracellular,
  with reported membrane association dependent on preparation. Phosphate is a DeoD substrate. The graph
  selects the salvage directions of reversible chemistry and does not establish this branch as the dominant
  route under all growth conditions. Transport, PRPP synthesis, alternative nucleoside hydrolysis, and
  downstream AMP phosphorylation lie outside the exact two-step boundary.
