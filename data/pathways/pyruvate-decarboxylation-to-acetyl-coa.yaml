id: gomodel:YeastPathways_PYRUVDEHYD-PWY
label: pyruvate decarboxylation to acetyl CoA
description: Pyruvate decarboxylation to acetyl CoA in Saccharomyces cerevisiae S288C
  uses pyruvate dehydrogenase activities to transfer acetyl groups through lipoyl-lysine
  intermediates, form acetyl-CoA, and regenerate oxidized lipoyl cofactor while reducing
  NAD(+) to NADH.
