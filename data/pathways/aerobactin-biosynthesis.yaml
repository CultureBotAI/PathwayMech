id: GO:0019270
label: aerobactin biosynthetic process
description: 'Complete four-transformation aerobactin biosynthesis in Klebsiella pneumoniae hvKP1: IucD
  hydroxylates lysine, IucB acetylates hydroxylysine, and IucA and IucC successively attach two building-block
  equivalents to citrate. The 2018 reconstruction uses hvKP1-derived enzyme preparations expressed in
  E. coli; the host does not establish endogenous E. coli pathway scope. The four native hvKP1 GenPept
  identities are retained, including IucA’s historical hypothetical-protein label and its experimentally
  identified 574-residue accession. The primary papers establish the source genes and describe recombinant
  preparations; the full sequences of all engineered constructs were not independently recovered, so exact
  native-to-tagged or fusion-protein sequence equality is not asserted. Gene-product enables relations
  preserve activity without asserting monomer sufficiency: IucA is experimentally tetrameric, whereas
  IucC shows ATP-associated dimer/tetramer variation. IucD and IucB preparation behavior does not establish
  a fixed hvKP1 stoichiometry. CHEBI:63796 is the issued lysine-S class with unspecified citrate-derived
  stereocenter. The hvKP1 experiments select its 3S,2′S member; this graph does not assert acceptance
  of the 3R member or an exact stereochemical identity between the class and that measured product. Both
  ligations use the native/Rhea ATP-to-AMP-plus-diphosphate convention, supported by the primary adenylation
  mechanism; the conflicting IUBMB IucA ATP-to-ADP equation is recorded as a source disagreement. The
  E. coli plasmid MetaCyc annotations ground the shared chemical pathway definition, not hvKP1 protein
  equivalence. Transport, iron loading, generic virulence effects, upstream precursor biosynthesis and
  unsupported localization or regulation are outside this complete biosynthetic boundary.'
