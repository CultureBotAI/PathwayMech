- id: mg-mnga-catalysis
  subject: UniProtKB:P54745
  predicate: catalyzes
  object: RHEA:33308
  description: MngA is one 658-residue EIIABC chain. MC4100 mngA deletion loses MG transport and pACS31
    restores it; inverted membranes plus general PTS extracts and PEP form MG-P. This is not a purified
    three-protein reconstitution. Separate intact-cell uptake comparisons in MG-induced MC4100 reported
    weak reduction with glucose, mannose and mannitol, a smaller effect with trehalose, and no observed
    reduction with fructose, maltose, arabinose, gluconate, glycerate, 1-alpha-glucosylglycerol, 2-alpha-glucosylglycerate
    or 2-alpha-mannosylglycerol. The Discussion instead describes mannose and those three glycosyl analogues
    as not significantly inhibitory even at 1 mM against 0.1 micromolar radiolabeled MG; the mannose weak-effect/no-significant-effect
    tension remains unresolved. These are uptake comparisons, not direct binding, a proven competitive
    mechanism or inhibition constants. Separately, 300 mM NaCl during growth did not induce transport
    and reduced MG-dependent induction by about 50%; this is an induction endpoint, distinct from the
    KM522 500 mM salt-protection experiment and from a direct catalytic salt effect. None of these whole-cell
    comparisons is attributed to the pACS31 inverted-membrane assay.
  evidence:
  - reference_id: EcoCyc:ENZRXN0-3541
    source_assertion: Native enzymatic reaction assigns HRSA-MONOMER to RXN0-2522.
    source_locator: XPath /ptools-xml/Enzymatic-Reaction/enzyme | /ptools-xml/Enzymatic-Reaction/reaction
  - reference_id: PMID:14645248
    source_assertion: MngA deletion/complementation and inverted-membrane assays support MG uptake/phosphorylation;
      phosphatase experiments infer the phosphate position.
    source_locator: Author-uploaded full text retained web observation, lines L1443–L1662; JBC279:5537–5548
  - reference_id: UniProtKB:P54745
    source_assertion: One658-residue protein contains IIA, IIB and IIC functional regions; these are not
      three distinct subunits.
    source_locator: sequence.length; proteinDescription.includes
  - reference_id: PMID:14645248
    source_assertion: In MG-induced MC4100, Results reports weak uptake inhibition by glucose, mannose
      and mannitol, a smaller effect from trehalose, and none from fructose.
    source_locator: Author-uploaded full text retained web observation, lines L1323–L1354; JBC279:5537–5548
  - reference_id: PMID:14645248
    source_assertion: No uptake inhibition was observed for maltose, arabinose, gluconate, glycerate,
      1-alpha-glucosylglycerol, 2-alpha-glucosylglycerate or 2-alpha-mannosylglycerol in the reported
      MC4100 comparisons.
    source_locator: Author-uploaded full text retained web observation, lines L1350–L1372; JBC279:5537–5548
  - reference_id: PMID:14645248
    source_assertion: Discussion reports no significant inhibition by mannose or the three named glycosyl
      analogues at 1 mM against 0.1 micromolar labeled MG. This contrasts with the weak mannose effect
      in Results; a direct competitive mechanism is not established.
    source_locator: Author-uploaded full text retained web observation, lines L2429–L2457; JBC279:5537–5548
  - reference_id: PMID:14645248
    source_assertion: In MC4100 growth experiments, 300 mM sodium chloride did not induce MG transport
      and reduced MG-dependent induction by about 50%. This is an induction observation, separate from
      KM522 salt protection.
    source_locator: Author-uploaded full text retained web observation, lines L1251–L1310; JBC279:5537–5548
