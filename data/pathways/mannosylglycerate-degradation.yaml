id: MetaCyc:PWY0-1300
label: 2-O-alpha-mannosyl-D-glycerate degradation
description: The native two-reaction pathway hydrolyzes imported MG phosphate to anomer-unspecified D-mannopyranose
  6-phosphate and (R)-glycerate, then phosphorylates glycerate to 2-phosphoglycerate. MngA uptake and
  the PEP–PtsI–HPr relay are linked entry/energy context, not extra core members. E. coli K-12 culture
  and genetic evidence supports the route; the MngB purified-substrate assay, product anomer and physiological
  metal remain unresolved. Regulatory expression effects, constructs, source conflicts and opaque downstream
  interfaces retain their evidence limits. MG biosynthesis and unphosphorylated thermophile MG hydrolysis
  are excluded.
pathway_type: carbohydrate-degradation
