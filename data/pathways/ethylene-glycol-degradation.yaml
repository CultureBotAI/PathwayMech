id: MetaCyc:PWY0-1280
label: ethylene glycol degradation
description: 'Two oxidative events convert ethylene glycol (EG) through glycolaldehyde to glycolate. The
  exact Rhea species give EG + 2 NAD(+) + water -> glycolate + 2 NADH + 3 H(+); the second event releases
  two protons. NAD regeneration, oxygen handling and glycolate assimilation are cellular context, not
  additional core reaction sides. Native FucO dimer and AldA tetramer catalysis are separated from qualified
  historical, tagged and mutant experiments. The record combines E. coli evidence without claiming that
  every taxon or ordinary wild-type MG1655 grows on EG alone.


  Historical physiological support comes from E15 strain 1, EMS-derived strain 3, glycolate-positive G1/G3
  and EG-selected EG3, not a sequenced MG1655 isolate. Initial selection used 30 mM EG with 1 mM glucose;
  subsequent purification used EG-only plates. The primary 1983 Discussion leaves one versus two causal
  mutations unresolved, despite the native summary specifying two. In CAA extracts G1/G3/EG3 FucO activities
  were 0.005/0.130/0.415 and AldA 0.145/0.165/0.560 U/mg. Chromatography and labelled intermediates support
  glycolaldehyde/glycolate formation; P1 association does not identify a sequenced causal allele. EG oxidation
  used 250 mM EG and 0.33 mM NAD, glycine pH 9.5, 25 C. AldA used 1 mM glycolaldehyde and 2.5 mM NAD;
  NADP activity in that preparation was about tenfold lower. Later preparations and assay pH/substrates
  differ.


  The complete 1983 EG3 uptake comparison at 25 mM co-substrate is retained: relative uptake control 100,
  glucose 105, acetate 72, malate 54, glyoxylate 48, glycolate 39, glycolaldehyde 18; control 125 nmol/h/mg
  dry weight. Isotope dilution and mass action were discussed. No named EG transporter, transport stoichiometry
  or obligatory proton coupling was established. Passive diffusion is an early proposal and a later flux-model
  assumption; proton symport is a discussed alternative. These observations do not establish direct transporter
  inhibition.


  Current FucO P0A9S1 is 382 residues, whereas the 2005/2023 papers use historical 383-residue numbering
  and older P11549 context. Their Asp196/His200/His263/His277 Fe ligands, G17D/G97E/D39G, N-terminal deletion
  and I7L/L8V engineering labels are not silently renumbered onto the current reference. The pQE32/pCM1
  N-terminal His6 preparation in M15(pREP4) supports the one-Fe-site crystal observation. Separately,
  solution metal analysis compared D196L/H200A/H200F mutants with WT containing 0.53 Fe atom/subunit.
  Methods assign WT/mutant site-directed-mutagenesis preparations to pGEX3X/pCM2 in BL21(DE3), with GST
  removed by factor Xa; this Methods/Results join supports the cleaved-WT comparator attribution, not
  a measured occupancy for the His6 crystal preparation. His267 is not the Fe ligand formerly proposed.
  N-terminal strand exchange supports the dimer; historical deltaN10 loses assembly/activity. Two NAD
  sites per dimer and D39G cofactor expansion do not create a wild-type NADPH core. Older partially purified
  mutant enzyme also used added manganese; that preparation-specific alternative is retained. The 2005
  paper reports earlier Cu(II)/Cd(II) inhibition of FucO, citing PMID4306747. Its retained older-source
  evidence is abstract/landing material, not an inspected full experimental body; no Cu/Cd dose or direct
  assay is inferred. The 2005 Figure 4 experiment separately tests Zn/Fe.


  The 2023 L-lactaldehyde reduction work reports positive cooperativity, K0.5 rather than Km, preliminary
  ordered Bi-Bi behavior and isotope effects implicating chemistry. H267Q/D360N retain activity, so a
  unique obligatory base is not established. Reduction used pH 8, 30 C and 0.4 mM NADH; EG is achiral.
  N151G/L259V 7QNF has cryoprotectant EG and ADPR with unresolved nicotinamide; 7QNI apo L259V lacks Fe/coenzyme
  and 7R5T F254I is a closed holo state. Neither that mutant structure nor the unsuccessful 2005 glycolaldehyde
  complex demonstrates a productive wild-type EG ternary intermediate. Earlier expression methods and
  the 2023 supplement were not fully acquired.


  AldA P25553 is 479 residues. Later ultracentrifugation/crystals support a tetramer over older dimer
  estimates. The unavailable 1987 PDF is represented by a limited indexed primary excerpt: strain 3 preparation,
  JA102=EG3, tetramer/four NAD sites, glycolaldehyde Km0.38 mM, NAD Km0.28 mM and NADP Km6.25 mM. The
  latter is not Kd despite later wording; ambiguous Zn/Cu OCR values are not promoted. Direct glycolaldehyde
  assays in 1983, 2006 and 2019 remain separate. The 2019 Vmax/kcat unit inconsistency is disclosed without
  silently correcting a value. The 2006 NADH and Mg propionaldehyde-dehydrogenase inhibition is distinct
  from NADH activation of p-nitrophenyl-acetate esterase; neither sign is transferred between functions.
  The 2008 His-tag F180T BL21(DE3)pLysS cofactor expansion, Ki differences and Mg response are engineered
  context. In 2007 AldA was endogenous untagged BL21(DE3) protein contaminating a pBSET taxadiene-synthase
  preparation. C285/E251 mechanism, partial ligand occupancies and NADPH crystal binding do not prove
  native NADPH turnover or a measured EG-derived covalent intermediate. Heavy-atom/crystallization metals
  are not physiological cofactors. The annotation''s p-hydroxy mercuribenzoate inhibitor lacks an exact
  supported charge/salt mapping here.


  Regulatory arrows distinguish activity from expression. CRP-cAMP has proximal aldA binding near-60 (overlap
  of strand-specific footprints -47 to -74) in the 1997 study; the distal-134 consensus failed the test.
  Purified binding used 20 micromolar cAMP; external5 mM cAMP partly relieved glucose repression but not
  glycerol repression. The reporter uses RYC1000 single-copy lambda fusions; MC1061 is a cloning host.
  An unknown ECL1 crude-extract factor binds-59 to-6 more strongly with glycolaldehyde or2-oxoglutarate;
  no named TF, direct purified effector binding or resolved multimer is invented. Purified IHF binds aldA
  fragments, but himA HN1491 and himD K2704 mutants showed no significant expression effect. IHF alpha/beta
  assembly is retained without a signed aldA edge. Phosphorylated ArcA endpoints retain the source modified
  state: 1997 ECL547/ECL968 reporter, later native promoter sites with distinct evidence classes, and
  2014 native genomics context are separate. Specific 2014 aldA supplemental data were not inspected.
  DnaA-ATP negative control is native-state support plus an abstract reporting DnaA binding; the full
  paper was unavailable. FNR''s aldA motif is computational expression-context support, not purified promoter
  binding. MarA/SoxS/Rob expression annotations explicitly allow indirect effects.


  Native fucAO CRP-cAMP/FucR-fuculose1-phosphate control is joined through the exact TU and fucO gene;
  fucPIK/IS5/crp201 mechanisms are not transplanted. The separately mapped internal fucO transcript remains
  distinct. SrsR/YgfI fucO RNA effects use BW25113/JW5476 and ASKA controls after 24 h LB, while purified
  C-terminal His-SrsR from W3110/pET21a in BL21(DE3) binds the shared fucA/fucP spacer; yfdP/yfdO supplied
  footprint sites. Its coinducer is unknown. Sugar-dependent expression is condition-specific. The 1988
  ECL1/ECL3, JA104 temperature-sensitive, JA105 fucO::Tn5, ET6016 rhamnose-aldolase and ECL493 ald-1 comparisons
  suggest lactaldehyde induction, but direct addition arrested growth. Carbon-fed anaerobic shifts retain
  AldA; starvation causes activity loss without immediate protein loss. Broad native claims of exclusively
  aerobic AldA or exclusively anaerobic FucO are consequently bounded. Glutamate induction is retained
  as native prose without a forced ionic/stereochemical effector identity. Glycerol-associated AldA protein
  reduction in the 2002 MC4100/TB comparison does not establish every malT/EIIA intermediary for aldA.


  Engineering provides qualified full-route context. The 2021 MG1655-derived LMSE11/12 pTrc99a FucO/AldA
  variants used 2 g/L yeast extract and controlled aeration; those results are not sole-organic-carbon
  reference growth. The 2024 UV EG01 and DnaB-AID/evolved EG02 study separates modules I FucO/AldA, II
  GlcDEF, III glycerate Gcl/Hyi/GlxR/GlxK, IV GlcB. Inspected Fig. 4 supports module III and resolves
  contradictory III/IV Results wording; module I alone was insufficient in that assay. Defined M9 EG differs
  from PET digest containing glycine/TPA/MHET and EG-versus-LB RNA comparisons. Another 2024 study compares
  FucO I7L/L8V, heterologous Gox0313 or PedE/PQQ with fucO/yqhD/glcDEF deletions; it inconsistently names
  MG1655 and MG1655(DE3) and uses2 g/L yeast extract. Glycolate toxicity and metabolite pools are not
  direct AldA inhibition or measured flux. PMID39079834 and 41308929 remain abstract-only engineering
  leads, not completed native mechanisms.


  Native glycolate links to three opaque downstream pathways and the glycol superpathway are retained.
  Frozen PathBank root SMP0002105/PW002093 has the same two-event outline, FucO (two chains)/AldA (four
  chains) assemblies and two attached children. Their generic Interactions provide unsigned structural
  participant context. PathBank neutral glycolic acid17497 is distinct from Rhea glycolate 29805; its
  NAD species differ, its first reaction is reversible, and its glycolaldehyde BioCyc DIHYDROXYPHENYLGLYCOLALDEHYDE
  cross-reference conflicts with CHEBI17071. These conflicts are preserved rather than harmonized away.
  Native archaeal Q9HHR2 and yeast Q12177 first-reaction contexts describe reverse glycolaldehyde reduction,
  not complete EG degradation in those taxa. Native comments also cover FucO propanediol/isobutanol, reverse
  beta oxidation, mouse colonization and slow-codon effects, and AldA folate-derived glycolaldehyde removal,
  other sugar routes, glucose limitation, oleate and environmental expression. Those are bounded adjacent
  contexts; prpC synthetic lethality does not establish PrpC catalysis, and sequence-based succinate-semialdehyde
  predictions do not change this core.'
