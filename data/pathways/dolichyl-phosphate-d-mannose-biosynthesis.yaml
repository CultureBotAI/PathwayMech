id: gomodel:YeastPathways_PWY3O-123
label: dolichyl phosphate D-mannose biosynthesis
description: Dolichyl phosphate D-mannose biosynthesis in Saccharomyces cerevisiae S288C converts
  beta-D-fructofuranose 6-phosphate to alpha-D-mannose 1-phosphate, forms GDP-alpha-D-mannose,
  and transfers D-mannose to dolichyl phosphate to produce dolichyl D-mannosyl phosphate.
pathway_type: glycan-biosynthesis
