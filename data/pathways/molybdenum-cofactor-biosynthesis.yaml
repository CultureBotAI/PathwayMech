id: MetaCyc:PWY-6823
label: molybdenum cofactor biosynthesis
description: 'The complete eight-reaction native route is represented for the Escherichia coli K-12 protein
  core: MoaA cyclizes GTP, MoaC forms cPMP, sulfur-carrier activation and recycling supply both sulfurs
  of molybdopterin, and Mog/MoeA adenylation and molybdate insertion yield Mo-molybdopterin. The sulfur-transfer
  net reaction retains five whole protein carrier states and a generic reductant; it does not specify
  every elementary relay. YnjE enhances reconstitution without a claim of universal indispensability.
  MoaA cyclase/cluster assignments retain their HAMAP inference, while direct MoaC experiments distinguish
  the E. coli enzyme from Staphylococcus aureus MoaA used in coupled assays. Native assemblies concern
  MG1655 within K-12; individual kinetic and genetic experiments have narrower strain and assay scopes.
  Anaerobic nitrate-respiration complementation and oxygen-sensitive radical-SAM preparations do not imply
  exclusive anaerobic pathway operation. The endpoint is unmodified Mo-MPT, before MCD or bis-MGD synthesis
  and cofactor insertion into target enzymes. The initial PathBank map also includes a separate folate
  branch and MocA cytidylation; those are outside this exact native boundary. Alternative sulfur-donor
  compensation, tungsten substitution, and high-molybdate bypass conditions do not establish uniform wild-type
  flux.'
pathway_type: cofactor-biosynthesis
