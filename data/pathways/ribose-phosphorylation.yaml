id: MetaCyc:RIBOKIN-PWY
label: ribose phosphorylation
description: 'This complete native ribose-phosphorylation route contains three chemical events: beta-D-ribopyranose/beta-D-ribofuranose
  interconversion, spontaneous alpha/beta furanose interconversion, and ATP-dependent phosphorylation
  to alpha-D-ribofuranose 5-phosphate. Both enzymatic members of the native reaction-list are retained,
  together with the spontaneous event explicitly described by its narrative. RXN-14904 is the exact reversible
  native spontaneous reaction; its selected route direction is right-to-left. Its source also marks physiologically-relevant=true
  and orphan=YES-PUTATIVE; no catalyst is assigned. RbsD and FucU are separate alternative pyranases,
  not obligate partners.


  The META narrative specifies alpha-furanose kinase chemistry while its formal reaction-layout and Rhea
  13697/13698 use generic furanose classes. This graph explicitly refines the generic RIBOKIN-RXN sugar
  sides to that narrative''s alpha forms; it does not claim an exact Rhea synonym, consume both generic
  and alpha sugars, or equate cyclic and aldehydo forms. Ryu 2004 NMR suggests alpha preference rather
  than proving exclusivity; the stronger specificity statement is the inspected native annotation citing
  Sigrell 1998. The generic and anomer-specific definitions remain separately preserved in the evidence
  audit.


  Incoming ABC-28-RXN transports the native D-ribopyranose class from outside to inside with ATP/water
  consumption and ADP/phosphate/hydron output. Rhea 29903/29904 instead uses D-ribofuranose and is not
  treated as an exact alias of this pyranose transport event. RbsB beta-pyranose binding is established
  in the native summary, while beta-selective transport is explicitly presumed. Current EcoCyc/UniProt
  specify RbsA1-RbsC2-RbsB1; the frozen 2019 PathBank rendering uses A2-C2-B1. RbsA has two ATP-binding
  domains in one chain. Cofactor-dependent RbsAC2B, RbsAC and RbsBC cycle states are not simultaneously
  permanent assemblies. The transport step is an incoming interface, not a third enzymatic member of the
  native pathway reaction-list.


  Native RbsD and FucU homodecamers and the RbsK homodimer remain source-defined complexes. They are not
  equated to Ryu 2004 gel-filtration preparations: C-His RbsD had estimated 7.1/15.3 oligomers, N-His
  FucU was monomeric and inactive, C-His FucU about 5, and untagged FucU about 6.2/18.9. RbsK(C-His) was
  about 1.9. Those are construct- and method-specific estimates, not exact alternative native stoichiometries.
  The full Ryu scientific body and Table I were inspected via an author-uploaded web rendering; a complete
  original publisher PDF and supplement were not obtained. RbsC ten-helix topology likewise derives from
  His-tagged cysteineless templates with single-cysteine replacements (PMID12923096), not an unmodified-chain
  assay.


  Ribokinase uses a divalent cation, with Mg2+ considered likely in vivo and Mn2+ an active alternative;
  probable metal-nucleotide substrate assignment is retained as inference. Potassium and ammonium are
  alternative monovalent activators. Phosphate activation is condition dependent; native kinetic commentary
  also names arsenate and vanadate without resolving their exact chemical forms here. No cofactor independence
  is inferred for either pyranase. Native localization and curator-inferred localization are distinguished.


  RbsR represses and CRP-cAMP positively regulates the rbsDACBKR transcription unit; D-ribose lowers RbsR
  DNA-binding affinity. These edges target exact MG1655 genes and do not imply direct enzyme inhibition.
  YidZ deletion/RNA-seq supports negative control of rbsD under the assayed M9-glucose conditions; associated
  ChIP-exo used a C-terminal 8-myc construct, not unmodified purified YidZ. CRP expression-based evidence
  may include indirect effects. The iModulon observations remain external computational context and do
  not add causal edges. Historical K-12 experiments and engineered derivatives are not all relabelled
  as MG1655.


  The non-oxidative pentose phosphate pathway and PRPP biosynthesis are opaque downstream source links,
  not expanded core chemistry. No unobserved cyclic/open-chain isomerization or exact endpoint identity
  is invented to connect them. This is a full source-defined microbial route with preserved anomer, assembly,
  experimental and access limits, not proof that every annotated alternative and regulatory condition
  operates simultaneously.'
