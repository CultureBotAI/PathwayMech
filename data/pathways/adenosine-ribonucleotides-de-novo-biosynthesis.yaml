id: gomodel:YeastPathways_PWY-7219
label: adenosine ribonucleotides de novo biosynthesis
description: Adenosine ribonucleotides de novo biosynthesis in Saccharomyces cerevisiae S288C converts IMP to adenylo-succinate through ADE12-catalyzed adenylosuccinate synthase activity, cleaves adenylo-succinate to AMP through ADE13-catalyzed adenylosuccinate lyase activity, and phosphorylates AMP to ADP through ADK2- or ADK1-catalyzed AMP kinase activity.
