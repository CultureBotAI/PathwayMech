id: MetaCyc:ARGDEG-III-PWY
label: L-arginine degradation IV (arginine decarboxylase/agmatine deiminase pathway)
description: >-
  L-arginine degradation through arginine decarboxylase and the agmatine
  deiminase pathway converts L-arginine to agmatine, N-carbamoylputrescine,
  putrescine, carbamoyl phosphate, ammonium, carbon dioxide,
  hydrogencarbonate, and ATP.
