id: MetaCyc:PHESYN
label: L-phenylalanine biosynthesis I
description: >-
  L-phenylalanine biosynthesis I converts chorismate to prephenate, dehydrates
  and decarboxylates prephenate to 3-phenylpyruvate, and transaminates
  3-phenylpyruvate with L-glutamate to form L-phenylalanine.
