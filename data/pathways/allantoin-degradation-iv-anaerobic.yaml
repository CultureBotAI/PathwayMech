id: MetaCyc:PWY0-41
label: allantoin degradation IV (anaerobic)
description: The Escherichia coli K-12 MG1655 anaerobic route converts S-allantoin through allantoate,
  S-ureidoglycine, S-ureidoglycolate and oxalurate to oxamate, with carbamoyl phosphate supporting ATP
  formation by AllK and subsequent spontaneous carbamate breakdown. The formal native endpoint is CO2,
  not a claim that dissolved inorganic carbon occurs exclusively as CO2. AllB, AllC and AllD have independently
  identified homomeric assemblies. AllF, AllG and AllH jointly supply OXTCase function; their enables
  edges preserve component roles without claiming individual sufficiency, a resolved whole-complex stoichiometry,
  or a formal AND relation. The Mg2+ context node refers to whole-OXTCase assay dependence and AllK assay
  conditions, not subunit-specific binding. The native mirror predates the 2024 AllFGH assignment and
  carries a stale AllC Rhea link; current protein and primary evidence resolve those limits. AllD uses
  NAD+, and alternative metal preparations are qualified at their edges. The separate glyoxylate branch,
  urea-producing yeast routes, transport, regulation, NADP substitution, bicarbonate hydration, and duplicate
  combined kinase/decomposition nets are outside this record.
