id: MetaCyc:CENTBENZCOA-PWY
label: benzoyl-CoA degradation II (anaerobic)
description: Complete seven-reaction MetaCyc route from benzoyl-CoA to glutaryl-CoA and acetyl-CoA, with
  ATP-dependent dearomatization and formal Oah hydration/ring opening. Upper Thauera aromatica evidence
  is distinguished from partial Syntrophus and Rhodopseudomonas enzyme examples. The sixth reaction remains
  YES-PUTATIVE with no assigned enzyme; lower-route chemistry is not proof of a measured complete route
  in any listed strain. Generic ferredoxin cluster units retain native coefficients. Oah net activity
  is auxiliary composite context, not an eighth selected step. Nine-step P321 is a separate alternative.
