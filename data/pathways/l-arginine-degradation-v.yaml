id: MetaCyc:ARGDEGRAD-PWY
label: L-arginine degradation V (arginine deiminase pathway)
description: >-
  L-arginine degradation through the arginine deiminase pathway converts
  L-arginine to L-citrulline, L-ornithine, ammonium, hydrogencarbonate, and ATP
  through arginine deiminase, catabolic ornithine carbamoyltransferase, and
  carbamate kinase.
