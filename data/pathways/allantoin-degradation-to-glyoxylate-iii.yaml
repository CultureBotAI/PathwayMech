id: MetaCyc:PWY-5705
label: allantoin degradation to glyoxylate III
description: The Escherichia coli K-12 glyoxylate branch converts S-allantoin through allantoate and S-ureidoglycine
  to S-ureidoglycolate, then AllA releases urea and glyoxylate. AllC and AllE release ammonium in separate
  steps, distinguishing this four-step route from the yeast allantoicase route. Native PWY-5705 contains
  the complete PWY-5698 module and the terminal ureidoglycolate lyase reaction. K-12 ECL1 experiments
  support anaerobic allantoin nitrogen utilization, not growth on allantoin as sole carbon source; deleting
  allA did not abolish nitrogen-supported growth because the alternative oxamate branch remained available.
  Native assemblies are annotated for MG1655, while reviewed proteins and primary experiments support
  the broader K-12 scope. AllB is tetrameric and AllC dimeric; AllE monomer status is inferred and AllA
  homodimer status is structural annotation. Metal alternatives and source evidence tiers are retained.
  The urea-releasing AllA reaction corrects historical ammonia-releasing hydrolase assignments; glyoxylate
  hydration in solution does not establish a different net enzymatic mechanism. Downstream glycerate metabolism,
  transport, transcriptional regulation and the separate oxamate branch are outside this defined route.
pathway_type: allantoin-degradation
