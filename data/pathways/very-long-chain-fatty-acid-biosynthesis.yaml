id: gomodel:YeastPathways_PWY-5080-1
label: very long chain fatty acid biosynthesis I
description: The very long chain fatty acid biosynthesis I GO-CAM for Saccharomyces
  cerevisiae S288C links ELO2/ELO3 fatty acid elongase, IFA38 acetoacetyl-CoA reductase,
  PHS1 enoyl-CoA hydratase, and TSC13 very-long-chain enoyl-CoA reductase activities
  that elongate long-chain fatty acyl-CoA through 3-oxo, 3-hydroxy, and trans-2-enoyl-CoA
  intermediates.
