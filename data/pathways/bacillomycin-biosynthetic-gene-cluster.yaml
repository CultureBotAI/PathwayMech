mechanistic_edges:
  - id: bmyD-component
    subject: NCBIProtein:ABS74182.1
    predicate: enables
    object: MIBiG:BGC0001090
    description: >-
      MIBiG-annotated component role, not an independently demonstrated reaction.
      MIBiG calls this protein bmyD; GenBank currently calls its gene fabD.
      The differing gene names are retained without asserting a nomenclature correction.
    evidence:
      - reference_id: MIBiG:BGC0001090
        source_assertion: MIBiG annotates ABS74182.1 as bmyD, malonyl-CoA transacylase, with a scaffold-biosynthesis function and an empty function-evidence list.
        source_locator: genes.annotations[id='ABS74182.1']; functions[].function.name; functions[].evidence
      - reference_id: NCBIProtein:ABS74182.1
        source_assertion: GenBank identifies ABS74182.1 as ACP S-malonyltransferase from FZB42, gene fabD, encoded by complement(CP000560.2:1907227..1908429).
        source_locator: GBSeq[GBSeq_accession-version='ABS74182.1']/GBSeq_feature-table; source strain; CDS gene and coded_by; Protein product
  - id: bmyA-component
    subject: NCBIProtein:ABS74181.1
    predicate: enables
    object: MIBiG:BGC0001090
    description: >-
      Component participation with source knockout evidence. The paper establishes
      cluster involvement, not independent enzyme sufficiency or freedom from
      polar effects on downstream genes.
    evidence:
      - reference_id: MIBiG:BGC0001090
        source_assertion: MIBiG annotates ABS74181.1 as bmyA, bacillomycin D synthetase A, with a scaffold-biosynthesis function and knockout evidence.
        source_locator: genes.annotations[id='ABS74181.1']; functions[].function.name; functions[].evidence
      - reference_id: NCBIProtein:ABS74181.1
        source_assertion: GenBank identifies ABS74181.1 as a non-ribosomal peptide synthetase from FZB42, encoded by complement(CP000560.2:1895259..1907207).
        source_locator: GBSeq[GBSeq_accession-version='ABS74181.1']/GBSeq_feature-table; source strain; CDS coded_by; Protein product
      - reference_id: PMID:14762003
        source_assertion: The study attributes the bmy cluster to bacillomycin D biosynthesis and reports that cassette mutagenesis of the bmy, fen and srf clusters eliminated production of their corresponding peptides.
        source_locator: Abstract; bmy cluster attribution and cassette-mutagenesis results
