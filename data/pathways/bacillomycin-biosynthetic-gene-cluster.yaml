id: MIBiG:BGC0001090
label: bacillomycin D biosynthetic gene cluster
description: >-
  Bacillomycin D biosynthetic gene cluster of Bacillus velezensis FZB42,
  called Bacillus amyloliquefaciens FZB42 in the original study. This partial
  graph preserves four source-annotated biosynthetic components, not a complete
  reaction sequence or independent enzyme sufficiency. MIBiG reports active
  status, questionable quality and complete locus coverage. Its bmyD name for
  ABS74182.1 differs from the current GenBank fabD annotation. MIBiG bounds
  refer to CP000560.1; current protein coded_by annotations refer to CP000560.2
  and are not used to remap those bounds. Module substrates are inferred from
  structure and sequence and are not promoted to measured reactions.
pathway_type: biosynthetic-gene-cluster
