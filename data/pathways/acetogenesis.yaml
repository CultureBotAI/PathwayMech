id: WikiPathways:WP5019
label: Acetogenesis
description: Acetogenesis is a carbon fixation and fermentation pathway in Acetobacterium woodii that reduces carbon dioxide to formate, carries the methyl branch through tetrahydrofolate intermediates, produces carbon monoxide on the carbonyl branch, and forms acetate through acetyl-CoA and acetyl phosphate.
pathway_type: acetogenesis
