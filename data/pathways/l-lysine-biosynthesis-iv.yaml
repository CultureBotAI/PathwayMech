id: gomodel:YeastPathways_LYSINE-AMINOAD-PWY-2
label: L-lysine biosynthesis IV
description: L-lysine biosynthesis IV in Saccharomyces cerevisiae S288C routes acetyl-CoA
  and 2-oxoglutarate through homocitrate, homoaconitate, 2-oxoadipate, 2-aminoadipate, saccharopine,
  and L-2-aminoadipate 6-semialdehyde chemistry to L-lysine. Homocitrate dehydration is assigned
  to ACO2 with a minor ACO1 contribution; LYS4 catalyzes the following homoaconitate hydration.
