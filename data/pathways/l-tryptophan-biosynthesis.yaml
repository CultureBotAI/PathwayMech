id: MetaCyc:TRPSYN-PWY
label: L-tryptophan biosynthesis
description: >-
  L-tryptophan biosynthesis converts chorismate and L-glutamine to
  anthranilate, transfers a phosphoribosyl group from
  5-phospho-alpha-D-ribose 1-diphosphate, isomerizes
  N-(5-phospho-beta-D-ribosyl)anthranilate to
  1-(2-carboxyphenylamino)-1-deoxy-D-ribulose 5-phosphate, cyclizes that
  intermediate to (1S,2R)-1-C-(indol-3-yl)glycerol 3-phosphate, and condenses
  it with L-serine to make L-tryptophan.
pathway_type: amino-acid-biosynthesis
