id: GO:0036040
label: curcumin catabolic process
description: The complete two-step reductive curcumin pathway converts curcumin through dihydrocurcumin
  to tetrahydrocurcumin using the NADPH-dependent CurA homodimer. The graph follows MetaCyc PWY0-1527
  and the two native reactions in PathBank SMP0001910. The primary study first found activity in a fecal
  Escherichia coli isolate, then used K-12 DH10B for purification and gene identification and a recombinant
  BL21 host for detailed enzyme characterization. Reviewed K-12 CurA and the native MG1655 annotation
  support the selected K-12 scope; this is not a direct MG1655 flux measurement. Both C=C reductions and
  their shared intermediate are retained. The redundant net Rhea reaction is excluded. Tetrahydrocurcumin
  is the demonstrated CurA endpoint, without an assertion of complete mineralization, downstream fate,
  or a curcumin transporter. NADPH is a diffusible cosubstrate; the reported enzyme is metal-independent.
  Cytosol localization is retained only as an explicitly computational native annotation.
