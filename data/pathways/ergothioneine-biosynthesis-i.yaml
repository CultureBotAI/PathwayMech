id: MetaCyc:PWY-7255
label: ergothioneine biosynthesis I (bacteria)
description: 'The complete seven-member native pathway combines gamma-glutamylcysteine synthesis, histidine
  trimethylation, oxygen-dependent C-S coupling, deglutamylation, PLP-dependent cleavage, generic reduction
  and thiol-thione equilibration. The five named gene products are current Mycolicibacterium smegmatis
  mc(2)155 proteins; EgtA activity is inferred by similarity, and the early B/C/D reconstitution used
  DSM43465/ATCC607. Later EgtC and EgtE studies directly identify mc(2)155 constructs. Functional enables
  assertions retain EgtC tetramer and EgtE homodimer contexts without inventing complex identifiers or
  monomer sufficiency. Current Rhea defines the first five equations; the terminal native equations retain
  neutral ergothioneine thiol and thione as separate states. Current Rhea reduction instead uses protonated
  ergothioneine and an added proton and is not substituted into the neutral tautomer sequence. The AH2/A
  pair remains generic: DTT-supported experiments do not identify the physiological reductant. Sulfoxide
  sulfur stereochemistry remains unspecified in the selected authoritative chemical classes, not a claim
  that every stereoisomer is accepted. Fungal bypasses, disproportionation side products, transport, antioxidant
  outcomes and precursor biosynthesis are outside this complete native boundary. The 2018 purified EgtD
  product-inhibition observation (DOI:10.1021/acschembio.8b00127.s001) is retained as DSM43465/ATCC607-derived
  engineered-preparation context only; it is not transferred to the exact mc(2)155 protein.'
