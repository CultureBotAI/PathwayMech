id: gomodel:YeastPathways_PWY3O-450
label: phosphatidylcholine biosynthesis I
description: Phosphatidylcholine biosynthesis I in Saccharomyces cerevisiae S288C
  phosphorylates choline to choline phosphate, converts choline phosphate and CTP
  to CDP-choline, and transfers phosphocholine from CDP-choline to 1,2-diacyl-sn-glycerol
  to form 1,2-diacyl-sn-glycero-3-phosphocholine.
