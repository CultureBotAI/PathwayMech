id: WikiPathways:WP5587
label: 2-phenylethanol biosynthesis
description: 2-phenylethanol biosynthesis in Saccharomyces cerevisiae places glucose, phosphoenolpyruvate,
  erythrose 4-phosphate, 3-deoxy-D-arabino-heptulosonic acid 7-phosphate, shikimate, chorismate,
  phenylalanine, and 2-phenylethanol in shikimate- and Ehrlich-route reactions in the WP5587
  GPML diagram. The graph distinguishes reversible phenylalanine transamination, DAHP condensation
  and the connected phenylpyruvate-to-phenylacetaldehyde Ehrlich route; collapsed upstream
  branches represent multiple enzymatic steps.
