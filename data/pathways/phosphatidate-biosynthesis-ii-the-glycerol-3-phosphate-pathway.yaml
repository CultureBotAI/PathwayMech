id: gomodel:YeastPathways_PWY3O-6499
label: phosphatidate biosynthesis II (the glycerol-3-phosphate pathway)
description: Phosphatidate biosynthesis II in Saccharomyces cerevisiae S288C forms
  sn-glycerol 3-phosphate, acylates it to 1-acyl-sn-glycerol 3-phosphate, and acylates
  that lysophosphatidate to 1,2-diacyl-sn-glycerol 3-phosphate through the SGD GO-CAM
  glycerol-3-phosphate pathway.
pathway_type: lipid-biosynthesis
