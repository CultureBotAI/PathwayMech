id: MetaCyc:GLUAMCAT-PWY
label: N-acetylglucosamine degradation I
description: N-acetylglucosamine degradation I deacetylates N-acetyl-D-glucosamine 6-phosphate to D-glucosamine
  6-phosphate and acetate, then deaminates alpha-D-glucosamine 6-phosphate to beta-D-fructose 6-phosphate
  and ammonium.
