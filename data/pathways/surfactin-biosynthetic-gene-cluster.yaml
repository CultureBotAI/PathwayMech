        source_assertion: MIBiG annotates CAE02631.1 (srfAB) as surfactin synthetase B with a scaffold-biosynthesis role. Its function-evidence list is empty; modules 4-6 are assigned to this gene.
        source_locator: genes.annotations[id='CAE02631.1']; biosynthesis.modules[name='4'|'5'|'6'].genes
      - reference_id: NCBIProtein:CAE02631.1
        source_assertion: GenBank identifies CAE02631.1 as srfAB from strain FZB42, encoded by AJ575642.1:19334..30094, with product surfactin synthetase B.
        source_locator: GBSeq[GBSeq_accession-version='CAE02631.1']/GBSeq_feature-table; CDS gene and coded_by; Protein product
