    category: protein
reactions: []
mechanistic_edges:
  - id: srfAA-component
    subject: NCBIProtein:CAE02630.1
    predicate: enables
    object: MIBiG:BGC0000433
    description: >-
      Component participation; the srfA disruption experiment establishes
      cluster involvement, not individual enzyme sufficiency or freedom from
      polar effects on downstream genes.
    evidence:
      - reference_id: MIBiG:BGC0000433
        source_assertion: MIBiG annotates CAE02630.1 (srfAA) as surfactin synthetase A with a scaffold-biosynthesis function and knockout evidence.
        source_locator: genes.annotations[id='CAE02630.1'].product; functions[].function.name; functions[].evidence
      - reference_id: NCBIProtein:CAE02630.1
        source_assertion: GenBank identifies CAE02630.1 as srfAA from strain FZB42, encoded by AJ575642.1:8558..19312, with product surfactin synthetase A.
        source_locator: GBSeq[GBSeq_accession-version='CAE02630.1']/GBSeq_feature-table; CDS gene and coded_by; Protein product
      - reference_id: PMID:14762003
        source_assertion: Cassette disruption of srfA in strain FZB42 abolished detectable surfactin while bacillomycin D peaks remained, supporting involvement of the srf cluster.
        source_locator: Abstract and Figure 2F caption; CH1 (srfA::Emr)
