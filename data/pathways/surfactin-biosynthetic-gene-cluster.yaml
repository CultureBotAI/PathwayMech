id: MIBiG:BGC0000433
label: surfactin biosynthetic gene cluster
description: >-
  Surfactin biosynthetic gene cluster of Bacillus velezensis FZB42, called
  Bacillus amyloliquefaciens FZB42 in the original study. This bounded graph
  preserves three annotated NRPS components and cluster-level genetic evidence;
  it does not assert that each component independently synthesizes surfactin.
  MIBiG reports active status, questionable quality and complete locus coverage.
  The graph is partial. Module substrate assignments are structure-based
  inferences and are not promoted to measured reaction steps. The native locus
  coordinates 0..0 are unspecified and are omitted rather than treated as bounds.
pathway_type: biosynthetic-gene-cluster
