id: MetaCyc:PWY-6609
label: adenine and adenosine salvage III
description: The complete four-reaction route salvages adenine through adenosine, inosine and hypoxanthine
  to IMP in Escherichia coli K-12. The DeoD homohexamer forms adenosine from adenine and alpha-D-ribose
  1-phosphate, Add deaminates adenosine, and DeoD then cleaves inosine. The Hpt homotetramer preferentially
  salvages hypoxanthine to IMP; Gpt also catalyzes this step with lower affinity for hypoxanthine than
  for its preferred guanine substrate. Historical genetic experiments used K-12 derivatives, while the
  native MetaCyc organism annotation is MG1655 and the reviewed proteins are assigned to K-12. The reversible
  phosphorylase reactions are oriented along the defined salvage route, without claiming that this flux
  dominates every growth condition. The graph ends at IMP; downstream AMP/GMP synthesis, direct AMP salvage
  and inosine kinase salvage are separate routes.
pathway_type: purine-nucleotide-salvage
