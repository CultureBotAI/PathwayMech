  Mycobacterium tuberculosis mycothiol biosynthesis converts alpha-D-glucose
  6-phosphate to mycothiol through inositol-phosphate, GlcNAc-Ins-P,
  GlcNAc-Ins, GlcNI, and desacetylmycothiol intermediates.
