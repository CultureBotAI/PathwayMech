id: Reactome:R-MTU-879299
label: Mycothiol biosynthesis
description: Cytosolic mycothiol synthesis in Mycobacterium tuberculosis links Ino1, MshA,
  an unresolved phosphatase, MshB, MshC and MshD. Mca supplies a minor alternative deacetylase
  route. The source models zinc-containing Ino1, Mca and MshC assemblies; Mca metal occupancy
  depends on oxygen conditions. ImpC is not assigned as the unresolved phosphatase because
  later experiments identify it as histidinol-phosphatase.
