id: PathBank:SMP0002100
label: Trehalose Biosynthesis I
description: 'PathBank SMP0002100 (native BioPAX archive member PW002088.owl) models the two-step cytoplasmic
  trehalose biosynthesis I pathway in Escherichia coli (NCBITaxon:562; native Species/3), corresponding
  to the Escherichia coli MetaCyc pathway record MetaCyc:TRESYN-PWY (trehalose-biosynthesis-i.yaml) and
  supported by genetic and biochemical characterization of the otsBA operon in Escherichia coli K-12
  (NCBITaxon:83333; PMID:8045430). In the first step (RHEA:18890, left-to-right direction of RHEA:18889;
  native Reactions/6093, eCNumber 2.4.1.15, Glucose 6-phosphate + Uridine diphosphate glucose -> Hydrogen
  Ion + Uridine 5''-diphosphate + alpha,alpha-Trehalose 6-phosphate, conversionDirection LEFT-TO-RIGHT),
  cytosolic trehalose-6-phosphate synthase OtsA (UniProtKB:P31677; native Protein/6510 Alpha,alpha-trehalose-phosphate
  synthase [UDP-forming] controlling Reactions/6093 via ReactionCatalysis/6052 in PathwayEnzymeReaction/22665)
  transfers a glucosyl moiety from UDP-alpha-D-glucose (CHEBI:58885; pH 7.3 major microspecies of native
  Compound/PW_C000193 Uridine diphosphate glucose, BioCyc UDP-GLUCOSE / KEGG Compound C00029) to D-glucose
  6-phosphate (CHEBI:61548; pH 7.3 major microspecies of native Compound/PW_C001083 Glucose 6-phosphate,
  CHEBI:4170) to form alpha,alpha-trehalose 6-phosphate (CHEBI:58429; pH 7.3 major microspecies of native
  Compound/PW_C044529 alpha,alpha-Trehalose 6-phosphate, CHEBI:18283), UDP (CHEBI:58223; pH 7.3 major
  microspecies of native Compound/PW_C000201 Uridine 5''-diphosphate, CHEBI:17659), and hydron (CHEBI:15378;
  native Compound/PW_C040034 Hydrogen Ion).


  In the second step (RHEA:23421, left-to-right direction of RHEA:23420; native Reactions/6094, eCNumber
  3.1.3.12, Water + alpha,alpha-Trehalose 6-phosphate -> Phosphate + alpha,alpha-trehalose, conversionDirection
  LEFT-TO-RIGHT), cytosolic trehalose-6-phosphate phosphatase OtsB (UniProtKB:P31678; native Protein/6511
  Trehalose-phosphate phosphatase controlling Reactions/6094 via ReactionCatalysis/6054 in PathwayEnzymeReaction/22667),
  which utilizes Mg(2+) (CHEBI:18420) or alternative divalent metal cations Mn(2+) (CHEBI:29035), Co(2+)
  (CHEBI:48828), or Zn(2+) (CHEBI:29105) as a cofactor, hydrolyzes alpha,alpha-trehalose 6-phosphate
  (CHEBI:58429; native Compound/PW_C044529) with water (CHEBI:15377; native Compound/PW_C001420 Water)
  to yield alpha,alpha-trehalose (CHEBI:16551; native Compound/PW_C042934 alpha,alpha-trehalose) and
  phosphate (CHEBI:43474; pH 7.3 major microspecies of native Compound/PW_C001104 Phosphate, CHEBI:18367).
  Native PW002088.owl also declares diagram subpathway stubs SMP0000841 (Galactose Metabolism; PathwaySubPathway/109953,
  SubPathwayInteractions/109953) and SMP0002109 (Trehalose Degradation I (Low Osmolarity); PathwaySubPathway/109954,
  SubPathwayInteractions/109954 with participant Compound/PW_C042934), which are recorded as adjacent
  pathway context without fabricating cross-pathway edges.'
