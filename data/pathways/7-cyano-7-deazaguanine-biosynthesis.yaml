id: GO:0097288
label: 7-cyano-7-deazaguanine biosynthetic process
description: 'The complete four-transformation route from GTP to preQ0 in Escherichia coli K-12, independently
  defined by MetaCyc PWY-6703. FolE and QueD form dihydroneopterin triphosphate and carboxytetrahydropterin,
  QueE contracts the ring to carboxydeazaguanine, and QueC forms the nitrile. Current Rhea chemistry assigns
  two ATP-to-AMP activations to the QueC net step, superseding the obsolete one-ATP/ADP accounting in
  the retained native releases. The net QueE reaction regenerates SAM; radical activation and its physiological
  electron donor are not additional stoichiometric transformations here. Direct E. coli FolE/QueD assays,
  mixed-species pathway reconstruction, E. coli genetics and inferred K-12 QueE/QueC activities are distinguished.
  The native QueD hexamer represents a crystallographic assembly; reviewed solution trimers and dodecamers
  remain an unresolved assembly difference. The pathway ends at free preQ0: its reduction to preQ1, tRNA
  incorporation, queuosine maturation, transport and antibiotic branches are separate processes. Anaerobic
  purified-enzyme assay conditions protect oxygen-sensitive intermediates and clusters and do not establish
  that the cellular pathway operates only anaerobically.'
