id: GO:0019305
label: dTDP-rhamnose biosynthetic process
description: The complete four-step dTDP-L-rhamnose pathway converts alpha-D-glucose 1-phosphate and dTTP
  to dTDP-beta-L-rhamnose through thymidylyl transfer, dehydration, C3/C5 epimerization and NADPH-dependent
  reduction. It follows MetaCyc DTDPRHAMSYN-PWY, with the final reductase selected in the biosynthetic
  reverse direction of its written Rhea master equation. The protein scope is E. coli K-12. RmlA has direct
  biochemical and tetramer evidence; RmlB catalysis, dimerization and bound NAD are annotated by similarity
  to the RffG paralog. K-12 mutant extracts support RmlC function and a free 4-keto-rhamnose intermediate,
  while purified-enzyme stereochemical work in that study used M. tuberculosis. RmlD remains a probable
  K-12 pathway assignment with catalytic, magnesium and homodimer annotations by similarity to Salmonella
  RmlD. Functional RmlC/RmlD edges do not establish isolated-monomer sufficiency or an obligatory joint
  complex. RmlD NADH use is also annotated by similarity; the native NADPH route is represented here.
  Many K-12 lines are O-antigen deficient because of rfb-region mutations, so this pathway assignment
  does not imply O-antigen production in every K-12 derivative. The boundary ends at the nucleotide sugar;
  RffG/RffH compensation, enterobacterial common-antigen synthesis and downstream rhamnosyl transfer are
  separate.
