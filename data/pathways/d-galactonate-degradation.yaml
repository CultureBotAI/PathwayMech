id: MetaCyc:GALACTCAT-PWY
label: D-galactonate degradation
description: 'The complete three-step MetaCyc D-galactonate pathway dehydrates D-galactonate, phosphorylates
  the resulting 2-dehydro-3-deoxy-D-galactonate with ATP, and cleaves the phosphorylated intermediate
  to D-glyceraldehyde 3-phosphate and pyruvate. The scope is E. coli K-12: native protein annotations
  refer to MG1655, while modern growth and transcription experiments used BW25113 derivatives. Current
  reviewed DgoD and DgoA sequences correct an older predicted gene fusion. DgoD and DgoK catalytic assignments
  are retained as reviewed annotations supported by native pathway curation and genetic physiology; DgoA
  also has purified-enzyme and crystal evidence. Functional enzyme edges do not imply isolated-monomer
  sufficiency: DgoA is homotrimeric. DgoD magnesium binding is annotated by similarity. DgoR represses
  the dgo operon, and D-galactonate relieves its DNA binding under the tested conditions. Later recombinant-protein
  work supports a divalent-metal requirement for effector binding without identifying a unique physiological
  metal. The selected aldolase direction is catabolic despite its reversible native reaction. Uptake,
  upstream D-galactose oxidation, galactitol utilization and downstream glyceraldehyde-phosphate metabolism
  lie outside this exact pathway boundary.'
