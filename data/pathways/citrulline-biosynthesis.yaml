id: gomodel:YeastPathways_CITRUL-BIO2-PWY
label: citrulline biosynthesis
description: Citrulline biosynthesis in Saccharomyces cerevisiae S288C uses CPX-579
  carbamoyl-phosphate synthase to form carbamoyl phosphate from L-glutamine, hydrogencarbonate,
  water, and ATP, then ARG3 ornithine carbamoyltransferase transfers the carbamoyl
  group to L-ornithine to form L-citrulline in the SGD GO-CAM citrulline biosynthesis
  pathway.
