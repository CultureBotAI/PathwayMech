id: gomodel:YeastPathways_PWY-1801-1
label: formaldehyde oxidation II (glutathione-dependent)
description: Formaldehyde oxidation II in Saccharomyces cerevisiae S288C
  condenses formaldehyde with glutathione, oxidizes S-(hydroxymethyl)glutathione
  to S-formylglutathione, hydrolyzes S-formylglutathione to formate and
  glutathione, and oxidizes formate to carbon dioxide.
pathway_type: formaldehyde-degradation
