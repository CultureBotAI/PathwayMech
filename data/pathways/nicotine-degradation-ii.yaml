id: MetaCyc:PWY-6993
label: nicotine degradation II (pyrrolidine pathway)
description: 'The complete eleven-step native pyrrolidine pathway converts (S)-nicotine to fumarate and
  succinate, with methylamine, ammonium and formate coproducts. The experimentally characterized enzymes
  are scoped to Pseudomonas putida S16. Current NicA2 and Pnao reactions use two oxidized CycN carrier
  molecules per turnover; their older oxygen-based representations are superseded for this physiological
  role. N-methylmyosmine hydration is spontaneous. The SpmABC step retains a generic electron acceptor:
  its physiological acceptor is not assigned. The native NADP-dependent aldehyde and succinate-semialdehyde
  oxidation steps remain in the complete route, but an exact experimentally supported S16 catalyst is
  not asserted here for either step. NicA2 assembly reports differ, and functional protein edges do not
  assert an isolated monomer as the catalytic unit. HspB and maleate isomerase retain verified native
  dimers. CycN reoxidation, transport and metabolism beyond fumarate, succinate and the released coproducts
  are outside this record.'
pathway_type: nicotine-degradation
