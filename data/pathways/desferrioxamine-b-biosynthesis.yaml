id: MetaCyc:PWY-6376
label: desferrioxamine B biosynthesis
description: Complete five-transformation desferrioxamine B biosynthesis in Streptomyces coelicolor A3(2)/M145.
  Lysine decarboxylation and cadaverine N-hydroxylation supply both the succinylated HSC and acetylated
  HAC branches; DesD combines two HSC and one HAC in two successive ligations represented by one complete
  net reaction. RXN-11001 retains the source-issued complete organic transformation. Primary-supported
  successive adenylations imply two ATP, two AMP, two diphosphate and two H+ with no net water in the
  selected ionic forms. Native MetaCyc and KEGG instead encode one ATP and water. This is an explicit
  curated coefficient correction, not exact native-equation equivalence or a measured ATP/product coupling
  ratio. Native ionic compound identities preserve hydroxycadaverine(+1), HAC(+1), zwitterionic HSC and
  B(+1); old neutral ChEBI cross-references are not treated as exact. The native reaction retains generic
  reduced/oxidized electron-acceptor classes. It does not identify a specific physiological coelicolor
  donor. The S. sviceus NADPH/NADH experiments and the sequence-unmatched 2023 DesABC preparation do not
  establish donor specificity for this exact coelicolor protein. The coelicolor DesB activity remains
  a proposed native assignment. Current automatic UniProt MbtG/MbtK function names conflict with native/experimental
  DesB/DesC roles and are not adopted. PLP and FAD cofactor edges preserve current automatic inference
  rather than direct binding measurements on the selected proteins. Direct DesA evidence is abstract-limited;
  the M145-derived DesC preparation supports both acylations and monomeric behavior, but the complete
  construct sequence is not verified. The 2023 DesABC construct sequences differ from current coelicolor
  entries and are not transferred. In contrast, the coelicolor DesD native core is sequence-verified against
  the 2022 construct reused in 2023; the source-defined dimer is retained. Primary model details, physiological
  precursor-pool control, exact donor specificity and assembly outside the measured preparations remain
  limited. E synthesis/cyclization, ferric loading, uptake, longer-chain congeners and hypothetical DesG/DesH
  tailoring lie outside the complete B boundary.
