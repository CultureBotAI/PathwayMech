id: MetaCyc:RIBOSYN2-PWY
label: flavin biosynthesis I
description: Flavin biosynthesis I converts GTP into 5-amino-6-(5-phospho-D-ribitylamino)uracil, dephosphorylates that intermediate, condenses it with the D-ribulose 5-phosphate-derived precursor (2S)-2-hydroxy-3-oxobutyl phosphate to form 6,7-dimethyl-8-(1-D-ribityl)lumazine, and then forms riboflavin, FMN, and FAD.
pathway_type: cofactor-biosynthesis
