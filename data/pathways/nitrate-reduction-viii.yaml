  predicate: inhibits
  object: EcoCyc:NADH-DHI-CPLX
  description: 2µM ZnCl2 reduced reference pumping24%; no significant reference oxidation loss, but mutant
    oxidation exceptions prevent universal selectivity.
  evidence:
  - reference_id: PMID:27118783
    quote: proton pumping activity significantly decreased by 24%
    source_locator: Main Results Zn2+ section; HTML paragraph47
  endpoint_qualifiers: *id001
- id: e099
  subject: CHEBI:136538
  predicate: inhibits
  object: EcoCyc:NADH-DHI-CPLX
  description: 15µM EIPA reduced reference pumping to60.8%; D178N and other mutant exceptions remain explicit;
    no universal binding-site claim.
  evidence:
  - reference_id: PMID:27118783
    quote: In WT, the proton pumping activity was significantly decreased to 60.8% in the presence of 15 μM
      EIPA
    source_locator: Main Results EIPA section; HTML paragraph54
  endpoint_qualifiers: *id001
- id: e100
  subject: CHEBI:138511
  predicate: inhibits
  object: EcoCyc:NADH-DHI-CPLX
  description: 20µM piericidin A inhibits NADH:Q1/DQ activity in the specified BL21FS nanodisc preparation;
    no proton-pumping or nitrate/MK assay was performed.
  evidence:
  - reference_id: PMID:34308841
    source_assertion: Nanodisc complex I reduced Q1 and decylubiquinone with NADH. Reported Vmax values were
      2.2 +/- 0.2 and 5 +/- 1 micromol NADH per min per mg, falling to 0.4 +/- 0.1 and 0.3 with 20 micromolar
      piericidin A.
    source_locator: /article/body/sec[@id="s2"]/sec[@id="s2-1"]; fig1s2; final article values
  endpoint_qualifiers:
  - endpoint: object
    kind: experimental_construct
    description: BL21FS (BL21-AI derivative) with genomic N-terminal Twin-Strep/TEV-site NuoF, DDM purification
      and MSP2N2/E. coli-lipid nanodiscs; DQ assay contains0.003%LMNG. Not whole-operon overexpression or a
      sealed pumping compartment.
    evidence:
    - reference_id: PMID:34308841
      source_assertion: Complex I was purified from E. coli BL21FS, a BL21-AI derivative carrying a genomic
        NuoF N-terminal Twin-Strep tag and TEV recognition site; the pCas/pTargetF editing plasmids were cured.
      source_locator: /article/body/sec[@id="s4"]/sec[@id="s4-1"]/p[1]
