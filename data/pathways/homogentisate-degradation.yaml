id: GO:1902000
label: homogentisate catabolic process
description: The complete three-step central homogentisate pathway in Pseudomonas putida strain U converts
  homogentisate through 4-maleylacetoacetate and 4-fumarylacetoacetate to fumarate and acetoacetate.
  HmgA, HmgC and HmgB act in that chemical order. Strain U gene disruptions and cluster complementation
  support pathway function; HmgB and HmgC assignments also depend on sequence-based functional interpretation,
  rather than purified strain U enzyme assays. The deposited strain U sequences identify the three proteins
  precisely. The selected boundary starts at homogentisate and ends at fumarate plus acetoacetate; upstream
  phenylalanine, tyrosine and hydroxyphenylacetate routes are outside this record. HmgA assembly and
  iron binding, HmgB metal annotations, and protein localization retain their computational evidence
  limits. The related KT2440 enzyme experiments and expression context are not treated as direct strain
  U measurements.
pathway_type: homogentisate-degradation
