id: gomodel:YeastPathways_PWY-5653
label: NAD biosynthesis from 2-amino-3-carboxymuconate semialdehyde
description: NAD biosynthesis from 2-amino-3-carboxymuconate semialdehyde in Saccharomyces
  cerevisiae S288C cyclizes 2-amino-3-carboxymuconate-6-semialdehyde to quinolinic acid, converts
  quinolinic acid to nicotinate D-ribonucleotide, adenylates nicotinate D-ribonucleotide to
  deamido-NAD through NMA1 or NMA2 nicotinate-nucleotide adenylyltransferase activity, and
  amidates deamido-NAD with glutamine to form NAD.
pathway_type: cofactor-biosynthesis
