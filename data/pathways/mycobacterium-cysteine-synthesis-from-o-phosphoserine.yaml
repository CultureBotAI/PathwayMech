id: Reactome:R-MTU-936654
label: Cysteine synthesis from O-phosphoserine
description: 'The CysM-CysO route in Mycobacterium tuberculosis transfers O-phosphoserine onto thiocarboxylated
  CysO, then Mec releases L-cysteine and regenerates the carrier. The graph begins at CysO-COSH: the upstream
  MoeZ sulfur-charging step is excluded because its physiological sulfur donor is unresolved. Carrier
  modification states, PLP-bearing CysM and the source zinc-containing, cleaved Mec assembly remain distinct.'
