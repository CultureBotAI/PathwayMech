id: PathBank:SMP0002038
label: Pyrimidine Ribonucleosides Degradation
description: The full seven-step PathBank route for Escherichia coli comprises five biochemical reactions
  and two NupG proton-coupled imports. Periplasmic CpdB hydrolyzes uridine 2′,3′-cyclic phosphate through
  3′-UMP to uridine; imported uridine and cytidine feed cytosolic uridine phosphorolysis, with cytidine
  first deaminated by the zinc-containing Cdd homodimer. The Udp hexamer releases uracil and alpha-D-ribose
  1-phosphate, and DeoB converts the sugar phosphate to D-ribose 5-phosphate. The curated K-12 scope follows
  reviewed proteins and native annotations; historical mutant assays and recombinant studies do not measure
  wild-type flux through the entire route. Exact native compartment states are retained for uptake, and
  inferred dependencies link them to reaction-class chemistry. CpdB metal specificity remains a similarity
  annotation, while Mn2+ and Co2+ are alternative assay activators of DeoB. The narrower two-reaction
  MetaCyc:PWY0-1295 core is not asserted to be equivalent to this complete PathBank pathway.
pathway_type: pyrimidine-ribonucleoside-catabolism
