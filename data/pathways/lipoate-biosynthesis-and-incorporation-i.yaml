id: MetaCyc:PWY0-501
label: lipoate biosynthesis and incorporation I
description: The complete two-step endogenous LipB-LipA route in E. coli K-12 transfers an octanoyl group
  from ACP to a target-protein lysine, then inserts sulfur at C6 and C8. The endpoint is protein-bound
  dihydrolipoyl state, following the native MetaCyc boundary and current Rhea chemistry. Whole ACP, target-protein,
  ferredoxin and cluster-carrier states remain distinct from reactive-part ChEBI moieties. Rhea 142 formally
  releases Fe(III), consumes oxidized ferredoxin and uses four hydrons, whereas MetaCyc 22.5 releases
  Fe(II), consumes reduced ferredoxin and uses six; those net conventions are preserved as a source conflict,
  not resolved into a measured physiological electron balance. LipB has active monomer/trimer annotations;
  the native LipA dimer is retained alongside the UniProt monomer/dimer alternative. The selected proteins
  are K-12, while primary biochemical abstracts generally report E. coli without independently establishing
  every strain detail. The older PathBank donor labeled acetyl-ACP is rejected. Fatty-acid synthesis,
  LplA salvage, Fe-S cluster regeneration, and downstream lipoyl-cofactor turnover are outside the two-step
  boundary.
