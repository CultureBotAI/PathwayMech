- id: lipoate-edge-018
  subject: UniProtKB:P60720
  predicate: catalyzes
  object: RHEA:17666
  evidence:
  - reference_id: UniProtKB:P60720
    source_assertion: K-12 LipB FUNCTION supports octanoyl transfer with experimental citations 15642479/16342964;
      the separate RHEA:17665 catalytic annotation is HAMAP ECO:0000255. SUBUNIT reports active monomer
      and homotrimer with ECO:0000269 PMID:15642479.
    source_locator: /organism/taxonId; /comments/0; /comments/1; /comments/4
  - reference_id: PMID:12591875
    source_assertion: Purified E. coli LipB transfers octanoyl or lipoyl groups from ACP thioesters to
      a pyruvate-dehydrogenase lipoyl domain. The upstream TTG start yields functional protein; the historically
      assigned ATG yields an inactive truncated form.
    source_locator: /resultList/result[id="12591875"]/abstractText
  - reference_id: PMID:15642479
    source_assertion: The primary abstract reports purified LipB transfer of octanoyl-ACP to apo-H protein,
      with apparent Km values for both substrates. It does not separately document the oligomer comparison
      in the inspected abstract.
    source_locator: /resultList/result[id="15642479"]/abstractText
  - reference_id: PMID:16342964
    source_assertion: An isolated octanoyl-C169 LipB thioester transfers its acyl group to an E. coli
      PDH domain or back to ACP; the paper supports an acyl-enzyme mechanism and reversibility in vitro.
    source_locator: /resultList/result[id="16342964"]/abstractText
  - reference_id: RHEA:17666
    source_assertion: RHEA:17665 links directional member RHEA:17666; the selected left-to-right member
      is the physiological octanoyl transfer.
    source_locator: http://rdf.rhea-db.org/17665 rh:directionalReaction http://rdf.rhea-db.org/17666
  description: The protein node includes the experimentally annotated active monomer; a separate stable
    external homotrimer identity was not established. Selecting physiological transfer does not deny the
    measured reverse reaction.
- id: lipoate-edge-019
  subject: MetaCyc:CPLX0-782
  predicate: catalyzes
  object: RHEA:16586
  evidence:
  - reference_id: MetaCyc:RXN0-949
    source_assertion: RXN0-949 lists ENZRXN0-1087 with catalyst CPLX0-782 and explicitly unifies RHEA:16586.
      Core octanoyl-to-dihydrolipoyl chemistry agrees, while formal iron/ferredoxin/hydron conventions
      differ from Rhea 142.
    source_locator: Reaction[@frameid="RXN0-949"]/enzymatic-reaction; dblink[dblink-db="RHEA"]; left;
      right
  - reference_id: UniProtKB:P60716
    source_assertion: Reviewed K-12 LipA supports sulfur insertion into protein-bound octanoyl groups,
      not free octanoate. Its catalytic activity links RHEA:16585 with HAMAP inference and experimental
      PMID:15157071.
    source_locator: /organism/taxonId; /comments/0; /comments/1
  - reference_id: PMID:14700636
    source_assertion: Restoring LipA converted a deuterated octanoyl PDH domain to a lipoylated domain.
      Octanoyl-domain and octanoyl-PDH substrates also underwent sulfur insertion in vitro.
    source_locator: /resultList/result[id="14700636"]/abstractText
  - reference_id: PMID:15157071
    source_assertion: Octanoylated glycine-cleavage H protein is a LipA substrate. Deuterium transfer
      and two SAM cleavages per formed lipoyl group support radical attack on the protein-bound chain.
    source_locator: /resultList/result[id="15157071"]/abstractText
  - reference_id: PMID:15740115
    source_assertion: The primary experiment identifies LipA itself as the sulfur source and finds that
      both sulfur atoms of a lipoyl group derive from the same polypeptide.
    source_locator: /resultList/result[id="15740115"]/abstractText
  description: The catalyst is the native annotated dimer, not an assertion that only dimers can function.
    Current UniProt also allows monomers. The 2004 two-polypeptide mechanistic interpretation is qualified
    by the 2005 same-polypeptide sulfur result; neither proves every formal Rhea redox participant in
    vivo.
