id: gomodel:YeastPathways_PWY3O-8
label: xylose metabolism
description: Xylose metabolism in Saccharomyces cerevisiae S288C uses GRE3 aldose
  reductase to reduce D-xylopyranose to xylitol with NADPH, and XYL2 xylitol dehydrogenase
  to oxidize xylitol to D-xylulose with NAD+ in the SGD GO-CAM xylose metabolism pathway.
