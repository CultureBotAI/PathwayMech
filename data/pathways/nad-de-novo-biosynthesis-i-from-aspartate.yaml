id: MetaCyc:PYRIDNUCSYN-PWY
label: NAD de novo biosynthesis I (from aspartate)
description: NAD de novo biosynthesis I oxidizes L-aspartate to iminosuccinate, condenses iminosuccinate
  with dihydroxyacetone phosphate to form quinolinate, converts quinolinate through nicotinate beta-D-ribonucleotide
  to deamido-NAD(+), and amidates deamido-NAD(+) through either an ammonia-dependent or glutamine-dependent
  NAD(+) synthase.
pathway_type: cofactor-biosynthesis
