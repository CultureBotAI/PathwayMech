id: gomodel:YeastPathways_PWY-5670-1
label: epoxysqualene biosynthesis
description: Epoxysqualene biosynthesis in Saccharomyces cerevisiae S288C converts
  farnesyl diphosphate to presqualene diphosphate, reduces presqualene diphosphate
  to squalene, and monooxygenates squalene to form (S)-2,3-epoxysqualene.
