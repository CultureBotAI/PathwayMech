id: MetaCyc:PWY0-43
label: conversion of succinate to propanoate
description: 'The Sbm/ScpABC three-enzyme biochemical cycle annotated for Escherichia coli K-12 MG1655
  couples succinyl-CoA rearrangement, methylmalonyl-CoA decarboxylation and CoA transfer to succinate.
  Adenosylcobalamin supports Sbm mutase activity. Recombinant enzyme assays support the proposed cycle,
  but do not establish wild-type pathway flux. The graph retains the current reviewed Rhea/UniProt assignment
  of (R)-methylmalonyl-CoA to ScpB as an annotation with unresolved experimental stereospecificity: the
  original coupled assay did not resolve the methylmalonyl-CoA enantiomers, while later engineered strains
  required a heterologous epimerase for propionate production from glucose in minimal medium. A later
  direct ScpB assay used an R/S substrate mixture and also observed hydrolysis. These findings remain
  a source conflict; no unverified native epimerase is added. The native Sbm dimer and ScpB hexamer are
  represented as assemblies; apo-Sbm can also occur as a monomer.'
pathway_type: proposed-succinate-decarboxylation-cycle
