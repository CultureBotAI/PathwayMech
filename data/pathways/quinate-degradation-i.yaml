id: MetaCyc:QUINATEDEG-PWY
label: quinate degradation I
description: The three-step MetaCyc 27.0 quinate degradation I definition converts L-quinate through 3-dehydroquinate
  and 3-dehydroshikimate to protocatechuate. The initial oxidation retains the source-defined quinone/quinol
  classes; PQQ is an enzyme cofactor, not a net reaction substrate. The shared dehydroquinate dehydration
  is reversible although the pathway selects catabolic forward flux. Enzyme evidence is qualified by organism,
  preparation and construct; the record does not assert a purified three-enzyme reconstitution in one
  strain.
