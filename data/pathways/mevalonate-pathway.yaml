id: gomodel:YeastPathways_IPPSYN-PWY
label: mevalonate pathway
description: The mevalonate pathway in Saccharomyces cerevisiae S288C condenses acetyl-CoA to acetoacetyl-CoA, forms 3-hydroxy-3-methylglutaryl-CoA and mevalonate, phosphorylates mevalonate to 5-diphosphomevalonate, decarboxylates that intermediate to isopentenyl diphosphate, and isomerizes it to prenyl diphosphate.
