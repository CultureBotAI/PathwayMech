id: MetaCyc:PWY-6534
label: phenylethylamine degradation II
description: 'The complete native two-reaction route converts 2-phenylethylamine through phenylacetaldehyde
  to phenylacetate in Pseudomonas putida strain U. The CTQ-containing PeaACD quinohaemoprotein dehydrogenase
  uses an external electron acceptor, unlike the copper/TPQ oxidase of degradation I. The complete Rhea
  equation retains the generic A/AH2 redox couple; it does not identify a strain-U physiological acceptor.
  Azurin-like carrier reconstitution used P. putida IFO 15366, and cytochrome c550 experiments used Paracoccus,
  so neither is substituted here. PeaACD composition and cofactor assignments are source-curated, with
  the strain-U heterotrimer assignment described as in silico in BRENDA. PeaB supports enzyme maturation/activity
  rather than serving as a fourth catalytic subunit. The NAD-dependent PeaE activity is retained without
  fixing its oligomeric state: native MetaCyc annotates a homodimer, whereas later secondary literature
  describes a PeaEFG complex. PeaE is not the only possible aldehyde-oxidizing activity; its deletion
  retains activity and growth, and PeaF/G are proposed contributors whose exact catalytic chemistry is
  not resolved here. This record does not claim that the listed proteins alone reconstitute strain-U growth.
  Transport, cofactor maturation, respiratory-chain regeneration and downstream phenylacetate assimilation
  lie outside the two native reactions. The 2008 strain-U primary abstract was inspected; its full body
  was unavailable, so detailed database statements are not presented as directly inspected primary results.'
