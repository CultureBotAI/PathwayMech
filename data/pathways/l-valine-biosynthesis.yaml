id: MetaCyc:VALSYN-PWY
label: L-valine biosynthesis
description: L-valine biosynthesis condenses pyruvate to (2S)-2-acetolactate, reduces and rearranges it
  to (2R)-2,3-dihydroxy-3-methylbutanoate, dehydrates that intermediate to 3-methyl-2-oxobutanoate, and
  transaminates it to L-valine.
pathway_type: amino-acid-biosynthesis
