id: gomodel:YeastPathways_PWY3O-17
label: thiamine biosynthesis
description: Thiamine biosynthesis in Saccharomyces cerevisiae S288C builds the pyrimidine
  and thiazole branches, condenses 4-amino-2-methyl-5-diphosphonatooxymethylpyrimidine and
  4-methyl-5-(2-phosphonatooxyethyl)thiazole to thiamine monophosphate, and dephosphorylates
  and diphosphorylates it to thiamine diphosphate.
