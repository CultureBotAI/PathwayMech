id: gomodel:YeastPathways_YEAST-GALACT-METAB-PWY
label: galactose degradation
description: Galactose degradation in Saccharomyces cerevisiae S288C epimerizes beta-D-galactose
  to alpha-D-galactose, phosphorylates it, transfers UDP-glucose to form alpha-D-glucose
  1-phosphate and UDP-galactose, regenerates UDP-glucose, and converts alpha-D-glucose
  1-phosphate to D-glucose 6-phosphate in the SGD GO-CAM galactose degradation pathway.
pathway_type: galactose-degradation
