id: gomodel:YeastPathways_PWY3O-1743
label: mannose degradation
description: Mannose degradation in Saccharomyces cerevisiae S288C phosphorylates
  D-mannopyranose with ATP through GLK1 glucokinase or HXK1/HXK2 hexokinase activity
  to produce D-mannopyranose 6-phosphate, ADP, and hydron, and converts D-mannopyranose
  6-phosphate through PMI40 mannose-6-phosphate isomerase activity to beta-D-fructofuranose
  6-phosphate.
