- id: galb-2016-copper-inhibition
  subject: CHEBI:29036
  predicate: inhibits
  object: MetaCyc:CPLX-8178
  description: Under the 2016 metal-substitution assay, Cu2+ gave 0.19 ± 0.10% CHM hydration activity
    versus 4.0 ± 0.33% in the apo row, with Fe2+ = 100%. This is lower activity in a 50 µM Cu2+-challenged
    apo preparation (50 µM CHM, 100 mM HEPES pH 7.0, 25 °C), not a measured physiological inhibition or
    an untreated Zn-loaded GalB effect. Metal stripping/washing and preincubation conditions are distinct
    from the EDTA-present row.
