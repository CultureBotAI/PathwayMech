id: MetaCyc:GALLATE-DEGRADATION-I-PWY
label: gallate degradation II
description: 'Source-defined five-step gallate route through PDC, keto OMA, the formal E,E enol and CHA
  to pyruvate and oxaloacetate. Native P. putida/PDC extract evidence and component-specific assays have
  different scopes. Other component taxa do not establish whole-route occurrence. Exact LigJ and BR6020
  PmdE E,E catalysis is deferred; historical preparations are not equated with modern reference sequences.
  The native narrative Z,Z link conflicts with the formal E,E structure. Adjacent activities remain assay
  context, not additional pathway steps.


  The five-member route is the native gallate degradation II definition (identifier suffix I). The 1982
  purified B. fuscum and P. aeruginosa 3,4-dioxygenases formed PDC; they are not identified with P. putida
  CPLX-2721. The 1975 crystalline gift has unresolved organism provenance and its oxygen-uptake kinetics
  did not identify PDC.


  The purified 1982 P. testosteroni PDC hydrolase is separate from the unpurified P. putida PDC-isolate
  enzyme. Its reversible equilibrium and rates depend on pH. EDTA stabilized diluted solutions without
  measured catalytic activation; Mg/EDTA assay negatives and pure pyrone-monocarboxylate negatives are
  conditional. GSH protected during DTNB challenge rather than reversing completed damage.


  Historical P. putida PDC-isolate extract time courses support downstream keto/enol products, pyruvate
  and oxaloacetate without exact contemporary catalyst or absolute-isomer assignments. Growth/induction
  tables compare separate strains and carbon co-supply; they do not supply named transcriptional regulators
  or complete-route organism transfers.


  LigJ2000 perturbations concern a recombinant SYK-6 enzyme acting on a PDC-derived keto/two-enol mixture.
  The true isomer was unresolved; the exact E,E catalyst assertion is held. Direct E6 PmdE in the 2016
  GalD-derived assay is distinct from BR6020 homology evidence and modern SYK-6 KCH hydration. Inaccessible
  LigJ2018 main text and thesis remain gaps; STRenda metadata conflicts are not resolved by inference.


  Historical 1983 enzyme I/II partial fractions, homogeneous 1985 ProH, purified 1990 ProA and later recombinant
  proteins remain distinct preparations. Mixed-fraction metal/chelator tests do not establish individual
  protein regulation. The printed 1983 CuSO2 identity remains unresolved. Its OMA-like gallate product
  and one-enantiomer inference remain source-specific observations rather than overrides of the 1982 PDC
  entry or 1990 optical-substrate experiments.


  ProA1990 supports both CHA optical forms and adjacent generic HMG/HG cleavage and OA decarboxylation.
  Optical l/d labels do not establish R/S. Metal-only nonenzymatic cleavage, conditional thiol/substrate
  negatives, buffer effects and uncertain physiological OA decarboxylation are preserved as context. The
  adjacent reactions are not extra formal route members.


  ProA phosphate-depletion experiments separate nine activating reagents from high-dose inhibition and
  ATP/Mg competition in another assay. Phosphate delivery was a KH2PO4/K2HPO4 mixture. Arsenate, parent
  acids/nucleotides and reagent salts retain stated form limits; proposed P–H/carbonate activating species
  are not measured speciation. Nineteen anion non-activation tests, solvent negatives and unchanged heat
  stability remain condition-bound.


  GalB2011 reports 244 residues, the reference has 258, and the 2016 crystal is 240; these preparations
  are not collapsed or assigned an unsupported His tag. EDTA-present inhibition and washed metal-reconstituted
  apoenzyme are separate assays. E6 PmdE underwent His6 handling and thrombin cleavage, but the full insert
  and residual scar remain unresolved. Formal CHA remains stereochemistry-unspecified.


  Reaction-node direction follows the issuing Rhea quartet. Native MetaCyc REVERSIBLE annotations remain
  separate evidence; the selected material flow is unchanged. RHEA:17403 is the right-to-left member relative
  to its master equation and represents enol hydration in this route. The adjacent HG activity uses the
  forward cleavage member RHEA:18170. ProA1990 separately measured equilibrium with optical l-HG (approximately
  0.03 ± 0.01 M at pH 8 and 25 °C; pp.331–332), while d-HG was practically inert. This does not establish
  absolute R/S configuration or equilibrium in vivo.'
