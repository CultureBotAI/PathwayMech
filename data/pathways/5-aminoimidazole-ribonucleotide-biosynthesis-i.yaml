id: MetaCyc:PWY-6121
label: 5-aminoimidazole ribonucleotide biosynthesis I
description: 5-Aminoimidazole ribonucleotide biosynthesis I converts 5-phospho-alpha-D-ribose 1-diphosphate to 5-amino-1-(5-phospho-beta-D-ribosyl)imidazole through 5-phospho-beta-D-ribosylamine, glycinamide ribonucleotide, folate-dependent formylation to FGAR, and ATP-dependent amidine formation and cyclization.
