id: PathBank:SMP0002081
label: Adenine and Adenosine Salvage I
description: 'PathBank SMP0002081 (native BioPAX archive member PW002069.owl) models Escherichia coli
  adenine and adenosine salvage through periplasmic-to-cytosolic adenine uptake coupled to the four-reaction
  nucleoside-phosphorylase, adenosine-deaminase, and hypoxanthine-phosphoribosyltransferase route to IMP.
  Transport505 moves periplasmic adenine and H(+) into the cytosol via the high-affinity proton-dependent
  adenine permease AdeP (UniProtKB:P31466; native displayName Probable adenine permease PurP). Cytosolic
  adenine is ribosylated with alpha-D-ribose 1-phosphate by hexameric DeoD purine nucleoside phosphorylase
  (MetaCyc:DEOD-CPLX, six copies of UniProtKB:P0ABP8) in the synthetic direction of RHEA:27644 to form
  adenosine and hydrogenphosphate. Adenosine deaminase Add (UniProtKB:P22333) hydrolyzes adenosine with
  water and H(+) to inosine and ammonium (RHEA:24409). DeoD then cleaves inosine with hydrogenphosphate
  in the phosphorolytic direction of RHEA:27647 to regenerate alpha-D-ribose 1-phosphate and release hypoxanthine.
  Finally, hypoxanthine is phosphoribosylated with 5-phospho-alpha-D-ribose 1-diphosphate (PRPP) to IMP
  and diphosphate (RHEA:17975).


  Native PW002069.owl assigns Reaction6052 (EC 2.4.2.22) to homotetrameric xanthine-guanine phosphoribosyltransferase
  Gpt (ProteinComplex/4059, four copies of Protein/6129 cross-referenced to UniProtKB:P0A9M5; MetaCyc:GPT-CPLX),
  whereas the EcoCyc/MetaCyc counterpart PWY-6609 and Escherichia coli K-12 genetic studies (PMID:765747)
  also include homotetrameric hypoxanthine phosphoribosyltransferase Hpt (MetaCyc:CPLX0-7685, four copies
  of UniProtKB:P0A9M2), which preferentially utilizes hypoxanthine and is feedback-inhibited by product
  IMP(2-). Both characterized E. coli K-12 phosphoribosyltransferase complexes are retained as catalysts
  of RHEA:17975 with their distinct substrate preferences and evidence provenance documented.


  Native PW002069.owl encodes species-level Escherichia coli (NCBITaxon:562), while the five reviewed UniProtKB
  accessions, EcoCyc/MetaCyc complexes, and primary biochemical and genetic studies refer to Escherichia
  coli K-12 (NCBITaxon:83333). The native periplasmic compartment reference GO:0005620 is obsolete in
  current GO and is represented by its replacement term GO:0042597 (periplasmic space). Transcriptional
  repression of adeP by PurR (MetaCyc:PC00033) and induction of add expression by exogenous adenine via
  an uncharacterized mechanism are retained from EcoCyc/MetaCyc and primary literature.'
