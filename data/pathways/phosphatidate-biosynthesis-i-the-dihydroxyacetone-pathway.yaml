id: gomodel:YeastPathways_PWY3O-6407
label: phosphatidate biosynthesis I (the dihydroxyacetone pathway)
description: Phosphatidate biosynthesis I in Saccharomyces cerevisiae S288C acylates
  glycerone phosphate to 1-acylglycerone 3-phosphate, reduces it to 1-acyl-sn-glycerol
  3-phosphate, and acylates that lysophosphatidate to 1,2-diacyl-sn-glycerol 3-phosphate
  through the SGD GO-CAM dihydroxyacetone pathway.
pathway_type: lipid-biosynthesis
