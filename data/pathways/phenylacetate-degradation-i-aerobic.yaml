  description: Native RXN0-6512 is a coupled net, retained in its source orientation and inverted for
    pathway flux. The 2010 assay already contained PaaG when PaaJ was added and therefore did not isolate
    PaaJ-only chemistry. A mechanistically inferred cis-3,4-dehydroadipyl-CoA intermediate separates thiolysis
    from isomerization to the source E-2,3 product. Current exact isolated PaaJ reaction authority remains
    CHEM02 open; local step keys are curatorial coordinates, not biological CURIEs. Ten planning steps
