id: MetaCyc:PWY0-321
label: phenylacetate degradation I (aerobic)
description: 'Aerobic phenylacetate degradation retains all nine native MetaCyc members and the full CoA-linked
  route to two acetyl-CoA and one succinyl-CoA. The sequential biochemical reconstruction used Pseudomonas
  sp. Y2 PaaABCE/PaaG/PaaJ/PaaF and E. coli K-12 PaaZ/PaaH; native Azoarcus evansii KB740 PaaK was a separate
  preparation. A list of source taxa does not establish the entire route in every listed organism. The
  nested details split the native C8 thiolysis/isomerization net into local claims with an inferred cis-3,4
  intermediate; these coordinates are not new reaction identifiers, and ten planning steps are not an
  exhaustive elementary count. Native source structures and directions remain visible. In the upper route,
  native/PubChem E oxepin conflicts with the Z interpretation of the primary drawing and ChEBI entry;
  explicit alternative detail preserves that unresolved stereochemical distinction. CCD LHQ also differs
  in constitution and is not used to join these structures.


  Y2 PaaABCE uses an MBP-PaaA-containing recombinant preparation; PaaD does not copurify. Nature 2012
  reports approximately A2B3–4C2E1, while its SI Table 1 gives A2B2–3C2E1. Neither is imposed as universal
  integer stoichiometry. Bulk iron (6.3±0.1 per A2E1), acid-labile sulfur (1.9±0.2 per E), FAD (0.73 per
  E), spectroscopy and analogy support a di-iron/PaaA and FAD/[2Fe-2S]/PaaE model. They do not establish
  each catalytic oxidation state or a physiological FAD microstate. The 2011 E. coli structural preparations
  and artificial cytochrome-c reduction assay are distinct. Lack of deposited Fe/Zn/Mg/Mn in the reviewed
  structures is not absence of functional metal; the 5.8 Å Fe-soaked data are not a refined di-iron atomic
  structure. PaaD maturation is proposed; its 2006 W14 deletion/rescue readout was extracellular 2-hydroxyphenylacetate
  (700 to less than 1, rescued to 210 µM) after 24 h at 37°C in M63/glycerol plus 1 mM phenylacetate,
  not direct hydroxylation or pathway flux.


  The same Y2 oxygenase can consume NADPH to deoxygenate the epoxide. Oxygen readdition restarts epoxidation;
  this is not the simple reverse of the oxygenation equation. Nature 2012 Fig. 2 used 0.25 mg/ml enzyme,
  0.1 mM phenylacetyl-CoA and 1 mM NADPH at 30°C with shaking. Approximately 0.4 U/mg deoxygenation and
  17±2 µM epoxide Km are indirect estimates; approximately 1.8 NADPH per O2 is compatible with the two-reductant
  cycling model plus decay. The cellular detoxification role is proposed. Benzoyl-CoA instead causes transient
  NADPH oxidation and inhibition without a detected HPLC product at 0.05–0.3 mM; this does not establish
  another catalytic pathway input.


  The lower Y2 PaaG assignment is inferred from the 2010 coupled assay, while later E. coli PaaFG and
  Thermus thermophilus JL-18 PaaG studies have distinct sequence/construct scopes. E. coli PaaFG forms
  an assembly of six PaaF and six PaaG chains (4FZW; distinct 258/274-aa constructs), with no demonstrated
  connecting tunnel; improved intermediate transfer is a proposal. The related 4II4 E49Q/K68Q construct
  is not wild type. The available 2019 Thermus SI uses trans-3,4 substrate as a surrogate and has construct/caption
  distinctions; it does not establish the natural cis substrate or close the unavailable primary-main
  claim about a spontaneous upper-route tautomer.


  PaaZ domain separation supports hydrolysis and NADP+-dependent aldehyde oxidation, with an inferred
  unstable semialdehyde. The 2011 E256Q construct and the 2012 SI E56Q text are a source discrepancy,
  not two established mutants. Nature 2012 corrects the earlier NAD+ activity and NADP+ Km as described
  in the local detail. The 2019 six-subunit cryoEM architecture is three domain-swapped dimers; apo, NADPH,
  and NADP+ plus octanoyl/crotonyl surrogate structures have distinct ligand states and sometimes partial
  density. Proposed electrostatic substrate pivoting is not direct visualization of natural intermediate
  transfer. Growth mutants K69A, R613A, K636A and C295A use a separate ASKA context; Methods K631A conflicts
  with the R613A account. SEC comparison concerns wild type and K69A, not every mutant.


  The cyclic side product and PaaY hydrolysis are contextual salvage, not additional native route members.
  PaaI and PaaY in Nature 2012 are N-terminal MBP fusions; native-mass activity correction does not demonstrate
  tag removal. Assays use pH 8, 22°C for these thioesterases and 30°C for PaaABCE/PaaZ, at least two independent
  measurements, and 1% formic-acid stop to pH 4.5–5. The PaaI/PaaY tested relative activities (I/Y) were
  phenylacetyl-CoA 100/19, epoxide 10/30, oxepin less than 1/3, cyclic derivative 9/100, C8 acid less
  than 1/3, 3,4-dehydroadipyl-CoA 18/less than 1, and acetyl-/succinyl-CoA less than 1. This finite panel
  is not universal substrate exclusion. Phenylacetate/glucose-grown extracts had PaaI 100/60 and PaaY
  13/1.5 mU/mg at 30°C, compatible with induction but not transcript or flux measurements. In 2006, E.
  coli ATCC 11105/W PaaI kinetics and A. evansii DSM 6898 kinetics differed: phenylacetyl-CoA kcat/Km
  were 0.41 s−1/9.6±0.9 µM and 3.7 s−1/390 µM, respectively; the E. coli 3,4-dihydroxy substrate gave
  100 s−1/16 µM. These pET23b/BL21 kinetic preparations are separate from the C-terminally tagged crystallographic
  proteins. Residual E. coli D61A activity was suspected host contamination; A. evansii D75A was undetectable,
  and the A. evansii mutant activities did not change after gel filtration. A general-base versus covalent
  mechanism remains unresolved; the 2FS2/1PSU discrepancy remains source-specific.


  Regulation is retained as qualified evidence and pending endpoint-specific edges. PaaX repression of
  Pa/Pz and phenylacetyl-CoA relief were measured using E. coli W-derived crude preparations and distinct
  reporters. Table II of the 2000 paper uses AF15PZ chromosomal Pz-lacZ, pAFX2 and optional pAFK5 with
  0/1 mM phenylacetate at 30°C in M63/glycerol; Table III uses Pa-lacZ plasmids in AF15 with optional
  pAFX2 and does not state phenylacetate supplementation. The wild-type Pa repression ratio was 30.4,
  versus 1.1/4.3/1.8/4.7 for mutants. ORA and ORZ footprints span −1:+51 and −30:+17, with a bounded 15-base
  motif. Approximate 7/150 µg total protein/ml apparent DNA-binding quantities are not molar PaaX affinities;
  approximately 30 µM phenylacetyl-CoA half-release is not ligand Kd. Phenylacetate/benzoyl-CoA at 2.5
  mM were negative. CRP (250 nM, 200 µM cAMP) bound Pa/full Pz-Pa, not isolated Pz, while IHF (250 nM)
  bound the full spacer, not Pa; a bridging model remains proposed. The peripheral E. coli W Ppac and
  Pseudomonas Y2 styA claims are distinct from core Pa/Pz: Ppac assays used crude PaaX and 125 µM phenylacetyl-CoA
  relief; CRP bound directly, whereas IHF did not shift PPAC despite a positive control. The 2006 Y2 MBP-PaaX1
  styA result does not establish purified PaaX2 function or exact open-complex blocking.


  SlyA 2017 provides direct binding of tagged SlyA to the 257-bp paaA/paaZ region and increased paaA–K
  expression (2.8-fold) in MG1655 with multicopy slyA under aerobic glucose-limited chemostat conditions
  (37°C, pH 6.9, dilution 0.2 h−1; two biological and two technical replicates). Binding used 1 nM DNA
  and 0–500 nM His6-SlyA at 25°C for 30 min; the roughly 50–100 nM affinity estimate spans several fragments.
  The three sequence motifs at −239/−136/−81 are candidates, not independently footprinted or mutated
  sites. No significant deletion effect at tested dilution rates is bounded by the twofold/P≤0.05 threshold;
  H-NS antagonism was not established at paa. SlyA 2020 reporter activation used MG1655 derivatives, plasmid
  overexpression and 16 h at 30°C in LB/0.05% arabinose; ppGpp was dispensable in that reporter condition,
  with no PpaaA EMSA in that paper. SrsR 2022 used W3110 type-A gSELEX/C-terminally His-tagged protein
  and separate BW25113/JW5476/ASKA expression experiments. The paa spacer peak was 170 against threshold
  150; EMSA used 0.1 pmol DNA/0–2 pmol SrsR. RT-qPCR at 24 h, 37°C, LB/0.5 mM IPTG and 16S normalization
  gave signed deletion/overexpression changes paaZ −69.9/+31, paaA −28.4/+5.7 and paaK −10.1/+10.5. These
  are transcript measurements, not RNA-seq or metabolic flux; footprinting was at yfdP/yfdO, not paa.


  Alternative ring-opening systems remain distinct context: A. aromaticum ECH-Aa and PacL have independently
  bound insert sequences but incomplete full MBP fusion bodies. ECH-Aa oxepin activity was 1.2±0.1 U/mg
  versus crotonyl-CoA 2300±340 U/mg; PacL gave 5.8±0.1 U/mg and preferred NAD+ with NADP+ at 60%, without
  a reported Km. A. evansii assayed BoxD is not identical to the A. aromaticum comparison sequence. CAI09349.1
  negative activity is not a positive hydratase edge. The Price P. bryophila strain attribution and OAS925
  sequence gap prevent transferring its fitness evidence onto the native P. caledonica reference; fitness
  is not direct catalysis. T. fusca and C. necator alternatives are retained in the source coverage ledger
  as adipate contexts, not silent replacements for the native aerobic route. Complete tag sequences and
  unissued isolated chemistry remain explicit gaps rather than fabricated identifiers.'
