  key: primary-paaz-aldehyde-oxidation
  source_reaction_id: MetaCyc:RXNMETA-12672
  relation_to_source: decomposition
  description: 'The N-terminal ALDH domain oxidizes the inferred ring-opened semialdehyde to the NMR/MS-characterized
    C8 acid using NADP+. Nature 2012 corrects the 2011 NAD+ activity estimate: NAD+ gives less than 5%
    of NADP+ activity; apparent NADP+ Km is 17±3 µM with excess PaaY and absorbance controls, superseding
    56±4 µM and approximately 50% NAD+ activity. This is specific to the E. coli PaaZ preparation; the
    distinct A. aromaticum PacL preference is not a cofactor substitution. Native NADP+/NADPH, water and
    two protons follow the exact source microstates.'
