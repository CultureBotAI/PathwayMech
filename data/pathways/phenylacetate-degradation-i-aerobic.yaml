- version: 1
  key: primary-paay-salvage
  source_reaction_id: MetaCyc:RXN0-7103
  relation_to_source: decomposition
  description: N-terminal MBP-PaaY from E. coli K-12 hydrolyzes the cyclic CoA derivative and releases
    CoA. At 22°C, pH 8, activity is 7.6±0.6 U/mg and apparent Km is 35±15 µM. PaaY at 44 µg/ml supports
    continued ring cleavage with 4.1 µg/ml PaaZ and 0.5 mM oxepin in the 2012 experiment. Main Methods
    says absent NADPH for one condition whereas SI Fig. 11 says absent NADP+; the SI is the condition-specific
    source. Intracellular rescue and epoxide control are physiological proposals, not directly measured
    cellular flux.
  evidence:
  - reference_id: PMID:22398448
    quote: specifically hydrolyses inhibitory 2-hydroxycyclohepta-1,4,6-triene-1- carboxyl-CoA
    source_locator: PDF p. 3, main text, paragraph introducing PaaY; line wrap retained as a space
