- version: 1
  key: primary-abce-epoxidation
  source_reaction_id: MetaCyc:RXN0-2042
  relation_to_source: decomposition
  description: The Y2 MBP-PaaA-containing preparation yields ring-1,2-epoxyphenylacetyl-CoA by HPLC/MS/NMR;
    18O2, not H2-18O, supplies the oxygen. At 30°C, pH 8, NADPH activity is approximately 1 U/mg, NADH
    approximately 0.05 U/mg; apparent Km values are 23±3 µM NADPH, 6±1 µM phenylacetyl-CoA and 3±1 µM
    O2 (the oxygen measurement is coupled). PaaG/PaaZ increase substrate consumption approximately 1.5-fold.
    These kinetics do not establish cellular flux. The epoxide stereo unspecified issuer identity is retained.
    The 2010 apparent inactivation is qualified by the 2012 competing deoxygenation cycle.
  evidence:
  - reference_id: PMID:20660314
    quote: 13C-NMR analysis substantiated ring 1,2-epoxyphenylacetyl-CoA
    source_locator: Results, Phenylacetyl-CoA Oxygenase; Table 2 and Fig. 2B
  - reference_id: PMID:20660314
    quote: The genes for all subunits were expressed simultaneously with PaaA as a maltose-binding protein
      (mbp)-tagged protein.
    source_locator: Results, Phenylacetyl-CoA Oxygenase, first paragraph
  - reference_id: PMID:22398448
    quote: We observed nearly complete back conversion of ep-CoA to pa-CoA when O2 became limiting.
    source_locator: PDF p. 2, main text preceding Fig. 2
