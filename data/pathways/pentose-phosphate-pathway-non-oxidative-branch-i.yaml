id: MetaCyc:NONOXIPENT-PWY
label: pentose phosphate pathway (non-oxidative branch) I
description: The non-oxidative branch of the pentose phosphate pathway reversibly interconverts D-ribulose
  5-phosphate, aldehydo-D-ribose 5-phosphate, and D-xylulose 5-phosphate with D-sedoheptulose 7-phosphate,
  D-erythrose 4-phosphate, beta-D-fructose 6-phosphate, and D-glyceraldehyde 3-phosphate through isomerase,
  epimerase, transketolase, and transaldolase reactions.
