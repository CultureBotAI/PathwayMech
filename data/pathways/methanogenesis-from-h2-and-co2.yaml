id: MetaCyc:METHANOGENESIS-PWY
label: methanogenesis from H2 and CO2
description: |-
  MetaCyc METHANOGENESIS-PWY defines six ordered reactions from CO2 to methyl-CoM, using methanofuran, tetrahydromethanopterin and coenzyme M carriers. The source label is retained, but methyl-CoM reduction to methane belongs to the linked METHFORM-PWY boundary and is not a seventh member. Carrier regeneration, methane formation and a complete energy-conserving system are outside this six-member record. Native pathway evidence tags are source metadata, not independent proof of the complete route.

  The native Mtr equation specifies two Na+ on each side, from CCO-IN to CCO-OUT. CoM and methyl-THMPT inputs and Me-CoM and THMPT outputs are all explicitly inside; the other 24 material occurrences in the pathway have unspecified locations. Exact coefficients, source side, selected orientation and occurrence-specific locations are retained in incident descriptions/evidence and the research ledger. They do not establish newly measured sodium stoichiometry, a globally located sodium species, ATP yield or physiological flux. The Kurth2021 energy scheme is a model, not a purified Mtr transport assay.

  The fourth native member is Hmd using H2, distinct from the F420-dependent Mtd alternative discussed in Kurth2021. Five generic reaction definitions are reversible; the root selects R2L Fmd, L2R Ftr, R2L Mch, L2R Hmd, R2L Mer and L2R Mtr. Exact native reaction frame labels are retained where their own records lack common names. The Hmd abstract (PMID:1521540) supplies bounded corroboration, not evidence for replacing Hmd with Mtd.

  The root selects Mch dehydration, whereas native ENZRXN-662 and ENZRXN-4121 explicitly specify physiological L2R hydrolysis. Both activities remain exact molecular-activity nodes with their enzyme enables and regulation assertions; neither is assigned as a catalyst of the selected dehydration. The generic reaction remains reversible. PMID:3782039 and PMID:10215859 were read at abstract scope, without a new full-methods reconciliation of the opposing native directions.

  The three direct pathway associations are NCBITaxon:2208 Methanosarcina barkeri (species), NCBITaxon:145262 Methanothermobacter thermautotrophicus (species), and NCBITaxon:2179 Methanothermus (genus). Exact native pointers and the pinned NCBI Taxonomy 2026-07-12 label/rank statements support these identities. A species-slot placement does not turn Methanothermus into a species. These are source pathway associations, not demonstrations of all six reactions or all strains. Historical Euryarchaeota TAX-28890 is a separate source range; the pinned issuer labels that identifier Methanobacteriota. Catalyst and nested taxon contexts do not enlarge the three direct associations.

  Methanofuran, F420 and ferredoxin remain generic native classes. Specific methanofuran molecules, two-glutamate F420 examples, gamma-linked polymer polyanions and [2Fe-2S] reactive parts cannot substitute for those classes. No fixed ferredoxin sequence or universal electron capacity is assigned. Hmd, Mch and Mtr formally balance at the compared native representation; Fmd, Ftr and Mer remain undetermined because their generic terms lack complete molecular specifications.

  Eight native SMILES contain [R], including four nonclass compounds with concrete formula/InChI; native H2 also has a literal [H] SMILES. Independent issuing review reproduced twelve concrete CML constitutions/formulas/charges and eleven direct ChEBI InChI-derived matches at the compared isotope-unspecified resolution, without establishing CML drawing stereochemistry. FORMYL-THMPT is not an exact substitute for either neutral CHEBI:17114 or stereo-underdetermined CHEBI:58018. Hydron remains isotope-unspecified. Seven concrete KEGG ionic forms differ; native graph IDs are retained. Matching selected equations or structures does not establish a whole-pathway alias.

  Molybdenum and tungsten Fmd cofactors and cyanide responses remain catalyst-specific. The Mo inhibition is not transferred to the W isoenzyme or every Fmd reaction. Old single-MGD wording is not silently reconciled with native bis-pterin compounds. PMID:2253782 and PMID:8125106 supply abstract-level context; source cofactor and regulation assertions without fully read experimental originals remain source assertions.

  Historical Hmd statements about absent Ni, FeS and flavins do not establish absence of an iron cofactor. PMID:20221540 concerns an M. jannaschii iron-site study at the abstract scope read here; it does not identify the exact historical native catalyst or authorize a FeGP cofactor edge. Native Hmd tetramer and component assertions retain their historical source scope. Its Marburg molecular-weight prose is distinct from the Delta H O27211 pointer and its initiation caution.

  Mtr has an unresolved native cofactor conflict: ENZRXN-702 lists FeS and cobamide, while CPLX-643 prose names only a cobamide prosthetic group. Both statements remain on the affected cofactor edges with their separate native evidence. The 1993 abstract (PMID:8477726) and 1995 abstract (PMID:7737157) describe different preparations and seven versus eight polypeptides; their quantities are not merged into a single measured stoichiometry. Native fourfold-octamer composition and unspecified component coefficients remain source-scoped; component membership does not establish independent subunit catalysis.

  Historical Marburg prose, species-level objects and Delta H accession pointers are not treated as one strain or protein. The exact ENA X86477/CDS CAA60203.1 translation is 321 amino acids and matches Q50744 Marburg, differing from O27784 Delta H at residues 191, 196, 197, 213 and 247. The historical ENA taxon pointer and the distinct Q50744 position15 and O27784 position313 sequence cautions remain visible. Marburg taxon79929 has species parent145263, whereas Delta H187420 has parent145262. Native protein identities and historical assay contexts are retained without accession substitution or transfer of Marburg kinetics. PMID:7649177 and PMID:8522533 were read as distinct Marburg and Delta H abstracts.

  Five Archaeoglobus fulgidus DSM4304 activities are native associations without their own evidence tags or declared directions. Shared C1 functions, homology and annotation do not establish methanogenesis or the complete six-member route. AF_RS10430/O28206 is formyltransferase-like with family/similarity support, distinct from AF_RS11105/O28076. Nine AF locus/RefSeq aliases have issuing support, but eight divergent GeneID pointers remain unresolved. O28076 also carries sequence cautions at positions32,34,43. Issuing annotations do not establish whole native sequence identity or independently read catalytic experiments.

  Methylorubrum extorquens AM1 Mch belongs to bacterial C1 metabolism. Its native association and O85014 annotation do not establish methane formation. PMID:10215859 provides abstract-level purified-enzyme and suggested catabolic-context evidence; full assay conditions were not newly verified. Its exact opposing physiological activity and sodium regulation retain their own native targets rather than being generalized to the route.

  Kurth2021 (PMID:34145392; DOI:10.1038/s41396-021-01025-6) experimentally studies methoxy-compound demethylation by Mto and expression context in Methermicoccus shengliensis. Native MtoA/MtoB purification and heterologous MtoC/MtoD have distinct roles. The full main, all five figures, complete supplementary DOCX body/seven figures, selected S1/S2 rows and all S3 were accepted at their recorded reading scopes. This is not an isolated eight-subunit Mtr sodium-pumping experiment. Native ENZRXN2065-393 EV-EXP-IPI remains a database evidence tag, not independently demonstrated exact Mtr catalysis.

  The Kurth MtoA acceptor assay uses tetrahydrofolate as a surrogate and CoM as a negative acceptor; physiological H4MPT acceptance is the interpretation, not a measured H4MPT rate. MtoA BP07_RS03240 and MtrH BP07_RS06315 are different gene products. The corrected experimental locator is Methods PDF pages6–7 (printed3554–3555), Figure4C/caption and Results PDF pages11–12 (printed3559–3560), with supplementary FigureS2B. Figure3 is not this assay locator, and no MtoA activity is transferred to native MtrH.

  Kurth Figure5, the supplementary energy calculations and oscillating-flux scenarios are hypotheses. Resting-cell product ratios and qualitative 13C experiments do not measure full-route flux, establish universal 1:3 disproportionation or validate every energetic assumption. Mtr expression rows in TableS1 and S2 remain expression context; neither those rows nor O27227 rule-derived cofactor/transport annotations demonstrate a purified sodium pump.

  The Vorholt1997 abstract (PMID:9342247) addresses CO2 rather than bicarbonate as Fmd substrate and evidence consistent with a proposed N-carboxymethanofuran intermediate. Its full main, figures and assays remain unacquired here. A native pathway-level experimental tag citing this study is not an experiment on the entire six-member route, and the proposed intermediate is not added as an observed elementary step.

  Kaster2011 (PMID:21262829) concerns MvhADG/HdrABC electron bifurcation in M. marburgensis, outside the six native members. Evidence here is the complete abstract plus the exactly recorded inherited partial-main scope; no newly acquired authentic full main/SI is claimed. Its assay ferredoxin is not substituted for the native generic class, and no universal membrane methanophenazine mechanism or six-member ATP yield is inferred.

  A formal one-pass net is a diagnostic rather than a physiological methane balance. Location-aware summation retains Na+ transport and located/unlocated carrier residuals. Rhea142 Mer has an additional H+ and narrower F420 scope, KEGG Ftr omits a native H+ and Fmd has an additional H+, and Rhea Mtr leaves four carrier locations unspecified where the native equation specifies inside. These are not silently normalized away. Bare graph endpoints do not encode typed occurrence coefficients or compartments; the exact source facts remain in the edge descriptions/evidence and retained occurrence ledger.

  Seven native regulations retain exact activity targets: HCN inhibits ENZRXN-422 and ENZRXN-641; Na+ activates ENZRXN-4121; 10-formyl-THMPT inhibits, Mg2+ activates and Mn2+ inhibits ENZRXN-662; oxygen inhibits ENZRXN-702. The separately acquired Regulation class is not an eighth instance. PMID:3782039 supports selected Mg/formyl effects and PMID:8125106 the Mo-specific cyanide effect at abstract scope. Other details remain source-only. Regulation is not flattened onto generic reactions, every isoenzyme or whole taxa.
