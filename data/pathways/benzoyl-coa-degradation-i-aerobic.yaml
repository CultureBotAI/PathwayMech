id: MetaCyc:PWY-1361
label: benzoyl-CoA degradation I (aerobic)
description: 'The complete source-defined seven-step aerobic Box route converts benzoyl-CoA to acetyl-CoA
  and succinyl-CoA. The upper BoxAB epoxidase, BoxC dihydrolase and BoxD semialdehyde dehydrogenase are
  supported with their actual experimental preparations. The 2010 epoxide result supersedes historical
  dihydrodiol assignments; proposed oxepin intermediates and predicted absolute epoxide stereochemistry
  are not established products. The fourth isomerization is explicitly putative and has no assigned catalyst.
  Lower hydration, NAD-dependent oxidation and thiolysis preserve native reaction chemistry and ordering
  without transferring catalysts from phenylacetate, engineered reverse-adipate, or expression-only studies.
  Native taxon annotations include Aromatoleum evansii, Geobacillus stearothermophilus and Paraburkholderia
  xenovorans LB400; they do not establish every reaction experimentally in each taxon. Azoarcus sp. CIB
  is an additional, separately issued regulatory context: BoxR/BzdR repress box-gene transcription, and
  benzoyl-CoA relieves tagged BoxR DNA binding in crude-extract assays. Those findings are not transferred
  to A. evansii. Complex membership is stored composition, not proof of stable assembly. FAD is normalized
  to CHEBI:57692; CPD-7 remains a generic iron-sulfur cofactor class, without fixed occupancy or ligation.
  Benzoate-CoA ligase lies upstream of this seven-step boundary. CIB bclA insertion-disruption growth
  loss was reported as data not shown; it is contextual support, not an eighth reaction or a complete
  seven-step enzyme assay. The originals print DSMZ 6869 for KB740 in some studies, whereas issuing taxonomy/UniProt
  use DSM 6898; this discrepancy is retained, not silently harmonized. PMID11306574, PMID15916608, PMID15458418
  and PMID18462753 remain full-original access gaps; complete retained abstracts and independently accepted
  later originals are distinguished in the evidence ledger.'
