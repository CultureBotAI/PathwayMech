id: MetaCyc:PWY-6579
label: superpathway of guanine and guanosine salvage
description: The complete three-reaction superpathway salvages guanosine and guanine to GMP in Escherichia
  coli K-12 MG1655. It combines direct ATP-dependent guanosine phosphorylation by Gsk with guanosine phosphorolysis
  by the DeoD homohexamer followed by Gpt-dependent phosphoribosyl transfer to guanine. The two branches
  converge on GMP. Native MG1655 annotations are supported by reviewed K-12 proteins and inspected enzyme
  studies; the 2020 Gsk regulation experiments used MG1655-derived strains. Gsk is an active dimer under
  the examined inhibitor-free conditions, while GDP and ppGpp promote tetramerization; ppGpp-bound tetramers
  are less active than ppGpp-bound dimers. Gpt is represented by the later experimentally supported homotetramer.
  Each branch retains the complete charge- and stereochemistry-resolved reaction sides; its direction
  describes orientation relative to the Rhea master reaction.
pathway_type: purine-nucleotide-salvage
