id: MetaCyc:GLUTATHIONESYN-PWY
label: glutathione biosynthesis
description: Glutathione biosynthesis ligates L-cysteine to L-glutamate with ATP to form gamma-L-glutamyl-L-cysteine,
  then ligates glycine to gamma-L-glutamyl-L-cysteine with a second ATP to form glutathione.
