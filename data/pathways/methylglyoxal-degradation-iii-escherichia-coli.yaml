id: PathBank:SMP0002091
label: Methylglyoxal Degradation III
description: 'PathBank SMP0002091 (native BioPAX archive member PW002079.owl) models the two-step
  glutathione-independent acetol branch of methylglyoxal degradation III in Escherichia coli (NCBITaxon:562;
  native Species/3), corresponding to the Escherichia coli K-12 MG1655 MetaCyc pathway record MetaCyc:PWY-5453
  (methylglyoxal-degradation-iii.yaml) and supported by biochemical and structural characterization in
  Escherichia coli K-12 (NCBITaxon:83333). In the first step (RHEA:27988, right-to-left direction of
  RHEA:27986; native Reactions/6074, eCNumber 1.1.1.-, Hydrogen Ion + NADPH + Pyruvaldehyde <-> Hydroxyacetone
  + NADP, conversionDirection REVERSIBLE), L-glyceraldehyde 3-phosphate reductase / methylglyoxal reductase
  Gpr/YghZ (UniProtKB:Q46851; native Protein/7315 Uncharacterized protein yghZ controlling Reactions/6074
  via ReactionCatalysis/6037 in PathwayEnzymeReaction/22629) reduces methylglyoxal (CHEBI:17158; native
  Compound/PW_C000905 Pyruvaldehyde) with NADPH(4-) (CHEBI:57783; pH 7.3 major microspecies of native
  Compound/PW_C000146 NADPH, CHEBI:16474) and hydron (CHEBI:15378; native Compound/PW_C040034 Hydrogen
  Ion) to hydroxyacetone (acetol, CHEBI:27957; native Compound/PW_C003018 Hydroxyacetone) and NADP(3-)
  (CHEBI:58349; pH 7.3 major microspecies of native Compound/PW_C000143 NADP, CHEBI:18009). Purified
  E. coli K-12 YghZ converts methylglyoxal to acetol with NADPH by 1H NMR, whereas NADH activity was
  below 3% of NADPH activity and the reverse acetol-to-methylglyoxal reaction was not detected under
  the reported conditions (PMID:16077126).


  In the second step (RHEA:28668, left-to-right direction of RHEA:28667; native Reactions/6075, eCNumber
  1.1.1.6, Hydrogen Ion + Hydroxyacetone + NADH <-> (S)-Propane-1,2-diol + NAD, conversionDirection
  REVERSIBLE), the L-1,2-propanediol dehydrogenase / glycerol dehydrogenase complex (PathBank:SMP0002091/ProteinComplex/3935,
  modeled in PW002079.owl with 8 copies of Protein/6141 Glycerol dehydrogenase cross-referenced to UniProtKB:P0A9S5,
  controlling Reactions/6075 via ReactionCatalysis/6038 in PathwayEnzymeReaction/22630) reduces hydroxyacetone
  (CHEBI:27957) with NADH(2-) (CHEBI:57945; pH 7.3 major microspecies of native Compound/PW_C001144
  NADH, CHEBI:16908) and hydron (CHEBI:15378) to (S)-propane-1,2-diol (CHEBI:29002; native Compound/PW_C040967
  (S)-Propane-1,2-diol) and NAD(1-) (CHEBI:57540; pH 7.3 major microspecies of native Compound/PW_C000721
  NAD, CHEBI:15846). Glycerol dehydrogenase GldA binds one catalytic zinc(2+) ion (CHEBI:29105) per
  subunit in its active site (PMID:30839292), and its oligomeric state in vitro varies between tetramers
  in 5% glycerol and dimer/octamer mixtures without glycerol (PMID:30839292). The (S)-propane-1,2-diol
  product stereochemistry is retained from native PW002079.owl, RHEA:28668, and reviewed UniProtKB:P0A9S5
  annotations; the 2005 NMR study (PMID:16077126) did not resolve diol enantiomers, and R-1,2-propanediol
  accumulation in engineered E. coli AG1 (PMID:10049880) was attributed to a lactaldehyde route rather
  than direct stereochemical characterization of this acetol step. Native PW002079.owl also includes
  an uncatalyzed diagrammatic export step (Transports/10317 in PathwayTransport/2123361, moving Compound/PW_C040967_Cytosol
  to Compound/PW_C040967_Periplasmic_Space without a stepProcess or carrier protein) and omits bp:cellularLocation
  on the enzymatic reaction participants and bp:nextStep links on PathwayEnzymeReaction/22629 and PathwayEnzymeReaction/22630;
  the causal graph retains the two enzyme-catalyzed reactions and grounds step handoff in bp:pathwayOrder
  and the shared Compound/PW_C003018 (CHEBI:27957) intermediate.'
