id: gomodel:YeastPathways_BSUBPOLYAMSYN-PWY
label: spermidine biosynthesis I
description: >-
  Spermidine biosynthesis I decarboxylates S-adenosyl-L-methionine
  through SPE2 and transfers its aminopropyl group to 1,4-butanediammonium
  through SPE3 to form spermidine in Saccharomyces cerevisiae S288C.
