id: MetaCyc:PWY0-1433
label: tetrahydromonapterin biosynthesis
description: 'An explicitly incomplete mechanism for the established tetrahydromonapterin biosynthetic
  pathway in Escherichia coli K-12, with pathway and assembly identities grounded to MG1655. The FolE
  homodecamer forms dihydroneopterin triphosphate from GTP, and the FolX homooctamer epimerizes it to
  dihydromonapterin triphosphate. Separately, FolM reduces unphosphorylated dihydromonapterin using NADPH.
  The intervening dephosphorylation mechanism and catalyst remain unresolved in the inspected evidence:
  the source''s hypothetical net reaction is not asserted here, and no connecting edge bridges these modules.
  This is a pathway-existence claim, not a complete biochemical reconstruction. Rhea and primary enzyme
  studies ground the chemistry independently of the erroneous dihydromethysticin intermediate in PathBank.
  Characterization of K-12 proteins, genetic complementation, and purified-enzyme assays have distinct
  scopes. Folate/queuosine branches, FolB alternatives, downstream Pseudomonas hydroxylation and pterin
  recycling are excluded; native physiological use of tetrahydromonapterin in E. coli is not assigned.'
pathway_type: pterin-biosynthesis
