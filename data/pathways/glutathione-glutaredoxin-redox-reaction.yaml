id: WikiPathways:WP392
label: Glutathione-glutaredoxin redox reaction
description: Glutathione-glutaredoxin redox reaction in Saccharomyces cerevisiae links glutathione/glutathione
  disulfide recycling through GLR1 to glutathione consumption by GTT1/GTT2 and GPX1/GPX2/HYR1-catalyzed
  glutathione oxidation in the WP392 GPML diagram. The unresolved glutaredoxin redox partner
  is not specified; peroxidase assignments retain the diagram scope and do not establish glutathione
  as the exclusive physiological donor.
