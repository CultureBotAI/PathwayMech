id: MetaCyc:PWY-6223
label: gentisate degradation I
description: The complete gentisate isomerization route cleaves gentisate to 3-maleylpyruvate, isomerizes
  this cis intermediate to 3-fumarylpyruvate, and hydrolyzes it to fumarate and pyruvate. Ralstonia sp.
  U2 NagI, NagL and NagK supply an experimentally supported complete enzyme realization. U2 NagL uses
  glutathione as a catalytic cofactor. NagK magnesium and manganese annotations are by similarity, not
  direct U2 metal measurements. The exact U2 enzyme sequences match deposited strain U2 coding sequences
  despite the broader organism label in current UniProt. The direct maleate-hydrolysis route and upstream
  aromatic-substrate conversions are outside this pathway boundary. Separately qualified isomerases represent
  C. glutamicum ATCC 13032 ncgl2918 with mycothiol and Paenibacillus sp. NyZ101 BagL with L-cysteine,
  cysteinylglycine or glutathione in vitro. These variant proteins and thiols are alternatives, not a
  requirement that one organism use all cofactors. Cysteine preference in NyZ101 remains a physiological
  inference. Metal activation and inhibition edges describe the tagged-enzyme assays with their stated
  concentrations, not demonstrated native metal requirements. The cysteine/cysteinylglycine zwitterions
  and glutathione anion are explicit chemical normalization; assay protonation was not measured. The NagI
  recombinant assay retains a reported primer/start-position conflict; its exact expressed N terminus
  is unresolved.
