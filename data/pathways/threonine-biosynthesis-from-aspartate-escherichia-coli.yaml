id: PathBank:SMP0000992
label: 'Secondary Metabolites: Threonine Biosynthesis from Aspartate'
description: 'PathBank SMP0000992 (native BioPAX archive member PW000976.owl) models Escherichia coli threonine biosynthesis
  from L-aspartate together with the L-aspartate 4-semialdehyde branch step toward lysine and diaminopimelate biosynthesis.
  In the five-step L-threonine branch, L-aspartate is phosphorylated by ATP-dependent aspartate kinase (RHEA:23777, EC:2.7.2.4;
  native Reactions/2525) to 4-phospho-L-aspartate, which is reduced by NADPH-dependent aspartate-semialdehyde dehydrogenase
  Asd (UniProtKB:P0A9Q9; RHEA:24286, EC:1.2.1.11; native Reactions/2919) to L-aspartate 4-semialdehyde and phosphate. Bifunctional
  aspartokinase/homoserine dehydrogenase 1 (ThrA, UniProtKB:P00561) and 2 (MetL, UniProtKB:P00562) reduce L-aspartate 4-semialdehyde
  with NADPH to L-homoserine (RHEA:15763, EC:1.1.1.3; native Reactions/2918). Homoserine kinase ThrB (UniProtKB:P00547) phosphorylates
  L-homoserine with ATP to O-phospho-L-homoserine (RHEA:13986, EC:2.7.1.39; native Reactions/2920), and pyridoxal 5''-phosphate-dependent
  threonine synthase ThrC (UniProtKB:P00934) converts O-phospho-L-homoserine and water to L-threonine and phosphate (RHEA:10841,
  EC:4.2.3.1; native Reactions/2921). At the L-aspartate 4-semialdehyde branch point, 4-hydroxy-tetrahydrodipicolinate synthase
  DapA (UniProtKB:P0A6L2) condenses L-aspartate 4-semialdehyde with pyruvate (RHEA:34172, EC:4.3.3.7; native Reactions/5516).


  Several native PW000976.owl BioPAX representation quirks are preserved in provenance while normalized to verified biochemical
  authorities in the causal graph: (1) native Reactions/2525 assigns aspartate kinase catalysis (ReactionCatalysis/2492) solely
  to homodimeric LysC (ProteinComplex/1237, two copies of UniProtKB:P08660), whereas in Escherichia coli K-12 RHEA:23777 is
  also catalyzed by the bifunctional enzymes ThrA (UniProtKB:P00561) and MetL (UniProtKB:P00562); (2) native Reactions/2918
  represents the homoserine dehydrogenase step (RHEA:15763, EC:1.1.1.3) but inherits displayName and eCNumber 2.7.2.4 from
  the bifunctional enzyme''s kinase domain, and its controller ProteinComplex/1526 bundles four copies of ThrA (UniProtKB:P00561)
  and two copies of MetL (UniProtKB:P00562) into a single BioPAX complex rather than separate homotetrameric ThrA and homodimeric
  MetL isozymes; (3) native Reactions/5516 writes the older overall condensation equation producing L-2,3-dihydrodipicolinate
  and 2 H2O (with CompoundReference/PW_C007792 carrying ChEBI_CHEBI_48052 Alongside an erroneous BioCyc_ALPHA-N-ACETYLNEURAMINYL-ETCETERA
  xref), whereas DapA physiologically catalyzes the single-dehydration formation of (2S,4S)-4-hydroxy-2,3,4,5-tetrahydrodipicolinate
  (CHEBI:67139), H2O, and H(+) (RHEA:34172); and (4) native CompoundReference/PW_C007794 (L-Aspartate-semialdehyde, formula
  C4H7NO3) carries an erroneous ChEBI_CHEBI_18051 xref in PW000976.owl while its BioCyc (L-ASPARTATE-SEMIALDEHYDE), KEGG (C00441),
  and PubChem (439235) xrefs identify L-aspartate 4-semialdehyde (CHEBI:537519).


  Native PW000976.owl encodes species-level Escherichia coli (NCBITaxon:562) and places all seven proteins and twelve small
  molecules in the cytosol (GO:0005829), while the seven reviewed UniProtKB entries and their catalytic, cofactor, allosteric-regulation,
  and cytoplasmic localization annotations (GO:0005737) are curated for Escherichia coli K-12 (NCBITaxon:83333).'
