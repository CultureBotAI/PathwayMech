id: gomodel:YeastPathways_PWY-901
label: methylglyoxal catabolism
description: Methylglyoxal catabolism in Saccharomyces cerevisiae S288C converts methylglyoxal and
  glutathionate to (R)-S-lactoylglutathionate through GLO1 lactoylglutathione lyase activity, then
  hydrolyzes (R)-S-lactoylglutathionate to (R)-lactate and regenerates glutathionate through GLO2
  and GLO4 hydroxyacylglutathione hydrolase activities.
