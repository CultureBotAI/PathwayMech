id: gomodel:YeastPathways_PWY-7220-1
label: adenosine deoxyribonucleotides de novo biosynthesis II
description: 'Adenosine deoxyribonucleotide biosynthesis in Saccharomyces cerevisiae S288C
  reduces ADP to dADP through the represented ribonucleoside-diphosphate reductase complexes
  and phosphorylates dADP to dATP through YNK1. The imported formate-dependent ATP-to-dATP
  branch has no yeast enzyme assignment and is excluded: it describes class III anaerobic
  ribonucleotide reductase chemistry, whereas the independently characterized yeast system
  reduces ribonucleoside diphosphates.'
pathway_type: nucleotide-biosynthesis
