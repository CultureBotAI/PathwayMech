id: gomodel:YeastPathways_PWY-7220-1
label: adenosine deoxyribonucleotides de novo biosynthesis II
description: Adenosine deoxyribonucleotides de novo biosynthesis II in Saccharomyces cerevisiae S288C reduces ADP to dADP through CPX-1102 or CPX-1103 ribonucleoside-diphosphate reductase activity, phosphorylates dADP to dATP through YNK1-catalyzed nucleoside diphosphate kinase activity, and includes the raw GO-CAM RXN0-745 formate- and ATP-consuming route to dATP.
