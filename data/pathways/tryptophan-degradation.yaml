id: gomodel:YeastPathways_PWY3O-214
label: tryptophan degradation
description: Tryptophan degradation in Saccharomyces cerevisiae S288C uses ARO8 or ARO9 aminotransferase
  activity to form 3-(indol-3-yl)pyruvate from L-tryptophan, decarboxylates 3-(indol-3-yl)pyruvate
  through ARO10, PDC1, PDC5, or PDC6 indolepyruvate decarboxylase activity to indol-3-ylacetaldehyde
  and carbon dioxide, and reduces indol-3-ylacetaldehyde with NADH through ADH1, ADH2, ADH3,
  ADH4, ADH5, or SFA1 indole-3-acetaldehyde reductase activity to tryptophol and NAD.
pathway_type: amino-acid-degradation
