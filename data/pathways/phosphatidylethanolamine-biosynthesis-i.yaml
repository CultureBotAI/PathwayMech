id: gomodel:YeastPathways_PWY-5669
label: phosphatidylethanolamine biosynthesis I
description: Phosphatidylethanolamine biosynthesis I in Saccharomyces cerevisiae S288C transfers
  phosphatidyl groups from CDP-diacylglycerol to L-serine to form 3-sn-phosphatidyl-L-serine,
  then decarboxylates 3-sn-phosphatidyl-L-serine through PSD1 or PSD2 to form phosphatidylethanolamine.
