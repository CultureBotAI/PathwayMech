id: MetaCyc:ILEUSYN-PWY
label: L-isoleucine biosynthesis I (from threonine)
description: L-isoleucine biosynthesis I converts L-threonine to 2-oxobutanoate, condenses 2-oxobutanoate
  with pyruvate to form (S)-2-ethyl-2-hydroxy-3-oxobutanoate, reduces and rearranges that intermediate
  to (2R,3R)-2,3-dihydroxy-3-methylpentanoate, dehydrates it to (S)-3-methyl-2-oxopentanoate, and transaminates
  that 2-oxo acid to L-isoleucine.
pathway_type: amino-acid-biosynthesis
