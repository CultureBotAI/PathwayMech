id: MetaCyc:PWY-6151
label: S-adenosyl-L-methionine cycle I
description: 'The complete MetaCyc bacterial activated methyl cycle is represented with E. coli
  K-12 proteins: MetK makes SAM, a generic methyltransferase reaction yields SAH, Pfs cleaves SAH
  to adenine and S-ribosylhomocysteine, LuxS produces homocysteine and (S)-4,5-dihydroxypentane-2,3-dione,
  and methionine synthase regenerates methionine. The five native transformations are retained,
  with separate MetE triglutamate and documented MetH monoglutamate equations for the alternative
  final step. Generic methyl-acceptor states retain their native donor labels and unspecified chemical
  scope; no particular methylation target or catalyst is selected. LuxS-derived DPD is distinct
  from downstream cyclic or borated AI-2 signals, which are outside this cycle. The protein scope
  does not assert functionality in every K-12 derivative, universal quorum sensing, or simultaneous
  use of all annotated alternative metals.'
