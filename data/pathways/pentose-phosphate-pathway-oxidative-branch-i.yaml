id: MetaCyc:OXIDATIVEPENT-PWY
label: pentose phosphate pathway (oxidative branch) I
description: The oxidative branch of the pentose phosphate pathway oxidizes D-glucose 6-phosphate to 6-phospho-D-gluconate via 6-phospho-D-glucono-1,5-lactone, then oxidatively decarboxylates 6-phospho-D-gluconate to D-ribulose 5-phosphate while reducing NADP(+) to NADPH.
