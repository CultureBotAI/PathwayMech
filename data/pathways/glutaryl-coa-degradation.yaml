id: MetaCyc:PWY-5177
label: glutaryl-CoA degradation
description: |-
  This source-native glutaryl-CoA degradation pathway converts glutaryl-CoA through glutaconyl-CoA, crotonyl-CoA, (S)-3-hydroxybutanoyl-CoA and acetoacetyl-CoA to two acetyl-CoA molecules. MetaCyc PWY-5177 defines five members and their order. Free-glutarate activation, alternative glutarate hydroxylation and downstream TCA/glyoxylate metabolism are outside these native pathway boundaries. All graph edges below preserve explicit structured source assertions; native evidence codes and cited papers are retained without treating unread citations as independently verified experiments.

  The pathway-selected hydration is crotonyl-CoA + water -> (S)-3-hydroxybutanoyl-CoA. Its native reaction RXN-11667 is named '(S)-3-hydroxybutanoyl-CoA dehydrogenase'; that source name conflicts with the actual hydration/dehydration equation. The record preserves the authoritative node label and explains the chemistry here and in the incident edge descriptions. No redox reaction is inferred from that name.

  The five native member equations and the auxiliary composite retain all material occurrences, integer coefficients and source directions. Source reversibility differs from the pathway-selected direction: RXN-11667 is displayed as hydration and ACETYL-COA-ACETYLTRANSFER-RXN as thiolysis. The combined GLUTARYL-COA-DEHYDROGENASE-RXN equation formally equals the first two members, but the K172 and KT2440 GcdH activity annotations attach only to that composite. It is not a sixth pathway member, and neither catalyst is assigned to an isolated half-reaction.

  Oxidized and reduced ETF are generic native protein classes, not identified physiological carrier sequences. Their missing complete formula/charge prevents a complete elemental-balance claim for the first reaction or whole route. FAD is separately asserted as a cofactor of the native K172 GcdH complex. The external Rhea23973 decarboxylation includes located sodium transport absent from the native equation; no sodium pump or transport stoichiometry is asserted here. Twelve accepted ChEBI comparisons concern normalized encoded ionic structures, not blanket acceptance of CML stereo or literal proton/tautomer placement; nine KEGG ionic states differ. Native graph IDs are retained.

  Pathway-level taxon scope (not proof of an isolated member reaction): NCBITaxon:303: Native PWY-5177 directly associates TAX-303 (Pseudomonas putida). Direct source pathway association only; not independent experimental demonstration of all five members, physiological ETF or whole-route flux in this taxon. NCBITaxon:1076: Native PWY-5177 directly associates TAX-1076 (Rhodopseudomonas palustris). Direct source pathway association only; not independent experimental demonstration of all five members, physiological ETF or whole-route flux in this taxon. NCBITaxon:316277: Native PWY-5177 directly associates TAX-316277 (Syntrophus aciditrophicus). Direct source pathway association only; not independent experimental demonstration of all five members, physiological ETF or whole-route flux in this taxon. NCBITaxon:43774: Native PWY-5177 directly associates TAX-43774 (Syntrophus buswellii). Direct source pathway association only; not independent experimental demonstration of all five members, physiological ETF or whole-route flux in this taxon. NCBITaxon:43775: Native PWY-5177 directly associates TAX-43775 (Syntrophus gentianae). Direct source pathway association only; not independent experimental demonstration of all five members, physiological ETF or whole-route flux in this taxon. NCBITaxon:59405: Native PWY-5177 directly associates TAX-59405 (Thauera aromatica). Direct source pathway association only; not independent experimental demonstration of all five members, physiological ETF or whole-route flux in this taxon. NCBITaxon:44139: Native PWY-5177 directly associates historical Pseudomonas Sp. K172. Accepted issuer reconciliation binds historical Pseudomonas sp. K172 / DSM6984 to Thauera aromatica K172, NCBITaxon44139; issuer rank is strain. Direct source pathway association only; not independent experimental demonstration of all five members, physiological ETF or whole-route flux in this taxon. NCBITaxon:59406: Native PWY-5177 directly associates historical Pseudomonas sp. KB 740. Accepted DSM6898/NCBI issuing originals bind KB740 to the type material of Aromatoleum evansii, NCBITaxon59406, at species scope. Direct source pathway association only; not independent experimental demonstration of all five members, physiological ETF or whole-route flux in this taxon. The native human association is retained in the source ledger and excluded from this microbial record.

  Shared catalyst annotations from additional microbial taxa are reaction-specific source contexts and do not broaden the direct pathway taxon list or establish the complete route in those organisms. All29 native activities are retained in the research ledger: 21 provide generic-reaction catalyst annotations; four microbial thiolase activities have explicitly opposing physiological condensation directions and do not become route-thiolysis catalyst edges. THLCLOS-ENZRXN is nevertheless represented as its exact regulated activity. Four human/plant catalyst activities remain outside this microbial positive graph. Missing activity direction is not evidence for pathway flux.

  Eight microbial regulation assertions target four exact enzyme-specific activity participants, with enzyme enables links. They do not inhibit every catalyst of a generic reaction. The native CoA inhibition record REG-14465 reports Ki 120 with units "&micro;mole"; the unit is retained without silently converting it to micromolar. Two human mitochondrial thiolase ion-regulation assertions remain outside the microbial graph. A separate native selenomethionine cofactor annotation conflicts with a later native-cited conclusion that selenium in the Clostridium kluyveri thiolase is adventitious and not required; no selenium cofactor edge is asserted. Selected complex composition does not establish independent catalytic activity of each subunit.

  Primary evidence has narrower experimental scope than the complete source graph. In the 2009 study (PMID:19395484), native and tagged recombinant GS15 GcdH supported oxidative decarboxylation, whereas recombinant DSM2059 GDHDes supported glutaryl-CoA dehydrogenation without detected crotonyl-CoA in the reported assay. These used an artificial ferrocenium acceptor; membrane-extract conversion with 20 mM NaCl is not a purified sodium-pump or physiological ETF demonstration. Protein preparation, organism and assay distinctions remain separate from the native composite annotations.

  The 2018 KT2440 study (PMID:29844506) supports condition-specific gdh deletion/growth, substrate-consumption and expression observations. The complementing inserts called gdh and csiD comprise gdh+pp0159 and csiD+lhgO, respectively. Expression sampling followed contact with glutarate; it is not proof of a pre-exposure constitutive state or pathway flux. Figure4c plates were read at 36 h, while Supplementary Figure9 concerns 12 h. The purified CsiD/LhgO experiments establish a separate hydroxylation route, not purified GcdH, every native PWY-5177 member, or native ETF coupling. Figure7 is a network interpretation; no 13C flux tracing was performed. Proposed CsiR/glutarate control is not added as a demonstrated regulatory edge.

  The authentic 1993 publisher abstract (PMID:8439237) reports purified historical K172/KB740 GcdH and FAD-containing homotetramers; the full main remains unacquired here. Its abstract support does not supply full methods, a physiological ETF partner, or a modern exact protein sequence. The native K172 gene association with AE016774 conflicts with the issuing KT2440 sequence record. Historical KB740 sequence identity and the current KT2440 gene identifier remain unresolved; unrelated strain identifiers and MAY27 sequences are not substituted.

  The 2009 tagged DSM2059 preparation had reported Km 52±5µM and Vmax 11±1µmol/min/mg in a ferrocenium assay at 30°C/pH7.8. Retained UniProt C3UVB0 instead records 25µM and 11 mmol/min/mg without per-value evidence. The 2010 citation was verified and its authentic supplement read, but the full main was not acquired; its primer/sequence information supplies no kinetic reconciliation or exact 2010 assay preparation. IP08 therefore remains open; no global numerical correction or attribution of the database values to that paper is claimed. Sequence-length, residue-number and accession/version coordinate differences remain explicit in the retained research ledger.

  Source-native catalyst, cofactor and regulation assertions without a newly acquired full historical paper remain explicitly source-only. The retained research package accounts for every source object and omitted positive edge, including all genes, organism contexts, ten regulations and thiolase constituent reactions. No unsupported gene-product relation, activity–reaction equivalence, full-route taxon expansion, nested elementary mechanism or public-identifier replacement is introduced.
