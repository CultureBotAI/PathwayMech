id: gomodel:YeastPathways_PWYQT-4432
label: glutathione degradation
description: >-
  Glutathione degradation uses ECM38 to transfer glutathione's gamma-glutamyl
  moiety to a proteinogenic amino acid, forming L-cysteinylglycine and an
  L-gamma-glutamyl-L-amino acid, then uses DUG1 to hydrolyze L-cysteinylglycine
  to L-cysteine and glycine in Saccharomyces cerevisiae S288C.
