id: PathBank:SMP0002051
label: L-Carnitine Degradation I
description: The four-reaction PathBank route represents anaerobic L-carnitine reduction to gamma-butyrobetaine
  through CoA thioesters, using characterized Escherichia coli K-12 Cai proteins. CaiC supplies the initial
  carnitinyl-CoA pool; CaiD dehydrates it, CaiA reduces crotonobetainyl-CoA, and the CaiB homodimer transfers
  CoA to another carnitine molecule, releasing gamma-butyrobetaine and regenerating carnitinyl-CoA. Thus
  ATP-dependent initiation is distinct from the recycling loop. Rhea charge forms and both generic electron-transfer
  flavoprotein redox states are retained; the exact physiological donor complex is unresolved. FAD bound
  to CaiA is a separate cofactor. Selected catabolic directions do not imply irreversibility of CaiD or
  CaiB. This enzyme mechanism does not establish growth or expression in every K-12 strain, and is distinct
  from aerobic carnitine assimilation. The older native map defines the route boundary; its erroneous
  or underspecified chemical xrefs are not adopted as exact identities.
