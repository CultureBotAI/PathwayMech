id: MetaCyc:HOMOSER-METSYN-PWY
label: L-methionine biosynthesis I
description: L-methionine biosynthesis I activates L-homoserine as O-succinyl-L-homoserine,
  condenses it with L-cysteine to form L,L-cystathionine, hydrolyzes L,L-cystathionine to
  L-homocysteine, and methylates L-homocysteine to L-methionine through either cobalamin-dependent
  or cobalamin-independent methionine synthase.
pathway_type: amino-acid-biosynthesis
