id: MetaCyc:PLPSAL-PWY
label: pyridoxal 5'-phosphate salvage I
description: The pyridoxal 5'-phosphate salvage I pathway phosphorylates pyridoxal, pyridoxamine, and
  pyridoxine, then oxidizes pyridoxamine 5'-phosphate and pyridoxine 5'-phosphate to regenerate pyridoxal
  5'-phosphate.
