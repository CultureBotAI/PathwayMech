id: MetaCyc:2PHENDEG-PWY
label: phenylethylamine degradation I
description: 'The complete two-step native pathway converts 2-phenylethylamine to phenylacetate in Escherichia
  coli K-12. The periplasmic copper/topaquinone-containing TynA homodimer oxidatively deaminates the amine,
  producing phenylacetaldehyde, ammonium and hydrogen peroxide; cytosolic FeaB oxidizes the aldehyde with
  NAD+. Rhea physiological charge forms and both complete equations are retained, including two protons
  in the FeaB product side. The aldehyde links the reactions across compartments; its transport mechanism
  is not specified. Downstream phenylacetate assimilation and the distinct quinohemoprotein degradation-II
  route are outside this exact native boundary. K-12 enzyme and mutant evidence is complemented by MG1655
  transcription experiments and W3110 aerobic-growth measurements; the record does not imply expression
  or growth in every K-12 derivative or condition. FeaB is represented by its supported gene-product/activity
  association, without claiming an active isolated monomer or fixing the disputed oligomeric state: UniProt
  annotates a dimer, native MetaCyc a tetramer, and the inspected 2006 tetramer experiment used a supplied
  PadA construct whose exact equivalence to this K-12 protein was not established. The selected NAD+ route
  does not exclude reported NADP+ turnover. FeaR regulation is transcriptional and condition dependent;
  direct aldehyde binding to FeaR was not demonstrated in the inspected study.'
