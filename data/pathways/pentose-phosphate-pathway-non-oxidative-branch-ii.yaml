id: MetaCyc:PWY-8178
label: pentose phosphate pathway (non-oxidative branch) II
description: 'The native MetaCyc PWY-8178 boundary contains six reversible reactions: ribose-phosphate isomerase,
  ribulose-phosphate epimerase, two transketolase events, PPi-dependent S7P phosphorylation and sedoheptulose-bisphosphate
  cleavage. The displayed pentose-to-hexose layout reverses the native left/right direction of RIB5PISOM-RXN and
  1TRANSKETO-RXN. RXN-21730 consumes S7P and PPi and releases SBP, phosphate and a proton; PPi is a consumed donor,
  not merely an activating cofactor. The source supplies twenty side occurrences but no explicit coefficient fields.
  Generic S7P and R5P classes, beta-D-fructofuranose6-phosphate and the source''s distinct ionic identities are
  retained. The native PPI cross-reference to neutral diphosphoric acid conflicts with its charged native structure;
  no neutral-acid/anion exactMatch is asserted. Shared Rhea chemistry for the other five events does not establish
  a Rhea identity for the PPi-S7P event or narrow the native classes.


  Entamoeba histolytica 200:NIH provides historical activity-level support. The 1982 study used axenic TP-S-1 culture
  and partially purified native transketolase, PPi-PFK and aldolase; it did not identify a modern protein sequence,
  tag or oligomer. Transketolase apoenzyme requires both Mg2+ and thiamine diphosphate, with a lag when Mg is added
  first. Its two substrate-pair assays had apparent Km values dependent on the fixed cosubstrate: R5P0.027mM with
  Xu5P0.3mM, Xu5P0.23mM with R5P2mM, GAP1.60mM with F6P12mM, and E4P0.005mM with Xu5P0.1mM. The partial PFK preparation
  has apparent S7P Km64micromolar and PPi Km about10micromolar; the cited F6P comparator is38micromolar. Partial
  aldolase cleaves SBP with Km13micromolar versus FBP3micromolar and about half the FBP Vmax. Slight PFK contamination
  is disclosed; added triose-phosphate isomerase did not increase SBP cleavage. Reconstitution requires transketolase,
  PFK, aldolase and PPi with omission controls; yeast aldolase can substitute after PFK is supplied. Extract R5P
  consumption was8.1±1.7nmol/min/mg in four preparations, with triose0.46±0.04 and S7P0.40±0.04 per R5P, accounting
  for86% of substrate. These results support the route without assigning a present-day Entamoeba sequence. Reverse
  biosynthetic flux and retention of PPi energy were proposed, not all measured directly.


  Modern clostridial work separates species, strains and recombinant preparations. Thermosuccinogenes CDQ83_11320=PNT94038.1
  and CDQ83_07225=PNT93300.1 are issued DSM5809 sequences; the metabolomics cultures are not silently equated to
  every issuing genome preparation. DSM1313 Clo1313_1876=ADU74928.1 is a separate PPi-PFK. In 2019 the pET28b constructs
  carried N-terminal His6 flanking a TEV site, without documented tag cleavage. Heat-treated Rosetta extracts assayed
  at55C gave CDQ83_11320 PPi-dependent F6P activity220±26U/mg CFE, with ATP/GTP activity not detected; CDQ83_07225
  gave ATP13±1 and GTP13±5 with PPi not detected. CDQ83_10650 remained inactive in the tested heated and nonheated
  preparations. These are CFE measurements, not equal expression or purified kcat. CDQ83_07225 donor Km values differed:
  ATP0.155mM and GTP0.016mM. The 2019 Discussion mistakenly calls CDQ83_11320 PPdK; Tables2/3 identify PPdK as CDQ83_07455.


  The 2020 study used pET28b+/Rosetta for CDQ83 proteins and DSM1313 PCR into pD861-NT/pSH157 in E. coli T7 Express
  lysY/Iq for Clo1313_1876. Direct55C MS showed S7P-to-SBP conversion with PPi, alongside minus-PPi and minus-enzyme
  controls. The MS assay contained5mM MgCl2,5mM sodium PPi and1mM acceptor; kinetic assays used1mM PPi. Mg presence
  is an assay condition, not an independently measured universal metal requirement. Rabbit aldolase coupling supplies
  E4P/DHAP; it does not demonstrate activity of a clostridial aldolase. Unequal triose signals led to a TPI-contamination
  hypothesis, not a new core reaction. NADH/GPDH and other auxiliary enzymes belong to the assay, not core stoichiometry.
  Purified CDQ83_11320 has S7P Km0.11mM, kcat49/s and F6P0.070mM,182/s; Clo1313_1876 has S7P0.10mM,80/s and F6P0.046mM,127/s.
  CDQ83_07225 has no detected S7P activity through4mM and a F6P Khalf0.688mM with Hill coefficient24, not a Michaelis
  Km. Its ammonium requirement belongs to the ATP/F6P comparator using lyophilized rabbit aldolase/GPDH in place
  of ammonium-sulfate suspensions, because S7P Ba-salt precipitated BaSO4. Ultrafiltration applied to purified PFK
  buffer exchange, not the auxiliary enzymes; the source''s NH4Cl2 formula is inconsistent. E. coli PfkA, its0.25mM
  ADP assay addition and delta-talAB physiology are ATP-route comparisons, not an E. coli PPi-branch assignment.


  The thesis-version supplemental figures reproduce the minus-enzyme control and separate Michaelis/Hill fits. Hill
  fits for PPi enzymes are not uniformly one; the very steep CDQ83_07225 fit and poor alternative Michaelis fit
  must not be confused. This thesis supplement is not asserted byte-identical to a journal supplementary PDF. Thermosuccinogenes
  SBP and S7P pools were about fourfold and2.5-fold higher on xylose than glucose in biological triplicates normalized
  to OD600. Pool accumulation does not establish six-event flux, direct xylose binding or transcriptional regulation.


  The 2023 study tests ATCC27405=DSM1237 Cthe_0347 Pfp=ABN51585.1 and Cthe_0349 Aldoa=ABN51587.1, distinct from
  DSM1313. Aldoa uses a synthetic codon-optimized pRSET-A construct with N-terminal His6/linker; Pfp uses pAHCT0347/pRSET-A
  with an N-terminal His6 tag. Both were expressed in E. coli T7 Shuffle. The inspected Pfp-specific passages do
  not establish a linker or codon optimization. Ni purification does not identify physiological nickel use. Pfp
  forward MS at50C used2mM PPi,2.115mM S7P and2.5mM MgCl2. Reported S7P Km3.236mM exceeds the highest measured2.12mM;
  Vmax is6.294±3.723micromol/min/mg. The F6P Km0.075mM and Vmax100.222±11.6 were measured separately. This preparation/strain/assay
  difference from the2020 values remains unresolved. Mixed S7P/F6P lowered FBP formation, consistent with competition
  in that assay, without a direct binding constant. Only forward S7P phosphorylation was tested.


  The original Taillefer thesis adds Cthe_0347 F6P-assay context. Its title page says2017, the issuing repository
  metadata2015-04 and the2023 citation2016; the persistent Handle identifies the retained artifact despite the date
  conflict. The His6 pAHCT0347/pRSET-A T7 Shuffle preparation was assayed at50C with5mM MgCl2. PPi was the sole
  detected donor; ATP,GTP,PEP and ADP were not detected as donors. PPi Km was0.23mM, Vmax39.7micromol/min/mg and
  calculated kcat30.14/s. High PPi gave substrate inhibition Ki1.38±0.5mM;1mM ATP reduced F6P-PFK activity about60%.
  ADP,AMP,GTP,GMP and PEP at1mM had no significant effect. These are original F6P-assay observations, not directly
  measured S7P inhibition or a resolved ATP-binding mechanism. The approximately50kDa SDS monomer mass is not a
  native oligomer measurement. The source''s reference to GK protein within the PFK paragraph is retained as a wording
  inconsistency; effects on other thesis enzymes are outside this branch.


  Aldoa''s direct2023 activity is FBP cleavage, Km0.145mM and Vmax27.7micromol/min/mg. The paper explicitly did
  not verify SBP cleavage. At55C with2mM added cations, Zn2+ increased FBP activity over twofold, Mg2+ alone was
  not significant, Mg2+ plus ammonium increased activity, and K+ reduced activity in the Mg/Zn comparisons. Ammonium
  partly attenuated the stronger Zn response, so its activation edge is restricted to the Mg-containing condition.
  These effects do not establish SBP-specific metal requirements. The DSM1313 Clo1313_1875=ADU74927.1 aldolase is
  an issuing class-II FBP annotation with promoter-binding context; neither the rabbit coupling assay nor the ATCC27405
  FBP assay is transferred to an exact DSM1313 SBP catalyst.


  Additional RPI/RPE/TKT investigation preserves evidence levels. ATCC27405 Cthe_2597 RpiB=A3DIL8 is a149-residue
  unreviewed sequence with EC5.3.1.6 annotation. Issuing3HEE contains R5P and author/PISA dimer assembly;3PH3 contains
  unphosphorylated ribose and has a different deposited construct extent. The2011 publisher abstract reports ligand
  structures and mutagenesis, but its full body was unavailable. The2008 and2013 papers and2009 crystallization
  lead concern rare/unphosphorylated sugars; unseen body details are not converted to R5P turnover evidence. Historical
  ZP00503831.1 has the same149-residue sequence but older product/EC annotation, so version differences remain explicit.
  Crystallization salts are not a measured Mg cofactor requirement. DSM1313 Clo1313_1661=ADU74718.1 and ATCC27405
  Cthe_0576=ABN51812.1 are issuing RPE annotations, without a newly acquired purified-enzyme or metal assay. A failed
  lexical search for DSM1313 RpiB does not establish absence.


  KJC335 is a DSM1313-derived delta-hpt strain carrying heterologous xylAB. The TktAB pair CLO1313_RS00385/RS00390
  joins through issuing historical gene records to Clo1313_0074/0075 and ADU73172.1/ADU73173.1. Co-overexpression
  from the gapDH promoter on pTC131374-5 reduced doubling time on5g/L xylose from19.0±5.7h to5.8±0.6h versus pKJC84
  empty vector, with no major cellobiose difference. This supports paired pathway participation, not full catalysis
  by each subunit or measured1:1 assembly. RNA-seq used three replicates at matched mid-exponential OD but different
  growth rates, which limits interpretation. Another predicted pair reported as RS01525/RS01530 changed little;
  the separately issued ADU73386.1/ADU73387.1 Clo1313_0295/0296 annotations are retained without silently asserting
  an unverified modern-locus join. Broad transport, xylitol, chemotaxis and cellulosome responses remain outside
  the six-event core.


  Rex Clo1313_2471=ADU75484.1 is issued with a generic CoA-binding-domain label; the primary study identifies Rex.
  DAP-seq used codon-optimized C-terminal HaloTag constructs in E. coli S30 IVTT,55C binding and a HaloTag-only
  control. Separate room-temperature motif EMSA used semi-purified C-terminal His6 protein from BL21(DE3); no Kd
  was determined. DAP-seq associates two shared sites in the divergent Clo1313_1875/1876 region, but which site
  acts on either gene or both is unresolved. Poor replicate correlation(Pearson0.18) and motif-versus-promoter assay
  scope are retained. The graph represents sequence-specific DNA binding only, without a signed expression arrow,
  invented live-gene endpoint or exact NADH/NAD effector dose-response. Family redox-sensing models are not direct
  assays of this construct. Historical Entrez12422212,12421607 and12421608 provide locus context but are not recast
  as currently live annotated genes.


  The2022 engineered LL1660 result limits necessity claims: a strain lacking PPi-PFK and introduced transaldolase
  could grow despite the proposed reverse biosynthetic role. A partial Clo1313_0790–1248 genome duplication includes
  ATP-pfk0997 and other energy genes; it does not uniquely identify the compensating mechanism. The alternate route
  remains unknown, with L-type PPP discussed as a possibility. This counterevidence does not negate the measured
  wild-type/recombinant enzyme activities. The retained publisher rendering supports these Results/Discussion claims;
  no supplemental reanalysis is asserted. A separate13C flux-model study is consistent with nonoxidative/SBP routing
  but model fits and near-equilibrium estimates are not exact enzyme assignments.


  Native enzyme associations are reaction-global: the16 original associations include15 excluded from transfer to
  the scoped organisms. The UniProtB8I4R1 cross-reference on native MetaCyc MONOMER-21313 belongs to a different
  species/locus, despite the native object''s correct thermocellum PID ADU74928.1. B8I4R1 sequence, homodimer, cofactor
  and nonallosteric annotations are not transferred to DSM1313 or thermosuccinogenes. Native G-80830 has a locus/STRING
  cross-reference conflict. Broad Bacteria range, methylotroph substrate reports whose original bodies were not
  acquired, and a45-genome survey with two transaldolase-annotated R. papyrosolvens exceptions do not establish
  universal branch occurrence. PPi supply through glycogen cycling or proton-pumping pyrophosphatase and a metabolic
  relief-valve role remain proposals outside the core. Pentose assimilation, anabolic pentose supply and glycolytic
  F6P/GAP are interfaces; oxidative PPP/NADPH production, carbon fixation and an invented transporter are not extra
  core events. Unknown assemblies, locations and fine regulatory mechanisms remain unknown.'
