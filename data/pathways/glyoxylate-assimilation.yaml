id: MetaCyc:PWY-5744
label: glyoxylate assimilation
description: The complete native 13-object glyoxylate-assimilation cycle of Chloroflexus aurantiacus converts
  glyoxylate plus inorganic carbon to pyruvate while regenerating its acetyl-CoA/propionyl-CoA carrier
  pool. The acetyl-CoA-to-propionyl-CoA regeneration branch and all five dedicated assimilation reactions
  are retained, including CO2/bicarbonate equilibration and two whole protein-bound biotin half-reactions.
  The separate first 3-hydroxypropionate cycle that generates glyoxylate is outside this record. The five
  dedicated transformations were reconstituted with four enzymes from OK-70-fl/DSM636; current J-10-fl
  genome annotations and 2024 BC1 work are distinguished, with CT function retained at its inference tier.
  Mcl is a hexamer; MCR and the three dedicated hydratase/isomerase enzymes are dimers. PCS has an unresolved
  three-or-four-subunit estimate, and no fixed whole-ACC assembly is asserted. Current (2R,3S)-beta-methylmalyl-CoA
  agrees with primary Figure 1; the older native CPD-9409 structure encodes opposite acyl stereocenters
  despite its matching label and is not accepted as an exact structure mapping. Native citramalyl-CoA
  leaves CoA stereocenters unspecified; current stereospecific CoA chemistry is retained separately. Physiological
  MCR metal identity remains unresolved. No carbonic-anhydrase identity, transcriptional regulator or
  transporter is invented; condition-dependent induction and biochemical inhibition do not establish regulatory
  circuitry.
pathway_type: glyoxylate-assimilation-cycle
