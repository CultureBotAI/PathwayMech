id: MetaCyc:BIOTIN-BIOSYNTHESIS-PWY
label: biotin biosynthesis I
description: 'The complete 14-reaction BioC/BioH-dependent route in E. coli K-12/MG1655 converts malonyl-ACP
  through two fatty-acid elongation cycles and BioF/BioA/BioD/BioB ring assembly to biotin. Both native
  MetaCyc children are retained. The first condensation reaction is present without an assigned catalyst:
  current inspected evidence excludes the old ACP-incompatible FabH proposal but does not establish a
  unique FabB/F catalyst. Native downstream FAS assignments retain their indirect evidence grade. Seven
  intermediate ACP classes have no authoritative empirical formula; all are whole protein states, not
  isolated reactive residues. Six current Rhea equations provide normalized charge/stereochemistry; eight
  native FAS equations preserve source orientation and NADH versus NADPH. BioB retains the formal Rhea
  generic sulfur-carrier/ferredoxin equation, while E. coli primary assays use flavodoxin; no exact physiological
  donor or cluster-repair cycle is inferred. Selected protein identities are K-12, native complexes MG1655,
  and primary assays include engineered strains and non-E. coli BioC homologues as explicitly qualified.
  Malonyl-ACP formation, broader fatty-acid synthesis, BirA ligation/regulation and Fe-S-cluster regeneration
  lie outside this named pathway.'
pathway_type: biotin-biosynthesis
