id: MetaCyc:PWY0-301
label: L-ascorbate degradation I (bacterial, anaerobic)
description: 'The complete MetaCyc 27.0 five-event bacterial L-ascorbate degradationI route combines UlaABC
  PTS uptake/phosphorylation with UlaG lactonase, UlaD decarboxylase, UlaE 3-epimerase and UlaF 4-epimerase
  to D-xylulose 5-phosphate. E. coli K-12/MG1655 enzyme evidence and BW25113 transport genetics support anaerobic
  utilization at low ascorbate concentrations; strain, reporter and construct scopes are retained beside their
  claims. The general PTS comparison specifically uses JM101 and PB11 with a combined ptsHIcrr deletion. Native27.0
  includes the PTS event, whereas 22.5 lists it as an incoming link. The PTS event is an HPr-fed aggregate;
  its carrier residue classes are protein-bound, not free amino acids. Obsolete Rhea 33303 and replacement
  42436 are not asserted exact equivalents: the latter uses a generic immediate histidyl-protein donor, while
  native and UniProt relay commentary predict UlaB phosphoCys9. The complete net transport equation is retained
  without inventing a direct HPr-to-sugar transfer. UlaE/UlaF are distinct from SgbU/SgbE/AraD used in other
  contexts. The 2002 hydrolysis-before-PTS proposal lacked an assigned hydrolase; later sources support the
  present ordering. UlaG 2010 and UlaR 2008 primary abstracts were accessible, but their full methods/figures
  were not; detailed construct and kinetic claims are not inferred. UlaG retains its current UniProt Probable
  label despite later direct activity evidence. Ascorbate6P relieves UlaR repression; free ascorbate does not
  directly displace UlaR in 2004 binding tests. Anaerobic describes the selected route, not a universal inability
  of all mutants or other routes to use ascorbate aerobically. The separate aerobic yia route is excluded.'
