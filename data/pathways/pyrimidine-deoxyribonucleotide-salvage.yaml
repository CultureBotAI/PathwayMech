id: GO:0010139
label: pyrimidine deoxyribonucleotide salvage
description: This complete five-reaction Escherichia coli implementation converts 2'-deoxycytidine through
  2'-deoxyuridine to dUMP, or uses deoxyuridine-derived 2-deoxy-alpha-D-ribose 1-phosphate to salvage
  thymine through thymidine to dTMP. Cdd deaminates deoxycytidine, the reversible DeoA phosphorolyses
  supply or consume the sugar phosphate, and Tdk phosphorylates deoxyuridine or thymidine. The selected
  biochemical boundary matches the five-reaction native EcoCyc pathway; NupC/NupG uptake is incoming context
  and subsequent nucleotide phosphorylation is outside it. MG1655 is the native protein-annotation scope;
  primary K-12 mutant studies and E. coli B enzyme studies do not establish constitutive wild-type MG1655
  flux. Tdk is represented by its source-defined multimeric assembly without fixing its stoichiometry
  across conditions. This GO process implementation is not asserted equivalent to the differently composed
  MetaCyc PWY-7199 pathway.
