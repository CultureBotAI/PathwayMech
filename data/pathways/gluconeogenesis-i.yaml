id: gomodel:YeastPathways_GLUCONEO-PWY-1
label: gluconeogenesis I
description: Gluconeogenesis I in Saccharomyces cerevisiae S288C converts malate or pyruvate to oxaloacetate and phosphoenolpyruvate,
  runs lower glycolytic reactions toward fructose 1,6-bisphosphate, and uses FBP1 and PGI1 activities to produce beta-D-fructofuranose
  6-phosphate and D-glucopyranose 6-phosphate.
