id: Reactome:R-MTU-936721
label: Cysteine synthesis from O-acetylserine
description: 'The Mycobacterium tuberculosis O-acetylserine route joins CysH/Sir sulfate reduction with
  CysE serine acetylation and CysK1-dependent cysteine synthesis. The outdated CysK2 O-acetylserine reaction
  is excluded: CysK2 uses a distinct O-phosphoserine route. Native thioredoxin and ferredoxin states and
  PLP-bearing CysK1 are retained. Reactome chemical forms include sulfurous acid, sulfide(2-) and acetic
  acid; this graph does not claim physiological protonation or complete stoichiometric balance.'
