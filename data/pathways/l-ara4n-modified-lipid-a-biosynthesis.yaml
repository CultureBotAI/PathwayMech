id: MetaCyc:PWY0-1338
label: polymyxin resistance
description: The complete six-reaction native L-Ara4N-modified lipid A biosynthetic route, represented
  for Escherichia coli K-12. Starting at UDP-glucuronate, ArnA and ArnB form UDP-aminoarabinose; ArnA
  formylation, ArnC carrier transfer and ArnD deformylation supply the undecaprenyl-phosphate-linked donor
  used by ArnT to modify Kdo2-lipid A. The terminal source equation summarizes addition of two aminoarabinose
  residues, not a single elementary transfer or every cellular lipid species. ArnE and ArnF have jointly
  required transport-associated roles; no fixed heterodimer or energy-coupling mechanism is asserted.
  The older native hypothetical ArnD step is supported by later E. coli genetics and separately scoped
  purified Salmonella enzyme experiments. ArnA hexamer evidence is preparation-specific, and ArnB dimerization
  remains a similarity annotation. Resistance is conditional on pathway expression and the studied mutant
  or induction context; the record does not claim constitutive resistance of all K-12 cells. Upstream
  UDP-glucuronate and Kdo2-lipid A biosynthesis are outside this native boundary.
pathway_type: aminoarabinose-lipid-a-modification
