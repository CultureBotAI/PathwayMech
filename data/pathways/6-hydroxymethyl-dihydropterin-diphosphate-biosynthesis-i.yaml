id: gomodel:YeastPathways_PWY-6147
label: 6-hydroxymethyl-dihydropterin diphosphate biosynthesis I
description: 6-hydroxymethyl-dihydropterin diphosphate biosynthesis I in
  Saccharomyces cerevisiae S288C converts GTP to
  (7,8-dihydropterin-6-yl)methyl diphosphate through FOL2-catalyzed GTP
  cyclohydrolase I activity, 7,8-dihydroneopterin triphosphate
  pyrophosphohydrolase, 7,8-dihydroneopterin 3'-phosphate
  dephosphorylation, and FOL1-catalyzed aldolase and diphosphokinase
  activities.
