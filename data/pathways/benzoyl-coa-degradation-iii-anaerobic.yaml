id: MetaCyc:P321-PWY
label: benzoyl-CoA degradation III (anaerobic)
description: Complete nine-reaction MetaCyc route from benzoyl-CoA through saturated cyclic intermediates
  and pimeloyl-CoA to glutaryl-CoA and acetyl-CoA. R. palustris genetics and BadK/BadH/BadI assays are
  distinguished from Thauera K172 BCR and Syntrophus SB reverse enzyme assays. Lower PimCD/F/B assignments
  remain predictions; step 8 is YES-PUTATIVE with no assigned enzyme. Native carrier equations and generic
  cluster units do not establish physiological ETF coupling or whole-protein stoichiometry. Listed taxa
  describe source and preparation contexts, not measured complete routes in every strain. BadR/BadM regulation
  refers to transcription. All three assayed acetamidobenzoic acid reagent effects on BadM DNA binding
  are retained with dose and solubility limits; the physiological ligand remains unresolved. The two BadL
  homologs have a separately scoped ortho acetylation activity, outside the nine selected pathway steps.
  Measured meta/para homolog acetylation remains explicit context because exact activity identifiers were
  not closed by bounded lookup.
