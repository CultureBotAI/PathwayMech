id: WikiPathways:WP287
label: Ubiquinol-6 biosynthesis from 4-hydroxybenzoate
description: Ubiquinol-6 biosynthesis from 4-hydroxybenzoate prenylates 4-hydroxybenzoate to 3-hexaprenyl-4-hydroxybenzoate, then modifies the aromatic ring through hydroxylation, methylation, decarboxylation, and reduction steps to form ubiquinol-6 in Saccharomyces cerevisiae.
