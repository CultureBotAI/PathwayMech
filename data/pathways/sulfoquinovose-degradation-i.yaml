id: MetaCyc:PWY-7446
label: sulfoquinovose degradation I
description: 'The complete four-reaction sulfo-EMP route from free sulfoquinovose to glycerone phosphate
  and (2S)-3-sulfopropanediol in Escherichia coli K-12. YihS isomerization, YihV phosphorylation, YihT
  aldol cleavage and YihU NADH-dependent reduction retain all charged reaction sides. Current chemistry
  selects beta-SQ and (2S)-SLA/(2S)-DHPS; the old native protein prose naming (2R)-SLA is superseded,
  while the native reaction frames use a stereounspecified SLA class. E. coli YihT activity was detected
  in the 2014 coupled reconstitution but not in the 2021 purified preparation; that later study used Salmonella
  enzyme for kinetics. YihS and YihU use source-defined assemblies; YihV and YihT are qualified functional
  gene-product assertions, not claims of monomer sufficiency. CsqR repression and assay-dependent kinase
  modulation are included with their experimental conditions. The endpoint retains organic sulfur: glycoside
  hydrolysis, SQ mutarotation, membrane transport, sulforhamnose side-reaction chemistry, lower glycolysis
  and partner-organism DHPS mineralization are outside the four-member native boundary.'
