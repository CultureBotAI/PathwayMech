id: gomodel:YeastPathways_PWY-5651
label: L-tryptophan degradation to 2-amino-3-carboxymuconate semialdehyde
description: L-tryptophan degradation to 2-amino-3-carboxymuconate semialdehyde in Saccharomyces
  cerevisiae S288C oxidizes L-tryptophan to N-formyl-L-kynurenine, hydrolyzes N-formyl-L-kynurenine
  to L-kynurenine through BNA3 or BNA7 arylformamidase activity, hydroxylates L-kynurenine
  to 3-hydroxy-L-kynurenine, hydrolyzes 3-hydroxy-L-kynurenine to 3-hydroxyanthranilate, and
  oxidizes 3-hydroxyanthranilate to cis,cis-2-amino-3-(3-oxoprop-1-enyl)but-2-enedioate.
