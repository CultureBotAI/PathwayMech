id: MetaCyc:PYRIDOXSYN-PWY
label: pyridoxal 5'-phosphate biosynthesis I
description: The DXP-dependent pyridoxal 5'-phosphate biosynthesis I pathway oxidizes D-erythrose 4-phosphate to 4-phospho-D-erythronate, transaminates the resulting keto acid to 4-(phosphooxy)-L-threonine, decarboxylates it to 3-amino-2-oxopropyl phosphate, condenses that intermediate with 1-deoxy-D-xylulose 5-phosphate to form pyridoxine 5'-phosphate, and oxidizes pyridoxine 5'-phosphate to pyridoxal 5'-phosphate.
pathway_type: cofactor-biosynthesis
