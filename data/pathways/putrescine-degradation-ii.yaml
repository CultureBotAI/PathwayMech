id: PathBank:SMP0002067
label: Putrescine Degradation II
description: The four-enzyme glutamylation core converts putrescine to gamma-aminobutyrate (GABA) through
  gamma-L-glutamylated intermediates in characterized Escherichia coli K-12 proteins. PuuA ligates the
  gamma-carboxyl group of L-glutamate to one putrescine nitrogen; PuuB oxidizes the other amine; PuuC
  oxidizes the aldehyde; PuuD hydrolyzes the glutamyl amide and releases GABA and L-glutamate. Native
  PuuA dodecamer and PuuD homodimer assemblies are retained. Rhea supplies exact charged chemical forms
  and balanced equations, correcting conflicting native intermediate structures and the native PuuB equation.
  This record selects the native NADP-dependent PuuC variant; NAD-dependent activity is also supported.
  Transport, regulation, the alternative aminotransferase route and downstream GABA-to-succinate metabolism
  are outside this core. Relative pathway contributions depend on growth conditions; this is not a claim
  that every core enzyme is indispensable for all putrescine utilization.
pathway_type: polyamine-catabolism
