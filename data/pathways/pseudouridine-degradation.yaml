id: MetaCyc:PWY-6019
label: pseudouridine degradation
description: The complete two-step pseudouridine degradation pathway phosphorylates free pseudouridine
  using ATP, then cleaves its C-C glycosidic bond to uracil and D-ribofuranose 5-phosphate. It follows
  MetaCyc PWY-6019 and both reactions of the misleadingly titled PathBank Purine Degradation map. The
  selected protein core is E. coli K-12, supported by reviewed annotations and direct K-12 PsuG characterization.
  Whole-cell utilization in the original study was in UTI89; kinase structural studies used strain B/BL21
  and are not relabeled as K-12 flux or assembly experiments. PsuG is a supported homotrimer. The K-12
  kinase is assigned by reviewed functional annotation; the cited dimer experiments concern strain B/BL21,
  so these sources do not establish the K-12 oligomeric state. Physiological PsuG cleavage is selected
  despite reversible chemistry and an equilibrium favoring synthesis. Its Mn, Fe and Co alternatives are
  retained without asserting simultaneous occupancy. The pathway ends at the two cleavage products; RNA
  pseudouridylation, transport, uracil salvage and downstream pyrimidine-ring degradation are outside
  the native boundary.
