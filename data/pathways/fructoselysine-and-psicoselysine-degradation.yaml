id: MetaCyc:PWY0-521
label: fructoselysine and psicoselysine degradation
description: The source-defined three-reaction pathway converts psicoselysine to fructoselysine through
  FrlC, then uses ATP-dependent FrlD phosphorylation and FrlB deglycation to produce glucose 6-phosphate
  and lysine. Fructoselysine enters at the kinase step. The two downstream reactions overlap the narrower
  GO:1901281 fructoselysine catabolic record; these are overlapping boundaries, not disjoint capabilities
  or exact identifier synonyms. The graph selects catabolic traversal while preserving FrlC reversibility
  and in vitro FrlB reversibility. Native MG1655 annotations, reviewed K-12 protein identities, experimental
  constructs and conditional growth evidence retain separate scopes.
pathway_type: glycated-amino-acid-catabolism
