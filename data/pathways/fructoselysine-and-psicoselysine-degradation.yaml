- id: frl-028
  subject: UniProtKB:P45539
  predicate: enables
  object: MetaCyc:PWY0-521
  description: FrlA participation is inferred from the growth phenotype and reviewed probable-transporter
    annotation. Tn5 polarity and lack of rescue limit gene-product attribution; transport itself, coupling
    and stoichiometry were not measured. FrlA is context, not a core reaction member.
  evidence:
  - reference_id: PMID:14641112
    source_assertion: The frlA Tn5 mutant FB21138 does not grow on fructoselysine or psicoselysine but
      does grow on glucose; Figure 5 treats FrlA transport as presumptive.
    source_locator: p1047 Materials; p1051 Growth of E. coli on psicoselysine and Fig5 caption
  - reference_id: UniProtKB:P45539
    source_assertion: FUNCTION describes likely fructoselysine/psicoselysine transport with ECO:0000305;
      DISRUPTION PHENOTYPE cites PMID:14641112 with ECO:0000269.
    source_locator: comments[commentType="FUNCTION"].texts; comments[commentType="DISRUPTION PHENOTYPE"].texts
    assay_taxon: NCBITaxon:83333
  endpoint_qualifiers:
  - endpoint: subject
    kind: experimental_construct
    description: Indirect gene-product attribution from the FB21138 frlA Tn5 growth comparison at 20 mM
      substrates. The Materials passage does not specify this mutant background; the separately described
      BL21 cultures do not establish it. No complementation or purified FrlA transport assay is reported.
    evidence:
    - reference_id: PMID:14641112
      source_assertion: FB21138 is a Blattner-collection frlA Tn5 mutant; growth was followed in M9 with
        20 mM substrates. The reported phenotype lacks a rescue experiment.
      source_locator: p1047 Materials; p1048 Growth of E. coli on psicoselysine; p1051 growth Results
- id: frl-029
  subject: UniProtKB:P45543
  predicate: catalyzes
  object: RHEA:28379
  description: Recombinant FrlD catalyzes ATP-dependent C6 phosphorylation. Product NMR establishes phosphate
    position while retaining multiple solution forms at pH 4.1. Mg salts are assay conditions; their inclusion
    alone does not establish an indispensable cofactor. NADH and phosphoenolpyruvate belong to coupled
    detection.
  evidence:
  - reference_id: PMID:12147680
    source_assertion: The purified kinase phosphorylates fructoselysine using ATP; product characterization
      assigns the phosphate to carbon 6.
    source_locator: p42524 enzyme assay Methods; pp42526–42527 product characterization and Fig6 caption
  endpoint_qualifiers:
  - endpoint: subject
    kind: experimental_construct
    description: FrlD from BL21(DE3) genomic DNA in pET-3a, expressed in BL21(DE3)pLysS; no affinity tag
      stated. The start-primer sequence matches current K-12 P45543, but complete experimental sequence
      identity is not established. Approximately 28-kDa gel-filtration behavior supports the monomer assignment.
    evidence:
    - reference_id: PMID:12147680
      source_assertion: Methods describe the BL21(DE3) donor and pET-3a expression in BL21(DE3)pLysS;
        Results assigns monomeric behavior from gel filtration.
      source_locator: p42524 Overexpression and purification of fructoselysine 6-kinase; p42526 Expression
        and characterization; Fig5 caption
- id: frl-030
  subject: MetaCyc:CPLX0-821
  predicate: catalyzes
  object: MetaCyc:RXN0-963
  description: 'Recombinant FrlB supports reversible cleavage to lysine and glucose 6-phosphate, including
    the reverse condensation experiment. The enzymatic glucose-6-phosphate identification does not establish
    anomer specificity: the beta product attached to this native reaction remains a separate database
    assertion.'
  evidence:
  - reference_id: PMID:12147680
    source_assertion: The active deglycase preparation forms glucose 6-phosphate and lysine; reverse formation
      of fructoselysine 6-phosphate is measured.
    source_locator: p42527 Expression and characterization of putative deglycase; p42528 Fig8 caption
      and Discussion
  - reference_id: MetaCyc:GLC-6-P
    source_assertion: The native product compound directly identifies CHEBI:58247 and supplies beta-anomer-specific
      complete InChI.
    source_locator: /ptools-xml/Compound/common-name; inchi; dblink[dblink-db="CHEBI"]
  endpoint_qualifiers:
  - endpoint: subject
    kind: experimental_construct
    description: Active first-AUG FrlB from BL21(DE3) DNA, pET-3a expression in BL21(DE3)pLysS. Its start
      primer matches current P0AC00 residues 1 onward; complete donor sequence identity is unproved. The
      second-AUG construct was insoluble/inactive. Approximately 450-kDa gel filtration suggests a dodecamer;
      the assembly trace was not shown.
    evidence:
    - reference_id: PMID:12147680
      source_assertion: The first-AUG construct is active, whereas the second-AUG product is insoluble
        with no detected activity. An approximately 450-kDa apparent mass suggests a dodecamer.
      source_locator: p42524 Overexpression and purification of fructoselysine-6-phosphate deglycase;
        p42527 Expression and characterization of putative deglycase
