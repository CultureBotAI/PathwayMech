- id: frl-032
  subject: UniProtKB:P45544
  predicate: inhibits
  object: MetaCyc:PWY0-521
  description: Transcriptional repression of the shared frlABCD promoter controls pathway expression in
    the BW25113 reporter system. This process-level context edge does not assert direct inhibition of
    the pathway enzymes, separate endogenous transcript measurements, regulation of frlR itself, or psicoselysine-specific
    reporter testing.
  evidence:
  - reference_id: PMID:32979851
    source_assertion: Deleting frlR increases PfrlABCD-lux output; ectopic FrlR represses it. Epsilon-fructoselysine
      relieves reporter repression, whereas alpha-fructoselysine does not.
    source_locator: Thesis PDF pp89–90 (article pp5–6), Figs5b/6 and Results2.3
  endpoint_qualifiers:
  - endpoint: subject
    kind: experimental_construct
    description: E. coli FrlR expressed from pBAD33 in BW25113/JW5698 PfrlABCD-lux reporter comparisons.
      Exact construction/primer tables were unavailable; full insert identity to current K-12 P45544 is
      not independently established. The measured target is a shared-promoter reporter, not each endogenous
      transcript or an MG1655 gene instance.
    evidence:
    - reference_id: PMID:32979851
      source_assertion: BW25113 and frlR-deleted JW5698 lux reporters are compared with ectopic pBAD33-FrlR;
        construction details are referred to supporting Table S2.
      source_locator: Thesis PDF pp89–90 (article pp5–6), Figs5b/6; Methods4.5 article p13 / PDF97
- id: frl-033
  subject: UniProtKB:P45544
  predicate: regulates
  object: MetaCyc:PWY0-521
  description: Operator binding supplies the molecular basis for the separately observed transcriptional
    repression. SPR measured operator-dependent binding, with reported KD 4.9 nM after active-concentration
    correction; engineered T7/operator reporters support sequence dependence. This is regulatory context,
    not a new metabolic event.
  evidence:
  - reference_id: PMID:32979851
    source_assertion: Purified FrlR binds operator-bearing DNA in SPR. Operator mutations alter the engineered
      reporter response, supporting sequence-dependent DNA recognition.
    source_locator: Thesis PDF pp91–93 (article pp7–9), Results2.4 and Fig7; Methods4.6/4.9
  endpoint_qualifiers:
  - endpoint: subject
    kind: experimental_construct
    description: 'Separate in vitro preparation: His6-SUMO-FrlR expressed in BL21(DE3), cleaved with His6-Ulp1
      and recovered after metal-affinity cleanup. Exact supplementary construct sequence is unverified.
      Operator DNA is the assay target; the reference protein ID does not establish a particular MG1655
      promoter or full-length native dimer.'
    evidence:
    - reference_id: PMID:32979851
      source_assertion: Protein purification uses His6-SUMO expression in BL21(DE3), His6-Ulp1 cleavage
        and recovery of tag-free FrlR; SPR compares operator-bearing and control DNA.
      source_locator: Thesis PDF pp97–98 (article pp13–14), Methods4.6–4.7
- id: frl-034
  subject: UniProtKB:P0AGB3
  predicate: activates
  object: MetaCyc:PWY0-521
  description: Positive transcriptional context from RpoH overexpression and promoter-truncation reporters.
    This is not a purified sigma-factor binding experiment, direct enzyme activation, individual endogenous-transcript
    measurement, or a host-adaptation experiment.
  evidence:
  - reference_id: PMID:32979851
    source_assertion: Arabinose-induced rpoH on pBAD33 increases PfrlABCD-lux output in promoter-truncation
      experiments.
    source_locator: Thesis PDF pp89–90 (article pp5–6), Fig5c; Methods4.5 article p13 / PDF97
  endpoint_qualifiers:
  - endpoint: subject
    kind: experimental_construct
    description: pBAD33-rpoH overexpression in BW25113 shared-promoter lux reporter assays, with promoter
      truncations and temperature conditions specified by Figure 5c and Methods4.5. Exact supplementary
      insert sequence was not inspected; current K-12 RpoH denotes gene-product identity.
    evidence:
    - reference_id: PMID:32979851
      source_assertion: The reporter experiment overproduces RpoH from pBAD33; Methods specifies adjusted
        measurement temperatures for rpoH analysis.
      source_locator: Thesis PDF pp89–90 Fig5c and Results2.3; PDF97 Methods4.5
- id: frl-035
  subject: UniProtKB:P0ACJ8
  predicate: activates
  object: MetaCyc:PWY0-521
  description: Inferred CRP/cAMP-dependent positive transcriptional control from cyaA manipulation, glucose
    response and candidate-CRP-region truncation. The study supplies no new purified CRP binding or crp-deletion
    experiment. The source differs between 10 and 20 mM glucose descriptions; no single dose is selected
    here.
  evidence:
  - reference_id: PMID:32979851
    source_assertion: cyaA deletion reduces the reporter and ectopic cyaA restores activity; glucose and
      promoter truncation alter the response, supporting a CRP/cAMP regulatory interpretation.
    source_locator: Thesis PDF pp89–90 (article pp5–6), Fig5d and Results2.3; PDF97 Methods4.5
  endpoint_qualifiers:
  - endpoint: subject
    kind: experimental_construct
    description: Indirect CRP attribution in BW25113/JW3778 cyaA and PfrlABCD-lux reporter comparisons.
      CRP itself was neither deleted nor purified in these experiments; promoter DNA and reporter context
      were engineered. Exact equivalence of every tested sequence to the reference K-12 molecules is not
      established.
    evidence:
    - reference_id: PMID:32979851
      source_assertion: The cAMP reporter comparisons use cyaA-deleted JW3778, ectopic cyaA and truncated
        promoter fusions; the CRP-directed interpretation is indirect.
      source_locator: Thesis PDF pp89–90 Fig5d and Results2.3; Methods4.5 PDF97
