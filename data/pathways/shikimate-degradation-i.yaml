id: MetaCyc:SHIKIMATEDEG-PWY
label: shikimate degradation I
description: The two-step MetaCyc 27.0 shikimate degradation I definition converts shikimate
  through 3-dehydroshikimate to protocatechuate. The initial oxidation retains the source-defined
  quinone and quinol classes, with PQQ as a separate enzyme cofactor. This is distinct from
  the NAD-dependent shikimate II route and the three-step quinate I route. Enzyme and regulatory
  evidence retains organism, preparation and inference scope; the record does not assert a
  purified two-enzyme reconstruction for every source-listed organism.
