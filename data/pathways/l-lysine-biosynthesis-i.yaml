id: MetaCyc:DAPLYSINESYN-PWY
label: L-lysine biosynthesis I
description: L-lysine biosynthesis I converts L-aspartate to L-lysine through L-aspartate 4-semialdehyde,
  cyclic tetrahydrodipicolinate intermediates, a succinylated diaminopimelate branch, and meso-2,6-diaminopimelate.
