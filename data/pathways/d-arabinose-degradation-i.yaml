id: MetaCyc:DARABCAT-PWY
label: D-arabinose degradation I
description: D-arabinose degradation I isomerizes D-arabinose to D-ribulose, then phosphorylates D-ribulose
  with ATP to form D-ribulose 5-phosphate for entry into pentose phosphate metabolism.
