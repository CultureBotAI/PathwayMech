id: MetaCyc:PWY-8132
label: S-methyl-5-thio-α-D-ribose 1-phosphate degradation III
description: 'This exact five-event MetaCyc pathway, also called the DHAP–ethylene shunt, starts with
  S-methyl-5-thio-α-D-ribose 1-phosphate (MTR1P). MtnA makes the corresponding ribulose phosphate; Ald2
  cleaves it to dihydroxyacetone phosphate (DHAP) and (methylsulfanyl)acetaldehyde. Reduction gives 2-methylthioethanol
  (MT-EtOH), which methylthio-alkane reductase (Mar) converts to ethylene and methanethiol. O-acetylhomoserine
  sulfhydrylase captures methanethiol as methionine. Upstream MTA phosphorolysis supplies MTR1P but lies
  outside these five events. The graph preserves all 22 native reaction-side occurrences, four intermediate
  transfers and the complete nested Mar assembly; continuity does not assert physical substrate channeling.


  Native physiology was studied in Rhodospirillum rubrum ATCC 11170/S1 and Rhodopseudomonas palustris
  CGA010, a derivative of CGA009. Anaerobic isotope-feeding, gene deletions and complementation establish
  the MtnP/MtnA/Ald2 module, formation of MT-EtOH and approximately equimolar ethylene production from
  consumed MT-EtOH. Several upstream deletion backgrounds retain low ethylene or residual growth, so their
  phenotypes are not generalized to abolition of every sulfur-salvage route. The R. rubrum strain identifier
  anchors the selected protein chains; the species entries preserve experimentally supported scope without
  asserting that every strain carries this pathway.


  The first event is native REVERSIBLE despite a degradative left-to-right pathway layout. RXN-21319 is
  written as alcohol plus NAD giving aldehyde, NADH and a proton, but its native RIGHT-TO-LEFT direction
  and pathway layout select aldehyde reduction. Its graph consumption/production arrows follow that selected
  reduction while the reaction direction retains the source equation axis. The other three reactions are
  PHYSIOL-LEFT-TO-RIGHT. The NAD/NADH pair is the formal putative native equation, not an identification
  of the cellular aldehyde reductase or its physiological cofactor.


  In the 2017 coupled assay, recombinant Ald2 produced the aldehyde and DHAP, and added yeast alcohol
  dehydrogenase plus NADH converted the aldehyde to MT-EtOH. The native aldehyde was not detected during
  feeding, consistent with rapid reduction, but this does not identify the bacterial enzyme. The 2018
  aerobic DHAP–methanethiol pathway shares the early module in R. palustris; its terminal chemistry and
  oxygen context are distinct from the anaerobic ethylene route. Historical 2017/2018 descriptions left
  the sulfur endpoint unresolved. The 2020 native-host radiotracer study instead detected Mar-dependent
  methanethiol and methionine from MT-EtOH, superseding that historical uncertainty.


  The Mar equation retains one MT-EtOH, two reduced ferredoxin equivalents and two protons yielding one
  ethylene, one methanethiol, one water and two oxidized ferredoxin equivalents. These ferredoxins are
  generic protein redox classes, not small-molecule structures or identified R. rubrum proteins. MetaCyc
  proposes ferredoxin or flavodoxin by analogy; its commentary calls the missing partner an electron acceptor,
  although the represented reduction requires an electron donor. The 2020 supporting thermodynamics explicitly
  state that the actual donor is unknown and use H2 only as a reference. Current UniProt uses a generic
  AH2/A donor pair. Those representations are not asserted to be exact reaction equivalents.


  The 2020 work separated the marBHDK locus (Rru_A0793–Rru_A0796) from nitrogen fixation. Disruption of
  marH or the full cluster prevented growth with MT-EtOH as sole sulfur source and eliminated induced
  ethylene above basal levels; complementation restored the phenotype. Deletion of the separate nflDK
  pair did not prevent this route. MarBH combined with the alternate NflDK supported only weak alternative
  activity in the tested complementation setting, so NflDK is not silently substituted for the native
  MarDK catalyst. MarB is a proposed cofactor-maturation protein, not a fourth structural chain in the
  represented Mar assembly.


  R. rubrum MtnA is Q2RXI0/Rru_A0360, Ald2 is Q2RXI1/Rru_A0359 and Oah is Q2RWB7/Rru_A0774. The first
  two current UniProt entries are reviewed; Oah remains an unreviewed submission whose chain identity
  is corroborated by native gene/product links and whose methanethiol-specific activity was experimentally
  described in 2012. MarD, MarK and MarH are current Q2RW97/Rru_A0794, Q2RW98/Rru_A0793 and Q2RW96/Rru_A0795.
  Their native MONOMER-21380/21381/21382 identifiers are retained as assembly members with exact chain
  cross-mappings, rather than adding duplicate biological chains.


  Native CPLX-9562 contains one CPLX-9561 reductase component and one CPLX-9560 catalytic component. CPLX-9561
  contains two MarH chains; CPLX-9560 contains two MarK and two MarD chains, with reciprocal memberships.
  The 2025 purified components were a MarH2 dimer and a Mar(DK)2 tetramer by mass photometry. Their ATP-analogue-trapped
  association contained particles with one or two MarH2 dimers. Focused refinement produced the reported
  MarDK2H2 structural fragment after the second MarD could not be resolved. These are distinct assembly
  contexts: the fragment and trapped octamer are not replacements for the complete native nested topology
  or proof of one fixed physiological docking stoichiometry.


  The 2025 structural and activity experiments used R. rubrum marBHDK expressed in engineered Rhodobacter
  capsulatus MM0422, derived from MM0246 (ΔnifD::SpR ΔanfHDGK::gmR ΔdraTG ΔmodABC ΔgtaI) carrying pMM0181.
  MarH had an N-terminal His6 tag and MarD a C-terminal Strep-tag II; these distinguish the tested preparation
  from the unmodified native chains. R. capsulatus is the heterologous production host and is not added
  as a native DHAP–ethylene pathway taxon. The purified components were assayed at a catalytic:reductase
  molar ratio of 1:5 owing to MarH precipitation, not because the native assembly has five reductase dimers.


  Purified Mar reduced MT-EtOH at 2.3 nmol ethylene per mg Mar(DK)2 per minute in the 2025 conditions.
  Activity required both components, ATP and sodium dithionite; assays used 15 mM substrate, 3.5 mM ATP,
  5 mM dithionite, an ATP-regeneration system and 30 °C. These conditions establish an ATP-dependent reconstituted
  activity, not ATP turnover stoichiometry or use of dithionite in the cell. Dimethyl sulfide and ethyl
  methyl sulfide gave methane and ethane in parallel substrate assays, but are outside this five-event
  graph. H2 formation and acetylene reduction were additional in vitro activities; no nitrogen-fixation
  activity above background was detected under the tested 15N2 conditions.


  The 2025 MarH2 structure contains one interfacial [4Fe–4S] cluster and two bound MgADP–AlF3 moieties.
  A P-cluster bridges MarD/MarK and an [Fe8S9C] active-site cluster sits in MarD, providing a structural
  electron-transfer route. The central carbide was modeled from geometry and maturation context because
  the map did not resolve that atom independently; EPR supplied additional support for its assignment.
  Homocitrate, Mo and V were not detected in these preparations. The generic ChEBI [4Fe–4S] cofactor reference
  identifies the cluster type, not a claim that its neutral database depiction fixes the experimental
  redox state. Full P-cluster and [Fe8S9C] context is preserved in prose because no independently checked
  exact cofactor identifiers for those states are introduced.


  Proposed substrate-access channels, an S2B binding site and candidate proton-transfer residues in the
  2025 paper are structural interpretations, not measured elementary reaction steps. Its evolutionary
  analysis supports a proposed common ancestor with complex metalloclusters, but does not demonstrate
  the ancestral substrate or physiological activity. The record therefore separates measured C–S cleavage
  and component electron transfer from those mechanistic and evolutionary hypotheses.


  Ald2 assays used a recombinant His6 preparation expressed in E. coli and purified anaerobically; the
  2017 SI and native commentary support that construct. The 2020 Methods specify pET28 expression in E.
  coli Rosetta(DE3) pLysS and nickel purification. MtnA and Oah His10 details are native database attributions
  to the older 2012 work because its detailed SI was not accessible here; exact tag orientations are not
  established. These construct scopes do not convert recombinant assays into native-host protein purification.


  The MTR1P-specific MtnA values are Km 134 micromolar and kcat 0.1 s−1. The native slots and current
  UniProt attribute them to 2012, while 2020 Table 1 repeats them as literature values. For R. rubrum
  Ald2 with MTRu1P, the reported pair is Km 288 micromolar and kcat 0.94 s−1. The accessible Table 1 catalytic-efficiency
  entry is inconsistent with that pair and is not propagated or silently corrected. Native ENZRXN-29277
  also places 3.1950558e7 in specific-activity and Vmax fields without slot-level citations; the digits
  reproduce PMID31950558. Those two apparent transcription artifacts are retained as source defects and
  rejected as biochemical measurements.


  R. rubrum Ald2 required a divalent metal in the reconstitution experiments, with Co2+ and Ni2+ giving
  the highest activities among the tested conditions. Each graph cofactor edge is an alternative recombinant
  apoenzyme preparation after EDTA treatment and dialysis, followed by one hour with 0.1 mM of the selected
  metal. It does not assert simultaneous Co/Ni occupancy or identify the native cellular metal. The current
  UniProt one-cobalt-per-subunit statement carries a by-similarity qualification. Magnesium in the older
  coupled assay likewise does not establish an exclusive physiological metal for MtnA or Ald2.


  For Oah with O-acetylhomoserine, the native kcat 3.5 s−1, experimental molecular mass 46 kDa and pI
  5.91 are database-attributed to the 2012 study; its accessible main text confirms methanethiol-specific
  Rru_A0774 activity but does not expose the detailed SI measurements. Current Q2RWB7 annotates pyridoxal
  phosphate by automated inference, so the cofactor edge preserves that evidence tier instead of claiming
  an R. rubrum cofactor-occupancy measurement. Native Oah commentary attributes a 320-fold induction to
  a different 1988 citation. The 2012 main text reports a 30–320-fold range for the fourteen-gene thiol
  cluster; an Oah-specific exact fold is not inferred from that range.


  All nine native activity frames are retained, including contexts outside this route''s demonstrated
  organisms. E. coli ATCC 25922 MtnA and Ald2 have MTR1P/MTRu1P pairs of 50 micromolar/0.49 s−1 and 275
  micromolar/22 s−1, respectively, but the 2020 primary work found no conversion beyond MT-EtOH and no
  growth using these methylthio compounds as sole sulfur sources. Its native Ald2 activity includes native-host
  purification wording alongside heterologous evidence, whereas the accessible Methods describe recombinant
  expression. These shared-module data do not establish a complete E. coli Mar pathway. Arabidopsis MTI1
  complementation and Klebsiella isomerase activity are catalog contexts, not added route taxa.


  Thermus thermophilus HB8 Oah activity is another separate catalog context: pH optimum 7.8, temperature
  optimum 70 °C, O-acetylhomoserine Km 6800 micromolar, PLP and methionine inhibition are attributed to
  its 2001 study. They are not transferred to R. rubrum. Native and current identity evidence also resolve
  the older MtnA/MtnP locus-name transposition in one 2012 passage and the native MtnA commentary''s mistaken
  ribulose-phosphate arrest statement; the primary mutant block is at the upstream ribose phosphate. The
  2017 SI double-rlp1/rlp2 strain row also mislists the ald2 locus RPA4655 where the single-rlp1 row and
  cloning context support RPA2169; it is not treated as an ald2 deletion.


  Mar expression is induced during sulfur limitation and depends on the LysR-family regulator SalR/Rru_A0785
  in the tested R. rubrum background. Loss of SalR prevented the induced sulfur-assimilation and hydrocarbon-production
  phenotype; transcriptomics and genetic dependence do not themselves show direct SalR binding at a promoter.
  Sulfate inhibition differed by substrate in the 2020 figure (approximately 110 micromolar for MT-EtOH
  and 140 micromolar for DMS). This is separate from nitrogenase regulation by nitrogen availability.
  The complete upstream route is not assigned to additional species merely from mar homology or VOSC-growth
  assays.


  Fourteen defined chemical participants have exact native-to-current ChEBI InChI agreement, including
  full stereochemical and protonation layers. Reduced and oxidized ferredoxins instead have issued generic
  class identities with no defined formula. Their two-equivalent formal redox bookkeeping is retained
  without claiming a particular ferredoxin, experimental donor, or fully specified protein atom balance.
  Native Rhea cross-references 19990/10049 and current UniProt 81439/81440 remain source context; attempted
  direct retrievals were blocked, so no exact Rhea reaction mapping is asserted from those links alone.
  Numerical native Gibbs energies, where present, are computational annotations, not fresh thermodynamic
  measurements.


  The complete 2017, 2018 and 2025 scientific main-text/method/table/caption projections were read against
  retained originals. The 2017 SI scientific methods, figures and strain/assay tables through PDF page
  18, all ten pages of the 2025 SI, and the 2020 Science scientific main text plus its retained supporting
  text and figures were read; selected original figure images were also inspected. The prior complete
  2012 and 2020 Molecular Microbiology main-text readings were inherited with fresh checks of relevant
  passages. Their inaccessible SI/figure bodies, the 2020 Science external spreadsheets/databases, raw
  2025 structural and spectroscopy datasets, and unread 2017 SI gene-inventory tail are not claimed as
  newly examined. These limits do not turn a missing gene identity, source conflict or proposed donor
  into a demonstrated fact. Broader pathway-source discovery and public-release licensing remain separate
  work.'
