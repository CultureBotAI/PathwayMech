id: MetaCyc:PWY-8008
label: staphyloferrin B biosynthesis
description: 'Complete seven-transformation staphyloferrin B biosynthesis: SbnI/A/B supply two L-2,3-diaminopropionate
  units, followed by SbnE/H/F/C assembly with supplied citrate. The experimentally grounded implementation
  uses Staphylococcus aureus Newman proteins; NCTC 8325 proteins and native SbnI/B complexes are retained
  separately as source-defined assembly context, not renamed Newman entities. The seven selected current
  Rhea equations specify ionic forms and a formal open-chain terminal product. CHEBI:136993 is the linear
  dianion, not the cyclic hemiaminal characterized in the 2015 original supplement. That supplement reports
  synthetic SB as an equilibrating pair of hemiaminal epimers; PubChem CID 122234488 independently issues
  the neutral cyclic structure with an unspecified additional center. No exact equivalence or linear-only
  physiological endpoint is claimed. The observed ring-chain chemistry is disclosed without inventing
  an eighth reaction. Native citryl intermediates leave a stereocenter unspecified; current ChEBI S-specific
  forms are curated conventions rather than direct stereochemical measurements on every Newman intermediate.
  The five-ATP-per-formal-product total is derived from twice-turning precursor reactions and three ligations,
  not a measured cellular yield. SbnB reversibility is experimentally observed, while the selected direction
  follows biosynthetic flux. SbnI dimer/tetramer observations coexist with an active truncated monomer;
  SbnA/H dimers and SbnC/E/F monomer-dimer mixtures do not establish unique assembly sufficiency. Primary
  engineered constructs are distinguished from native sequence identities. The 2009 reconstitution uses
  Newman coding regions and RN6390 genetic comparison; the 2015 biological assays use USA300 JE2. Native
  DAP and ACEGA protonation differs from the selected Rhea forms; equations are not asserted to be exactly
  identical. Source-native proton/mass metadata conflicts are retained in evidence and the research disposition.
  SbnG citrate supply, SbnD transport, iron loading, receptor recognition and regulation are contextual
  processes outside the seven-object native boundary.'
