id: MetaCyc:PYRIDNUCSAL-PWY
label: NAD salvage pathway I (PNC VI cycle)
description: NAD salvage pathway I cycles NAD(+) through beta-nicotinamide D-ribonucleotide, nicotinamide, nicotinate, nicotinate beta-D-ribonucleotide, and deamido-NAD(+) before glutamine-dependent amidation regenerates NAD(+).
