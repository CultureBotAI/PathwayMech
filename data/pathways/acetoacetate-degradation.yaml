id: MetaCyc:ACETOACETATE-DEG-PWY
label: acetoacetate degradation (to acetyl CoA)
description: 'Acetoacetate degradation in Escherichia coli converts acetoacetate and free CoA to acetate and
  one net acetyl-CoA through two coupled transformations. AtoDA first transfers CoA from an acetyl-CoA donor
  to acetoacetate, giving acetoacetyl-CoA and acetate. AtoB then cleaves acetoacetyl-CoA with CoA to produce
  two acetyl-CoA molecules gross: one replaces the donor used in the first transformation and one is the net
  product. The regenerated donor is a material-balance inference, not evidence for an obligatory physical channel
  between the enzymes.


  The native transfer reaction is reversible and the pathway uses its left-to-right orientation; the reversible
  thiolase reaction is written as acetyl-CoA condensation in its native frame and is used right-to-left during
  degradation. Rhea 27807 and 21038 independently supply the corresponding oriented equations. They are alternative
  descriptions of the same two biological events. Their acetoacetate and acetate are monoanions and their acetyl-CoA,
  acetoacetyl-CoA and CoA are the explicitly represented tetraanions; acid-form PathBank cross-references are
  not substituted for these chemical identities.


  The native thiolase composite includes two reversible constituent reactions, RXN-20154 and RXN-20155. In
  their written condensation orientation, acetyl-CoA first acetylates a protein-bound cysteine and releases
  CoA; the S-acetylated residue then combines with a second acetyl-CoA to produce acetoacetyl-CoA and regenerate
  the protein-bound cysteine. All eight constituent side entries are retained as decomposition context, not
  two additional physiological pathway steps. Degradative cleavage traverses this chemistry in reverse. The
  two generic protein-residue classes do not identify an isolated free cysteine molecule or independently prove
  that a particular AtoB residue occupied that state in an experiment.


  The EcoCyc reference assembly for acetoacetyl-CoA transferase is nested: its unnamed parent contains one
  beta complex and one alpha complex, and those children contain two AtoA and two AtoD chains, respectively.
  Reciprocal component-of links support this hierarchy. Thus the reference composition is AtoA2AtoD2, not a
  single AtoA or AtoD enzyme and not an unspecified mixed controller. The unnamed AtoB reference complex contains
  four AtoB chains. These four assembly nodes and three leaf protein types are kept distinct from any individual
  assay preparation.


  The native transferase account associates a 97 kDa preparation with Sramek and Frerman (1975), while the
  1987 genetic study reports atoD and atoA products of approximately 26.5 and 26 kDa and a 42 kDa atoB product.
  These experimental apparent masses are not replaced by current sequence-derived masses or used to recalculate
  assembly stoichiometry. Current UniProt entries describe the transferase as cytoplasmic and membrane-associated.
  The native AtoA and AtoD monomer comments separately retain an older sequence-based function prediction from
  the 2003 metabolic model; that annotation is not evidence that either isolated chain catalyzes the complete
  CoA-transfer reaction.


  The native transferase commentary describes two half-reactions involving a covalent enzyme-CoA intermediate,
  two detectable conformational changes and a likely ping-pong mechanism, citing the 1975 and 1977 studies.
  It also reports broad use of short-chain acyl-CoA donors and carboxylic acid acceptors, with strongest activity
  for normal and 3-keto substrates. UniProt gives apparent Km values of 0.26 mM for acetyl-CoA in acetoacetyl-CoA
  formation and 0.035 mM for acetoacetyl-CoA in acetyl-CoA formation, citing the 1975 kinetic study. These
  are source-attributed annotations because the complete original kinetic papers were not obtained here; they
  do not establish a universal rate law, identical assay conditions or a fixed in vivo flux ratio.


  Four native regulatory annotations are retained. Acetyl-CoA competitively inhibits the transferase in REG0-11728,
  which supplies no linked primary citation; CoA is a competitive inhibitor with respect to acyl-CoA in REG0-8779,
  citing the 1977 study; p-chloromercuribenzoate inhibits it in REG0-8781, citing the 1975 purification study;
  and acetoacetyl-CoA inhibits the AtoB reaction in REG0-7500, citing the 1976 thiolase study. Their concentrations
  and preparation-specific conditions are not supplied by these complete regulation frames, so the graph records
  source-qualified inhibitory relationships without a universal in vivo potency claim. Acetyl-CoA can be a
  substrate in one direction and an inhibitor in another assay context. The mercurial is the native anion with
  the verified PubChem 21226146 structure, not an acid-form substitution.


  The native pathway account describes growth on acetoacetate as sole carbon and energy source and reports
  a 200–300-fold increase in transferase and thiolase synthesis during growth on acetoacetate, citing Pauli
  and Overath (1972). The associated protein comment also attributes AtoB induction to this work. This historical
  quantitative statement is retained as a database-attributed account, because the complete 1972 paper and
  its exact strain, baseline and assay denominators were not acquired; it is not a prediction for every E.
  coli strain or growth condition.


  The complete 1975 thiolase study distinguishes two preparations that should not be collapsed into one strain
  attribution. Thiolase I was prepared from wild-type E. coli B ATCC 11775 grown on oleate, whereas thiolase
  II was prepared from a constitutive fadR16 fad-5 atoC49 mutant grown on acetate. The paper does not identify
  that mutant as the same wild-type B preparation. Accordingly, the native summary that the AtoB enzyme was
  initially purified from E. coli B is qualified by the primary Methods, and modern AtoB/FadA names are retrospective
  mappings rather than genes sequenced in that study.


  In that 1975 work, thiolase assays were performed at 25 °C in 0.6 ml containing 67 micromol Tris at pH 8.1,
  0.134 micromol dithiothreitol, 15 micromol MgCl2, 58 nmol CoA and 12 nmol beta-ketoacyl-CoA, with CoA initiating
  the spectrophotometric reaction. Thiolase I acted on tested C4–C16 substrates, with medium-chain substrates
  preferred; the long-chain tests used lower concentrations because of substrate inhibition. Thiolase II activity
  on the tested C6 substrate was below 1% of its acetoacetyl-CoA activity. This supports strong substrate preference,
  not demonstrated zero activity on every possible substrate. Failure to detect thiolase II in the oleate-grown
  wild-type B preparation is conditional on that preparation and assay.


  The AtoB structure study is represented by its indexed abstract and the complete native annotation: apo and
  CoA-bound crystal structures support a tetramer described as a loosely associated pair of tight dimers. EcoCyc
  states that the gene was cloned from BL21(DE3) and that its sequence matches the K-12 protein. Those are
  attributed source statements, not a newly verified construct alignment, and the complete 2016 paper was not
  obtained. The native 166 kDa complex mass cites the separate 1976 study. A crystal assembly, a historical
  apparent mass and the K-12 reference sequence are complementary contexts, not interchangeable assay preparations.


  The native AtoB kinetic slots attribute Km values of 17.6 micromolar for acetoacetyl-CoA, 8.0 micromolar
  for CoA and 138.6 micromolar for acetyl-CoA, and kcat values of 220.5 s−1 for cleavage and 6.5 s−1 for condensation,
  to the 2016 study. A separate acetyl-CoA Km of 470 micromolar is imported from BRENDA with the 1976 citation.
  The 1976-linked native prose also lists apparent rates of 0.85 micromolar per minute for cleavage and 38
  nanomolar per minute for condensation. These heterogeneous annotations retain their original directions,
  units and citations; unavailable complete assay contexts prevent combining them into one fitted enzyme model
  or treating their ratios as an in vivo directional constraint.


  Sequence annotations identify an AtoB acyl-thioester site at Cys88 by similarity and proton-acceptor sites
  at positions 349 and 379 by sequence-model evidence. AtoA position 46 and the AtoD CoA-binding region at
  positions 24–30 are also sequence-model annotations. These features are useful mechanistic context but are
  not new direct mutagenesis results or proof that the generic native protein-bound cysteine class is exclusively
  AtoB Cys88. Native Pfam and GO annotations retain their computational or curated evidence levels; family
  membership alone does not establish isolated-subunit catalysis.


  The 1987 genetic and expression studies support an atoDAB structural-gene operon and a separately expressed
  atoC regulator. Their indexed abstracts distinguish complementation and gene-product assignments from promoter-level
  regulation: atoD and atoA are both required for transferase activity, while galK promoter fusions and atoC
  allele behavior support transcriptional control. The early study left some synthesis-versus-activation interpretation
  open; it is not used to claim direct allosteric activation of purified transferase by AtoC. Later evidence
  is described specifically for the atoDAEB operon nomenclature used by those studies.


  AtoC regulates expression of the acetoacetate-utilization enzymes through the atoDAEB promoter. In the complete
  2007 study, reporter assays used modified M9 glucose medium with 10 mM acetoacetate and compared promoter
  fragments extending from −206, −120 or −47 to +73 relative to the predicted transcription start. The upstream
  −206 to −120 region was required for strong AtoC binding and inducible reporter expression. Reporter constructs
  for atoS, atoC and rcsC did not show the same acetoacetate induction, providing assay-specific negative controls
  rather than a global statement about all regulation of those genes.


  The 2007 in vitro binding experiments used recombinant His10-tagged AtoC without an established phosphorylated
  preparation: the authors could not obtain significant phosphorylation under their tested in vitro conditions
  with AtoS or small phosphodonors. EMSA and footprinting therefore demonstrate DNA binding by that preparation,
  not that phosphorylation is unnecessary for physiological acetoacetate signaling. Added acetoacetate did
  not itself enhance the in vitro DNA-binding reaction. The possible failure to phosphorylate or rapid dephosphorylation
  was not resolved.


  Footprinting in the 2007 study identified two adjacent 20-base-pair AtoC-binding regions, −146 to −127 and
  −126 to −107 relative to a predicted, not experimentally mapped, transcription start. The protected region
  and hypersensitive positions were evaluated with tagged AtoC over a concentration series. Promoter mutations
  at positions including −111, −121, −130 and −140 strongly reduced induction; a −53 mutation could reduce
  induction without eliminating AtoC binding. These observations support a regulatory DNA mechanism, not direct
  changes to the catalytic chemistry of AtoDA or AtoB.


  The same study used chromatin immunoprecipitation of plasmid-borne promoter constructs in BW25113 and its
  atoSC-deletion derivative BW28878, with antibody and deletion controls, and observed increased AtoC association
  after acetoacetate induction. An IHF-deficient N7193 background compared with N99 markedly reduced induction,
  supporting an architectural contribution by IHF under those conditions. Neither plasmid-promoter occupancy
  nor an IHF-mutant response measures a fixed stoichiometric relation between AtoC abundance and metabolic
  flux.


  AtoC phosphorylation-site and mutant annotations require allele-specific interpretation. The indexed 2005
  study examined His10-tagged AtoC and D55G/H73L substitutions, with single substitutions reducing but not
  abolishing phosphorylation and the double mutant failing to respond to acetoacetate. UniProt retains uncertainty
  about independent aspartate/histidine phosphorylation versus transfer between sites. Native and UniProt annotations
  connect D55G and H73L to approximately 40% and 70% lower complexed polyhydroxybutyrate accumulation, respectively,
  using a separate 2006 study. Those cPHB phenotypes are not measured acetoacetate-catabolic fluxes, and the
  mutant proteins are not treated as unmodified reference AtoC.


  AtoC also has source-supported ornithine-decarboxylase inhibition, cPHB, spermidine-response, motility and
  chemotaxis contexts. These remain distinct from the two-step degradation chemistry. The 1993 abstract reports
  decarboxylase inhibition without reduced decarboxylase protein abundance; the 2006–2007 cPHB work concerns
  specific overexpression and phosphomutant backgrounds; and the 2011 motility study uses atoSC deletion, complementation
  and an amino-terminally truncated constitutive regulator. Their phenotypes are retained as contextual evidence,
  not additional metabolites or obligatory steps of this pathway.


  The AtoC reference annotation includes a receiver region, a sigma-54 interaction region, predicted ATP-binding
  regions and a carboxy-terminal DNA-binding region. Legacy EcoCyc and current UniProt feature boundaries need
  not be identical: the native HTH annotation spans 433–452, whereas the current UniProt DNA-binding annotation
  spans 433–456. The old AAA23450.1 sequence carries a frameshift caution and a position-99 conflict. These
  sequence and evidence-version distinctions are preserved; they do not define a new wild-type allele or a
  directly observed nucleotide stoichiometry.


  YdiF is an alternative CoA-transferase context whose physiological contribution to this acetoacetate route
  remains unestablished by the evidence reviewed here. The older EcoCyc K-12 assignment and its enzymatic-reaction
  link are based on sequence/model inference. A separate 2005 study characterized the O157:H7 ortholog, which
  the native annotation describes as 99% identical to K-12, and reported a homotetramer arranged as a dimer
  of dimers. The ortholog and the current K-12 reference are kept separate; an annotation of broad catalytic
  capacity is not proof of acetoacetate-growth necessity.


  The O157:H7 YdiF account supports broad short-chain acyl-CoA specificity and a glutamyl-CoA thioester intermediate.
  Its curated donor/acceptor account includes acetoacetyl-, propionyl-, crotonoyl- and butyryl-CoA with acetate,
  and several short carboxylate acceptors with acetyl-CoA; isovalerate was not an effective tested acceptor.
  Activity falls with longer substrates. The K-12 Glu333 mechanism and tetramer annotations are transferred
  by similarity from that ortholog. These are source-qualified biochemical contexts because the complete 2005
  paper was not obtained, and its historical uncertainty about physiological function is not presented as if
  no later work existed.


  The complete 2022 YdiF study adds direct biochemical evidence for the reverse of the assimilation transfer
  reaction and for lactyl-CoA formation. Its purified recombinant YdiF assay used 7.5 micrograms enzyme in
  50 microlitres containing 1 mM acetoacetyl-CoA and 10 mM acetate or L-lactate, 50 mM each sodium dihydrogen
  phosphate and disodium hydrogen phosphate, and 5 mM MgCl2 at pH 7.0, incubated at 35 °C for 20 minutes after
  a five-minute preincubation. LC–MS detected acetyl-CoA or lactyl-CoA products. Thus the acetate assay starts
  with acetoacetyl-CoA plus acetate; it does not directly measure forward acetoacetate assimilation.


  In that 2022 work, YdiF was expressed using pET28a in BL21(lambdaDE3) and purified by nickel-affinity methods,
  while much of the physiology concerned MG1655. YdiF overexpression increased lysine acetylation and lactylation
  signals relative to an empty-vector control. This study does not establish that YdiF is necessary for growth
  on acetoacetate or that lactyl-CoA is an intermediate of the native two-step degradation route. The additional
  YiaC/CobB, PykF mutant, molecular-dynamics and glycolytic-growth experiments concern protein lactylation
  and are not added as pathway steps. Exact supplement-only cloning details and all supplemental datasets were
  not independently read.


  PathBank PW002090/SMP0002102 describes a broader acetate-metabolism diagram with five reactions and twenty-one
  side entries. Its phosphate-acetyltransferase and acetate-kinase segment overlaps an already represented
  acetate-production route, while acetyl-CoA synthetase is an alternative acetate-assimilation route outside
  the present native pathway. Its transferase reaction agrees with the two-step acetoacetate boundary, but
  its thiolase reaction incorrectly places CoA among the products and gives only one acetyl-CoA. That equation
  is not imported. The PathBank AtoB tetramer is explicit, whereas the transferase controller lists AtoD and
  AtoA without component coefficients; its missing stoichiometry does not replace the complete nested EcoCyc
  reference assembly.


  The acetyl-CoA product can feed central metabolism, including the TCA cycle, as described by the native pathway
  commentary. That interface is not an additional reaction in this record and does not quantify ATP yield or
  prove the same flux partition under all oxygen and growth conditions. The record has an E. coli species scope
  but preserves the distinct K-12/MG1655, BL21, wild-type B, constitutive mutant and O157:H7 evidence contexts
  instead of treating every observation as universal across the species.


  AtoB has also been used in engineered 1-butanol and medium-chain fuel production, and the native entries
  explain the historical ato gene-name derivation from acetoacetate. These annotations are preserved as application
  and nomenclature context. They do not change the physiological pathway boundary or establish an engineered
  product as a normal degradation endpoint.


  Evidence depth is explicit throughout this record: the complete 1975 thiolase, 2007 AtoC and 2022 YdiF papers
  were read, while inaccessible older transferase/thiolase papers, the 1987 genetic papers, the 2005 YdiF paper
  and the 2016 structure paper are represented by acquired indexed abstracts where available and clearly attributed
  database annotations. Missing full assay contexts are not supplied from titles, cross-references or metadata
  alone. The whole issuing pathway, reaction, assembly, regulation and protein originals are retained separately
  from primary-paper evidence.'
