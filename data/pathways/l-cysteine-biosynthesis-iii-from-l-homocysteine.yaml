id: gomodel:YeastPathways_HOMOCYSDEGR-PWY-1
label: L-cysteine biosynthesis III (from L-homocysteine)
description: >-
  L-cysteine biosynthesis III (from L-homocysteine) condenses L-homocysteine
  with L-serine to form L-cystathionine and then cleaves L-cystathionine to
  L-cysteine, 2-oxobutanoate, and ammonia in Saccharomyces cerevisiae S288C.
