id: KEGG:M00373
label: Ethylmalonyl pathway
description: The complete 14-reaction KEGG M00373 ethylmalonyl pathway assimilates three acetyl-CoA plus CO2 and
  bicarbonate into malate and succinyl-CoA. All twelve mandatory orthology groups are retained, including both propionyl-CoA
  carboxylase subunits and the complete propionyl branch. Experimental protein scope is Cereibacter sphaeroides
  2.4.1/DSM158, historically Rhodobacter sphaeroides; AM1 studies provide separately scoped route and terminal-chemistry
  corroboration. Mcl2 hydrolysis terminates the malate branch without ATP formation. The native MetaCyc PWY-5741
  ATP-forming terminal ligase conflicts with this chemistry, so the two pathway identifiers are not exact-mapped.
  Native CPD-9409 has an older stereochemical conflict; current Rhea/ChEBI beta-methylmalyl chemistry is retained.
  The R-specific hydroxybutyryl-CoA branch follows the issued module and primary R. sphaeroides evidence; AM1's
  figure versus assay R/S wording disagreement is not silently resolved. Rhea's whole-ETF redox states are a formal
  equation. The cited ACAD-family two-ETF mechanism is consistent with observed Mcd ETF semiquinone formation; the
  Mcd assays do not directly measure its two-ETF microscopic stoichiometry. D3JV03 exactly matches the deposited
  native 548-aa Mcd coding product; purification tags have separate construct scope; the 555-aa Q3J5V7 counterpart
  has seven extra N-terminal residues, with no processing explanation inferred. Reviewed Ecm/Mcd homodimer annotations,
  inferred PCC/MCM assemblies, alternative metal assay conditions and Mcl2's unresolved dimer/trimer are distinguished
  in evidence. PccR indirectly controls the PCC step through pccB transcription. Exact PhaB and crotonase protein
  assignments remain unresolved; this does not omit their chemical reactions. No upstream acetate activation, downstream
  TCA/serine reactions, engineered Mco chemistry or guessed regulator ligand is added.
pathway_type: acetyl-coa-assimilation
