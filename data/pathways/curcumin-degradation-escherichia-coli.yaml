id: PathBank:SMP0001910
label: Curcumin Degradation
description: 'PathBank SMP0001910 (native BioPAX archive member PW001896.owl) models the two-step
  NADPH-dependent reductive degradation of curcumin through dihydrocurcumin to tetrahydrocurcumin in
  Escherichia coli, catalyzed by the homodimeric NADPH-dependent curcumin/dihydrocurcumin reductase
  CurA (PathBank:SMP0001910/ProteinComplex/3920, two copies of Protein/10350 cross-referenced to
  UniProtKB:P76113). In the first step (RHEA:34821, right-to-left direction of RHEA:34819; native
  Reactions/5204, EC 1.3.1.n3, conversionDirection LEFT_TO_RIGHT), homodimeric CurA reduces curcumin
  (CHEBI:3962; native Compound/PW_C001532 Curcumin) with NADPH(4-) (CHEBI:57783; pH 7.3 major
  microspecies of native Compound/PW_C000146 NADPH, CHEBI:16474) and hydron (CHEBI:15378; native
  Compound/PW_C040034 Hydrogen Ion) to dihydrocurcumin (CHEBI:67262; native Compound/PW_C012734
  Dihydrocurcumin) and NADP(3-) (CHEBI:58349; pH 7.3 major microspecies of native Compound/PW_C000143
  NADP, CHEBI:18009).


  In the second step (RHEA:34813, right-to-left direction of RHEA:34811; native Reactions/5205,
  conversionDirection LEFT_TO_RIGHT), the same CurA homodimer reduces the dihydrocurcumin intermediate
  (CHEBI:67262) with a second equivalent of NADPH(4-) (CHEBI:57783) and hydron (CHEBI:15378) to yield
  tetrahydrocurcumin (CHEBI:67263; native Compound/PW_C002561 Tetrahydrocurcumin) and NADP(3-)
  (CHEBI:58349). Hassaninasab et al. (2011, PMID:21467222) first identified curcumin-converting
  activity in a human fecal Escherichia coli isolate (strain Ni2, NCBITaxon:562), purified the native
  82 kDa homodimer and identified the curA (yncB) gene in Escherichia coli K-12 strain DH10B
  (NCBITaxon:83333; reviewed UniProtKB:P76113), and characterized recombinant CurA expressed in E. coli
  BL21 (NCBITaxon:562). Both double-bond reductions and their shared dihydrocurcumin intermediate are
  retained from PW001896.owl; the redundant two-step overall Rhea reaction (RHEA:34815) is excluded.
  Tetrahydrocurcumin is the demonstrated endpoint of CurA catalysis without complete mineralization,
  downstream cleavage, or a dedicated curcumin transporter, and PW001896.owl does not assert a
  cellular compartment.'
