id: PathBank:SMP0002042
label: Thiamin Diphosphate Biosynthesis
description: 'PathBank SMP0002042 (native BioPAX archive member PW002028.owl) models Escherichia coli thiamin diphosphate
  biosynthesis across ten enzyme-catalyzed transformations spanning de novo 5-amino-1-(5-phospho-beta-D-ribosyl)imidazole
  (AIR) formation from 5-phospho-alpha-D-ribose 1-diphosphate (PRPP) and downstream pyrimidine formation, thiazole-pyrimidine
  condensation, and thiamine monophosphate phosphorylation. In the six-reaction upstream purine/thiamine precursor segment,
  amidophosphoribosyltransferase PurF (UniProtKB:P0AG16; RHEA:14907, EC:2.4.2.14; native Reactions/3410) converts PRPP, L-glutamine,
  and H2O to 5-phospho-beta-D-ribosylamine, L-glutamate, and diphosphate; phosphoribosylamine--glycine ligase PurD (UniProtKB:P15640;
  RHEA:17454, EC:6.3.4.13; native Reactions/3411) ligates 5-phospho-beta-D-ribosylamine and glycine with ATP to form N(1)-(5-phospho-beta-D-ribosyl)glycinamide
  (GAR); two alternative formyltransferases—10-formyltetrahydrofolate-dependent PurN (UniProtKB:P08179; RHEA:15054, EC:2.1.2.2;
  native Reactions/5930) and ATP/formate-dependent PurT (UniProtKB:P33221; RHEA:24830, EC:6.3.1.21; native Reactions/3412)—convert
  GAR to N(2)-formyl-N(1)-(5-phospho-beta-D-ribosyl)glycinamide (FGAR); phosphoribosylformylglycinamidine synthase PurL (UniProtKB:P15254;
  RHEA:17130, EC:6.3.5.3; native Reactions/3413) converts FGAR, L-glutamine, ATP, and H2O to 2-formamido-N(1)-(5-O-phospho-beta-D-ribosyl)acetamidine
  (FGAM); and phosphoribosylformylglycinamidine cyclo-ligase PurM (UniProtKB:P08178; RHEA:23033, EC:6.3.3.1; native Reactions/3414)
  cyclizes FGAM with ATP to AIR (CHEBI:137981). In the four-reaction downstream thiamine segment, radical-SAM phosphomethylpyrimidine
  synthase ThiC (UniProtKB:P30136; RHEA:24841, EC:4.1.99.17; native Reactions/5931) rearranges AIR with S-adenosyl-L-methionine
  to 4-amino-2-methyl-5-(phosphooxymethyl)pyrimidine (HMP-P, CHEBI:58354), 5''-deoxyadenosine, CO, formate, L-methionine, and
  3 H(+); hydroxymethylpyrimidine/phosphomethylpyrimidine kinase ThiD (UniProtKB:P76422; RHEA:19894, EC:2.7.1.49; native Reactions/5932)
  phosphorylates HMP-P with ATP to 4-amino-2-methyl-5-(diphosphooxymethyl)pyrimidine (HMP-PP, CHEBI:57841); thiamine-phosphate
  synthase ThiE (UniProtKB:P30137; RHEA:47845, EC:2.5.1.3; native Reactions/5933) condenses HMP-PP with 2-[(2R,5Z)-2-carboxy-4-methylthiazol-5(2H)-ylidene]ethyl
  phosphate (cTHZ-P, CHEBI:62899) to thiamine monophosphate (CHEBI:37575), CO2, and diphosphate; and thiamine-monophosphate
  kinase ThiL (UniProtKB:P0AGG0; RHEA:15914, EC:2.7.4.16; native Reactions/5934) phosphorylates thiamine monophosphate with
  ATP to thiamine diphosphate (CHEBI:58937) and ADP.


  Several native PW002028.owl BioPAX representation quirks are preserved in provenance while normalized to verified biochemical
  authorities in the causal graph: (1) unlike MetaCyc THISYN-PWY (which begins at AIR and includes the IscS/ThiF/ThiI/ThiS/Dxs/ThiH/ThiG
  thiazole-synthesis branch), PathBank SMP0002042 includes the six upstream PRPP-to-AIR reactions (PurF, PurD, PurN, PurT,
  PurL, PurM) and treats the carboxythiazole phosphate cosubstrate (Compound/PW_C042574, CHEBI:62899) of Reactions/5933 (RHEA:47845)
  as an external boundary input without modeling upstream thiazole synthesis; (2) native Reactions/3412 (catalyzed by PurT,
  UniProtKB:P33221) carries partial eCNumber 2.1.2.- in PW002028.owl, whereas the ATP- and formate-dependent GAR formyltransferase
  2 reaction is EC:6.3.1.21 (RHEA:24830, family RHEA:24829); (3) native Reactions/5933 (ThiE, RHEA:47845) lists Compound/PW_C040034
  (Hydrogen Ion, CHEBI:15378) on bp:left with stoichiometricCoefficient 1.0, whereas the charge-balanced Rhea reaction RHEA:47845
  consumes 2 H(+) (coefficient 2); (4) native CompoundReference/PW_C001060 (Thiamine pyrophosphate, formula C12H19N4O7P2S,
  ChEBI_CHEBI_9532, KEGG_Compound_C00068) carries an erroneous BioCyc_2-(alpha-lactyl)-thpp cross-reference alongside its
  thiamine diphosphate (CHEBI:58937) identifiers; and (5) native BiochemicalPathwayStep elements (PathwayEnzymeReaction/22117
  through PathwayEnzymeReaction/22126) in PW002028.owl are listed under bp:Pathway/bp:pathwayOrder without bp:nextStep child
  elements and native Protein/SmallMolecule instances omit bp:cellularLocation, so step ordering and metabolite handoffs are
  anchored to bp:pathwayOrder and shared reaction bp:right/bp:left compounds and cytoplasmic localization (GO:0005737) is
  asserted only where directly supported by reviewed UniProtKB entries (UniProtKB:P15254 and UniProtKB:P08178) for Escherichia
  coli K-12 (NCBITaxon:83333).'
