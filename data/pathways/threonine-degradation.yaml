id: gomodel:YeastPathways_THREOCAT2-PWY
label: threonine degradation
description: Threonine degradation in Saccharomyces cerevisiae S288C includes CHA1-enabled
  threonine deamination to 2-oxobutanoate and the GLY1 threonine aldolase route to glycine
  and acetaldehyde. The broader native outline contains unassigned or neighbouring reactions;
  KBL is absent and threonine dehydrogenase is uncertain in yeast. An unsupported reverse
  cystathionine-condensation branch is excluded.
