id: Reactome:R-MTU-879325
label: mycothiol S-conjugate catabolism
description: Mycobacterium tuberculosis Mca hydrolyzes detoxification conjugates of mycothiol
  to an N-acetyl-L-cysteine S-conjugate and glucosaminyl-inositol. Mca binds iron under anaerobic
  purification and zinc under aerobic purification; the native Reactome zinc complex describes
  the latter condition.
