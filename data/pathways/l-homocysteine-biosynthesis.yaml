id: gomodel:YeastPathways_PWY-5344
label: L-homocysteine biosynthesis
description: L-homocysteine biosynthesis in Saccharomyces cerevisiae S288C uses MET2
  to acetylate L-homoserine with acetyl-CoA, forming O-acetyl-L-homoserine and coenzyme
  A, then uses MET17 to condense O-acetyl-L-homoserine with hydrogen sulfide to produce
  L-homocysteine, acetate, and hydron.
pathway_type: amino-acid-biosynthesis
