id: gomodel:YeastPathways_PWY3O-1565
label: dolichyl glucosyl phosphate biosynthesis
description: Dolichyl glucosyl phosphate biosynthesis in Saccharomyces cerevisiae
  S288C converts D-glucopyranose 6-phosphate to alpha-D-glucose 1-phosphate through
  PGM1, PGM2, or YHL012W phosphoglucomutase activity, couples alpha-D-glucose 1-phosphate
  with UTP through UGP1 to form UDP-alpha-D-glucose, and uses ALG5 to transfer glucose
  from UDP-alpha-D-glucose to dolichyl phosphate, producing dolichyl beta-D-glucosyl
  phosphate and UDP.
