id: MetaCyc:PWY0-42
label: 2-methylcitrate cycle I
description: Complete five-reaction MetaCyc route from propanoate activation through methylcitrate synthesis,
  dehydration, aconitase hydration and methylisocitrate cleavage to pyruvate and succinate, represented
  for Escherichia coli K-12 with primary experiments separately scoped to their strains and preparations.
  The central methylcitrate stereochemistry remains experimentally disputed. Approved stereounspecified
  Rhea reactions 57493 and 57497 and CHEBI:15598 preserve the established transformations without selecting
  an absolute stereoisomer or claiming all stereoisomers are substrates. These are broader reactions than
  the stereospecific native annotations, not exact replacements. PrpC and PrpB assemblies are explicit;
  AcnB monomer/dimer behavior is conditional. Acs and PrpE are alternative activation roles with different
  evidence strength. Oxaloacetate regeneration by the TCA cycle is outside the five-member native definition.
pathway_type: propionate-catabolic-pathway
