id: MetaCyc:FUCCAT-PWY
label: L-fucose degradation I
description: L-fucose degradation I epimerizes beta-L-fucose to alpha-L-fucose, isomerizes L-fucose to L-fuculose, phosphorylates L-fuculose with ATP, and cleaves L-fuculose 1-phosphate to (S)-lactaldehyde and dihydroxyacetone phosphate.
