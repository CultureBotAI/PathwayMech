id: MetaCyc:PWY-5686
label: UMP biosynthesis I
description: UMP biosynthesis I uses glutamine-dependent carbamoyl-phosphate synthase to form carbamoyl
  phosphate, condenses it with L-aspartate, cyclizes and oxidizes the pyrimidine ring to orotate, transfers
  a phosphoribosyl group to form orotidine 5'-phosphate, and decarboxylates that intermediate to UMP.
