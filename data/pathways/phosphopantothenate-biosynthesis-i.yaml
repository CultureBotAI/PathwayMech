id: MetaCyc:PANTO-PWY
label: phosphopantothenate biosynthesis I
description: Phosphopantothenate biosynthesis I condenses 3-methyl-2-oxobutanoate with 5,10-methylene-tetrahydrofolate
  to form 2-dehydropantoate, reduces it to (R)-pantoate, ligates (R)-pantoate with beta-alanine to form
  (R)-pantothenate, and phosphorylates (R)-pantothenate to (R)-4'-phosphopantothenate.
pathway_type: cofactor-biosynthesis
