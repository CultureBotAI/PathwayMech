id: PathBank:SMP0002089
label: Purine Deoxyribonucleosides Degradation
description: The complete six-reaction PathBank pathway annotated here for Escherichia coli K-12 MG1655
  channels deoxyadenosine, deoxyinosine and deoxyguanosine into free purine bases, acetaldehyde and D-glyceraldehyde
  3-phosphate. Add deaminates deoxyadenosine to deoxyinosine; the DeoD homohexamer provides three parallel
  phosphorolysis branches, including direct deoxyadenosine cleavage. DeoB transfers the deoxyribose phosphate
  from C1 to C5 and DeoC cleaves the resulting sugar phosphate. Degradation-directed Rhea reactions retain
  every chemical side and its exact charge and stereochemistry. This native boundary ends before acetaldehyde
  oxidation to acetyl-CoA and does not assert purine ring degradation, nucleoside uptake, or nucleotide
  salvage. MG1655 follows native component annotations; the reviewed proteins are K-12 entries, and the
  inspected enzyme studies do not establish whole-pathway flux in MG1655. DeoC's monomer/dimer states
  and Add's inferred zinc assignment remain explicitly qualified.
pathway_type: purine-deoxyribonucleoside-catabolism
