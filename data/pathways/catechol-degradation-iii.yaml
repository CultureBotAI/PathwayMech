    plus two minor bands and a 162 ± 5 kDa native mass, supporting an inferred homotetramer; later wording
    calling it homogeneous does not erase those impurities. Copper sulfate, zinc chloride and NADH effects
    are assay-specific. Sodium cyanide was tested, not hydrogen cyanide. The three analog inhibitors in
    that paper target transferase and are not asserted here as thiolase inhibitors. PMID11741863 separately
    links paper catF to a matching N-terminus and activity in Escherichia coli DH5alpha carrying pKSC2;
