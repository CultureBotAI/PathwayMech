id: MetaCyc:PWY-5417
label: catechol degradation III (ortho-cleavage pathway)
description: 'Catechol degradation III is the complete six-step ortho route from catechol to succinate
  and acetyl-CoA. Oxygen-dependent intradiol cleavage gives cis,cis-muconate, followed by cycloisomerization
  to (S)-muconolactone, isomerization to the enol lactone, hydrolysis to 3-oxoadipate, succinyl-CoA-dependent
  CoA transfer and thiolysis. The four-step catechol ortho-cleavage module and the two-step 3-oxoadipate
  degradation module are both represented inside this parent. The independently reconciled formal net
  is catechol + O2 + H2O + CoA(4−) → succinate(2−) + acetyl-CoA(4−) + 2 H+; succinyl-CoA is consumed by
  transferase and regenerated by thiolase. Each formal intermediate, water, proton and CoA species is
  explicit. Native reaction directions, reversible annotations and pathway traversal remain distinct from
  the issuing directional Rhea nodes. KEGG M00568 is only the shorter child boundary, and R03959 lacks
  the required (S)-muconolactone specificity.


  Nine current NCBI Taxonomy identities ground the native parent''s eleven organism rows. The ungrounded
  native mt-2 and Sinorhizobium meliloti Rm2011 rows remain named source contexts without invented taxon
  IDs. These parent annotations do not establish all six steps experimentally in every taxon. Exact donor
  strains, native preparations, expression hosts, constructs and method limits accompany the activity
  edges. Rm2011 is not equated to the engineered RmK927/Rm5004/Rm1021/SU47 lineage used in PMID16885292;
  that transferase study concerns the protocatechuate branch. PMID3941043 also concerns branch-specific
  expression rather than complete catechol-route demonstrations.


  The graph preserves twenty distinct native activity assignments for nineteen catalysts. Predicted MT1
  CatC, E. coli PaaJ inference and crude-extract evidence, Y2 thiolase nomenclature and preparation gaps,
  Pseudomonas putida PcaF mutant evidence, engineered Tfu0875 contexts and H16 PcaF expression are explicitly
  qualified as enabling assignments. Two native SalC activity identifiers remain separate annotations
  of one protein and one formal step. The adjacent CcaC hydrolase and H16 adipate activation complex are
  retained only to explain documented preparation and gene-name conflicts; neither adds a formal route
  step.


  Three inhibitor assignments are corrected to the B13 CoA transferase using the primary paper, and are
  not asserted on the native thiolase targets. The B13 thiolase assays used copper sulfate, zinc chloride,
  sodium cyanide and NADH under specific in vitro conditions. Hydrogen cyanide is not a substitute for
  the tested sodium cyanide. Mercury reagent effects are indeterminate because the reagents destroyed
  substrate, while magnesium was used for the assay chromophore and is not established as an essential
  thiolase cofactor. Expression induction and repression are separate from direct catalytic regulation.


  Historical PcaD and CatA preparations are not silently equated with modern sequences. The approximately
  11 kDa PcaD subunit and inferred trimer in PRS2260 do not identify modern KT2440 Q88N36. Deleted CatA
  accession Q9AEQ0 has no selected replacement; mt-2, C-1 isozymes and B13 dioxygenases remain separate.
  Native gene/product and component relations are retained with their exact source objects; sequence mismatches,
  discontinued Gene links and engineered structure variants remain explicit in the accompanying evidence.
  PMID761399 is rejected as an unrelated human amniotic-fluid polyamine paper, without guessing a replacement
  identifier.


  MT1 expression experiments distinguish the cat and sal clusters under salicylate and 5-chlorosalicylate
  growth conditions. Proposed CatR/muconate signaling remains a hypothesis rather than direct ligand-binding
  evidence (PMID17172348). The distinct B13 CatD recombinant hydrolase in Escherichia coli BL21(DE3)pLysS,
  and the neighboring putative AMP-binding open reading frame, are not substitutes for historical Pseudomonas
  putida PcaD (PMID11741863). Likewise, the mt-2 CatA clone was assayed in Escherichia coli crude extracts,
  whereas the historical native C-1 isozyme measurements concerned separate preparations.


  Pseudomonas putida PRS2000 is a derivative of PRS1 (ATCC 12633), not a synonymous strain identifier.
  PcaR-dependent pcaIJ expression is distinct from the separate promoter-binding experiment. The latter
  used the full pHS104 construct and has an unresolved Methods K38 versus Figure 6 DH5alpha host discrepancy;
  the truncated pHS105 control is separate. The deposited PcaR sequence matches Q52154 but leaves the
  native initiation site uncertain. Beta-ketoadipate and adipate expression effects do not establish direct
  PcaR ligand binding. PMID8522507 explicitly reports benzoate repression of pcaK, but not pcaF.


  In the separate Sinorhizobium meliloti transferase study, the engineered RmK927 lineage and the observed
  PcaI bands of about 36 and 38 kDa and PcaJ band of 28 kDa do not establish a total oligomeric assembly.
  Alternative initiation was proposed for PcaI. Its pcaF reporters concern expression in the protocatechuate
  branch rather than purified thiolase catalysis (PMID16885292). In Pseudomonas stutzeri A1501, pcaD and
  pcaR mutant/complementation and metabolite results support pathway involvement, while the regulator
  underlying the reported catBC response remains unresolved. KT2440 is a comparison in that paper, not
  the experimental preparation (PMID20137101).'
