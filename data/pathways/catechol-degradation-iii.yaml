    C-1 alpha-alpha, alpha-beta and beta-beta isozymes in PMID2295613 and their method-dependent masses.
    Table II measures approximately one iron atom per enzyme complex, not per subunit, with pH optimum 7.5;
    it does not establish an exact ferric chemical species here. PMID7646060 reports 98% amino acid identity
    between its mt-2 CatA and C-1 beta CatA preparations; this comparison is not transferred to AY029000.1/AAK33066.1.
