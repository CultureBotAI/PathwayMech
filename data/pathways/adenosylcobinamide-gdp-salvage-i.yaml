id: MetaCyc:PWY-7971
label: adenosylcobinamide-GDP salvage from cobinamide I
description: 'The Escherichia coli K-12 activation subpathway converts cob(II)inamide to adenosylcobinamide-GDP.
  It retains all five native reactions: binding to corrinoid adenosyltransferase, reduction of the bound
  corrinoid, adenosyl transfer and release, ATP-dependent phosphorylation, and guanylyl transfer. The
  reduction can occur spontaneously; the complete generic flavoprotein donor and bound-enzyme states do
  not identify a specific E. coli electron donor or oligomer. BtuR and CobU functional assignments are
  supported by native annotation, similarity and genetic evidence, not purified E. coli reconstitution
  of every step. Two native PathBank CobU role/location projections each contain two P0AE76 subunits;
  they are not asserted to be distinct enzyme species or formally identical objects. The homodimer and
  activities retain annotation/inference limits, without claiming monomer sufficiency. BtuR mutants retain
  anaerobic cobinamide utilization in the tested conditions; no universal BtuR requirement is asserted.
  This record uses Rhea charge forms and stops at adenosylcobinamide-GDP, before nucleotide-loop assembly.
  It does not include the net activation reaction as a second parallel conversion, corrin-ring synthesis,
  transport or complete cobalamin salvage.'
