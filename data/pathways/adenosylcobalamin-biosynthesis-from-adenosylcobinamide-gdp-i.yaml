id: MetaCyc:PWY-5509
label: adenosylcobalamin biosynthesis from adenosylcobinamide-GDP I
description: 'This three-reaction nucleotide-loop assembly pathway starts with supplied adenosylcobinamide-GDP
  and 5,6-dimethylbenzimidazole. CobT transfers phosphoribose from nicotinate ribonucleotide, CobS joins
  the resulting alpha-ribazole phosphate to the activated corrinoid, and CobC removes the terminal phosphate.
  The graph represents reviewed Escherichia coli K-12 assignments with explicit evidence limits: CobT
  homodimer and CobS function/magnesium annotations include similarity evidence, and the current E. coli
  CobC annotation is inferred from Salmonella CobC. K-12 growth genetics supports salvage; the 2021 EcCobS
  assays used a BL21-derived construct and heterologous accessory enzymes. A 2023 engineered cell-free
  B12 production system separately used MG1655 CobT, CobS and CobC, including a soluble SIMPLEx-CobS fusion
  and engineered complementation. This strengthens MG1655 functional support without establishing isolated
  CobC kinetics, native quaternary structures or terminal-step physiology. Chemical naming inconsistencies
  in that supplement are preserved as source conflicts; the graph uses independently balanced Rhea chemistry.
  Terminal-step physiological timing was reassessed in Salmonella, not directly in K-12. No universal
  enzyme essentiality, exclusive route or physiological flux is implied. The activated corrinoid input
  separates this exact pathway from upstream cobinamide uptake, reduction, adenosylation and GDP activation;
  this record does not cover the full salvage superpathway or de novo corrin-ring synthesis. The alternative
  unphosphorylated-ribazole route and cobamide remodeling are excluded.'
