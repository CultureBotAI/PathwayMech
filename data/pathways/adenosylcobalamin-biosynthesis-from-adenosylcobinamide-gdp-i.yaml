- id: nla-edge-024
  subject: RHEA:11197
  predicate: provides_input_for
  object: RHEA:23561
  description: The material-transfer edge represents the native annotated route. The cited 1999 reconstitution
    uses Salmonella enzymes; the later MG1655 proteins occur in a larger engineered multienzyme system,
    not an isolated native three-enzyme physiological-flux assay.
  evidence:
  - reference_id: MetaCyc:PWY-5509
    source_assertion: PWY-5509 orders DMBPPRIBOSYLTRANS-RXN before COBALAMIN5PSYN-RXN. Alpha-ribazole
      5'-phosphate is the first reaction's product and the second reaction's substrate.
    source_locator: Pathway[@frameid="PWY-5509"]/reaction-ordering[Reaction[@frameid="COBALAMIN5PSYN-RXN"]]/predecessor-reactions;
      reaction-layout
  - reference_id: PMID:10518530
    source_assertion: The Salmonella enzyme reconstitution uses the CobT product alpha-ribazole 5'-phosphate
      with adenosylcobinamide-GDP for CobS-dependent formation of cobalamin phosphate.
    source_locator: 'PMC18366: Results, The CobS Protein Has Cobalamin Synthase Activity; Isolation of
      Products from the NLA and Cobalamin Synthase Reactions; Figures 3C and 4'
- id: nla-edge-025
  subject: RHEA:23561
  predicate: provides_input_for
  object: RHEA:30368
  description: This sequence is the selected reviewed E. coli annotation with explicit cross-species inference
    in the CobC annotation and later engineered MG1655 system support. The earlier 1999 in vitro paper
    alone did not establish the physiological timing of phosphate removal; the 2007 reassessment establishes
    it specifically in Salmonella.
  evidence:
  - reference_id: MetaCyc:PWY-5509
    source_assertion: PWY-5509 orders RXN-8770 after COBALAMIN5PSYN-RXN through the adenosylcobalamin
      5'-phosphate intermediate.
    source_locator: Pathway[@frameid="PWY-5509"]/reaction-ordering[Reaction[@frameid="RXN-8770"]]/predecessor-reactions;
      reaction-layout
  - reference_id: PMID:10518530
    source_assertion: Salmonella CobC-containing extract dephosphorylated the cobalamin phosphate formed
      by nucleotide-loop assembly; vector-only extract did not. Corrinoids were cyanated before HPLC analysis.
    source_locator: 'PMC18366: Results, The CobC Protein Can Dephosphorylate AdoCbl-5''-P in Vitro; Figure
      6'
  - reference_id: PMID:17209023
    source_assertion: The later Salmonella study supports alpha-ribazole phosphate use by CobS followed
      by terminal CobC dephosphorylation. Its Discussion states that validity in other prokaryotes remains
      to be shown.
    source_locator: 'PMC1899380: Results, Alpha-RP is the preferred substrate of the AdoCbl-5''-P synthase
      (CobS) enzyme; Figure 7; Discussion, opening paragraph; Figure 8'
