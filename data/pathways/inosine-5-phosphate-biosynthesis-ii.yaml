id: MetaCyc:PWY-6124
label: inosine-5'-phosphate biosynthesis II
description: Inosine-5'-phosphate biosynthesis II carboxylates 5-amino-1-(5-phospho-beta-D-ribosyl)imidazole
  directly to CAIR, ligates the carboxylate to L-aspartate, releases fumarate to form AICAR, formylates
  AICAR with 10-formyltetrahydrofolate, and cyclizes FAICAR to IMP.
pathway_type: nucleotide-biosynthesis
