id: PathBank:SMP0002070
label: Conversion of Succinate to Propanoate
description: 'PathBank SMP0002070 (native BioPAX archive member PW002058.owl) models the Escherichia
  coli Sbm/ScpABC three-enzyme biochemical cycle that couples succinyl-CoA rearrangement, methylmalonyl-CoA
  decarboxylation, and CoA transfer from propionyl-CoA to succinate to form propionate and regenerate
  succinyl-CoA. In the first step of the cycle (RHEA:22890, right-to-left direction of RHEA:22888;
  native Reactions/6008, EC 5.4.99.2), homodimeric methylmalonyl-CoA mutase Sbm (PathBank:SMP0002070/ProteinComplex/3725,
  two copies of Protein/6463 cross-referenced to UniProtKB:P27253) rearranges succinyl-CoA(5-) (CHEBI:57292;
  native Compound/PW_C000496 Succinyl-CoA, CHEBI:15380) to (R)-methylmalonyl-CoA(5-) (CHEBI:57326;
  native Compound/PW_C002532 R-Methylmalonyl-CoA) using adenosylcobalamin (cobamamide, CHEBI:18408)
  as cofactor. Native PAGE and size-exclusion chromatography show that apo-Sbm exists in vitro as a
  mixture of monomer and homodimer and can also form an equimolar complex with the G-protein chaperone
  YgfD (PMID:18950999).


  In the second step (RHEA:27667, left-to-right direction of RHEA:27666; native Reactions/6006, EC
  4.1.1.41), homohexameric methylmalonyl-CoA decarboxylase ScpB/YgfG (PathBank:SMP0002070/ProteinComplex/3726,
  six copies of Protein/10202 cross-referenced to UniProtKB:P52045; crystal structure dimer of trimers
  in PMID:10769118) decarboxylates (R)-methylmalonyl-CoA(5-) (CHEBI:57326) with hydron (CHEBI:15378;
  native Compound/PW_C040034 Hydrogen Ion) to propionyl-CoA(4-) (CHEBI:57392; native Compound/PW_C001164
  Propionyl-CoA, CHEBI:15539) and carbon dioxide (CHEBI:16526; native Compound/PW_C000702 Carbon Dioxide).
  The graph retains the native PathBank PW002058.owl and reviewed Rhea/UniProt assignment of (R)-methylmalonyl-CoA
  to ScpB while documenting the unresolved experimental stereospecificity conflict: Haller et al. (2000,
  PMID:10769117) demonstrated coupled Sbm + YgfG conversion of succinyl-CoA to propionyl-CoA in vitro
  without resolving methylmalonyl-CoA enantiomers, whereas Akawi et al. (2015/2017, PMID:28716098) reported
  that engineered E. coli strains required heterologous methylmalonyl-CoA epimerase expression for propionate
  production from glucose in minimal medium, and a 2019 direct MMCD-His6 assay (DOI:10.1021/jacs.9b00650.s001)
  used a racemic (R/S)-methylmalonyl-CoA substrate mixture and observed competing thioester hydrolysis.
  No unverified native epimerase or wild-type physiological flux is asserted.


  In the third step (RHEA:28011, left-to-right direction of RHEA:28010; native Reactions/6009, EC
  2.8.3.-), propanoyl-CoA:succinate CoA transferase ScpC/YgfH (UniProtKB:P52043; native Protein/7313
  Propionyl-CoA:succinate CoA-transferase) transfers CoA from propionyl-CoA(4-) (CHEBI:57392) to succinate(2-)
  (CHEBI:30031; native Compound/PW_C000249 Succinic acid, CHEBI:15741) to yield propionate (CHEBI:17272;
  native Compound/PW_C000237 Propionic acid, CHEBI:30768) and regenerate succinyl-CoA(5-) (CHEBI:57292).
  Native PW002058.owl assigns Species/3 to species-level Escherichia coli (NCBITaxon:562), while the
  three reviewed UniProtKB entries and primary biochemical/structural studies characterize Escherichia
  coli K-12 (NCBITaxon:83333).'
