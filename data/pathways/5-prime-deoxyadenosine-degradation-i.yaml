id: MetaCyc:PWY-8130
label: 5'-deoxyadenosine degradation I
description: 'This exact MetaCyc pathway converts 5''-deoxyadenosine plus inorganic phosphate to adenine,
  dihydroxyacetone phosphate (DHAP) and acetaldehyde in three reactions. MtnP phosphorolysis produces
  5-deoxy-α-D-ribose 1-phosphate and adenine; MtnA isomerizes the sugar phosphate to 5-deoxy-D-ribulose
  1-phosphate; Ald2 cleaves it to DHAP and acetaldehyde. The graph retains all nine native chemical-side
  occurrences and both intermediate transfers. Its phosphate-consuming entry distinguishes it from the
  hydrolysis-plus-kinase route PWY-8131. Free 5-deoxyribose, ATP, ADP and hydrolytic water are not additional
  steps or participants in this route. Metabolite continuity does not imply physical substrate channeling.


  Direct whole-route physiological evidence concerns Rhodospirillum rubrum ATCC 11170. In the 2020 study,
  anaerobic feeding with [5′-³H]-5′-deoxyadenosine and chromatographic product analysis showed that mtnP
  deletion blocked entry, mtnA deletion arrested conversion at 5-deoxyribose 1-phosphate, and ald2 deletion
  arrested it at 5-deoxyribulose 1-phosphate. Mutants accumulated extracellular 5′-deoxyadenosine during
  both aerobic and anaerobic growth, and plasmid complementation restored abundance toward the wild-type
  level. The paper''s twofold comparison is 5′-deoxyadenosine versus MTA abundance across strains; it
  is not a twofold mutant-versus-wild-type effect. The species taxon records the native assembly assignment,
  while the strain taxon anchors experimental physiology. Neither the MetaCyc Bacteria range nor its Rhodopseudomonas
  palustris species listing is extended here into demonstrated whole-route physiology in all those organisms.


  RXN-14304 carries the native PHYSIOL-LEFT-TO-RIGHT direction. RXN-21315 and RXN-21316 are native REVERSIBLE
  reactions, although the pathway layout and all three activity frames use the degradative left-to-right
  orientation. These source contexts remain distinct. Rhea release 142 independently supports the three
  reaction families and all nine sides; the native entry cross-reference RHEA:24872 is the bidirectional
  member of the RHEA:24869 family, whereas UniProt''s physiological entry direction uses RHEA:24870. No
  exact directional equivalence is asserted between those contexts. Full native-to-ChEBI InChI comparisons
  establish all seven chemical identities, including the specific phosphate charge states and α-D sugar-phosphate
  structure. Formal atom and charge balance is not a measurement of intracellular protonation or a fresh
  experimental determination of stereochemistry.


  The reviewed current proteins are Q2RXH9/MtnP (Rru_A0361), Q2RXI0/MtnA (Rru_A0360) and Q2RXI1/Ald2 (Rru_A0359),
  all assigned to strain ATCC 11170. Native gene/product links and reciprocal UniProt cross-references
  establish these identities. The graph preserves MtnP''s native MONOMER-17874 chain and its exact mapping
  from Q2RXH9, rather than adding a second biological chain for the same protein. The 2012 paper reverses
  the A0360/A0361 enzyme names in one passage; the corroborated mapping from its earlier passage, native
  genes and current UniProt is used. That paper establishes the adjacent MTA/isoprenoid mechanism and
  provides the earlier biochemical context; it is not used as proof of the complete 5′-deoxyadenosine
  DHAP route.


  MtnP catalysis is assigned to native CPLX-8605. Its component slot contains two CPLX-8604 subassemblies,
  each of which contains three MONOMER-17874 chains, with reciprocal membership links. CPLX-8604 nevertheless
  has the issuer label S-methyl-5′-thioadenosine phosphorylase dimer. That label/composition conflict
  is preserved without renaming the source entity or treating the isolated chain as an independently demonstrated
  catalyst. UniProt describes a homohexamer assembled as a dimer of homotrimers, but the evidence is the
  HAMAP inference code ECO:0000255; it is not a direct measurement of physiological assembly stoichiometry
  in this record.


  The 2020 purified-enzyme reconstitution used R. rubrum proteins expressed from pET28 in E. coli Rosetta(DE3)
  pLysS and purified by nickel chromatography. It is an in vitro recombinant experiment even though one
  Results sentence calls reconstitution in vivo. This assay is separate from native-host isotope feeding
  and deletion experiments. Exact MtnP affinity-tag identity and orientation are not established by the
  accessible Methods. Native MtnA commentary attributes a His10 construct, and native Ald2 commentary
  attributes a His6 construct and anaerobic purification to older work; these remain database-attributed
  construct details, not confirmation from unavailable supporting files or a fresh complete reading of
  the 2017 paper. The MtnA activity frame distinguishes earlier purified heterologous and mutant evidence
  from partially purified heterologous evidence assigned to 2020. Its conflicting general protein commentary
  does not erase that finer evidence tier.


  Native activity slots and the 2020 Table 1 report substrate-specific Km/kcat pairs of 40 micromolar/6.7
  s−1 for MtnP with 5′-deoxyadenosine, 171 micromolar/0.18 s−1 for MtnA with 5-deoxyribose 1-phosphate,
  and 229 micromolar/1.94 s−1 for Ald2 with 5-deoxyribulose 1-phosphate. Table 1 marks the first two pairs
  as literature values, and UniProt attributes them to the 2012 paper, while the native kinetic slots
  cite 2020. All these attribution tiers are retained. The accessible 2012 main text delegates detailed
  enzymology to inaccessible SI. Values are assay-specific, not cellular flux constants. The retained
  BioC Ald2 catalytic-efficiency entry disagrees arithmetically with its Km and kcat; that disputed efficiency
  is neither propagated nor silently corrected.


  Ald2 requires a divalent metal in the reported activity assays. Co2+ and Ni2+ gave the highest activity
  among the tested R. rubrum reconstitution conditions. The two cofactor edges describe alternative recombinant
  apoenzyme preparations: EDTA treatment and dialysis preceded separate 0.1 mM metal incubations for one
  hour. They do not assert simultaneous metal occupancy or identify the native cellular metal. UniProt''s
  one-cobalt-per-subunit statement is by similarity and is not treated as measured stoichiometry. Mixed
  Mg2+/Co2+ conditions in a coupled MtnA assay also do not establish an independently required cofactor
  for every enzyme in that coupled system.


  The same R. rubrum enzymes act on methylthio substrates in methionine salvage, but those substrates
  and downstream sulfur reactions define adjacent routes. The final two reactions are shared with PWY-8131;
  its E. coli ATCC 25922 physiology and Bacillus component assays do not establish phosphorolytic entry
  in those organisms. The R. rubrum work supports degradation and carbon salvage chemistry, including
  further conversion of acetaldehyde to ethanol or acetate, without adding unassigned downstream enzyme
  nodes or claiming growth with 5′-deoxyadenosine as the sole carbon source. Potential detoxification
  and broad taxonomic distribution remain source-discussion context rather than unqualified demonstrated
  outcomes for every strain.


  Both complete primary main texts were read from their retained NCBI BioC originals, including available
  main-text table and figure captions. The 2012 SI attempts yielded failed or unusable responses, and
  its original figure bodies were not available. The 2020 supporting PDF/spreadsheet and original figure
  images remained inaccessible through the tested routes. No claim relies solely on those unavailable
  materials. Current ChEBI 144504 has inconsistent definition prose; its ribulose label and complete structure
  establish identity. Native MtnA commentary also misstates the older MTA mutant''s arrest metabolite;
  the primary 2012 experiment and the separate 2020 5′-deoxyadenosine experiment are kept distinct. Broader
  source leads remain open; this draft does not establish source exhaustion or public-release licensing
  clearance.'
