id: MetaCyc:PWY-2361
label: 3-oxoadipate degradation
description: Complete two-reaction 3-oxoadipate degradation module in MetaCyc PWY-2361, with Pseudomonas
  putida catalyst context. CoA transfer from succinyl-CoA forms 3-oxoadipyl-CoA and succinate; thiolysis
  with CoA forms acetyl-CoA and regenerates succinyl-CoA. The native reactions are reversible, while
  this pathway selects CoA transfer followed by thiolysis. The upstream catechol and protocatechuate
  branches are distinct modules. Native catalyst assemblies retain source-scoped annotations and do
  not establish universal strain composition. Regulation edges describe expression of the pcaIJ and
  pcaF products in the PRS2000 experimental lineage, not direct activation of purified enzymes. Adipate
  is an experimental nonmetabolizable inducer analog. Q52154 matches the deposited pcaR translation,
  while alternative initiating methionines remain uncertain.
