- id: pcar-regulates-transferase-expression
  subject: UniProtKB:Q52154
  predicate: regulates
  object: MetaCyc:CPLX-2722
  description: PcaR is required for inducer-dependent pcaIJ expression in the PRS2000 lineage. The
    quoted pcaI-lacZ reporter measures the promoter of the independently established pcaIJ operon.
    This is transcriptional regulation, not binding to or direct activation of the transferase.
  evidence:
  - reference_id: PMID:8376330
    quote: PcaR is required for pcaI induction
    source_locator: p. 5836, text immediately below Table 3; pcaI reporter assay and pcaIJ operon
      context
  - reference_id: UniProtKB:Q52154
    source_assertion: The reviewed FUNCTION annotation describes positive regulation of pcaBDC, pcaIJ
      and pcaF; its sequence reference identifies strain PRS2000.
    source_locator: $.comments[commentType="FUNCTION"]; $.references[0].referenceComments[type="STRAIN"]
- id: oxoadipate-regulates-transferase-expression
  subject: CHEBI:15775
  predicate: regulates
  object: MetaCyc:CPLX-2722
  description: 3-Oxoadipate induces synthesis of the transferase under the source-described conditions,
    with PcaR-dependent pcaIJ expression. The edge represents expression induction; neither direct
    inducer binding to PcaR nor catalytic activation of the transferase is asserted.
  evidence:
  - reference_id: MetaCyc:ENZRXN-3369
    source_assertion: The native comment states that synthesis of the P. putida transferase is induced
      by beta-ketoadipate and cites Parales 1993 and Harwood 1996.
    source_locator: /ptools-xml/Enzymatic-Reaction/comment
- id: adipate-regulates-transferase-expression
  subject: CHEBI:17128
  predicate: regulates
  object: MetaCyc:CPLX-2722
  description: Adipate is a nonmetabolizable experimental inducer analog. In the PRS2000-derived PRS4050
    chromosomal pcaI-lacZ reporter, 20 mM adipate with 10 mM glucose increased beta-galactosidase
    activity. This is promoter induction rather than a transferase reaction substrate or direct catalytic
    activation.
  evidence:
  - reference_id: PMID:8376330
    quote: Growth with adipate, β-ketoadipate, or aromatic compounds caused a 10- to 20-fold induction
    source_locator: p. 5836, chromosomal pcaI-lacZ fusion results and Fig. 6; reporter strain PRS4050
- id: pcar-regulates-thiolase-expression
  subject: UniProtKB:Q52154
  predicate: regulates
  object: MetaCyc:CPLX-2746
  description: PcaR is required for pcaF expression. This is supported by the later 1995 author abstract
    and reviewed regulatory annotation; the full 1995 paper was inaccessible here. It supersedes the
    1994 paper's explicit uncertainty and does not assert direct PcaR binding to the thiolase.
  evidence:
  - reference_id: PMID:8522507
    quote: is required for expression of both pcaF and pcaK
    source_locator: Author abstract, sentence beginning PcaR; abstract-only primary inspection
  - reference_id: UniProtKB:Q52154
    source_assertion: The reviewed FUNCTION annotation includes positive regulation of pcaF within
      the pca regulon.
    source_locator: $.comments[commentType="FUNCTION"].texts
- id: oxoadipate-regulates-thiolase-expression
  subject: CHEBI:15775
  predicate: regulates
  object: MetaCyc:CPLX-2746
  description: 3-Oxoadipate induces pcaF expression as reported in the 1995 author abstract. Full-paper
    methods and data were inaccessible here. This is expression induction of the terminal thiolase
    in the source context, not direct ligand binding or activation of purified PcaF.
  evidence:
  - reference_id: PMID:8522507
    quote: the pathway intermediate beta-ketoadipate induces both genes
    source_locator: Author abstract, pcaF/pcaK expression sentence; abstract-only primary inspection
- id: adipate-regulates-thiolase-expression
  subject: CHEBI:17128
  predicate: regulates
  object: MetaCyc:CPLX-2746
  description: PRS2000 cell extracts showed thiolase activity of 16.1 on 10 mM glucose versus 111.0
    nmol/min/mg on glucose plus 20 mM adipate. The pcaF mutant retained only low activity. This supports
    inducer-dependent expression in the experimental lineage, not direct activation of the purified
    enzyme.
  evidence:
  - reference_id: PMID:7961399
    quote: Thiolase activity for PRS2000 was 16.1 and 111.0 nmol of β-ketoadipyl-CoA disappeared per
      min per mg of protein
    source_locator: p. 6485, first paragraph; conditions in p. 6483, pcaF mutant characterization,
      continued across Fig. 4
