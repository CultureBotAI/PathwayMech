id: Reactome:R-MTU-868688
label: Mycobacterium tuberculosis trehalose biosynthesis
description: Mycobacterium tuberculosis produces trehalose through OtsA/OtsB and TreY/TreZ
  routes. TreS is reversible in vitro, but experimental physiological flux consumes trehalose
  to produce alpha-maltose. Cytosolic catalytic assemblies include OtsA tetramer and magnesium-bound
  OtsB.
