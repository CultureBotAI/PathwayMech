id: MetaCyc:THISYN-PWY
label: superpathway of thiamine diphosphate biosynthesis I
description: 'The complete native MetaCyc de novo route is represented for the Escherichia coli K-12 protein
  core: AIR-to-HMP-PP synthesis, cysteine-derived sulfur transfer and DXP/tyrosine-dependent thiazole
  synthesis, then ThiE coupling and ThiL phosphorylation to thiamine diphosphate. Its three children contain
  eleven native reactions; current Rhea net sulfur transfer replaces two native ThiI relay steps, yielding
  ten nonduplicated reactions. All five sulfur-carrier states are whole proteins. The net reductant AH2/A
  remains generic, and the graph does not assert a specific ferredoxin or an elementary ThiI/ThiF disulfide
  sequence. ThiI stimulation in reconstitution is preserved without universal indispensability. ThiGH
  is a heterodimeric unit isolated also as larger multimers; its native six-plus-six assembly is qualified
  by experiment. ThiC cluster/oligomer and ThiE magnesium assignments retain their inference grades; ThiD
  oligomer annotations differ between sources. Exact thiazole tautomer chemistry follows current curated
  annotation, with Bacillus product-structure studies kept distinct from E. coli assays. Dxs requires
  the pathway product as a cofactor. PurF/D/N-or-T/L/M steps in the initial PathBank lead are upstream
  of this native AIR boundary; they are not omitted branches of THISYN-PWY. Thiamine salvage, TenI/ThiO
  variants, tRNA thiolation, Fe-S assembly, downstream cofactor utilization and engineered bypasses are
  outside this record. This reaction-level graph does not claim every transient intermediate is resolved,
  uniform wild-type flux, or complete elementary enzymology.'
pathway_type: cofactor-biosynthesis
