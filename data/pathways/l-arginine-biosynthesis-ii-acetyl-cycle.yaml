id: gomodel:YeastPathways_ARGSYNBSUB-PWY
label: L-arginine biosynthesis II (acetyl cycle)
description: L-arginine biosynthesis II in Saccharomyces cerevisiae S288C uses ARG2, ARG56,
  ARG8, and ARG7 acetyl-cycle reactions to convert L-glutamate to L-ornithine, then uses CPX-579,
  ARG3, ARG1, and ARG4 to convert L-ornithine through L-citrulline and argininosuccinate to
  L-arginine.
