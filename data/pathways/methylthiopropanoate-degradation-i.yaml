id: MetaCyc:PWY-6048
label: methylthiopropanoate degradation I (cleavage)
description: 'The complete three-reaction MetaCyc route converts 3-(methylthio)propionate (MMPA) to methanethiol,
  acetaldehyde and carbon dioxide in Ruegeria pomeroyi DSS-3. DmdB2 activates MMPA with ATP and CoA; DmdC1
  oxidizes the thioester to trans-methylthioacryloyl-CoA; DmdD-dependent hydration and hydrolysis complete
  cleavage. The terminal net reaction includes spontaneous methanethiol elimination and expected spontaneous
  decarboxylation. Generic electron-transfer flavoprotein redox states retain the MetaCyc/Rhea database
  convention: the physiological partner remains unidentified, and direct DmdC1 assays used artificial
  acceptors. DmdB2 and DmdC1 are experimentally supported homodimers and DmdD a homohexamer; protein enables
  edges represent their functional roles without asserting monomer sufficiency. DmdB magnesium dependence
  and DmdC inferred FAD cofactor are distinguished from the whole carrier. DMSP-dependent DmdB2 inhibition
  and its conditional relief by MMPA are supported in vitro. The route starts after DMSP demethylation
  and stops before acetaldehyde oxidation or methanethiol assimilation; it does not assert these adjacent
  pathways or flux in every environmental condition.'
