id: PathBank:SMP0002086
label: Guanine and Guanosine Salvage
description: 'PathBank SMP0002086 (native BioPAX archive member PW002074.owl, PathWhiz PW002074) models
  Escherichia coli guanine and guanosine salvage to GMP across two converging branches comprising three
  reactions: (1) direct ATP-dependent phosphorylation of guanosine to GMP(2-), ADP(3-), and H(+) (Reactions/6057,
  normalized to RHEA:27711 in the left_to_right direction) catalyzed by guanosine-inosine kinase Gsk (Protein/6254,
  UniProtKB:P0AEW6); and (2) phosphorolysis of guanosine with hydrogenphosphate to guanine and alpha-D-ribose
  1-phosphate(2-) (Reactions/6058, normalized to RHEA:13234 in the left_to_right direction) catalyzed by
  hexameric DeoD purine nucleoside phosphorylase (PathBank:SMP0002086/ProteinComplex/4056, six copies of
  Protein/6182 cross-referenced to UniProtKB:P0ABP8), followed by phosphoribosyl transfer from 5-phospho-alpha-D-ribose
  1-diphosphate (PRPP) to guanine yielding GMP(2-) and diphosphate(3-) (Reactions/6059, normalized to RHEA:25426
  in the right_to_left direction relative to Rhea master RHEA:25424) catalyzed by tetrameric xanthine-guanine
  phosphoribosyltransferase Gpt (PathBank:SMP0002086/ProteinComplex/4059, four copies of Protein/6129 cross-referenced
  to UniProtKB:P0A9M5).


  Native PW002074.owl models Gsk directly as monomeric Protein/6254 (displayName Inosine-guanosine kinase)
  controlling Reactions/6057 via ReactionCatalysis/6021 without a BioPAX Complex wrapper; primary biochemical
  and structural studies in Escherichia coli K-12 (PMID:32857952) show that Gsk functions as an active
  homodimer in the absence of alarmone inhibitors and undergoes ppGpp- or GDP-promoted tetramerization,
  and feedback inhibition of Gsk by ppGpp (CHEBI:77828) and GDP (CHEBI:58189) is recorded on UniProtKB:P0AEW6
  from PMID:10879466 and PMID:32857952. Native PW002074.owl encodes species-level Escherichia coli (NCBITaxon:562)
  without cellularLocation annotations on participants, while the reviewed UniProtKB proteins and primary
  biochemical and structural evidence refer to Escherichia coli K-12 (NCBITaxon:83333). Neutral/parent ChEBI
  cross-references in PW002074.owl (CHEBI:15422 -> CHEBI:30616, CHEBI:16761 -> CHEBI:456216, CHEBI:17345
  -> CHEBI:58115, CHEBI:18367 -> CHEBI:43474, CHEBI:16300 -> CHEBI:57720, CHEBI:17111 -> CHEBI:58017,
  CHEBI:18361 -> CHEBI:33019) are normalized to Rhea pH 7.3 major microspecies.'
