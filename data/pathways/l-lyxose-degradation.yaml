id: MetaCyc:LYXMET-PWY
label: L-lyxose degradation
description: 'The source-defined four-event L-lyxose 5-phosphate route joins RhaA isomerization, LyxK phosphorylation
  and successive 3- and 4-epimerization to D-xylulose 5-phosphate. Whole-route genetic support concerns adapted
  K-12 derivatives such as JA134 with plaR/yiaJ derepression; it does not establish complete flux in ordinary
  wild-type MG1655. SgbU remains a tentative 3-epimerase assignment after two negative enzyme assays. Native
  beta-L-lyxopyranose initiating chemistry is distinct from generic RhaT lyxopyranose transport; no anomerization
  is invented. The separate 1991 mutant-rhaB L-xylulose 1-phosphate route is excluded. AraD and SgbE are alternatives;
  frozen PathBank UlaF conflicts with native enzymes-not-used. Regulatory, metal, construct and source-access
  limits are preserved beside their edges. PMID:10913096 additionally reports that pectinase-digested citrus
  or apple pectin increased the yiaJ/plaR-lacZ reporter 10-20-fold in ECL1, but not JA134. Structural-gene expression
  was unaffected even without the repressor, and the biological significance remained unresolved. Preparation:
  0.14% pectin in sodium acetate, pH 4.0; overnight at 25 C with 400 U Aspergillus niger pectinase; tenfold
  dilution into medium. This undefined hydrolysate is retained as experimental context, without assigning an
  individual chemical or a PlaR-binding interaction.'
pathway_type: carbohydrate-degradation
