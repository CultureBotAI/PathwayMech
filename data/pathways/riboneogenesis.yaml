id: PathBank:SMP0002406
label: Riboneogenesis
description: The six-reaction Saccharomyces cerevisiae route makes ribose 5-phosphate from fructose 6-phosphate
  and triose phosphates without producing NADPH. Transketolase and Fba1 supply sedoheptulose 1,7-bisphosphate;
  Shb17 hydrolysis provides the thermodynamic drive; transketolase, Rpe1 and Rki1 complete pentose formation.
  Evidence includes BY4743-derived mutants and FY4/FY5 controls, not a claim of identical flux in every
  yeast strain. Protein enables edges identify functional gene products while retaining homodimer evidence;
  no isolated-monomer sufficiency or Tkl1–Tkl2 heteromer is asserted. Tkl2 reaction/cofactor annotations
  are inferred by similarity. The graph selects riboneogenic flux through otherwise reversible reactions
  using exact directed Rhea equations and charge forms. These formal chemical representations do not equate
  the native cyclic ribose phosphate or the crystallographic beta-furanose SBP ligand with open-chain
  ChEBI structures. NADPH production, transaldolase bypass, octulose metabolism and Calvin-cycle carbon
  fixation are outside this route.
pathway_type: ribose-phosphate-biosynthesis
