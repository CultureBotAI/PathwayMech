id: MetaCyc:HISTSYN-PWY
label: L-histidine biosynthesis
description: 5-phospho-alpha-D-ribose 1-diphosphate and ATP are converted to L-histidine through phosphoribosyl-ATP,
  phosphoribosyl-AMP, phosphoribulosylformimino-AICAR-phosphate, imidazole-glycerol phosphate, imidazole
  acetol-phosphate, L-histidinol phosphate, L-histidinol, and L-histidinal.
