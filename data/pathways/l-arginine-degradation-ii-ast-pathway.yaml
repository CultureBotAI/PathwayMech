id: MetaCyc:AST-PWY
label: L-arginine degradation II (AST pathway)
description: The arginine succinyltransferase pathway converts L-arginine through N(2)-succinyl-L-arginine,
  N(2)-succinyl-L-ornithine, N-succinyl-L-glutamate 5-semialdehyde, and N-succinyl-L-glutamate to L-glutamate
  and succinate.
