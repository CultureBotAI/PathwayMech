id: PathBank:SMP0000993
label: 'Secondary Metabolites: Cysteine Biosynthesis from Serine'
description: 'PathBank SMP0000993 (native BioPAX archive member PW000977.owl) models Escherichia coli L-cysteine biosynthesis
  from L-serine together with the upstream three-step phosphorylated L-serine biosynthesis route from (2R)-3-phosphoglycerate
  and an alternate NADPH-dependent 2-aminomalonate semialdehyde reduction route to L-serine. In the main phosphorylated
  L-serine branch, NAD(+)-dependent D-3-phosphoglycerate dehydrogenase SerA (UniProtKB:P0A9T0) oxidizes (2R)-3-phosphoglycerate
  (supplied in native SubPathway/7789 as the SubPathwayOutput of Glycolate and Glyoxylate Degradation, PathBank:SMP0000847)
  to 3-phosphooxypyruvate and NADH (RHEA:12642, EC:1.1.1.95; native Reactions/2843). Pyridoxal 5''-phosphate-dependent
  phosphoserine aminotransferase SerC (UniProtKB:P23721) transaminates 3-phosphooxypyruvate with L-glutamate to O-phospho-L-serine
  and 2-oxoglutarate (RHEA:14331, EC:2.6.1.52; native Reactions/2844), and Mg(2+)-dependent phosphoserine phosphatase SerB
  (UniProtKB:P0AGB0) hydrolyzes O-phospho-L-serine to L-serine and phosphate (RHEA:21209, EC:3.1.3.3; native Reactions/2841).
  In the parallel native Reactions/5862 (PathBank:SMP0000993/Reactions/5862, labeled 1.1.1.-), NADP-dependent 3-hydroxy
  acid dehydrogenase / serine 3-dehydrogenase YdfG (UniProtKB:P39831) reduces 2-aminomalonate semialdehyde (PathBank:SMP0000993/Compound/PW_C043169)
  with NADPH and H(+) to L-serine and NADP(+). In the two-step L-cysteine branch, serine O-acetyltransferase CysE (UniProtKB:P0A9D4;
  PMID:12627979) transfers an acetyl group from acetyl-CoA to L-serine to form O-acetyl-L-serine and CoA (RHEA:24561,
  EC:2.3.1.30; native Reactions/2845), and pyridoxal 5''-phosphate-dependent cysteine synthase isozymes CysK (cysteine
  synthase A, UniProtKB:P0ABK5; native ReactionCatalysis/2809) and CysM (cysteine synthase B / OASS-B, UniProtKB:P16703;
  native ReactionCatalysis/5477; PMID:16546401) convert O-acetyl-L-serine and hydrosulfide to L-cysteine and acetate (RHEA:14830,
  EC:2.5.1.47; native Reactions/2842). Both pathways are subject to end-product feedback inhibition: L-serine (and glycine)
  inhibits SerA (UniProtKB:P0A9T0), and L-cysteine inhibits CysE (UniProtKB:P0A9D4).


  Several native PW000977.owl BioPAX representation details are preserved in provenance while normalized to verified biochemical
  authorities in the causal graph: (1) native Reactions/2844 (RHEA:14331, SerC) omits an eCNumber element in PW000977.owl
  while Rhea (RHEA:14329) and UniProtKB:P23721 assign EC:2.6.1.52; (2) native Reactions/5862 (PathBank:SMP0000993/Reactions/5862,
  displayName 1.1.1.-) uses source-local Compound/PW_C043169 (2-Aminomalonate semialdehyde, PathBank:SMP0000993/Compound/PW_C043169)
  without external chemical cross-references and links via ReactionCatalysis/5822 to homotetrameric ProteinComplex/3956
  (UniProtKB:P39831, NADP-dependent 3-hydroxy acid dehydrogenase YdfG / Serine 3-dehydrogenase); (3) native Reactions/2842
  lists neutral Hydrogen sulfide (ChEBI_CHEBI_16136) on bp:left and balances the proton with Hydrogen Ion (ChEBI_CHEBI_15378)
  on bp:right, whereas Rhea 139 (RHEA:14830) balances hydrosulfide (CHEBI:29919) directly with O-acetyl-L-serine (CHEBI:58340)
  to L-cysteine (CHEBI:35235) and acetate (CHEBI:30089); and (4) native SubPathway/7789 (Glycolate and Glyoxylate Degradation,
  PathBank:SMP0000847) contains a generic BioPAX Interaction (SubPathwayInteractions/109900, named SubPathwayOutput) whose
  sole participant is Compound/PW_C000419 (D-Glyceric acid 3-phosphate, CHEBI:58272) and links via PathwayStep/21393 bp:nextStep
  to PathwayStep/21388 (Reactions/2843, RHEA:12642).


  Native PW000977.owl encodes species-level Escherichia coli (NCBITaxon:562) and places all seven proteins in the cytosol
  (GO:0005829), while the seven reviewed UniProtKB entries and their catalytic, cofactor, allosteric-regulation, and cytoplasmic
  localization annotations (GO:0005737 for SerC and CysE) are curated for Escherichia coli K-12 (NCBITaxon:83333).'
