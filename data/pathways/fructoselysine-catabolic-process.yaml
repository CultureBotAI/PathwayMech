id: GO:1901281
label: fructoselysine catabolic process
description: The two-step fructoselysine catabolic route represented by the reviewed Escherichia coli
  K-12 proteins FrlD and FrlB converts fructoselysine to D-glucose 6-phosphate and L-lysine. FrlD uses
  ATP to form fructoselysine 6-phosphate; FrlB cleaves this intermediate with water. The graph selects
  the catabolic direction of the experimentally reversible FrlB reaction. Its scope is the core chemical
  conversion, with transport, psicoselysine epimerization, transcriptional regulation and alternative
  bacterial routes documented separately in the curation notes.
