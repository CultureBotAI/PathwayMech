id: MetaCyc:PWY-7181
label: pyrimidine deoxyribonucleosides degradation
description: The complete three-reaction MetaCyc route annotated for Escherichia coli K-12 MG1655 deaminates
  2'-deoxycytidine to 2'-deoxyuridine through the zinc-containing Cdd homodimer, then cleaves 2'-deoxyuridine
  to uracil and 2-deoxy-alpha-D-ribose 1-phosphate through the DeoA homodimer. A parallel DeoA branch
  cleaves thymidine to thymine and the same sugar phosphate. The graph selects degradation-directed chemistry
  for both reversible phosphorolyses. This native boundary ends at the free bases and sugar phosphate;
  nucleoside uptake, subsequent sugar or ring degradation, and nucleotide salvage are separate processes.
  Primary enzyme assays and K-12 mutant studies support the functions, while the MG1655 scope follows
  native database annotation; mutant thymidylate-salvage phenotypes do not quantify wild-type pathway
  flux.
