id: MetaCyc:NONMEVIPP-PWY
label: methylerythritol phosphate pathway I
description: The methylerythritol phosphate (MEP/DOXP) route converts pyruvate and D-glyceraldehyde 3-phosphate
  to isopentenyl diphosphate (IPP) and dimethylallyl diphosphate (DMAPP). This record represents the Escherichia
  coli K-12 enzyme set; the native MetaCyc pathway also lists K-12 MG1655 and Brucella abortus. IspH directly
  supplies both products; Idi is an additional interconversion, not an obligatory route to DMAPP. Variant
  I uses flavodoxin for IspG. Current Rhea IspH equations use generic ferredoxin, whereas primary E. coli
  assays support flavodoxin-dependent activation; unresolved carrier-state edges are omitted. This partial
  chemical graph is not a stoichiometric flux model, and source reaction directions do not imply irreversibility.
pathway_type: isoprenoid-precursor-biosynthesis
