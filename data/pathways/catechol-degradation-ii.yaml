  Evidence scope: Scientific main HTML inspected except Table3 homolog catalog; no activity assay, no
  figure visual claims. The authors use AmnE for AP3 2-aminomuconate deaminase. They lacked AP3 cells,
  used a synthetic gene and reported no enzyme-activity assay because unstable substrate production failed.
  Recombinant AmnE was produced in BL21(DE3)pLysS from pET28a; purification included nickel affinity,
  thrombin tag removal, ion exchange and size exclusion. The 142-residue deaminase structure 6IZH has
  nine asymmetric-unit protomers; the biological interpretation is a hexamer, supported by an approximately
  103.5 kDa solution estimate. R56A and deletion49–59 favored trimers; P126A remained hexameric. These
  are deaminase assembly experiments, not evidence for decarboxylase/hydratase stoichiometry. [DOI:10.3389/fmicb.2019.02079]


  Evidence scope: complete abstract only; full primary paper not obtained. Coexpressed 4-OD/VPH and E106Q-VPH
