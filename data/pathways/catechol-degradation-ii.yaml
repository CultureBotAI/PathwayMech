id: MetaCyc:PWY-5420
label: catechol degradation II (meta-cleavage pathway)
description: 'The complete seven-step oxidative catechol meta-cleavage route consists of the four reactions
  of PWY-5419 followed by the three reactions of PWY-5162. Ring cleavage, NAD-dependent semialdehyde oxidation,
  tautomerization and enol-producing decarboxylation feed the shared hydration/aldolase/acylating-dehydrogenase
  tail. Pyruvate branches at aldol cleavage; acetaldehyde continues to acetyl-CoA. The complete formal
  net transformation consumes catechol, oxygen, two waters, CoA(4−) and two NAD(1−), producing carbon
  dioxide, pyruvate, acetyl-CoA(4−), two NADH(2−) and three hydrons.


  Native formal reaction orientation is kept independently from route traversal and from the six selected
  directional Rhea equations. Native RXN-8529 is reversible and matches the 28080-to-64908 tautomerization,
  not its wrong-stereoisomer Rhea32214 cross-reference. Native4.1.1.77-RXN yields the 2Z dienol; linked
  ketoRhea24261 is not an exact substitute. The hydratase is traversed native right-to-left. Native parent2E
  prose and historical substrate preparations do not independently establish modern2Z/S stereochemistry.


  The four listed taxa are exact native parent species annotations, not four independently demonstrated
  complete routes. Historical Pseudomonas putida mt-2 remains the source-specific ORG-5948 context without
  a guessed taxonomy alias. Component donors, broader taxonomic ranges and heterologous expression hosts
  do not become whole-route taxa. All native activity assignments preserve their evidence classes and
  preparation limits. Gene nodes retain exact identity context and reciprocal product pointers in the
  accompanying ledger; no unsupported encodes predicate is invented.


  NbaG remains a predicted component; CnbE/F unchlorinated formal promotion is excluded because the described
  coupled assay is chlorinated. CnbG unchlorinated extract activity is distinct. AP3 decarboxylase gene
  spelling conflicts across native/UniProt, exact ENA accession/CDS and papers; accession-grounded identity
  does not resolve the historical AmnF partner or absolute assembly count. Modern engineered8IH6 tagged5+5
  is a separate preparation. The native Cu/Hg regulator conflict is explicit. Native XylH six-subunit
  annotation, historical mass interpretation and modified crystal preparations remain separate. DmpFG
  is2+2; its native negative NADH sign is excluded in favor of primary-author adjudication. E.coli ADHE-CPLX
  is explicitly excluded by PWY5162, without excluding unrelated AdhE proteins.


