  Evidence scope: Complete scientific main HTML, four kinetic/stereochemical tables and 20 original graphics
  inspected; supporting-information contents unavailable.. YwhB from B. subtilis catalyzes several tested
  enol/dienol ketonizations in vitro. The paper explicitly leaves its biological function unresolved and
  identifies no genomic context establishing a pathway. P1A and R11A YwhB mutants were overproduced in
  E. coli BL21(DE3)pLysS and purified to more than 95% homogeneity by the reported SDS-PAGE assessment.
  Their DNA sequences and expected protein masses were checked. The main report interprets mutant mass
  spectra as showing the expected products without a retained initiating methionine blocking the first
  catalytic residue. Mutant labels use processed enzyme positions P1A and R11A. Steady-state assays used
  20 mM sodium phosphate, pH 7.3, at 23°C, with spectrophotometric monitoring and nonlinear regression.
  Table errors are standard deviations. For compound 2→1, YwhB performs 1,3 ketonization of 2-hydroxymuconate
  to the β,γ-unsaturated keto tautomer, with kcat 10±1 s−1 and Km 76±17 µM under the assay conditions.
  YwhB also catalyzes compound 2→3, the 1,5 ketonization, with kcat 26.0±1.4 s−1 and Km 940±70 µM; its
  catalytic efficiency is 2.8±0.2 × 10^4 M−1 s−1. YwhB converts HPD (compound 5) to 2-oxo-4-pentenoate
  (4) by 1,3 ketonization: kcat 112±14 s−1, Km 243±42 µM and kcat/Km 4.6±0.8 × 10^5 M−1 s−1. YwhB catalyzes
  1,3 ketonization of phenylenolpyruvate (7), p-hydroxyphenylenolpyruvate (8) and the seven-carbon dicarboxylate
  dienol (11); efficiencies differ substantially across these analogues. Only the six-carbon diacid 2
  yielded a measurable YwhB 1,5 ketonization rate among the tested dienols. Corresponding α,β-keto formation
  from 5 and 11 was too close to nonenzymatic rates to measure reliably. P1A and R11A eliminate detectable
  2→1 and 2→3 activities under the reported assays. Both retain reduced ketonization of HPD and phenylenolpyruvate;
  Arg-11 replacement has the larger effect. Table 2 reports HPD Km values of 243±42 µM for wild-type YwhB
  and 378±100 µM for P1A, an approximately 1.56-fold increase. S15 instead calls it a 1.6-fold decrease.
  Products generated in D2O were trapped by borohydride reduction and converted through ozonolysis and
  malic-enzyme treatment to labeled malate. Partial proton NMR spectra were used to assign isotope-dependent
  stereochemistry. Ketonization of HPD (5) by YwhB in D2O favors (3R)-[3-2H]-2-oxo-4-pentenoate (4) by
  approximately 4.4:1, inferred from the derivatized malate NMR signals. Phenylenolpyruvate (7) ketonization
  in D2O favors (3R)-[3-2H]-phenylpyruvate (9) by approximately 3:1 in the reported derivatization/NMR
  analysis. YwhB ketonization of diacid 2 to compound 1 in D2O favors (3S)-[3-2H]-2-oxo-4-hexenedioate
  by approximately 8:1, opposite to the favored C-3 configuration for the tested monoacids. Incubating
  diacid 2 with 4-OT in D2O yielded approximately equal C-3 isotope stereoisomers of keto compound 1.
  The analysis was repeated with the same result. The YwhB diacid reaction proceeded for 1 min before
  NaBH4 addition and then 1 h before workup. In the 4-OT comparator, enzyme and NaBH4 were added together
  and the mixtures stood overnight. After trapping the YwhB diacid reaction, the isolated material contained
  about 26 mg of reduced compound 1 and 11 mg of reduced compound 3. The 4-OT experiment recovered these
  reduced products in an approximate 1:2 ratio. Opposite labeled C-3 preferences for monoacids and diacid
  2 motivate different substrate orientations involving Arg-11. Pro-1 general-base chemistry and altered
  charge stabilization are proposed explanations for the mutant effects. The introduction describes YwhB
  as a hexamer of 61-residue subunits and cites prior structural literature. This study does not newly
  determine its native oligomerization. The cited 4-OT 2→3 kinetic comparator is kcat 3500 s−1 and Km
  180 µM. S14 attributes these values to reference 13, rather than measuring them anew in the YwhB kinetic
  table. The authors propose that the pathway role of 4-OT may be primarily 2→3 1,5 ketonization, with
  keto compound 1 interconverting chemically with enol 2. They present this as a revised possibility requiring
  kinetic discrimination. YwhB had no known biological role or obvious gene context; in-vitro 1,3-tautomerization
  had higher catalytic efficiency than 1,5 activity, and P1A/R11A impaired these reactions. The newly
  inspected main text refines the comparison: the favored 1,3 route has higher catalytic efficiency, not
  higher kcat, and isotope trapping protocols differ. D2O experiments gave predominantly3R products from
  two monoacids and3S from a diacid; 4-OT gave racemic3-deuterated diacid product. The newly inspected
  main text refines the comparison: the favored 1,3 route has higher catalytic efficiency, not higher
  kcat, and isotope trapping protocols differ. [PMID:17902707]


  Evidence scope: complete publisher PDF transformed text; all pages, methods, results, discussion, references,
  legible tables and figure captions read. PKO1 chromosomal donor DNA was assayed mainly in P. aeruginosa
  PAO1.93 catA clones. Those hosts are not native pathway taxa. Deletion mapping supports tbuE/F/G/K/I/H/J
  order and corresponding ring-cleavage, hydrolytic, oxidative, aldolase, decarboxylase, tautomerase and
  hydratase activities. The terminal acylating dehydrogenase was not mapped. tbuS in trans restored repression
  without inducer and induction with phenol. TbuR concerned the upstream phenol hydroxylase. Direct effector
  binding and promoter occupancy were model interpretations. Phenol and m-cresol induced extract activities;
  tested catechols and other cresols did not. Noninduction is not enzyme inhibition or inability to metabolize
  after induction. Catechol and both methylcatechols were ring-cleavage substrates. Heterologous methylcatechol
  growth used phenol inducer and was reported without displayed data. Promoter-region deletion abolished
  downstream activities despite trans regulator complementation. Ring-cleavage-only clones accumulated
  yellow semialdehyde. The principal genetics and extract assays use PKO1 donor DNA in a heterologous
  catA host. Hydrolase assays detected formate from catechol ring-cleavage substrate; hydratase and aldolase
  used synthesized substrates and coupled readouts. Deletion mapping supports one tbu structural operon
  and its reported gene order. Phenol induction, partial derepression and trans complementation were measured
  in defined clone combinations. TbuS restored phenol-responsive control in trans; TbuR concerns phenol
  hydroxylase. Repression without inducer and activation with inducer form the authors model. Phenol and
  m-cresol induced the measured pathway activities; the other tested aromatics did not under these culture
  conditions. Clone-expressed catechol2,3-dioxygenase processed catechol and both methylcatechols; induced
  cells also grew on methylcatechols. Promoter deletion abolished downstream activity even with trans
  regulatory complementation; ring-cleavage-only clones accumulated yellow semialdehyde. [PMID:1856161]


  Evidence scope: Complete scientific main HTML and eight original figures inspected; primer, SDS-PAGE
  and GC-MS supplements unavailable.. The native source is Paenibacillus sp. JJ-1b, ATCC 35889. PraB/C/D
  were expressed in E. coli BL21(DE3); this host is an experimental preparation, not another native pathway
  taxon. PraB was expressed from pETB23: pET21a(+) carrying a 1.9-kb NdeI–HindIII praB fragment. BL21(DE3)
  cells were induced with 1 mM IPTG at 30°C for 4 h. PraC was expressed from pETC23: pET21a(+) carrying
  a 0.4-kb NdeI–EcoRI praC fragment. BL21(DE3) cells were induced with 1 mM IPTG at 30°C for 4 h. PraD
  was expressed from pC4D23: pColdIV carrying a 0.8-kb NdeI–XhoI praD fragment. BL21(DE3) cultures were
  cooled to 15°C and induced with 0.1 mM IPTG for 24 h. Sonicated cells were centrifuged at 15,000 × g
  for 15 min; supernatants were used as crude enzyme preparations. Reported PraB rates are per milligram
  of extract protein, not purified-enzyme turnover numbers. Crude PraB consumes HMS with NAD+ and yields
  an HMA-assigned product, supported by a 375-to-295-nm spectral change and a reported GC-MS derivative
  consistent with HMA. Crude PraB activity was 1.19 ± 0.07 U/mg with NAD+ and 0.113 ± 0.009 U/mg with
  NADP+. NAD+ is preferred by about 11-fold under these conditions; NADP+ also supports measurable activity.
  Adding crude PraC during the PraB reaction shifts the product spectrum toward 236 nm, supporting HMA-to-OCA
  tautomerization. Figure 3C displays the rise near 236 nm with loss of the HMS signal. After crude PraD
  was added to the PraC mixture, an HPD-assigned HPLC peak appeared at 6.03 min after 10 min. Its spectrum
  peaked at 272 nm; initial OCA/HMA peaks were at 0.89/2.50 min. The PraD assay included 500 µM MgSO4,
  pH 7.3 Tris buffer and incubation at 35°C. Added magnesium is an explicit experimental condition. PraD
  activity was measured using its separately expressed crude extract added to a PraA/PraB/PraC-derived
  mixture; a PraE expression product was not a specified component of this assay. The source distinguishes
  HMA, keto OCA and enol HPD. Figure 1 draws their proposed structures, while Figure 4 resolves a starting
  OCA/HMA mixture and the later HPD-assigned product. PraE is assigned HPD hydratase by sequence similarity
  (52% identity to BphH; 45% to NbaH), with whole-cluster growth and cotranscription supporting its placement
  downstream of PraD. PraF is assigned HOV aldolase by sequence similarity (58% identity to NahM; 51%
  to XylK), with whole-cluster growth and cotranscription supporting the downstream role. PraG is assigned
  the acetaldehyde-to-acetyl-CoA step by sequence similarity (61% identity to NahO; 53% to NbaJ), with
  whole-cluster growth and cotranscription providing pathway-context support. E. coli BL21(DE3) carrying
  pBRI23 with praR-praABEGFDCHI acquired growth on M9 medium containing 10 mM 4HB as sole carbon source
  within 10 days. This supports a functional transferred 4HB catabolic gene set. RT-PCR supports one praABEGFDCHI
  transcriptional unit and separate praR transcription. Catabolic transcripts were evident after JJ-1b
  growth on 4HB or PCA and not evident under the reported succinate condition. In E. coli DH5α, a praR-containing
  praA promoter–lacZ reporter increased activity with 4HB or PCA, while the reporter lacking praR was
  constitutively active. The result supports PraR-dependent repression. PraA first generates the 350-nm
  5CHMS-assigned species, which shifts toward HMS over a longer incubation. PraH accelerates the 350-to-375-nm
  conversion on the short assay timescale. The experimentally reconstructed entry is 4HB→PCA→5CHMS→HMS,
  sharing PraB/C/D and inferred PraE/F/G chemistry with a catechol meta-cleavage tail. The study does
  not establish a catechol ring-cleavage enzyme in JJ-1b. Figure 8 compares pra with xyl, nah and dmp
  clusters and with predicted clusters in other bacilli. A proposed benzoate transporter appears in the
  B. licheniformis comparison. The main study supplies no PraB/C/D native oligomer determination or direct
  catalytic-residue experiment. Homolog identities in Table 2 and automatic sequence annotations must
  retain their inferential status. Figure 4 is the PraD HPLC product experiment. Figure 5 instead shows
  PraI conversion of 4HB to PCA; Figure 7 is the PraR reporter and Figure 8 is comparative gene organization.
  [PMID:19717587]


  Evidence scope: complete abstract only; full primary paper not obtained. Thirteen pWW0 operon genes
  were ordered by expression mapping. XylG, H, I, J and K assignments support oxidative and shared-tail
  context. The paper left xylQ and xylT functions unknown. Do not retrospectively cite it as direct seventh-step
  XylQ proof. Maxicell expression mapping identified thirteen pWW0 operon genes and approximate product
  masses. [PMID:2183008]


  Evidence scope: complete publisher-transformed text, 10 pages; numeric OCR limits; no raw PDF or figures.
  The purified PaW1/pWW0 enzyme was called benzaldehyde dehydrogenase and attributed to xylC in 1990.
  Its later N-terminal reassignment to XylG must accompany reuse of these experiments. Benzyl-alcohol/xylene
  induction, Affi-Gel Blue retention and DTT handling concern this native preparation. They differ from
  the 1995 KT2440 pWW0-161 experiments. Apparent native/subunit masses were 126/57 kDa, supporting a dimer.
  A lower native-gel band showed activity after DTT treatment; this is not a universal monomer-activity
  rule. Benzaldehyde oxidation yielded benzoate and NADH in a 1:1 ratio by HPLC. NADP supported less than
  1% of NAD activity at 1 mM; these assays concern benzaldehyde, not HMS. pH 9.6 and pro-R hydride transfer
  concern benzaldehyde assays. Do not call them HMS optimum or directly measured HMS hydride stereochemistry.
  Magnesium improved storage stability modestly, while tested salts did not activate aldehyde dehydrogenase.
  Distinguish storage effects from catalysis and from the separate benzyl-alcohol dehydrogenase. EDTA
  and phenanthroline did not inhibit in the tested conditions. Thiol reagents inhibited; mercaptoethanol
  restored pCMB-treated activity. These observations do not identify a particular catalytic residue. The
  aldehyde dehydrogenase was not apparently inhibited by NADH. Reverse activity with benzoate/NADH was
  not detected under the tested conditions; ester hydrolysis was an adjacent activity of unclear physiological
  relevance. [PMID:2202600]


  Evidence scope: PubMed original indexed abstract only. E. coli MhpF showed activity as a monomer and
  catalytic properties independent of oligomeric state. Native acetaldehyde competitive inhibition Ki265000µM
  is absent from the inspected primary abstract. [PMID:23237860]


  Evidence scope: complete scientific main text from publisher transformation; no raw PDF or figures.
  Native PaW1/pWW0 purification differs from temperature-induced E. coli K-12 single-gene constructs.
  XylJ alone retained hydratase activity; isolated XylI activity was unstable. Methods reverse H/I gene
  functions relative to the final interpretation; one Results sentence reverses 27/28 kDa assignments.
  Use XylH tautomerase, XylI decarboxylase and XylJ hydratase with these conflicts retained. The 28 kDa
  native/3.5 kDa apparent subunit estimates are historical; the authors acknowledged abnormal SDS mobility.
  They do not establish an eight-subunit enzyme. Tautomerization and side-activity assays depended on
  buffer and salts. Six-minute spontaneous conversion was condition-specific; NMR product assignment was
  personal communication, not a reported experiment. Decarboxylase and hydratase copurified in a preparation
  near 130 kDa with two polypeptides. Exact subunit copy numbers were not measured. Hydratase favored
  the freshly prepared enol pool. Aged substrate accumulated resistant keto material and an unidentified
  degradation product; neither historic names nor absorbance assigns exact E/Z. Decarboxylase used the
  keto diacid and produced mainly a dienol by spectral estimation. Magnesium dependence and kinetic values
  belong to those preparations; manganese also accelerated spontaneous conversion. The hydratase product
  keto/enol form remained explicitly unresolved. The text/figure product-number inconsistency must not
  silently decide formal chemistry. Native PaW1 purification and recombinant single-component studies
  used different preparations. Multiple tautomeric chemical forms are distinguished; hydratase monitoring
  used enol absorbance and separate alkaline total-pool measurement. Methods/function labels and one molecular-mass
  assignment conflict with the abstract and discussion. Recombinant isomerase purification and uncertain
  oligomer estimate concern the oxidative branch. Native decarboxylase and hydratase copurified; their
  complex had an apparent mass near 130 kDa. Enol was efficiently hydrated; aged material accumulated
  a resistant keto pool and an unidentified decay product. Hydratase kinetic values apply to the stated
  buffer/metal regime. Recombinant decarboxylase alone was unstable, whereas recombinant XylJ alone retained
  activity. Decarboxylase preferred the keto diacid and yielded predominantly the dienol used by hydratase.
  Hydrolytic formation of the dienol is attributed to Duggleby/Williams1986; hydrolase/hydratase separation
  was unpublished, and the hydratase product tautomer could not be determined. Isomerase also ketonized
  the five-carbon dienol in vitro; its principal oxidative-branch assays were buffer-sensitive. Decarboxylase
  kinetic values depended on how its keto substrate was prepared. [PMID:2681159]


  Evidence scope: indexed abstract only. NAH7 and pWW0 shared gene order and sequence similarity supporting
  an evolutionary relationship. [PMID:3481421]


  Evidence scope: complete publisher-transformed text, 14 pages; no raw PDF or figures. Main experiments
  used A. vinelandii206; other named Azotobacter strains remain distinct experimental scopes. Crude, high-speed
  and chromatography fractions differed; NADH oxidase interfered with assays. Catechol cleavage consumed
  equimolar oxygen. Alternative-substrate oxidation did not distinguish one broad enzyme from multiple
  oxygenases. Induced NAD-dependent semialdehyde oxidation dominated; NADase exposed weak noninducible
  hydrolysis. Endogenous NAD recycling confounded omission controls. EDTA-trapped product was isolated
  and compared by melting point and spectra; historical labels do not establish modern intermediate geometry.
  Spontaneous spectral conversion and extract acceleration were distinguished; heat stability complicated
  attribution, while fractionation and induction supported catalysis. Partially purified preparations
  coupled decarboxylation/hydration; magnesium or manganese stimulated, EDTA inhibited. Aldolase fractions
  produced separately measured acetaldehyde and pyruvate; only42% of synthetic substrate reacted, without
  absolute stereochemical assignment. Measured upstream activities increased after benzoate growth; aldolase
  did not show comparable induction. The proposed six-step route ends at acetaldehyde/pyruvate. Hydration
  was not separately characterized; tautomerase physiological necessity remained unresolved. The full
  1971 publisher-transformed text is now inspected; it supports the historical six-step route only, without
  direct proof of the seventh CoA-acylating step or exact modern stereoforms. [PMID:4325686]


  Evidence scope: complete publisher-transformed text, 6 pages; numeric OCR limits; no raw PDF or figures.
  KT2440 hosted pWW0 derivatives; distinguish experimental host from plasmid origin. N-terminal sequencing
  reassigns the earlier benzaldehyde-active preparation to XylG. It oxidized catechol and4-methylcatechol
  cleavage products, but not the3-methyl product. XylG pH optima were8.3 for semialdehyde and9.6 for benzaldehyde.
  Semialdehyde kinetics were measured here; aldehyde and NAD kinetics came from earlier studies. Preserve
  separate assays. XylC was purified from thexylG-deletion host and lacked semialdehyde activity. Its
  tetramer, buffer inhibition and kinetic data do not describe XylG. XylG homodimer status cites1990 work;
  the1995 paper does not newly measure that assembly. Proposed active-site explanations remain interpretations.
  [PMID:7868591]


  Evidence scope: complete abstract only; full primary paper not obtained. XylF modification and mutagenesis
  support a serine-hydrolase triad and altered F108M behavior. This is evidence for the alternative hydrolytic
  branch, not an oxidative-route reaction or exact dienol geometry. XylF of the P. putida TOL system hydrolyzes
  ring-cleavage products of 3-alkyl catechols; sequence comparison, chemical modification and mutagenesis
  support a serine-hydrolase catalytic triad. F108M increased thermostability and changed substrate preference.
  [PMID:7890778]


  Evidence scope: complete abstract only; full primary paper not obtained. Preliminary recombinant CF600
  tautomerase crystallography supported a hexamer rather than pentamer. This organism-specific result
  must not alone identify the mt-2 assembly. [PMID:7966298]


  Evidence scope: complete scientific main text from publisher transformation; no raw PDF or figures.
  DmpF-expressing E. coli extracts formed acetyl-CoA from acetaldehyde/CoA/NAD; unrelated dmpQ control
  and native acetate-growth controls were distinct. Propionaldehyde was an alternate substrate. Phenol-grown
  CF600 DmpFG copurified; N termini identified DmpF and DmpG. Measured bands were 34.5/40 kDa, with inferred
  sequence masses 32.5/37.5 kDa. Apparent 148 kDa solution mass supported two of each subunit. Manganese
  stimulated aldolase; zinc inhibited; magnesium/calcium did not stimulate. NADH stimulated aldolase in
  delayed-addition controls. Direct NADH binding to DmpG or an allosteric transmission mechanism was not
  demonstrated. EDTA dialysis left basal aldolase activity; added manganese activation did not settle
  whether tightly bound metal was essential. Hydrolyzed S-lactone substrate gave incomplete pyruvate recovery.
  Aldehyde and NAD/NADP comparisons were assay-specific; alternate substrates must not become formal catechol-route
  products. Channeling, protection from toxicity and ATP benefit were proposals. Alternative acetaldehyde-metabolizing
  activities existed; failed detection of DmpG alone could reflect expression or assay sensitivity. A
  single Results sentence associates propionaldehyde with 3-methylcatechol, conflicting with abstract/discussion
  mapping to 4-methyl/3,4-dimethylcatechol. Preserve the internal inconsistency. Native CF600 purification
  and heterologous DmpF assays are distinct preparations. DmpF-expressing extracts produced acetyl-CoA
  from acetaldehyde and propionyl-CoA from propionaldehyde; unrelated-gene and acetate-growth controls
  had negligible products. One results sentence links propionaldehyde to 3-methylcatechol; abstract and
  discussion instead associate propionaldehyde with 4-methyl/3,4-dimethylcatechol and acetaldehyde with
  catechol/3-methylcatechol. Aldolase and acylating dehydrogenase copurified through five chromatographic
  steps and ammonium fractionation. Two bands were identified by N-terminal sequences as DmpF and DmpG;
  stain intensity is approximate. Gel filtration mass was compatible with two copies of each subunit;
  monomer/homodimer peaks were not detected. Storage and dilution effects differ for the two activities.
  Activity depended on pH and buffer. Added manganese stimulated aldolase; zinc inhibited; magnesium and
  calcium did not stimulate this preparation. NADH stimulated complex-associated aldolase activity, with
  weaker NAD+ stimulation. Delayed-addition controls separate stimulation from the lactate-dehydrogenase
  reporter. Direct allostery of DmpG and conformational signaling through DmpF were alternative explanations
  for nucleotide stimulation. Incomplete pyruvate recovery was attributed to substrate instability; equilibrium
  and a simple precursor impurity explanation were disfavored. Purified complex showed aldehyde and nucleotide
  preferences under one assay condition. Other acetaldehyde-metabolizing activities were present; failure
  to detect DmpG alone could reflect expression or assay sensitivity. Dmp decarboxylase/hydratase association
  was unpublished context, and channeling, toxicity protection and ATP benefit were proposals. [PMID:8419288]


  Evidence scope: complete abstract only; full primary paper not obtained. Structures distinguished hexameric
  4-OT from trimeric CHMI. Their proposed common one-base mechanism and substrate specificity are structural
  interpretations; no transfer of CHMI stoichiometry to XylH. [PMID:8547259]


  Evidence scope: complete scientific HTML main text and four visual figures. Nitrobenzene-grown JS45
  deaminase was purified by sequential anion exchange, copper chelate, gel filtration and hydrophobic
  steps. Purified deaminase has16.6kDa subunits and apparent100kDa native mass; six identical subunits
  are inferred. These measurements are not4OT measurements. Crude extracts accelerate hydroxymuconate
  tautomerization (about7min to2min half-life at0.1mg/ml), whereas purified deaminase does not. Spontaneous
  conversion is measured in25mM phosphate pH8.0,0.15MNaCl. It is distinct from1971 conditions; no universal
  half-life is inferred. Rapid spectra support direct keto product rather than a detectable hydroxymuconate
  intermediate. The imine/proton-donor mechanism is an inference, not direct intermediate isolation. Tautomerase
  activity in JS45 extract need not participate in its aminophenol route; component presence does not
  prove catechol pathway execution. Metal effects, EDTA insensitivity and histidine-reagent inhibition
  describe the deaminase. Do not attach them to4OT. [PMID:9573204]


  Evidence scope: complete abstract only; full primary paper not obtained. Inhibitor-modified 4-OT is
  described as a trimer of dimers. Pro1 and neighboring Arg39/Arg61 contacts support a mechanistic proposal,
  not a direct unmodified substrate-turnover measurement. [PMID:9778344]


  AP3 names remain accession-specific: AB020521.1 CDS BAB03534.1 (6079–6864) is amnF hydratase, BAB03535.1
  (6874–7644) is amnD decarboxylase and BAB03536.1 (7650–8078) is amnE deaminase in ENA. The 2000 indexed
  abstract instead gives AmnD hydratase/AmnE decarboxylase/AmnF deaminase. Current UniProt Q9KWS3 uses
  amnE for the exact BAB03535.1 sequence. Bare AmnD/E/F labels therefore cannot resolve these entities.
  Issuing deposit: https://www.ebi.ac.uk/ena/browser/view/AB020521.1; exact deposited CDS and translated
  sequence proof are retained in the source dossier. [UniProtKB:Q9KWS3; PMID:11081795]


  The modern 8IH6 structure describes an engineered author/PISA assembly of five hydratase and five decarboxylase
  chains. The hydratase is ADLNW followed by the complete 261-residue Q9KWS4 sequence; the decarboxylase
  is AA followed by the complete 256-residue Q9KWS3 sequence. Deposit source taxon306 and E. coli expression
  host562 have distinct roles. This is separate from the historical database-reported 300 kDa preparation
  and 1:1 ratio; it does not prove the historical assembly had five copies of each. The deposit citation
  is still unpublished. [DOI:10.2210/pdb8ih6/pdb; UniProtKB:Q9KWS3; UniProtKB:Q9KWS4]


  1BJP has five asymmetric-unit chains, while each of its three author/PISA biological assemblies has
  six instances. The sequence corresponds to Q01468 after removal of its initial methionine, and the Pro-1
  inhibitor adduct defines a modified state. Neither five crystal chains nor the historical apparent pentamer
  overturns the six-member biological assembly for this deposited preparation. [DOI:10.2210/pdb1bjp/pdb;
  UniProtKB:Q01468; PMID:9778344]'
