id: MetaCyc:SALVADEHYPOX-PWY
label: adenosine nucleotides degradation II
description: The complete native five-step route converts AMP through adenosine, inosine, hypoxanthine
  and xanthine to urate. This E. coli-focused representation preserves all five native reactions, alternative
  nucleotidases and phosphorylases, supported assemblies and source-specific regulation. The terminal
  NAD-linked XdhABC assignment remains putative/inferred despite genetic support for xanthine consumption.
  Formal Rhea chemical species are retained, including neutral uric acid for its urate-labelled product.
  Periplasmic and intracellular alternatives do not imply an unrepresented transporter. MG1655 native
  annotations, K-12 reviewed proteins and historical W3110 experiments remain distinct. The META PWY-5691
  connection is an opaque downstream interface, not evidence that MG1655 carries its three oxidative reactions.
  Current eight-step PathBank SMP0002103 remains a different, held definition. Recombinant YfiH/PgeF activities
  are separate qualified in-vitro claims, with the later weak-PNP and failed-growth-rescue limits retained.
  Historical Add induction reported for E. coli B remains strain-specific. Independent MG1655 experiments
  measured adenine-induced add transcription (17.61-fold under the cited M9 glucose conditions), without
  establishing direct PurR regulation; the unidentified UshA inhibitor and condition-dependent UmpG oligomer
  receive no invented identities. XdhA Mo-MPT annotation and phenotype-based MCD inference remain distinct.
pathway_type: purine-nucleotide-degradation
