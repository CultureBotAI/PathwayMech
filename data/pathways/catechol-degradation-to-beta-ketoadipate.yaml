id: MetaCyc:CATECHOL-ORTHO-CLEAVAGE-PWY
label: catechol degradation to β-ketoadipate
description: The native four-reaction ortho-cleavage module converts catechol to 3-oxoadipate through
  cis,cis-muconate, (S)-muconolactone and 3-oxoadipate enol-lactone. This boundary ends before CoA transfer
  and thiolysis in the downstream 3-oxoadipate degradation module. The selected Pseudomonas putida scope
  follows the native species annotation; it does not assert occurrence in every strain. Native catalyst
  frames preserve historical assembly annotations; deleted CatA and discordant PcaD sequence cross-references
  are not propagated as modern protein identities.
