  description: The C-1 structural model assigns a bound Fe(III) cofactor coordinated by two tyrosine and
    two histidine residues. The assignment applies to this modeled holoenzyme; it is not a new redox assay
    or a sequence-equivalence claim for the native generic component. Iron is not consumed by the core
    reaction.
