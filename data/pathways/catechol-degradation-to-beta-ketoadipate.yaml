    source_assertion: The natural-source C-1 model names component FE as FE (III) ION and records four
      metal contacts to two TYR and two HIS residues; its FE atom has occupancy 1.00.
    source_locator: _entity_src_nat; _chem_comp[id=FE]; _struct_conn[conn_type_id=metalc]; _atom_site[label_comp_id=FE]
