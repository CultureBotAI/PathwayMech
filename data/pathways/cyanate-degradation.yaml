id: MetaCyc:CYANCAT-PWY
label: cyanate degradation
description: The CynS/CynT bicarbonate-recycling route annotated for Escherichia coli K-12 MG1655 converts
  cyanate to ammonium and carbon dioxide. The cyanase homodecamer first forms carbamate from cyanate and
  bicarbonate; carbamate then decomposes spontaneously. Zinc-containing CynT hydrates carbon dioxide to
  replenish bicarbonate. The graph selects this physiological hydration direction of a reversible reaction.
  K-12 mutant experiments support the recycling role at 0.03% CO2, with rescue of the cynT deletion at
  3% CO2; they do not establish an unconditional requirement for CynT. This record represents the explicit
  intermediate route, not an additional parallel net cyanase reaction.
pathway_type: cyanate-catabolism-and-bicarbonate-recycling
