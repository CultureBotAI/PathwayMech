id: gomodel:YeastPathways_HOMOCYS-CYS-CONVERT
label: homocysteine and cysteine interconversion
description: Homocysteine and cysteine interconversion in Saccharomyces cerevisiae
  S288C combines cystathionine beta-synthase and gamma-lyase activities that convert
  L-homocysteine to L-cysteine via L-cystathionine with cystathionine gamma-synthase
  and beta-lyase activities that convert L-cysteine toward L-homocysteine through
  the same intermediate.
