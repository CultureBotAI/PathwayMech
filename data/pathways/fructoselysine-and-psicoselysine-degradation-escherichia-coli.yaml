id: PathBank:SMP0002063
label: Fructoselysine and Psicoselysine Degradation
description: >-
  PathBank/SMPDB BioPAX Level 3 pathway record (PathBank:SMP0002063, PathWhiz PW002049)
  for cytoplasmic catabolism of the Heyns and Amadori glycation products psicoselysine
  and fructoselysine in Escherichia coli (NCBITaxon:562), backed by biochemical assays
  in E. coli K-12 (NCBITaxon:83333). Fructoselysine 3-epimerase FrlC (UniProtKB:P45541,
  modeled as complex PathBank:SMP0002063/ProteinComplex/4018) catalyzes the reversible
  Ni(2+)- or Co(2+)-dependent C3 epimerization between psicosyllysine(1+) (CHEBI:61403)
  and fructosyllysine(1+) (CHEBI:61393; RHEA:28391). Fructoselysine 6-kinase FrlD
  (UniProtKB:P45543; EC 2.7.1.174) catalyzes the ATP-dependent phosphorylation of
  fructosyllysine(1+) (CHEBI:61393) with ATP (CHEBI:15422) to fructoselysine
  6-phosphate(1-) (CHEBI:61392), ADP (CHEBI:16761), and hydron (CHEBI:15378; RHEA:28379).
  Fructoselysine 6-phosphate deglycase FrlB (UniProtKB:P0AC00, modeled as complex
  PathBank:SMP0002063/ProteinComplex/4020; EC 3.5.1.104) catalyzes the reversible
  hydrolytic cleavage of fructoselysine 6-phosphate(1-) (CHEBI:61392) with water
  (CHEBI:15377) to L-lysinium(1+) (CHEBI:32551) and beta-D-glucose 6-phosphate
  (CHEBI:17719; PathBank:SMP0002063/Reactions/5985), corresponding to the EcoCyc E. coli
  K-12 pathway reference MetaCyc:PWY0-521 (fructoselysine-and-psicoselysine-degradation.yaml)
  and the downstream two-step GO:1901281 record (fructoselysine-catabolic-process.yaml).
