id: MetaCyc:PWY-6336
label: protocatechuate degradation III (para-cleavage pathway)
description: The complete five-step protocatechuate 2,3-cleavage route in Paenibacillus sp. JJ-1b proceeds
  through the Z,Z carboxysemialdehyde, hydroxymuconate semialdehyde, hydroxymuconate and oxalocrotonate
  to the Z-enol hydroxypentadienoate. It connects to the separate downstream degradation pathway. The
  five individual recombinant enzymes are assayed as crude extracts; their endpoint qualifications retain
  construct uncertainty. The historical native dioxygenase assembly and iron annotation remain distinct
  from those recombinant preparations. Spontaneous intermediate conversion is compatible with enzyme acceleration.
  NAD is the selected reaction coenzyme; lower NADP-supported PraB activity is retained separately. Upstream
  4-hydroxybenzoate conversion and the downstream three-enzyme module are outside the internal five-step
  boundary.
pathway_type: aromatic-compound-catabolism
