id: MetaCyc:GLUCARDEG-PWY
label: D-glucarate degradation I
description: D-glucarate degradation I dehydrates D-glucarate to 5-dehydro-4-deoxy-D-glucarate, cleaves
  that intermediate to 2-hydroxy-3-oxopropanoate and pyruvate, reduces 2-hydroxy-3-oxopropanoate to (R)-glycerate
  with NADPH or NADH, and phosphorylates (R)-glycerate to (2R)-2-phosphoglycerate.
pathway_type: carbohydrate-degradation
