id: MetaCyc:COA-PWY
label: coenzyme A biosynthesis I (prokaryotic)
description: The prokaryotic coenzyme A biosynthesis I pathway converts (R)-4'-phosphopantothenate to
  CoA through phosphopantothenoyl-L-cysteine, 4'-phosphopantetheine, and 3'-dephospho-CoA intermediates.
